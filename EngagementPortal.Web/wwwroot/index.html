<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Engagement Portal</title>
<style>
/* ====== PALETTE (allineata a demo-poc.html) ====== */
:root{
  --brand-950:#061d36;
  --brand-900:#0a2a4d;
  --brand-700:#0f4275;
  --brand-600:#0d63b5;
  --brand-500:#2a86d8;
  --brand-100:#e1eefa;
  --brand-50:#f1f7fc;
  --accent:#19c3d6;
  --accent-soft:#d6f4f8;
  --ink:#0a1b2e;
  --muted:#566a80;
  --line:#dfe7ef;
  --bg:#f4f7fa;
  --card:#ffffff;
  --ok:#0b7a55; --ok-bg:#def7ec;
  --warn:#8a5a00; --warn-bg:#fef3c7;
  --err:#d1344a; --err-bg:#fde8ec;
  --radius:14px;
  --shadow:0 1px 2px rgba(6,29,54,.06),0 6px 20px rgba(6,29,54,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5}
button{font:inherit;cursor:pointer}
/* Header */
header{background:linear-gradient(100deg,var(--brand-950),var(--brand-900) 60%,var(--brand-700));color:#fff;position:sticky;top:0;z-index:20}
.hwrap{max-width:1200px;margin:auto;padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.2px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--brand-950);font-style:normal;font-weight:800}
.logo small{display:block;font-weight:400;font-size:11px;opacity:.7;letter-spacing:.4px;text-transform:uppercase}
.spacer{flex:1}
.roleSw{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);padding:5px 6px 5px 12px;border-radius:999px;font-size:12.5px}
.roleSw select{background:#fff;color:var(--ink);border:0;border-radius:999px;padding:6px 12px;font:inherit;font-weight:600}
.user{display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-500);display:grid;place-items:center;font-weight:700}
.demo-banner{background:var(--warn-bg);color:#7a5200;text-align:center;font-size:12px;padding:5px}
/* Layout */
main{max-width:1200px;margin:24px auto 60px;padding:0 24px}
h1{font-size:26px;margin:0 0 4px;color:var(--brand-900)}
h2{font-size:17px;margin:0 0 12px;color:var(--brand-900)}
.sub{color:var(--muted);margin:0 0 22px}
.crumb{color:var(--brand-600);background:none;border:0;padding:0;margin-bottom:10px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:22px}
.kpi b{display:block;font-size:28px;color:var(--brand-900);line-height:1.1}
.kpi span{color:var(--muted);font-size:13px}
.kpi{border-left:4px solid var(--brand-500)}
.kpi.a{border-left-color:var(--accent)} .kpi.w{border-left-color:#f0b429}
/* table */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer;transition:background .15s}
tr.row:hover{background:var(--brand-50)}
tr:last-child td{border-bottom:0}
.name b{display:block;color:var(--brand-900)} .name span{color:var(--muted);font-size:12.5px}
/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-err{background:var(--err-bg);color:var(--err)} .p-info{background:var(--brand-100);color:var(--brand-600)}
.p-mute{background:#eceff6;color:var(--muted)}
.p-prog{background:#d6f4f8;color:#0a6f7c}
.mini{display:flex;gap:4px}.mini i{width:22px;height:6px;border-radius:3px;background:var(--line)}.mini i.on{background:var(--accent)}.mini i.cur{background:var(--brand-500)}
/* buttons */
.btn{border:1px solid transparent;border-radius:10px;padding:9px 16px;font-weight:600;transition:.15s}
.btn.pri{background:var(--brand-600);color:#fff}.btn.pri:hover{background:var(--brand-700)}
.btn.acc{background:var(--accent);color:var(--brand-950)}.btn.acc:hover{filter:brightness(.95)}
.btn.sec{background:#fff;border-color:var(--line);color:var(--brand-900)}.btn.sec:hover{border-color:var(--brand-500)}
.btn.dng{background:#fff;border-color:var(--err-bg);color:var(--err)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* stepper */
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin:6px 0 4px;list-style:none;padding:0}
.st{position:relative;text-align:center;padding:0 6px}
.st::before{content:"";position:absolute;top:17px;left:-50%;width:100%;height:3px;background:var(--line)}
.st:first-child::before{display:none}
.st.done::before,.st.cur::before{background:var(--accent)}
.dot{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:#fff;border:3px solid var(--line);font-weight:700;color:var(--muted)}
.st.done .dot{background:var(--accent);border-color:var(--accent);color:var(--brand-950)}
.st.cur .dot{border-color:var(--brand-500);color:var(--brand-600);box-shadow:0 0 0 5px var(--brand-100)}
.st b{display:block;font-size:13px;color:var(--brand-900)}.st span{font-size:12px;color:var(--muted)}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 18px;overflow:auto}
.tab{background:none;border:0;padding:10px 16px;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--brand-600);border-bottom-color:var(--brand-600)}
.tab .lock{opacity:.6;font-size:12px}
/* misc */
.two{grid-template-columns:1fr 1fr}
@media(max-width:820px){.two{grid-template-columns:1fr}.stepper{grid-template-columns:1fr;gap:12px}.st{display:flex;gap:12px;text-align:left;align-items:center}.st::before{display:none}.dot{margin:0}}
.doc{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.ico{width:42px;height:42px;border-radius:10px;background:var(--brand-100);color:var(--brand-600);display:grid;place-items:center;font-weight:800;font-size:12px}
.doc .t{flex:1}.doc .t b{display:block}.doc .t span{font-size:12.5px;color:var(--muted)}
.note{background:var(--brand-50);border:1px solid var(--brand-100);border-radius:10px;padding:12px 14px;color:var(--brand-700);font-size:13.5px;margin-bottom:16px}
.note.lockbox{background:#f1f3f8;border-color:var(--line);color:var(--muted)}
label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--brand-900)}
input[type=text],input[type=date],textarea,select.f,#modal select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand-500);outline-offset:-1px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
@media(max-width:620px){.fgrid{grid-template-columns:1fr}}
.upl{border:2px dashed var(--line);border-radius:10px;padding:14px;display:flex;align-items:center;gap:12px;background:var(--brand-50)}
.upl span{flex:1;color:var(--muted);font-size:13px}
.prop{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;flex-wrap:wrap}
.prop .d{flex:1;min-width:220px}.prop .d b{color:var(--brand-900)}.prop .d span{display:block;color:var(--muted);font-size:12.5px}
.tl{list-style:none;padding:0;margin:0}.tl li{position:relative;padding:0 0 14px 22px;font-size:13px}
.tl li::before{content:"";position:absolute;left:3px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--brand-500)}
.tl li::after{content:"";position:absolute;left:7px;top:16px;bottom:-2px;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}.tl span{color:var(--muted);display:block;font-size:12px}
.bars{display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:10px}.bars div{flex:1;background:linear-gradient(var(--brand-500),var(--brand-600));border-radius:6px 6px 0 0;position:relative}
.bars div em{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-style:normal;font-size:11px;color:var(--muted)}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600;margin:0}.sw input{display:none}.sw i{width:38px;height:22px;border-radius:999px;background:#c9d4e0;position:relative;transition:.2s}.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}.sw input:checked+i{background:var(--accent)}.sw input:checked+i::after{left:19px}
.mailc{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--line)}.mailc:last-child{border-bottom:0}.mailc .t{flex:1;min-width:240px}.mailc .t b{display:block;color:var(--brand-900)}.mailc .t span{color:var(--muted);font-size:12.5px;display:block}.mailc .ctl{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
/* stato schede */
.tab::before{content:"";display:inline-block;min-width:16px;height:16px;line-height:16px;border-radius:50%;margin-right:7px;font-size:11px;font-weight:800;text-align:center;vertical-align:1px}
.tab.s-ok::before{content:"✓";background:var(--ok);color:#fff}.tab.s-todo::before{content:"!";background:#f0b429;color:#3b2a00}.tab.s-wait::before{content:"…";background:var(--brand-100);color:var(--brand-600)}.tab.s-lock::before,.tab.s-none::before{display:none}
.tab.s-ok,.tab.s-ok.on{color:var(--ok)}.tab.s-todo,.tab.s-todo.on{color:var(--warn)}.tab.s-wait,.tab.s-wait.on{color:var(--brand-600)}.tab.s-lock,.tab.s-lock.on{color:#667689}
.tab.s-ok.on{border-bottom-color:var(--ok)}.tab.s-todo.on{border-bottom-color:#f0b429}.tab.s-wait.on{border-bottom-color:var(--brand-600)}.tab.s-lock.on{border-bottom-color:#667689}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}.chipb{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;color:var(--muted)}.chipb:hover{border-color:var(--brand-500)}.chipb.on{border-color:var(--brand-600);color:var(--brand-600);box-shadow:0 0 0 2px var(--brand-100)}
.cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:#eceff6;color:var(--muted);font-size:12px;font-weight:700;text-align:center}.chipb.on .cnt{background:var(--brand-100);color:var(--brand-600)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:-8px 0 18px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
@media(max-width:820px){
  .tab.s-ok{background:var(--ok-bg);border-color:#b7ebd3}.tab.s-todo{background:var(--warn-bg);border-color:#f3d48a}.tab.s-wait{background:var(--brand-50);border-color:var(--brand-100)}.tab.s-lock{background:#f1f3f8}
  .tabs{flex-wrap:wrap;overflow:visible;border-bottom:0;gap:8px;margin:18px 0 14px}
  .tab{border:1px solid var(--line);border-radius:999px;padding:7px 13px;background:#fff;font-size:13px}
  .tab.on{box-shadow:0 0 0 2px var(--brand-600);font-weight:700}
  .tab .lock{font-size:11px}
  .card{overflow-x:auto}
  .hwrap{padding:10px 16px;gap:12px}
  main{padding:0 16px}
  h1{font-size:22px}
  .doc{flex-wrap:wrap}.doc .t{min-width:60%}
  .mailc .ctl{align-items:flex-start}
}
.legend b{display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;border-radius:50%;font-size:11px;margin-right:6px}.g-ok{background:var(--ok);color:#fff}.g-todo{background:#f0b429;color:#3b2a00}.g-wait{background:var(--brand-100);color:var(--brand-600)}
.badge-kind{background:var(--brand-100);color:var(--brand-700);padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;margin-left:6px}
.linkb{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.seg{display:inline-flex;background:#e9eef5;border-radius:999px;padding:4px;margin-bottom:18px}.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:600;color:var(--muted)}.seg button.on{background:#fff;color:var(--brand-900);box-shadow:var(--shadow)}
.modal{position:fixed;inset:0;background:rgba(6,29,54,.55);display:none;place-items:center;z-index:60;padding:16px}.modal.show{display:grid}.mbox{background:#fff;border-radius:var(--radius);padding:22px;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(6,29,54,.35);max-height:90vh;overflow:auto}.mact{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand-500);outline-offset:2px}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:var(--brand-900);color:#fff;padding:12px 20px;border-radius:10px;box-shadow:var(--shadow);transition:.3s;opacity:0;z-index:90}
#toast.show{transform:translate(-50%,0);opacity:1}
.hint{color:var(--muted);font-size:12.5px;margin:0}
.empty{text-align:center;color:var(--muted);padding:26px}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo"><i>CE</i><div>Cyber Engagement Portal<small>Area clienti</small></div></div>
    <div class="spacer"></div>
    <div class="roleSw">Visualizza come
      <select id="role" aria-label="Profilo demo"></select>
    </div>
    <div class="roleSw">Tenant
      <select id="tenant" aria-label="Tenant demo"></select>
    </div>
    <div class="user"><div class="avatar" id="av">–</div><div><div id="uname" style="font-weight:600"></div><div id="urole" style="opacity:.7;font-size:12px"></div></div></div>
  </div>
  <div class="demo-banner">Ambiente dimostrativo – dati fittizi, i dati si azzerano al riavvio</div>
</header>

<main id="app" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal"></div>

<script>
/* ====== PROFILI E TENANT ====== */
const ROLES = {
  Client:       { label: 'Cliente',      role: 'Cliente',                av: 'MR', tenant: 'tenant-contoso' },
  PMO:     { label: 'PMO',     role: 'PMO',               av: 'LF', tenant: 'tenant-provider' },
  Pentester: { label: 'Pentester', role: 'Pentester',           av: 'SC', tenant: 'tenant-provider' },
  Manager:      { label: 'Manager',      role: 'Manager',                av: 'GM', tenant: 'tenant-provider' },
  Auditor:      { label: 'Auditor',      role: 'Auditor · sola lettura', av: 'EG', tenant: 'tenant-provider' }
};
const ROLE_NAMES = {
  Client: 'Marta Rinaldi',
  PMO: 'Luca Ferri',
  Pentester: 'Sara Conti',
  Manager: 'Giorgio Marino',
  Auditor: 'Elena Greco'
};
const ROLE_LABEL = {
  Client: 'Cliente',
  PMO: 'PMO',
  Pentester: 'Pentester',
  Manager: 'Manager',
  Auditor: 'Auditor'
};
const TENANTS = [
  ['tenant-provider', 'Provider'],
  ['tenant-contoso', 'Contoso'],
  ['tenant-fabrikam', 'Fabrikam'],
  ['tenant-novabank', 'Nova Bank'],
  ['tenant-orion', 'Orion Energia']
];
const CLIENT_CONTACTS = {
  'tenant-contoso': ['Marta Rinaldi', 'MR'],
  'tenant-fabrikam': ['Paolo Bassi', 'PB'],
  'tenant-novabank': ['Giulia Sala', 'GS'],
  'tenant-orion': ['Andrea Conti', 'AC']
};
const TYPES = [
  ['PenetrationTest', 'Penetration Test'],
  ['VulnerabilityAssessment', 'Vulnerability Assessment'],
  ['RedTeam', 'Red Team'],
  ['CodeReview', 'Code Review'],
  ['CloudSecurity', 'Cloud Security']
];
const STEPS = [
  ['Scheda tecnica + Ordine', 'Scheda tecnica con manleva e ordine'],
  ['Pianificazione', 'Proposta e accettazione'],
  ['Scope e credenziali', 'Dati di accesso e perimetro'],
  ['Esecuzione', 'Attività in corso'],
  ['Report', 'Revisione e consegna']
];
const MAIL_META = {
  start:   { t: 'Inizio attività', subj: 'Avvio attività', desc: 'Comunica alla distribution list l\'avvio dell\'attività.' },
  end:     { t: 'Fine attività', subj: 'Conclusione attività', desc: 'Comunica alla distribution list la conclusione dell\'attività.' },
  deliver: { t: 'Consegna deliverables', subj: 'Consegna deliverables', desc: 'Notifica la disponibilità dei report e degli altri deliverables.' }
};
const PROPOSAL_STATUS = {
  Pending: ['In attesa', 'warn'],
  Accepted: ['Accettata', 'ok'],
  Rejected: ['Rifiutata', 'err'],
  Superseded: ['Sostituita', 'mute'],
  Replaced: ['Superata', 'mute']
};
const REVIEW_STATUS = {
  None: ['Non inviata', 'mute'],
  Pending: ['In attesa del manager', 'warn'],
  Approved: ['Approvata', 'ok'],
  Changes: ['Modifiche richieste', 'err']
};
const VISIBILITY = {
  Client: 'scheda tecnica, documento di ingaggio, credenziali fornite e deliverables',
  PMO: 'tutti i file, comprese le credenziali',
  Pentester: 'scheda tecnica, ingaggio, ordine, business case, credenziali e deliverables',
  Manager: 'scheda tecnica, ingaggio, ordine, business case e deliverables (le credenziali non sono visibili)',
  Auditor: 'tutti i file tranne le credenziali, in sola lettura'
};

const state = {
  role: localStorage.getItem('cep.role') || 'Pentester',
  tenant: localStorage.getItem('cep.tenant') || 'tenant-provider',
  view: 'list',
  listTab: 'eng',
  list: [],
  clients: [],
  detail: null,
  tab: 'docs',
  rules: [],
  due: [],
  scope: null,
  credentials: null,
  logAuthor: '',
  editing: {}
};

const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v)
  .replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = d => {
  if (!d) return '–';
  const [y, m, g] = String(d).substring(0, 10).split('-');
  return g && m && y ? `${g}/${m}/${y}` : d;
};
const fmtTime = d => {
  if (!d) return '–';
  const date = new Date(d);
  if (Number.isNaN(date.getTime())) return fmt(d);
  const p = n => String(n).padStart(2, '0');
  return `${p(date.getDate())}/${p(date.getMonth() + 1)}/${date.getFullYear()} ${p(date.getHours())}:${p(date.getMinutes())}`;
};
const fmtSize = n => n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : n >= 1024 ? `${Math.round(n / 1024)} KB` : `${n} B`;
const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};
const typeLabel = t => (TYPES.find(x => x[0] === t) || [t, t])[1];
const tenantLabel = t => tenantName(t);
const isClient = () => state.role === 'Client';
const isProviderRole = () => state.role === 'PMO' || state.role === 'Pentester' || state.role === 'Manager' || state.role === 'Auditor';
const canCreateEngagement = () => state.role === 'PMO' || state.role === 'Manager';
const canManageClients = () => state.role === 'Manager';
const tenantName = t => (state.clients.find(c => c.tenantId === t) || {}).name
  || (TENANTS.find(x => x[0] === t) || [t, t])[1];
const pill = ([text, cls]) => `<span class="pill p-${cls}">${esc(text)}</span>`;
const reviewLabel = s => REVIEW_STATUS[s] || [s, 'mute'];
const proposalLabel = s => PROPOSAL_STATUS[s] || [s, 'mute'];

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2800);
}

function qs(extra = {}) {
  return new URLSearchParams({ role: state.role, tenant: state.tenant, ...extra }).toString();
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
  });
  if (!response.ok) {
    let message = `Errore ${response.status}`;
    try {
      const body = await response.json();
      if (typeof body === 'string' && body.trim()) message = body;
      else message = (body && (body.detail || body.title)) || message;
    } catch { /* corpo non JSON (es. 403 vuoto) */ }
    if (message === `Errore ${response.status}`) {
      message = {
        400: 'Richiesta non valida.',
        403: 'Operazione non consentita per il tuo profilo.',
        404: 'Risorsa non trovata.',
        409: 'Elemento già esistente o in conflitto.'
      }[response.status] || message;
    }
    throw new Error(message);
  }
  if (response.status === 204) return null;
  const type = response.headers.get('content-type') || '';
  return type.includes('json') ? response.json() : response;
}

function downloadResponse(response, fallbackName) {
  return response.blob().then(blob => {
    const disposition = response.headers.get('content-disposition') || '';
    const match = /filename="?([^";]+)"?/i.exec(disposition);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = match ? match[1] : fallbackName;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });
}

function pickFile(accept) {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file';
    if (accept) input.accept = accept;
    input.onchange = () => resolve(input.files[0] ? input.files[0].name : null);
    input.click();
  });
}

/* ====== MODALE ====== */
function ask({ title, text, fields = [], ok = 'Conferma', danger = false }) {
  return new Promise(resolve => {
    const fieldsHtml = fields.map(f => {
      const control = f.area
        ? `<textarea id="m_${esc(f.id)}" rows="3" placeholder="${esc(f.ph || '')}"></textarea>`
        : f.type === 'select'
          ? `<select class="f" id="m_${esc(f.id)}">${(f.options || [])
              .map(o => `<option value="${esc(o[0])}" ${o[0] === (f.value || (f.options[0] || [])[0]) ? 'selected' : ''}>${esc(o[1])}</option>`)
              .join('')}</select>`
          : `<input type="${esc(f.type || 'text')}" id="m_${esc(f.id)}" value="${esc(f.value || '')}"
               placeholder="${esc(f.ph || '')}" ${f.min ? `min="${esc(f.min)}"` : ''}>`;
      return `<div class="${f.half ? '' : 'full'}">
        <label for="m_${esc(f.id)}">${esc(f.label)}</label>${control}</div>`;
    }).join('');

    $('#modal').innerHTML = `
      <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mt">
        <h2 id="mt">${esc(title)}</h2>
        ${text ? `<p class="sub" style="margin-bottom:14px">${esc(text)}</p>` : ''}
        <div class="fgrid">${fieldsHtml}</div>
        <div class="mact">
          <button class="btn sec" data-modal="cancel">Annulla</button>
          <button class="btn ${danger ? 'dng' : 'pri'}" data-modal="ok">${esc(ok)}</button>
        </div>
      </div>`;
    $('#modal').classList.add('show');

    const close = value => {
      $('#modal').classList.remove('show');
      $('#modal').innerHTML = '';
      document.removeEventListener('keydown', onKey);
      resolve(value);
    };
    const confirm = () => {
      const values = {};
      fields.forEach(f => { values[f.id] = ($('#m_' + f.id)?.value || '').trim(); });
      close(values);
    };
    const onKey = event => {
      if (event.key === 'Escape') close(null);
      if (event.key === 'Enter' && event.target && event.target.tagName === 'INPUT') confirm();
    };
    document.addEventListener('keydown', onKey);
    $('#modal').querySelector('[data-modal="cancel"]').onclick = () => close(null);
    $('#modal').querySelector('[data-modal="ok"]').onclick = confirm;
    const first = fields[0] && $('#m_' + fields[0].id);
    if (first) setTimeout(() => first.focus(), 30);
  });
}

    ? (clients.length ? clients.map(c => [c.tenantId, c.name]) : fallback)

/* ====== STATI WORKFLOW ====== */
function listStatus(e) {
  switch (e.phase) {
    case 'Docs': return ['In attesa documenti', 'warn'];
    case 'Planning': return e.pendingProposal ? ['Proposta da valutare', 'info'] : ['Da pianificare', 'warn'];
    case 'Prep': return ['Preparazione in corso', 'warn'];
    case 'Scheduled': return [`Pianificato dal ${fmt(e.periodStart)}`, 'info'];
    case 'Running': return ['In esecuzione', 'info'];
    case 'Reporting': return ['Report in progress', 'prog'];
    case 'Done': return ['Completato', 'ok'];
    default: return [e.phase, 'mute'];
  }
}

function detailStatus(d) {
  const e = d.engagement;
  const pending = (e.proposals || []).some(p => p.status === 'Pending');
  switch (d.phase) {
    case 'Docs': return ['In attesa documenti', 'warn'];
    case 'Planning': return pending ? ['Proposta da valutare', 'info'] : ['Da pianificare', 'warn'];
    case 'Prep': return ['Preparazione in corso', 'warn'];
    case 'Scheduled': return [`Pianificato dal ${fmt(e.acceptedProposal?.startDate)}`, 'info'];
    case 'Running': return ['In esecuzione', 'info'];
    case 'Reporting':
      if (e.reviewStatus === 'Pending') return ['Report in revisione', 'prog'];
      if (e.reviewStatus === 'Approved') return ['Report approvato – da pubblicare', 'prog'];
      if (e.reviewStatus === 'Changes') return ['Report: modifiche richieste', 'prog'];
      return ['Report in progress', 'prog'];
    case 'Done': return ['Completato', 'ok'];
    default: return [d.phase, 'mute'];
  }
}

function tabState(d, k) {
  const e = d.engagement;
  const c = d.capabilities || {};
  const pending = (e.proposals || []).some(p => p.status === 'Pending');
  if (k === 'docs') {
    const nS = !e.hasManleva && c.canUploadManleva;
    const nO = !e.orderConfirmed && c.canManageEngagementDocs;
    return e.hasManleva && e.orderConfirmed ? 'ok' : (nS || nO) ? 'todo' : 'wait';
  }
  if (k === 'plan') {
    if (!e.hasManleva || !e.orderConfirmed) return 'lock';
    if (d.todo && d.todo.targetTab === 'plan') return 'todo';
    if (pending) return 'wait';
    return e.acceptedProposal ? 'ok' : 'wait';
  }
  if (k === 'scope') {
    if (!e.acceptedProposal) return 'lock';
    if (d.scope && d.scope.done) return 'ok';
    return canEditPreparation(d) ? 'todo' : 'wait';
  }
  if (k === 'cred') {
    if (!e.acceptedProposal || !c.canCredentials) return 'lock';
    if (d.credentials && d.credentials.done) return 'ok';
    return canEditPreparation(d) ? 'todo' : 'wait';
  }
  if (k === 'reports') {
    if (d.todo && d.todo.targetTab === 'reports') return 'todo';
    if ((e.reports || []).some(r => r.published)) return 'ok';
    if (!c.isClient && ((e.reports || []).length || d.phase === 'Reporting')) return 'wait';
    return 'lock';
  }
  return 'none';
}

function defaultTab(d) {
  return ['docs', 'plan', 'scope', 'cred', 'reports'].find(k => tabState(d, k) === 'todo') || 'docs';
}

function canEditPreparation(d) {
  if (!d.engagement.acceptedProposal) return false;
  if (state.role === 'Client')
    return d.phase === 'Prep' || d.phase === 'Scheduled';
  if (state.role === 'PMO')
    return d.phase === 'Prep' || d.phase === 'Scheduled' || d.phase === 'Running';
  return false;
}

}

function stepper(stepIndex) {
  return `<ol class="stepper">${STEPS.map((x, i) => `
    <li class="st ${stepIndex > i ? 'done' : stepIndex === i ? 'cur' : ''}">
      <div class="dot" aria-hidden="true">${stepIndex > i ? '✓' : i + 1}</div>
      <div><b>${x[0]}</b><span>${x[1]}</span></div>
    </li>`).join('')}</ol>`;
}

function mailSubject(type) {
  if (MAIL_META[type]) return MAIL_META[type].subj;
  if (type && type.startsWith('solicitation:')) return `Sollecito: ${type.split(':')[1]}`;
  return type;
}

function authorLabel(by) {
  if (!by) return 'cliente';
  return by === 'Client' ? 'cliente' : `${ROLE_LABEL[by] || by} per conto del cliente`;
}

function entryAuto(mail, key) {
  const info = mail && mail[key];
  return !!(info && info[key]);
}

/* ====== DETTAGLIO ====== */
function nextAction(d) {
  const e = d.engagement;
  if (d.todo) {
    const labels = {
      docs: 'Vai ai documenti',
      plan: 'Vai alla pianificazione',
      scope: 'Compila lo scope',
      cred: 'Compila le credenziali',
      reports: 'Vai ai report'
    };
    return `<div class="note"><b>Azione richiesta:</b> ${esc(d.todo.action)}
      <button class="btn pri sm" style="margin-left:8px" data-act="tab" data-tab="${esc(d.todo.targetTab)}">${esc(labels[d.todo.targetTab] || 'Apri')}</button></div>`;
  }

  const accepted = e.acceptedProposal;
  const pending = (e.proposals || []).find(p => p.status === 'Pending');
  let message = '';
  switch (d.phase) {
    case 'Docs':
      message = 'In attesa di: ' + [
        !e.hasManleva ? 'scheda tecnica firmata dal cliente' : '',
        !e.orderConfirmed ? 'ricezione ordine da parte del provider' : ''
      ].filter(Boolean).join(' e ') + '. La pianificazione si sblocca quando entrambi sono completati.';
      break;
    case 'Planning':
      message = pending
        ? `Proposta ${fmt(pending.startDate)} → ${fmt(pending.endDate)} in attesa di decisione ${pending.from === 'Client' ? 'di PMO' : 'del cliente'}.`
        : 'Nessuna proposta di date ancora inviata.';
      break;
    case 'Prep':
      message = `In attesa che vengano forniti: ${[
        d.scope && !d.scope.done ? 'scope' : '',
        d.credentials && !d.credentials.done ? 'credenziali' : ''
      ].filter(Boolean).join(' e ') || 'scope e credenziali'}.`;
      break;
    case 'Scheduled':
      message = `Tutto pronto: attività pianificata dal ${fmt(accepted?.startDate)} al ${fmt(accepted?.endDate)}.`;
      break;
    case 'Running':
      message = `Attività in corso fino al ${fmt(accepted?.endDate)}.`;
      break;
    case 'Reporting':
      message = e.reviewStatus === 'Pending'
        ? 'Attività conclusa: deliverables in attesa di revisione del manager.'
        : `Attività conclusa il ${fmt(accepted?.endDate)}: i deliverables sono in redazione.`;
      break;
    case 'Done':
      return '<div class="note" style="background:var(--ok-bg);border-color:#b7ebd3;color:var(--ok)">Engagement completato. I deliverables sono disponibili nella scheda Reportistica.</div>';
  }
  if (pending && pending.kind === 'resched' && d.phase !== 'Planning') {
    message += ` Richiesta di riprogrammazione ${fmt(pending.startDate)} → ${fmt(pending.endDate)} in attesa di decisione ${pending.from === 'Client' ? 'di PMO' : 'del cliente'}.`;
  }
  const readOnly = state.role === 'Auditor' ? '<b>Profilo Auditor</b>: sola lettura. ' : '';
  return `<div class="note lockbox">${readOnly}${esc(message)}</div>`;
}

function renderDetail() {
  const d = state.detail;
  const e = d.engagement;
  const st = detailStatus(d);
  const TABS = [['docs', 'Documenti'], ['plan', 'Pianificazione'], ['scope', 'Scope'], ['cred', 'Credenziali'], ['reports', 'Reportistica']];
  const mailCount = isClient() ? (d.mailLog || []).length : (d.mailLog || []).length;
  const body = {
    docs: tabDocs,
    plan: tabPlan,
    scope: tabScope,
    cred: tabCred,
    reports: tabReports,
    dl: tabDl,
    mail: tabMail,
    log: tabLog
  }[state.tab] || tabDocs;

  $('#app').innerHTML = `
    <button class="crumb" data-act="list">← Tutti gli engagement</button>
    <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start">
      <div><h1>${esc(e.name)}</h1>
        <p class="sub" style="margin-bottom:14px">${esc(e.id)} · ${esc(typeLabel(e.type))} · ${esc(e.clientName)}</p></div>
      ${pill(st)}
    </div>
    <div class="card">${stepper(d.stepIndex)}</div>
    <div style="margin-top:16px">${renderOverview(d)}</div>
    <div class="tabs" role="tablist">
      ${TABS.map(([key, label]) => {
        const s = tabState(d, key);
        return `<button role="tab" aria-selected="${state.tab === key}" class="tab s-${s} ${state.tab === key ? 'on' : ''}" data-act="tab" data-tab="${key}">${label}${s === 'lock' ? ' <span class="lock" aria-label="bloccato">🔒</span>' : ''}</button>`;
      }).join('')}
    </div>
    <div class="legend">
      <span><b class="g-ok">✓</b> Completato</span>
      <span><b class="g-todo">!</b> Azione richiesta</span>
      <span><b class="g-wait">…</b> In attesa di altri</span>
      <span>🔒 Bloccato / non disponibile</span>
    </div>
    <div class="chips">
      <button class="chipb ${state.tab === 'dl' ? 'on' : ''}" data-act="tab" data-tab="dl">👥 Distribution list <span class="cnt">${(d.distributionList || []).length}</span></button>
      <button class="chipb ${state.tab === 'mail' ? 'on' : ''}" data-act="tab" data-tab="mail">✉️ ${isClient() ? 'Email ricevute' : 'Comunicazioni'} <span class="cnt">${mailCount}</span></button>
      <button class="chipb ${state.tab === 'log' ? 'on' : ''}" data-act="tab" data-tab="log">📋 Registro <span class="cnt">${(d.audit || []).length}</span></button>
    </div>
    ${body(d)}`;
}

/* ====== SCHEDE ====== */
function docRow(icon, title, subtitle, right) {
  return `<div class="doc"><div class="ico">${esc(icon)}</div>
    <div class="t"><b>${title}</b><span>${subtitle}</span></div>${right}</div>`;
}

function tabDocs(d) {
  const e = d.engagement;
  const c = d.capabilities || {};
  const canManleva = c.canUploadManleva;
  const canDocs = c.canManageEngagementDocs;
  const canCreds = c.canCredentials;

  let html = `<div class="note">Profilo <b>${esc(ROLE_LABEL[state.role])}</b> · puoi vedere: ${esc(VISIBILITY[state.role] || '')}.</div>
    <div class="card"><h2>Documenti associati</h2>`;

  html += docRow('SCH', 'Scheda tecnica con manleva',
    e.hasManleva
      ? `Firmato · ${esc(e.manlevaFile || '')}`
      : 'Da firmare e caricare da parte del cliente: vale anche come manleva',
    e.hasManleva
      ? pill(['Firmato', 'ok'])
      : canManleva
        ? `<button class="btn pri sm" data-act="upload-manleva">Carica firmato${isClient() ? '' : ' (per conto del cliente)'}</button>`
        : pill(['In attesa cliente', 'warn']));

  html += docRow('ING', 'Documento di ingaggio',
    e.documentoIngaggioFile ? esc(e.documentoIngaggioFile) : 'Non ancora caricato',
    e.documentoIngaggioFile
      ? pill(['Disponibile', 'ok'])
      : canDocs
        ? `<button class="btn pri sm" data-act="upload-ingaggio">Carica</button>`
        : pill(['Non disponibile', 'mute']));

  if (!isClient()) {
    html += docRow('PO', 'Ordine',
      e.orderConfirmed ? `Ricevuto · ${esc(e.orderRef || '')}` : 'In attesa di ricezione lato provider',
      e.orderConfirmed
        ? pill(['Ricevuto', 'ok'])
        : canDocs
          ? `<button class="btn acc sm" data-act="register-order">Registra ordine ricevuto</button>`
          : pill(['In attesa provider', 'warn']));

    html += docRow('BC', 'Business case',
      e.businessCaseFile ? esc(e.businessCaseFile) : 'Non ancora caricato',
      e.businessCaseFile
        ? pill(['Caricato', 'ok'])
        : canDocs
          ? `<button class="btn pri sm" data-act="upload-bc">Carica business case</button>`
          : pill(['Non caricato', 'mute']));
  }

  if (canCreds) {
    const cred = d.credentials || e.credentials;
    html += docRow('CRED', 'Credenziali fornite',
      cred && cred.done ? 'Credenziali consegnate tramite canale sicuro' : 'Non ancora fornite',
      cred && cred.done
        ? pill(['Fornite', 'ok']) + ' <button class="btn sec sm" data-act="tab" data-tab="cred">Dettagli</button>'
        : canEditPreparation(d)
          ? `<button class="btn pri sm" data-act="tab" data-tab="cred">Compila</button>`
          : pill(['In attesa cliente', 'warn']));
  }

  const reports = e.reports || [];
  const published = reports.filter(r => r.published).length;
  html += docRow('RPT', 'Deliverables',
    published
      ? `${published} pubblicati${!isClient() && reports.length > published ? ` · ${reports.length - published} in bozza` : ''}`
      : 'Nessun deliverable ancora disponibile',
    published
      ? pill(['Disponibili', 'ok']) + ' <button class="btn pri sm" data-act="tab" data-tab="reports">Apri</button>'
      : pill(['Non disponibili', 'mute']));

  html += `</div>
    <p style="color:var(--muted);font-size:13px;margin-top:12px">La pianificazione si sblocca quando la scheda tecnica firmata è caricata e l'ordine è ricevuto dal provider.</p>`;
  return html;
}

function canDecideProposal(p) {
  return p.status === 'Pending' &&
    ((p.from === 'Client' && state.role === 'PMO') ||
     (p.from === 'Provider' && state.role === 'Client'));
}

function tabPlan(d) {
  const e = d.engagement;
  const c = d.capabilities || {};
  const canPropose = c.canPropose;

  if (!e.hasManleva || !e.orderConfirmed) {
    return `<div class="note lockbox"><b>Pianificazione bloccata.</b> Servono la scheda tecnica firmata dal cliente e l'ordine ricevuto dal provider.</div>`;
  }

  const pending = (e.proposals || []).find(p => p.status === 'Pending');
  const accepted = e.acceptedProposal;

  const list = (e.proposals || []).length
    ? [...e.proposals].reverse().map(p => {
        const status = proposalLabel(p.status);
        return `<div class="prop">
          <div class="d">
            <b>${fmt(p.startDate)} → ${fmt(p.endDate)}</b>
            ${p.kind === 'resched' ? '<span class="badge-kind">Riprogrammazione</span>' : ''}
            <span>${p.from === 'Client' ? 'Cliente' : 'Provider'} · ${esc(p.by)} · ${fmt(p.date)}
              ${p.note ? ` · “${esc(p.note)}”` : ''}${p.reason ? ` · Motivo rifiuto: ${esc(p.reason)}` : ''}</span>
          </div>
          ${pill(status)}
          ${canDecideProposal(p)
            ? `<button class="btn acc sm" data-act="decide" data-pid="${esc(p.id)}" data-accept="1">Accetta</button>
               <button class="btn dng sm" data-act="decide" data-pid="${esc(p.id)}" data-accept="0">Rifiuta</button>`
            : ''}
        </div>`;
      }).join('')
    : '<div class="empty">Nessuna proposta ancora inviata.</div>';

  let right;
  if (accepted) {
    let action = '';
    if (pending) {
      action = `<p style="color:var(--muted);font-size:13px;margin:12px 0 0">Richiesta di riprogrammazione in corso: decide ${pending.from === 'Client' ? 'PMO' : 'il cliente'}.</p>`;
    } else if (!canPropose) {
      action = '';
    } else if (d.phase !== 'Done') {
      action = `<div style="margin-top:14px"><button class="btn sec" data-act="reschedule">Richiedi riprogrammazione</button></div>`;
    }
    right = `<h2>Pianificazione confermata</h2>
      <div class="note" style="background:var(--ok-bg);border-color:#b7ebd3;color:var(--ok)">
        <b>${fmt(accepted.startDate)} → ${fmt(accepted.endDate)}</b><br>
        Confermata${accepted.from === 'Client' ? ' da PMO' : ' dal cliente'}.</div>${action}`;
  } else if (!canPropose) {
    right = `<h2>Nuova proposta</h2><div class="note lockbox">Sola lettura: da questo profilo non si possono inviare proposte.</div>`;
  } else {
    right = `<h2>Nuova proposta</h2>
      <p class="sub" style="margin-bottom:12px">${state.role === 'Client'
        ? 'Le date proposte dal cliente vengono accettate da PMO.'
        : 'Le date proposte dal provider vengono accettate dal cliente.'}</p>
      <div class="fgrid">
        <div><label for="ps">Inizio attività</label><input type="date" id="ps" min="${today()}"></div>
        <div><label for="pe">Fine attività</label><input type="date" id="pe" min="${today()}"></div>
        <div class="full"><label for="pn">Note (vincoli, finestre di manutenzione…)</label><textarea id="pn" rows="3"></textarea></div>
      </div>
      <div style="margin-top:14px"><button class="btn pri" data-act="propose">${state.role === 'Client'
        ? 'Invia proposta al provider'
        : 'Invia proposta al cliente'}</button></div>`;
  }

  return `<div class="grid two" style="align-items:start">
    <div class="card"><h2>Proposte e richieste</h2>${list}</div>
    <div class="card">${right}</div>
  </div>`;
}

function isEditing(key) {
  return !!state.editing[key];
}

function authorOf(x) {
  return x.by === 'Client' ? 'cliente' : `${ROLE_LABEL[x.by] || x.by} per conto del cliente`;
}

function tabScope(d) {
  const e = d.engagement;
  if (!e.acceptedProposal) {
    return `<div class="note lockbox"><b>Sezione bloccata.</b> Lo scope si compila dopo l'accettazione della pianificazione.</div>`;
  }

  const info = state.scope;
  if (!info) return `<div class="card"><h2>Scope</h2><p class="sub">Caricamento…</p></div>`;
  const s = info.scope || {};
  const editing = isEditing('scope');

  if (s.done && !editing) {
    return `<div class="card"><h2>Scope ${pill(['Fornito', 'ok'])}</h2>
      <p class="sub">Fornito da ${esc(authorOf(s))} il ${fmt(s.date)}.</p>
      <table style="font-size:14px">${[
        ['Target (hostname / URL)', s.host],
        ['Indirizzi / range IP', s.ipRange || '–'],
        ['Fuori scope', s.outOfScope || '–'],
        ['Finestra oraria e vincoli', s.window || '–'],
        ['Referente tecnico', s.contact],
        ['Note', s.notes || '–']
      ].map(r => `<tr><td style="padding:9px 0;color:var(--muted);width:32%">${r[0]}</td><td><b>${esc(r[1])}</b></td></tr>`).join('')}
      </table>
      ${info.canEdit ? `<div style="margin-top:14px"><button class="btn sec sm" data-act="start-edit" data-key="scope">Modifica</button></div>` : ''}
    </div>`;
  }

  if (!info.canEdit) {
    return `<div class="note lockbox">${s.done ? 'Lo scope non è più modificabile.' : 'In attesa che lo scope venga fornito dal cliente.'}</div>`;
  }

  return `<div class="card"><h2>${s.done ? 'Modifica scope' : 'Compila lo scope'}</h2>
    ${!isClient() ? '<div class="note">Stai compilando <b>per conto del cliente</b>.</div>' : ''}
    <div class="fgrid">
      <div><label for="f_host">Target (hostname / URL)*</label><input type="text" id="f_host" value="${esc(s.host || '')}" placeholder="es. api-uat.cliente.it"></div>
      <div><label for="f_ipRange">Indirizzi / range IP</label><input type="text" id="f_ipRange" value="${esc(s.ipRange || '')}" placeholder="es. 10.0.0.0/28"></div>
      <div><label for="f_outOfScope">Fuori scope</label><input type="text" id="f_outOfScope" value="${esc(s.outOfScope || '')}" placeholder="Sistemi o ambienti da non testare"></div>
      <div><label for="f_window">Finestra oraria e vincoli</label><input type="text" id="f_window" value="${esc(s.window || '')}" placeholder="es. notturno 22:00–06:00"></div>
      <div><label for="f_contact">Referente tecnico*</label><input type="text" id="f_contact" value="${esc(s.contact || '')}" placeholder="Nome, telefono"></div>
      <div class="full"><label for="f_notes">Note</label><textarea id="f_notes" rows="3">${esc(s.notes || '')}</textarea></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px">
      <button class="btn pri" data-act="save-scope">Salva scope</button>
      ${s.done ? '<button class="btn sec" data-act="cancel-edit" data-key="scope">Annulla</button>' : ''}
    </div>
  </div>`;
}

function tabCred(d) {
  const e = d.engagement;
  if (!e.acceptedProposal) {
    return `<div class="note lockbox"><b>Sezione bloccata.</b> Le credenziali si forniscono dopo l'accettazione della pianificazione.</div>`;
  }

  const info = state.credentials;
  if (!info) return `<div class="card"><h2>Credenziali</h2><p class="sub">Caricamento…</p></div>`;
  if (!info.credentials) {
    return `<div class="note lockbox"><b>Accesso non consentito.</b> Le credenziali non sono visibili al profilo ${esc(ROLE_LABEL[state.role])}.</div>`;
  }

  const c = info.credentials;
  const editing = isEditing('cred');

  if (c.done && !editing) {
    return `<div class="card"><h2>Credenziali ${pill(['Fornite', 'ok'])}</h2>
      <p class="sub">Fornite da ${esc(authorOf(c))} il ${fmt(c.date)}. Le password non sono conservate nel portale.</p>
      <table style="font-size:14px">${[
        ['VPN', c.vpn],
        ['Utenze di test', c.users],
        ['Metodo di consegna dei segreti', c.deliveryMethod],
        ['Note', c.notes || '–']
      ].map(r => `<tr><td style="padding:9px 0;color:var(--muted);width:32%">${r[0]}</td><td><b>${esc(r[1])}</b></td></tr>`).join('')}
      </table>
      ${info.canEdit ? `<div style="margin-top:14px"><button class="btn sec sm" data-act="start-edit" data-key="cred">Modifica</button></div>` : ''}
    </div>`;
  }

  if (!info.canEdit) {
    return `<div class="note lockbox">${c.done ? 'Le credenziali non sono più modificabili.' : 'Credenziali non ancora fornite.'}</div>`;
  }

  const options = ['Vault aziendale', 'File cifrato (password su canale separato)', 'Altro (concordato con Pentester)'];
  return `<div class="card"><h2>${c.done ? 'Modifica credenziali' : 'Fornisci le credenziali'}</h2>
    <div class="note">Non scrivere password in questo modulo: indica solo dove e come verranno consegnate.</div>
    ${state.role === 'PMO' ? '<div class="note">Stai compilando come PMO <b>per conto del cliente</b>.</div>' : ''}
    <div class="fgrid">
      <div><label for="f_vpn">VPN (endpoint e profilo)*</label><input type="text" id="f_vpn" value="${esc(c.vpn || '')}" placeholder="es. vpn.cliente.it – profilo test"></div>
      <div><label for="f_users">Utenze di test*</label><input type="text" id="f_users" value="${esc(c.users || '')}" placeholder="es. 2 utenze: utente e amministratore"></div>
      <div><label for="f_deliveryMethod">Metodo di consegna dei segreti*</label>
        <select class="f" id="f_deliveryMethod">
          <option value="">Seleziona…</option>
          ${options.map(o => `<option ${c.deliveryMethod === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}
        </select></div>
      <div class="full"><label for="f_credNotes">Note</label><textarea id="f_credNotes" rows="3">${esc(c.notes || '')}</textarea></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px">
      <button class="btn pri" data-act="save-credentials">Salva credenziali</button>
      ${c.done ? '<button class="btn sec" data-act="cancel-edit" data-key="cred">Annulla</button>' : ''}
    </div>
  </div>`;
}

function reviewCard(d) {
  const e = d.engagement;
  const reports = e.reports || [];
  const unpublished = reports.filter(r => !r.published).length;
  const status = reviewLabel(e.reviewStatus);
  let action = '';

  if (state.role === 'Pentester' && unpublished > 0 &&
      (e.reviewStatus === 'None' || e.reviewStatus === 'Changes')) {
    action = `<button class="btn pri" data-act="submit-review">Invia in revisione al manager</button>`;
  }
  if (state.role === 'Manager' && e.reviewStatus === 'Pending') {
    action = `<button class="btn acc" data-act="review-decide" data-approve="1">Approva</button>
      <button class="btn dng" data-act="review-decide" data-approve="0">Richiedi modifiche</button>`;
  }
  if (state.role === 'Pentester' && unpublished > 0 && e.reviewStatus === 'Approved') {
    action = `<button class="btn acc" data-act="publish">Pubblica al cliente${entryAuto(d.mail, 'deliver') ? ' e invia email' : ''}</button>`;
  }

  return `<div class="card" style="margin-bottom:16px"><h2>Revisione del manager ${pill(status)}</h2>
    <p class="sub" style="margin-bottom:${action ? 12 : 0}px">I deliverables non arrivano al cliente finché il manager non li approva.</p>
    ${action}</div>`;
}

function tabReports(d) {
  const e = d.engagement;
  const c = d.capabilities || {};
  const reports = e.reports || [];
  const published = reports.filter(r => r.published).length;

  if (!reports.length && !c.canUploadReports) {
    return '<div class="note lockbox"><b>Nessun deliverable disponibile.</b> La reportistica viene caricata dal Pentester e pubblicata al cliente dopo la revisione del manager.</div>';
  }

  let html = '';
  if (!c.isClient && (reports.length || e.reviewStatus !== 'None')) {
    html += reviewCard(d);
  }

  html += `<div class="card"><h2>Reportistica</h2>${
    reports.length
      ? reports.map(r => `<div class="doc">
          <div class="ico">${esc((r.type || 'FILE').substring(0, 4))}</div>
          <div class="t"><b>${esc(r.name)}</b>
            <span>${r.published ? `Pubblicato il ${fmtTime(r.date)}` : `Bozza del ${fmtTime(r.date)}`} · ${fmtSize(r.size)}</span></div>
          ${r.published ? pill(['Pubblicato', 'ok']) : pill(['Bozza', 'mute'])}
          <button class="btn pri sm" data-act="download-report" data-rid="${esc(r.id)}">Scarica</button>
        </div>`).join('')
      : '<div class="empty">Nessun deliverable disponibile.</div>'
  }</div>`;

  if (c.canUploadReports) {
    html += `<div class="card" style="margin-top:16px"><h2>Carica deliverables</h2>
      <p class="sub" style="margin-bottom:12px">I file caricati restano in bozza fino all'approvazione del manager. Un nuovo file azzera la revisione.</p>
      <button class="btn sec" data-act="upload-report">Carica file</button></div>`;
  }

  if (published > 0) {
    html += `<div class="card" style="margin-top:16px"><h2>Riepilogo findings</h2>
      <div style="display:flex;gap:20px;flex-wrap:wrap">
        <div style="flex:1;min-width:240px"><div class="bars">
          ${[['Critical', 1], ['High', 3], ['Medium', 7], ['Low', 5]].map(x =>
            `<div style="height:${x[1] * 13}px"><em>${x[0]} (${x[1]})</em></div>`).join('')}
        </div><div style="height:22px"></div></div>
        <div style="flex:1;min-width:240px;color:var(--muted);font-size:13px">Dati dimostrativi. Il piano di remediation è nel documento Evidenze.</div>
      </div></div>`;
  }

  return html;
}

function orgPill(org) {
  return `<span class="pill ${org === 'Cliente' ? 'p-info' : org === 'Provider Pentester' ? 'p-ok' : 'p-mute'}">${esc(org)}</span>`;
}

function tabDl(d) {
  const c = d.capabilities || {};
  const entries = d.distributionList || [];
  const writable = c.canWrite;
  const clientCount = entries.filter(x => x.organization === 'Cliente').length;

  const rows = entries.map(entry => {
    const removable = writable &&
      (state.role !== 'Client' || entry.organization === 'Cliente') &&
      !(entry.organization === 'Cliente' && clientCount <= 1);
    return `<tr>
      <td><b>${esc(entry.name)}</b></td>
      <td>${esc(entry.email)}</td>
      <td>${orgPill(entry.organization)}</td>
      ${writable ? `<td style="text-align:right">${removable
        ? `<button class="btn dng sm" data-act="remove-dl" data-entry="${esc(entry.id)}">Rimuovi</button>` : ''}</td>` : ''}
    </tr>`;
  }).join('');

  let html = `<div class="note">La distribution list è accessibile a tutti i profili e viene usata per le comunicazioni email dell'engagement.${writable ? '' : ' Il tuo profilo è in sola lettura.'}</div>
    <div class="card"><h2>Distribution list · ${entries.length} destinatari</h2>
      <table><thead><tr><th>Nome</th><th>Email</th><th>Organizzazione</th>${writable ? '<th></th>' : ''}</tr></thead>
      <tbody>${rows || `<tr><td colspan="${writable ? 4 : 3}" class="empty">Nessun destinatario.</td></tr>`}</tbody></table>
    </div>`;

  if (writable) {
    html += `<div class="card" style="margin-top:16px"><h2>Aggiungi destinatario</h2>
      <div class="fgrid">
        <div><label for="dl_n">Nome e cognome</label><input type="text" id="dl_n"></div>
        <div><label for="dl_e">Email</label><input type="text" id="dl_e" placeholder="nome@dominio.it"></div>
        ${isClient() ? '' : `<div><label for="dl_o">Organizzazione</label>
          <select class="f" id="dl_o">
            <option>Cliente</option><option>Provider PMO</option><option>Provider Pentester</option>
          </select></div>`}
      </div>
      <div style="margin-top:14px"><button class="btn pri" data-act="add-dl">Aggiungi</button></div>
    </div>`;
  }

  return html;
}

function tabMail(d) {
  const e = d.engagement;
  const c = d.capabilities || {};
  const entries = d.distributionList || [];
  const log = d.mailLog || [];

  if (isClient()) {
    return `<div class="card"><h2>Email ricevute</h2>
      ${log.length
        ? `<ul class="tl">${log.map(m => `<li>${esc(mailSubject(m.type))}<span>${fmtTime(m.date)} · ${esc(m.recipients)}</span></li>`).join('')}</ul>`
        : '<div class="empty" style="padding:10px">Nessuna email ricevuta per questo engagement.</div>'}
    </div>`;
  }

  const manager = c.canManageMail;
  const accepted = e.acceptedProposal;
  const published = (e.reports || []).some(r => r.published);
  const when = {
    start: accepted ? `alla data di inizio (${fmt(accepted.startDate)})` : 'dopo l\'accettazione della pianificazione',
    end: accepted ? `alla data di fine (${fmt(accepted.endDate)})` : 'dopo l\'accettazione della pianificazione',
    deliver: 'alla pubblicazione dei deliverables'
  };

  const cards = ['start', 'end', 'deliver'].map(key => {
    const meta = MAIL_META[key];
    const auto = entryAuto(d.mail, key);
    const sentEntry = log.find(m => m.type === key);
    const available = key === 'deliver' ? published : !!accepted;
    const status = sentEntry
      ? pill([`Inviata il ${fmtTime(sentEntry.date)}`, 'ok'])
      : auto ? pill([`Programmata: ${when[key]}`, 'info'])
        : pill(['Invio automatico disattivato', 'warn']);
    return `<div class="mailc">
      <div class="t"><b>${esc(meta.t)}</b><span>${esc(meta.desc)}</span>
        <span>Oggetto: [${esc(e.id)}] ${esc(meta.subj)}</span>
        <div style="margin-top:8px">${status}</div></div>
      <div class="ctl">
        ${manager
          ? `<label class="sw"><input type="checkbox" data-act="toggle-mail" data-key="${key}" ${auto ? 'checked' : ''}><i></i><span>Invio automatico</span></label>
             <button class="btn sec sm" data-act="send-mail" data-key="${key}" ${available ? '' : 'disabled title="Non ancora disponibile"'}>Invia ora</button>`
          : `<span style="color:var(--muted);font-size:13px">Invio automatico: <b>${auto ? 'attivo' : 'disattivo'}</b></span>`}
      </div>
    </div>`;
  }).join('');

  return `<div class="note">${manager
    ? `Come <b>PMO</b> controlli l'invio automatico delle email alla distribution list (${entries.length} destinatari).`
    : 'Le comunicazioni sono gestite da PMO: tu puoi consultarne lo stato (sola lettura).'}</div>
    <div class="card"><h2>Email automatiche</h2>${cards}</div>
    <div class="card" style="margin-top:16px"><h2>Email inviate</h2>
      ${log.length
        ? `<ul class="tl">${[...log].reverse().map(m => `<li>${esc(mailSubject(m.type))}
            <span>${fmtTime(m.date)} · ${esc(m.recipients)} · ${m.auto ? 'invio automatico' : 'invio manuale'}${m.visibility === 'ProviderOnly' ? ' · interna' : ''}</span></li>`).join('')}</ul>`
        : '<div class="empty" style="padding:10px">Nessuna email ancora inviata.</div>'}
    </div>`;
}

function tabLog(d) {
  const all = (d.audit || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const authors = [...new Set(all.map(a => a.author))];
  const rows = state.logAuthor ? all.filter(a => a.author === state.logAuthor) : all;

  return `<div class="note">Registro delle attività con autore, data e ora. ${isClient()
    ? 'Mostra le attività che ti riguardano.'
    : 'Include accessi e download dei deliverables.'}</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
        <h2 style="margin:0">Registro · ${rows.length} eventi</h2>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <select class="f" style="width:auto" aria-label="Filtra per autore" data-change="log-author">
            <option value="">Tutti gli autori</option>
            ${authors.map(a => `<option ${a === state.logAuthor ? 'selected' : ''}>${esc(a)}</option>`).join('')}
          </select>
          <button class="btn sec sm" data-act="export-log">Esporta CSV</button>
        </div>
      </div>
      <table><thead><tr><th>Data e ora</th><th>Autore</th><th>Profilo</th><th>Evento</th></tr></thead>
      <tbody>${rows.length
        ? rows.map(a => `<tr><td style="white-space:nowrap">${fmtTime(a.date)}</td><td><b>${esc(a.author)}</b></td><td>${esc(a.authorRole)}</td><td>${esc(a.text)}</td></tr>`).join('')
        : '<tr><td colspan="4" class="empty">Nessun evento.</td></tr>'}</tbody></table>
    </div>`;
}

/* ====== CLIENTI ====== */
function renderClients() {
  const manage = canManageClients();
  const items = state.clients || [];

  const cards = items.map(client => {
    const users = client.users || [];
    const userRows = users.length
      ? `<ul style="list-style:none;margin:0;padding:0">${users.map(u => `<li style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #eef2f7">
          <span><b>${esc(u.name)}</b><br><span style="color:var(--muted);font-size:13px">${esc(u.email)}</span></span>
          ${manage ? `<button class="btn dng sm" data-act="remove-client-user" data-tenant="${esc(client.tenantId)}" data-user="${esc(u.id)}">Rimuovi</button>` : ''}
        </li>`).join('')}</ul>`
      : '<div class="empty" style="padding:8px 0">Nessuna utenza associata.</div>';

    return `<div class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
        <div><h2 style="margin:0">${esc(client.name)}</h2>
          <p class="sub" style="margin:4px 0 0">${esc(client.tenantId)} · ${client.engagementCount || 0} engagement associati</p></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sec sm" data-act="open-client" data-tenant="${esc(client.tenantId)}">Vedi engagement</button>
          ${manage ? `<button class="btn sec sm" data-act="rename-client" data-tenant="${esc(client.tenantId)}">Rinomina</button>` : ''}
        </div>
      </div>
      <h3 style="font-size:14px;margin:18px 0 6px">Utenze associate</h3>
      ${userRows}
      ${manage ? `<div style="margin-top:12px"><button class="btn pri sm" data-act="add-client-user" data-tenant="${esc(client.tenantId)}">+ Aggiungi utenza</button></div>` : ''}
    </div>`;
  }).join('');

  $('#app').innerHTML = `
    <button class="crumb" data-act="list">← Tutti gli engagement</button>
    <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start">
      <div><h1>Clienti e utenze</h1>
        <p class="sub" style="margin-bottom:14px">${manage
          ? 'Gestisci clienti, utenze associate ed engagement collegati.'
          : 'Elenco in sola lettura: clienti, utenze ed engagement associati.'}</p></div>
      ${manage ? '<button class="btn pri" data-act="new-client">+ Nuovo cliente</button>' : ''}
    </div>
    ${cards || '<div class="empty">Nessun cliente disponibile.</div>'}`;
}

/* ====== RENDER ====== */
function render() {
  updateHeader();
  if (state.view === 'clients') renderClients();
  else if (state.view === 'solicitations') renderSolicitations();
  else if (state.view === 'detail' && state.detail) renderDetail();
  else renderList();
}

/* ====== EVENTI ====== */
document.addEventListener('click', event => {
  const el = event.target.closest('[data-act]');
  if (!el) return;
  const action = actions[el.dataset.act];
  if (action) {
    event.preventDefault();
    Promise.resolve(action(el)).catch(error => toast(error.message));
  }
});

document.addEventListener('change', event => {
  const el = event.target.closest('[data-change]');
  if (!el) return;
  const kind = el.dataset.change;
  if (kind === 'rule') {
    Promise.resolve(actions['save-rule'](el)).catch(error => toast(error.message));
  }
  if (kind === 'log-author') {
    state.logAuthor = el.value;
    render();
  }
});

/* ====== INIT ====== */
function init() {
  if (!ROLES[state.role]) state.role = 'Pentester';

  const roleSelect = $('#role');
  roleSelect.innerHTML = Object.entries(ROLES)
    .map(([key, value]) => `<option value="${key}" ${key === state.role ? 'selected' : ''}>${esc(value.label)}${key === 'Auditor' ? ' · sola lettura' : ''}</option>`)
    .join('');
  roleSelect.value = state.role;
  roleSelect.onchange = event => setRole(event.target.value);

  $('#tenant').onchange = event => setTenant(event.target.value);

  fillTenantSelect();
  updateHeader();

  loadClients().then(async () => {
    if (isClient() && !state.clients.length) {
      state.tenant = ROLES.Client.tenant;
      localStorage.setItem('cep.tenant', state.tenant);
      await loadClients();
    }
    updateHeader();
    await loadList();
  });
}

init();
</script>
</body>
</html>
