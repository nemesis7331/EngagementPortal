<style>
/* ====== PALETTE (allineata a demo-poc.html) ====== */
:root{
  --brand-950:#061d36;
  --brand-900:#0a2a4d;
  --brand-700:#0f4275;
  --brand-600:#0b5fa5;
  --brand-500:#2a86d8;
  --brand-100:#e1eefa;
  --brand-50:#f1f7fc;
  --accent:#0e9fb5;
  --ink:#0a1b2e;
  --muted:#566a80;
  --line:#dfe7ef;
  --bg:#f4f7fa;
  --card:#ffffff;
  /* Token semantici di stato: il colore descrive chi deve agire. */
  --st-action:#b42318;   --st-action-bg:#fee4e2;   --st-action-border:#fda29b;
  --st-wait:#7a5b00;     --st-wait-bg:#fff8c5;     --st-wait-border:#eac54f;
  --st-progress:#175cd3; --st-progress-bg:#d1e9ff; --st-progress-border:#b2ddff;
  --st-done:#067647;     --st-done-bg:#dcfae6;     --st-done-border:#a9efc5;
  --st-blocked:#475467;  --st-blocked-bg:#f2f4f7;  --st-blocked-border:#e4e7ec;
  --st-neutral:#475467;  --st-neutral-bg:#f2f4f7;  --st-neutral-border:#e4e7ec;
  --st-negative:#b42318; --st-negative-bg:#fee4e2; --st-negative-border:#fda29b;
  /* rischio preparazione: distinto dal rosso "da gestire" */
  --st-risk:#9a3412;
  /* tipografia: una sola famiglia e una scala a token */
  --font-sans:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --fs-2xs:10.5px;   /* micro etichette */
  --fs-xs:11.5px;    /* tabelle, meta */
  --fs-sm:12.5px;    /* testi secondari */
  --fs-md:13.5px;    /* controlli e testi compatti */
  --fs-base:14.5px;  /* testo corrente */
  --fs-lg:17px;      /* titoli di sezione */
  --fs-xl:19px;      /* titolo sidebar / logo */
  --fs-2xl:22px;     /* h1 su schermi stretti */
  --fs-3xl:26px;     /* h1 e numeri grandi */
  --fs-stat:24px;
  --fw-regular:400;
  --fw-semibold:600;
  --fw-bold:700;
  --fw-black:800;
  --lh-tight:1.25;
  --lh-base:1.5;
  --tracking-caps:.06em;
  /* raggi */
  --radius-xs:6px;
  --radius-sm:8px;
  --radius-md:10px;
  --radius-lg:12px;
  --radius-xl:14px;
  --radius-pill:999px;
  --radius:var(--radius-xl);
  /* superfici e linee secondarie */
  --line-soft:#eef2f7;
  --line-strong:#c9d4e0;
  --surface-2:#eceff6;
  --surface-3:#f8fafc;
  --skeleton-a:#eef3f8;
  --skeleton-b:#f7fafc;
  --muted-2:#7b8a9b;
  --st-wait-strong:#8a4b00;
  --row-action:#fffafa;
  --row-wait:#fffdf5;
  --row-done:#fbfffc;
  --page-max:1440px;
  --shadow:0 1px 2px rgba(6,29,54,.06),0 6px 20px rgba(6,29,54,.06);
  --shadow-xs:0 1px 2px rgba(0,0,0,.25);
  --shadow-lg:0 20px 60px rgba(6,29,54,.35);
  --overlay:rgba(6,29,54,.55);
}*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--ink);font-size:var(--fs-base);line-height:var(--lh-base);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-variant-numeric:tabular-nums}button{font:inherit;cursor:pointer}/* Header */
.shell-main > header{background:linear-gradient(100deg,var(--brand-950),var(--brand-900) 60%,var(--brand-700));color:#fff;position:sticky;top:0;z-index:20}.hwrap{max-width:var(--page-max);margin:0;padding:12px 16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}.logo{display:flex;align-items:center;gap:10px;font-weight:var(--fw-bold);font-size:var(--fs-xl);letter-spacing:0}.logo i{width:30px;height:30px;border-radius:var(--radius-md);background:var(--accent);display:grid;place-items:center;color:var(--brand-950);font-style:normal;font-weight:var(--fw-black)}.logo small{display:block;font-weight:var(--fw-regular);font-size:var(--fs-xs);opacity:.7;letter-spacing:var(--tracking-caps);text-transform:uppercase}.spacer{flex:1}.user{display:flex;align-items:center;gap:10px;font-size:var(--fs-md)}.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-500);display:grid;place-items:center;font-weight:var(--fw-bold)}/* ====== SHELL: SIDEBAR GLOBALE ====== */
.shell{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}.shell-main{min-width:0;display:flex;flex-direction:column}.shell-main > main{width:100%}.app-side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:10px;padding:14px 10px;background:linear-gradient(180deg,var(--brand-950),var(--brand-900) 65%,#08243f);color:#c9d9e7;z-index:40;overflow-y:auto;overflow-x:hidden;transition:width .18s ease,padding .18s ease}.app-side-head{display:flex;align-items:center;gap:8px;padding:2px 6px 8px;min-width:0}.app-logo{display:flex;align-items:center;gap:9px;color:#fff;font-weight:var(--fw-bold);font-size:12.5px;min-width:0}.app-logo i{width:30px;height:30px;border-radius:var(--radius-md);background:var(--accent);color:var(--brand-950);display:grid;place-items:center;font-style:normal;font-weight:var(--fw-black);flex:none;font-size:var(--fs-sm)}.app-logo small{display:block;font-size:var(--fs-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:#9db8ce;font-weight:var(--fw-regular)}.app-logo .logo-txt{min-width:0;white-space:normal;line-height:1.2;font-size:12px;overflow-wrap:break-word}.side-close{display:none;margin-left:auto;width:30px;height:30px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;border-radius:8px;align-items:center;justify-content:center;font-size:20px;line-height:1}.app-nav{display:grid;gap:10px}.nav-group{display:grid;gap:2px}.nav-group[hidden]{display:none}.nav-label{font-size:var(--fs-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:#7d9bb4;font-weight:var(--fw-bold);padding:4px 8px 5px;white-space:nowrap}.nav-item{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;color:#b9cee0;border-radius:var(--radius-md);padding:9px 9px;text-align:left;font-size:var(--fs-md);font-weight:var(--fw-semibold);white-space:nowrap;transition:background .15s,color .15s}.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}.nav-item.on{background:#123e63;color:#fff;box-shadow:inset 3px 0 0 var(--accent)}.nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}.nav-item[hidden]{display:none}.nav-ico{width:16px;height:16px;fill:currentColor;opacity:.92;flex:none}.nav-txt{min-width:0;overflow:hidden;text-overflow:ellipsis}.nav-item.nav-sub{padding-top:6px;padding-bottom:6px;padding-left:31px;font-size:var(--fs-sm);font-weight:var(--fw-regular);color:#9db8ce}.nav-item.nav-sub:hover{color:#fff}.nav-item.nav-sub.on{box-shadow:inset 3px 0 0 var(--st-wait);background:rgba(245,158,11,.12);color:#fcd34d}.nav-count{margin-left:auto;display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 6px;border-radius:999px;background:var(--st-action-bg);color:var(--st-action);font-size:10px;font-weight:800}.nav-item[data-nav="waiting"] .nav-count{background:var(--st-wait-bg);color:var(--st-wait)}.nav-count[hidden]{display:none}body.side-collapsed .nav-count{display:none}.app-side-foot{margin-top:auto;padding-top:10px}.side-collapse{display:flex;align-items:center;gap:9px;width:100%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#c9d9e7;border-radius:var(--radius-md);padding:8px 9px;font-size:var(--fs-sm);font-weight:var(--fw-semibold)}.side-collapse:hover{background:rgba(255,255,255,.09);color:#fff}.side-collapse svg{flex:none;transition:transform .18s}.side-scrim{display:none}.hside{width:34px;height:34px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;display:grid;place-items:center;flex:none}.hside:hover{background:rgba(255,255,255,.16)}.header-section{display:flex;flex-direction:column;line-height:1.15;min-width:0}.header-section span{font-size:var(--fs-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:#9db8ce;font-weight:var(--fw-bold)}.header-section b{font-size:var(--fs-lg);color:#fff;font-weight:var(--fw-semibold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}.hbrand{display:none}
/* Barra demo: si sceglie solo l'utente; profilo e cliente derivano da lui.
   I due select restano nel DOM (servono alla logica), ma non si vedono. */
.demo-switch .demo-field-role,.demo-switch .demo-field-client{display:none}
@media(max-width:1200px){.hwrap .user > div:last-child{display:none}
}
/* Header demo: sotto i 1100px lo spazio è poco, quindi il contesto di pagina
   resta nel titolo. */
@media(max-width:1100px){.header-section{display:none}
}
@media(min-width:901px){body.side-collapsed .shell{grid-template-columns:64px minmax(0,1fr)}body.side-collapsed .app-side{padding:14px 8px}body.side-collapsed .app-logo{justify-content:center}body.side-collapsed .app-logo .logo-txt,body.side-collapsed .nav-label,body.side-collapsed .nav-txt{display:none}body.side-collapsed .nav-item{justify-content:center;padding:10px 0;gap:0}body.side-collapsed .side-collapse{justify-content:center;padding:8px 0;gap:0}body.side-collapsed .side-collapse svg{transform:rotate(180deg)}
}
@media(max-width:900px){.shell{grid-template-columns:minmax(0,1fr)}.app-side{position:fixed;top:0;left:0;bottom:0;width:272px;max-width:86vw;height:100dvh;transform:translateX(-100%);transition:transform .2s ease;z-index:70;box-shadow:18px 0 40px rgba(6,29,54,.28)}body.side-open .app-side{transform:none}.side-scrim{position:fixed;inset:0;background:rgba(6,29,54,.5);z-index:60}body.side-open .side-scrim{display:block}.side-close{display:flex}.app-side-foot{display:none}.hbrand{display:flex}.header-section{display:none}.hwrap{padding:10px 12px;gap:10px}
}/* Layout */
main{max-width:var(--page-max);margin:24px auto 60px 0;padding:0 16px}h1{font-size:var(--fs-3xl);line-height:var(--lh-tight);margin:0 0 4px;color:var(--brand-900)}h2{font-size:var(--fs-lg);line-height:var(--lh-tight);margin:0 0 12px;color:var(--brand-900)}.sub{color:var(--muted);margin:0 0 22px}.crumb{color:var(--brand-600);background:none;border:0;padding:0;margin-bottom:10px;font-weight:var(--fw-semibold)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}.grid{display:grid;gap:16px}/* table */
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tr.row{cursor:pointer;transition:background .15s}tr.row:hover{background:var(--brand-50)}tr:last-child td{border-bottom:0}.name b{display:block;color:var(--brand-900)}.name span{color:var(--muted);font-size:var(--fs-sm)}/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--radius-pill);font-size:var(--fs-sm);font-weight:var(--fw-semibold);white-space:nowrap;border:1px solid transparent}.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}.p-done,.p-ok{background:var(--st-done-bg);color:var(--st-done);border-color:var(--st-done-border)}.p-wait,.p-warn{background:var(--st-wait-bg);color:var(--st-wait);border-color:var(--st-wait-border)}.p-action{background:var(--st-action-bg);color:var(--st-action);border-color:var(--st-action-border)}.p-negative{background:var(--st-negative-bg);color:var(--st-negative);border-color:var(--st-negative-border)}.p-progress,.p-info{background:var(--st-progress-bg);color:var(--st-progress);border-color:var(--st-progress-border)}.p-blocked,.p-neutral,.p-mute{background:var(--st-neutral-bg);color:var(--st-neutral);border-color:var(--st-neutral-border)}.mini{display:flex;gap:4px}.mini i{width:10px;height:6px;border-radius:3px;background:var(--line)}.mini i.on{background:var(--accent)}.mini i.cur{background:var(--brand-500)}/* buttons */
.btn{border:1px solid transparent;border-radius:var(--radius-md);padding:9px 16px;font-weight:var(--fw-semibold);transition:.15s}.btn.pri{background:var(--brand-600);color:#fff}.btn.pri:hover{background:var(--brand-700)}.btn.acc{background:var(--accent);color:var(--brand-950)}.btn.acc:hover{filter:brightness(.95)}.btn.sec{background:#fff;border-color:var(--line);color:var(--brand-900)}.btn.sec:hover{border-color:var(--brand-500)}.btn.dng{background:#fff;border-color:var(--st-negative-border);color:var(--st-negative)}/* Decisioni: niente riempimenti verde/rosso,solo il bordo distingue l'azione */
.decide{background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:9px 16px;font-weight:var(--fw-semibold);color:var(--brand-900);transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}.decide:hover{background:var(--surface-3)}.decide.yes{color:var(--st-done);border-color:var(--st-done-border)}.decide.yes:hover{background:var(--st-done-bg)}.decide.no{color:var(--st-negative);border-color:var(--st-negative-border)}.decide.no:hover{background:var(--st-negative-bg)}.decide.warn{color:var(--st-wait);border-color:var(--st-wait-border)}.decide.warn:hover{background:var(--st-wait-bg)}.decide:focus-visible{outline:2px solid var(--brand-500);outline-offset:2px}.decide.sm{padding:5px 11px;font-size:var(--fs-md)}.decision-group{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn.sm{padding:5px 11px;font-size:var(--fs-md)}.btn[disabled]{opacity:.45;cursor:not-allowed}/* stepper orizzontale legacy (usato solo dai mockup statici) */
.sprite{position:absolute;width:0;height:0;overflow:hidden}/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 18px;overflow:auto}.tab{background:none;border:0;padding:10px 16px;color:var(--muted);font-weight:var(--fw-semibold);border-bottom:3px solid transparent;white-space:nowrap}.tab.on{color:var(--brand-600);border-bottom-color:var(--brand-600)}.tab .lock{display:inline-flex;align-items:center;opacity:.6}.tab .lock svg{width:14px;height:14px;fill:currentColor;display:block}/* misc */

@media(max-width:820px){.two{grid-template-columns:1fr}
}.doc{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.doc:last-child{border-bottom:0}.doc-hist{opacity:.8}.report-kinds{display:grid;gap:12px;margin-top:12px}.report-kind{border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;background:#fff}.rk-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}.rk-head h3{font-size:var(--fs-base);margin:0;display:flex;align-items:center;gap:6px}.rk-head p{font-size:var(--fs-sm);color:var(--muted);margin:2px 0 0}.rk-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}.rk-hist{margin-top:8px;border-top:1px solid var(--line-soft);padding-top:8px}.rk-hist summary{cursor:pointer;font-size:var(--fs-sm);color:var(--brand-600);font-weight:var(--fw-semibold)}.rk-hist .doc{padding:10px 0}.ico{width:42px;height:42px;border-radius:var(--radius-md);background:var(--brand-100);color:var(--brand-600);display:grid;place-items:center;font-weight:var(--fw-black);font-size:var(--fs-sm)}.doc .t{flex:1}.doc .t b{display:block}.doc .t span{font-size:var(--fs-sm);color:var(--muted)}.note{background:var(--brand-50);border:1px solid var(--brand-100);border-radius:var(--radius-md);padding:12px 14px;color:var(--brand-700);font-size:var(--fs-md);margin-bottom:16px}.note.lockbox{background:var(--st-blocked-bg);border-color:var(--st-blocked-border);color:var(--st-blocked)}label{display:block;font-size:var(--fs-sm);font-weight:var(--fw-semibold);margin-bottom:5px;color:var(--brand-900)}input[type=text],input[type=search],input[type=date],input[type=email],input[type=number],input[type=tel],input[type=url],input[type=password],textarea,select.f,#modal select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-md);font:inherit;background:#fff}input:focus,textarea:focus,select:focus{outline:2px solid var(--brand-500);outline-offset:-1px}.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fgrid .full{gri @media(max-width:620px){.fgrid{grid-template-columns:1fr}}/* Setup iniziale */

.obj-person{display:inline-flex;align-items:center;gap:8px;min-width:0;text-align:left}.obj-person .av{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:10px;font-weight:var(--fw-black);background:var(--brand-100);color:var(--brand-700);border:1px solid var(--brand-100)}.obj-person .av.pentester{background:var(--st-progress-bg);color:var(--st-progress);border-color:var(--st-progress-border)}.obj-person .av.manager{background:var(--st-done-bg);color:var(--st-done);border-color:var(--st-done-border)}.obj-person .av.pmo{background:var(--st-wait-bg);color:var(--st-wait);border-color:var(--st-wait-border)}.obj-person .av.cliente{background:var(--surface-2);color:var(--muted);border-color:var(--line)}.obj-person .av.auditor{background:var(--st-risk-bg);color:var(--st-risk);border-color:var(--st-risk-border)}.obj-person .col{display:grid;line-height:1.2;min-width:0}.obj-person .nm{font-size:var(--fs-md);font-weight:var(--fw-semibold);color:var(--brand-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.obj-person .role{font-size:var(--fs-2xs);color:var(--muted)}/* Tipo di attività: solo la sigla,col suo colore */
.obj-type{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:var(--radius-sm);font-size:var(--fs-2xs);font-weight:var(--fw-black);letter-spacing:.02em;border:1px solid;vertical-align:middle;flex:none}.obj-type.pt{background:#e7f1fc;color:#1a5f9e;border-color:#cfe0f5}.obj-type.va{background:#eafaf1;color:#0b6b45;border-color:#bcdfce}.obj-type.rt{background:#fdecec;color:#a12a1f;border-color:#f5c9c5}.obj-type.cr{background:#f3eefc;color:#5b34b5;border-color:#ddd0f7}.obj-type.cs{background:#e9f7fa;color:#0b6b7c;border-color:#bfe6ee}/* Stato: pastiglia con pallino */
.obj-state{display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius-pill);padding:2px 10px 2px 8px;font-size:var(--fs-xs);font-weight:var(--fw-bold);border:1px solid;white-space:nowrap;vertical-align:middle}.obj-state i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;opacity:.9}.obj-state em{font-style:normal;font-weight:var(--fw-black);background:rgba(0,0,0,.07);border-radius:var(--radius-pill);padding:0 6px;font-size:var(--fs-2xs);margin-left:1px}.obj-state.action{background:var(--st-action-bg);color:var(--st-action);border-color:var(--st-action-border)}.obj-state.wait{background:var(--st-wait-bg);color:var(--st-wait);border-color:var(--st-wait-border)}.obj-state.progress{background:var(--st-progress-bg);color:var(--st-progress);border-color:var(--st-progress-border)}.obj-state.ok{background:var(--st-done-bg);color:var(--st-done);border-color:var(--st-done-border)}.obj-state.risk{background:var(--st-risk-bg);color:var(--st-risk);border-color:var(--st-risk-border)}.obj-state.neutral{background:var(--surface-2);color:var(--muted);border-color:var(--line)}/* Periodo: riquadro con icona calendario */
.obj-period{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-3);border-radius:var(--radius-sm);padding:3px 10px;font-size:var(--fs-sm);font-weight:var(--fw-semibold);color:var(--brand-900);white-space:nowrap;vertical-align:middle}.obj-period svg{width:13px;height:13px;fill:var(--muted-2);flex:none}.obj-period .arrow{color:var(--muted-2);font-weight:var(--fw-regular)}.obj-period.live{border-color:var(--st-progress-border);background:var(--st-progress-bg)}/* Deliverable: icona per tipologia + nome + stato */
.obj-doc{display:inline-flex;align-items:center;gap:8px;min-width:0;vertical-align:middle}.obj-doc .ic{width:28px;height:28px;border-radius:var(--radius-sm);display:grid;place-items:center;flex:none;border:1px solid var(--brand-100);background:var(--brand-50);color:var(--brand-700)}.obj-doc .ic svg{width:16px;height:16px;fill:currentColor}.obj-doc .nm{font-size:var(--fs-md);font-weight:var(--fw-semibold);color:var(--brand-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.obj-doc .ver{font-size:var(--fs-2xs);font-weight:var(--fw-black);color:var(--muted-2)}.obj-doc .st{font-size:var(--fs-2xs);font-weight:var(--fw-black);border-radius:var(--radius-pill);padding:1px 8px;border:1px solid;white-space:nowrap}.obj-doc .st.ok{background:var(--st-done-bg);color:var(--st-done);border-color:var(--st-done-border)}.obj-doc .st.draft{background:var(--surface-2);color:var(--muted);border-color:var(--line)}.obj-doc .ic.exec{background:#e7f1fc;border-color:#cfe0f5;color:#1a5f9e}.obj-doc .ic.tech{background:#f3eefc;border-color:#ddd0f7;color:#5b34b5}.obj-doc .ic.act{background:#eafaf1;border-color:#bcdfce;color:#0b6b45}.obj-doc .ic.retest{background:#e9f7fa;border-color:#bfe6ee;color:#0b6b7c}.obj-doc .ic.custom{background:#fff5d6;border-color:#ead48a;color:#8a5b00}/* Engagement: pastiglia compatta (tipo,nome,cliente,avanzamento ad anello) */
.eng-pill{display:inline-flex;align-items:center;gap:8px;height:28px;max-width:100%;border:1px solid var(--line);background:#fff;border-radius:var(--radius-pill);padding:0 10px 0 3px;box-shadow:0 1px 2px rgba(6,29,54,.04);vertical-align:middle}.eng-pill .nm{font-size:var(--fs-md);font-weight:var(--fw-semibold);color:var(--brand-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.eng-pill .cli{width:18px;height:18px;border-radius:50%;flex:none;overflow:hidden;background:var(--brand-50);border:1px solid var(--brand-100);display:grid;place-items:center;position:relative}.eng-pill .cli img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}.eng-pill .ring{width:17px;height:17px;flex:none;display:block}.eng-pill .ring svg{width:100%;height:100%;transform:rotate(-90deg)}.eng-pill .ring circle{fill:none;stroke-width:4}.eng-pill .ring .track{stroke:var(--surface-2)}.eng-pill .ring .fill{stroke:var(--brand-600);stroke-linecap:round}.eng-pill.late .ring .fill{stroke:var(--st-action)}.eng-pill .obj-type{width:20px;height:20px;border-radius:6px}
@media(max-width:700px){.obj-client .nm{max-width:120px}}.admin-users-table .obj-person{vertical-align:middle}.admin-users-table .em{display:block;font-size:var(--fs-2xs);color:var(--muted);margin:2px 0 0 34px}.kpi-table .obj-client{pointer-events:none}/* ====== PANNELLI, BARRE E TABELLE ====== */
.kpi-cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start;margin-bottom:14px}.kpi-col{display:grid;gap:14px;align-content:start;min-width:0}.kpi-panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:14px;min-width:0;margin-bottom:14px}.kpi-cols .kpi-panel{margin-bottom:0}.kpi-panel > h2{margin:0 0 4px;font-size:var(--fs-lg)}.kpi-panel > .hint{margin:0 0 10px}.kpi-table{width:100%;border-collapse:collapse;font-size:var(--fs-md)}.kpi-table caption{text-align:left}.kpi-table th{text-align:left;font-size:var(--fs-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--muted-2);font-weight:var(--fw-black);padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap}.kpi-table td{padding:9px;border-bottom:1px solid var(--line-soft);vertical-align:middle}.kpi-table tbody tr[data-act]{cursor:pointer}.kpi-table tbody tr[data-act]:hover{background:var(--surface-3)}.kpi-table .name b{display:block;font-size:var(--fs-md);color:var(--brand-900);line-height:1.25}.kpi-table .name span{display:block;font-size:var(--fs-2xs);color:var(--muted)}.kpi-num{display:inline-block;min-width:22px;font-weight:var(--fw-bold);color:var(--brand-900)}.kpi-bar{display:block;height:6px;border-radius:var(--radius-pill);background:var(--surface-2);overflow:hidden;margin-top:4px;min-width:60px}.kpi-bar i{display:block;height:100%;background:var(--brand-500);border-radius:var(--radius-pill)}
@media(max-width:1100px){.kpi-cols{grid-template-columns:minmax(0,1fr)}.kpi-panel{overflow-x:auto}}

/* ====== DASHBOARD: pannelli e tabelle ====== */
.dash-panel-head{display:flex;align-items:baseline;gap:8px;margin:0 0 3px}
.dash-panel-head h2{margin:0}
.dash-table .name b{display:block}

.dash-table td{padding:7px 9px;vertical-align:top}
.dash-eng{min-width:170px;max-width:260px;line-height:1.3}
.dash-eng > span{display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash-eng .obj-type{width:22px;height:22px;margin-right:2px}
.dash-table .phase{min-width:0;max-width:100%}

.dash-flags{display:flex;flex-wrap:wrap;gap:5px;min-width:180px;white-space:normal}

.dash-panel-foot{margin:10px 0 0;display:flex;justify-content:flex-end}
@media(max-width:820px){.dash-opt{display:none}}
/* Righe-card degli engagement in Dashboard: stesso linguaggio della scheda

.eng-list{display:grid;gap:8px}
.eng-row{background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:0 1px 2px rgba(6,29,54,.04);padding:10px 12px;cursor:pointer;transition:border-color .15s,box-shadow .15s}

/* ====== TIPI DI ATTIVITÀ ====== */
.admin-table.act-table{table-layout:auto}
.act-table td{vertical-align:middle}
.act-table th.act-k,.act-table td.act-k{width:auto;min-width:84px;text-align:center;white-space:nowrap}
.act-table th:last-child{width:120px}
.act-main{min-width:250px}
.act-name{display:flex;align-items:center;gap:8px}
.act-badge{appearance:none;width:40px;height:30px;padding:0;flex:none;border:1px solid var(--brand-100);border-radius:8px;background:var(--brand-50);color:var(--brand-700);font:inherit;font-size:var(--fs-xs);font-weight:var(--fw-black);text-align:center;text-transform:uppercase}
.act-label{flex:1;min-width:0;border:1px solid transparent;border-radius:7px;background:transparent;padding:3px 6px;font:inherit;font-size:var(--fs-md);font-weight:var(--fw-semibold);color:var(--brand-900);text-overflow:ellipsis}

.act-badge:hover,.act-label:hover,.act-desc:hover{border-color:var(--line)}

}/* ====== MAILING LIST: filtri,elenco,dettaglio ====== */
.admin-mm{display:grid;gap:12px}.ml-filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:11px 12px}.ml-filters .search{flex:1;min-width:240px;margin:0}.ml-group{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}.ml-lbl{font-size:10px;text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--muted-2);font-weight:800}.chip{appearance:none;border:1px solid var(--line);background:#fff;border-radius:var(--radius-pill);padding:5px 12px;font:inherit;font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--muted);cursor:pointer;line-height:1.2}.chip:hover{border-color:var(--brand-500);color:var(--brand-900)}.chip[aria-pressed="true"]{border-color:var(--brand-500);background:var(--brand-50);color:var(--brand-700)}.chip:focus-visible{outline:2px solid var(--brand-500);outline-offset:2px}.ml-count{margin-left:auto;font-size:var(--fs-xs);color:var(--muted);font-weight:var(--fw-semibold);white-space:nowrap}.ml-list{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:auto;max-height:420px}.ml-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line-soft);background:#fff;padding:10px 13px;cursor:pointer;color:inherit;font:inherit}.ml-list .ml-item:last-child{border-bottom:0}.ml-item:hover{background:var(--surface-3)}.ml-item.on{background:var(--brand-50);box-shadow:inset 3px 0 0 var(--brand-600)}.ml-item:focus-visible{outline:2px solid var(--brand-500);outline-offset:-2px}.ml-av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:var(--fs-2xs);font-weight:var(--fw-black);flex:none;background:var(--brand-50);border:1px solid var(--brand-100);color:var(--brand-700)}.ml-av.eng{background:var(--st-progress-bg);border-color:var(--st-progress-border);color:var(--st-progress)}.ml-who{flex:1;min-width:0}.ml-who b{display:block;font-size:var(--fs-md);color:var(--brand-900);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ml-who small{display:block;font-size:var(--fs-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ml-end{display:flex;align-items:center;gap:7px;justify-content:flex-end;flex-wrap:wrap}.ml-detail{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:16px}.ml-dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line-soft);padding-bottom:12px;margin-bottom:14px}.ml-dhead .t{flex:1;min-width:200px}.ml-dhead h3{margin:0;font-size:var(--fs-xl)}.ml-dhead p{margin:3px 0 0;font-size:var(--fs-sm);color:var(--muted)}.ml-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}.ml-block{border:1px solid var(--line);border-radius:var(--radius-md);background:#fff;padding:12px;margin-bottom:10px}.ml-block h4{margin:0 0 8px;font-size:var(--fs-md);display:flex;align-items:center;gap:8px}.ml-block h4 .cnt{font-size:var(--fs-2xs)}.ml-block .hint{margin:0 0 8px}.ml-block.ml-base{background:var(--surface-3);border-style:dashed}.ml-mini{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-2);font-weight:var(--fw-bold);margin:8px 0 4px}.ml-people{display:grid;gap:7px}.ml-person{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) 140px 30px;gap:7px;align-items:center}.ml-person input,.ml-person select{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff;font:inherit;font-size:var(--fs-xs)}.ml-person input[readonly]{background:var(--surface-3);color:var(--muted)}.ml-x{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:var(--radius-sm);color:var(--muted);cursor:pointer;padding:0;font-size:var(--fs-lg);line-height:1}.ml-x:hover{border-color:var(--st-action-border);background:var(--st-action-bg);color:var(--st-action)}.ml-x-ph{width:30px;text-align:center;color:var(--muted-2)}.ml-subject{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:var(--radius-sm);font:inherit;font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--brand-900)}.ml-subject-body{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:var(--radius-sm);font:inherit;font-size:var(--fs-xs);line-height:1.45;min-height:104px;resize:vertical}.ml-blockacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:11px;border-top:1px solid var(--line-soft);padding-top:11px}

/* ====== WORKFLOW COMPATTO IN ALTO ====== */
/* Un segmento per passo: verde chiuso, rosso azione richiesta, ambra attesa,
   grigio bloccato; il passo corrente ha il numero in evidenza. */
.wf-top{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:10px 12px 9px;margin:12px 0 14px;min-width:0}
.wf-head{display:flex;align-items:baseline;gap:8px;margin:0 0 8px;font-size:var(--fs-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--muted-2);font-weight:var(--fw-bold)}
.wf-head span{font-weight:var(--fw-semibold);letter-spacing:0;text-transform:none;color:var(--muted)}
.wf-steps{display:flex;gap:8px;min-width:0}
.wf-step{flex:1;min-width:0;border:0;border-radius:var(--radius-sm);background:none;padding:2px 2px 3px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.wf-step:hover{background:var(--surface-3)}
.wf-step:focus-visible{outline:2px solid var(--brand-500);outline-offset:2px}
.wf-bar{display:block;height:4px;border-radius:3px;background:var(--line);transition:background .15s}
.wf-step .wf-lbl{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:var(--fs-2xs);line-height:1.2;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf-step .wf-lbl b{font-weight:var(--fw-bold);opacity:.7;flex:none}
.wf-step.s-ok .wf-bar{background:var(--st-done)}
.wf-step.s-ok .wf-lbl{color:var(--muted)}
.wf-step.s-todo .wf-bar{background:var(--st-action)}
.wf-step.s-todo .wf-lbl{color:var(--st-action);font-weight:var(--fw-semibold)}
.wf-step.s-wait .wf-bar{background:var(--st-wait-border)}
.wf-step.s-wait .wf-lbl{color:var(--st-wait)}
.wf-step.s-lock .wf-bar{background:var(--line-strong)}
.wf-step.cur .wf-bar{box-shadow:0 0 0 2px var(--brand-100)}
.wf-step.cur .wf-lbl{color:var(--brand-900);font-weight:var(--fw-bold)}
.wf-step.cur .wf-lbl b{opacity:1;background:var(--brand-900);color:#fff;border-radius:4px;padding:0 3px}
/* ====== SCHEDA ENGAGEMENT · proposta B1: workflow verticale + contesto ====== */
.hero-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 0}
.hero-meta b{color:var(--brand-900);font-weight:600}
.hero-meta .hero-pending{color:var(--st-wait);font-weight:600}
.rail-wf{background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:9px}
.rail-cap{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:2px 6px 7px;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-2);font-weight:800}
.rail-cap span{letter-spacing:0;text-transform:none;color:var(--muted);font-weight:600;font-size:11px}
.wf-vsteps{display:grid;gap:1px}
.wf-vstep{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;border-radius:8px;padding:6px 7px;font:inherit;text-align:left;color:var(--muted);cursor:pointer;min-width:0}
.wf-vstep:hover{background:var(--surface-3)}
.wf-vstep:focus-visible{outline:2px solid var(--brand-500);outline-offset:1px}
.wf-vnum{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:800;flex:none;border:1.5px solid var(--line);background:#fff;color:var(--muted-2);line-height:1}
.wf-vstep.s-ok .wf-vnum{background:var(--st-done);border-color:var(--st-done);color:#fff}
.wf-vstep.s-todo .wf-vnum{border-color:var(--st-action-border);color:var(--st-action)}
.wf-vstep.s-wait .wf-vnum{background:var(--st-wait-bg);border-color:var(--st-wait-border);color:var(--st-wait)}
.wf-vstep.s-lock{color:var(--muted-2)}
.wf-vstep.s-lock .wf-vnum{background:var(--surface-2);border-color:var(--line)}
.wf-vstep.cur{background:var(--brand-50);color:var(--brand-700);font-weight:700;box-shadow:inset 2px 0 0 var(--brand-600)}
.wf-vstep.cur .wf-vnum{background:var(--brand-600);border-color:var(--brand-600);color:#fff}
.wf-vlbl{font-size:11.5px;line-height:1.15;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail-cols > .context-rail .ctx-card{padding:10px 11px}
.detail-cols > .context-rail{top:calc(var(--app-header-h,64px) + 12px)}
.work-panel-head{padding:12px 14px}
.work-panel-body{padding:14px}
.work-panel-body > .card + .card{margin-top:12px}
.work-panel-body .card{padding:14px 16px}
.work-panel-body > .note{margin-bottom:12px}
/* ====== INTESTAZIONE A SCHEDA · stato e proprietari del passo ====== */
.eng-hero-card{display:block;background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:14px 16px;margin:2px 0 0}
.eng-hero-card .eng-hero-t{min-width:0}
.hero-band{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;margin:12px 0 0;padding:11px 0 0;border-top:1px solid var(--line-soft)}
.hero-band .band-owner{display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--muted);min-width:0}
.hero-band .band-owner b{color:var(--brand-900);font-weight:var(--fw-semibold)}
.hero-band .band-person{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-3);border-radius:var(--radius-pill);padding:2px 9px 2px 2px;font-size:var(--fs-xs);font-weight:var(--fw-semibold);color:var(--brand-900);white-space:nowrap}
.hero-band .band-person .avatar{width:20px;height:20px;font-size:9px}

// Identità della demo in cookie, non nell'URL: un link condiviso non può
// cambiare profilo (`?role=...` viene ignorato). Il server legge gli stessi
// cookie, così le chiamate API non devono rimandare ruolo e utente.
const ID_COOKIE = { role: 'cep_role', user: 'cep_user', client: 'cep_client' };

function readCookie(name) {
  const prefix = `${name}=`;
  const row = document.cookie.split('; ').find(item => item.startsWith(prefix));
  if (!row) return null;
  try { return decodeURIComponent(row.slice(prefix.length)); } catch { return row.slice(prefix.length); }
}

function writeCookie(name, value) {
  document.cookie = `${name}=${encodeURIComponent(value || '')}; path=/; max-age=31536000; SameSite=Lax`;
}

// Allinea i cookie allo stato corrente (usata dopo ogni cambio nel menu demo).
function writeIdentity() {
  writeCookie(ID_COOKIE.role, state.role);
  writeCookie(ID_COOKIE.user, state.userId || '');
  writeCookie(ID_COOKIE.client, state.clientId || '');
}

// Primo accesso: profilo Manager.
if (readCookie(ID_COOKIE.role) === null) writeCookie(ID_COOKIE.role, 'Manager');
if (readCookie(ID_COOKIE.user) === null) writeCookie(ID_COOKIE.user, '');
if (readCookie(ID_COOKIE.client) === null) writeCookie(ID_COOKIE.client, '');

const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v)
  .replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = d => {
  if (!d) return '–';
  const [y, m, g] = String(d).substring(0, 10).split('-');
  return g && m && y ? `${g}/${m}/${y}` : d;
};
const fmtTime = d => {
  if (!d) return '–';
  const date = new Date(d);
  if (Number.isNaN(date.getTime())) return fmt(d);
  const p = n => String(n).padStart(2, '0');
  return `${p(date.getDate())}/${p(date.getMonth() + 1)}/${date.getFullYear()} ${p(date.getHours())}:${p(date.getMinutes())}`;
};
const fmtSize = n => n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : n >= 1024 ? `${Math.round(n / 1024)} KB` : `${n} B`;
const fmtMoney = n => {
  if (n == null || n === '') return '–';
  const value = Number(n);
  if (Number.isNaN(value)) return '–';
  return new Intl.NumberFormat('it-IT', {
    style: 'currency',
    currency: 'EUR',
    maximumFractionDigits: 2
  }).format(value);
};
const fmtPercent = n => {
  if (n == null || n === '') return '–';
  const value = Number(n);
  if (Number.isNaN(value)) return '–';
  return `${new Intl.NumberFormat('it-IT', {
    maximumFractionDigits: 2
  }).format(value)}%`;
};
// Il margine è una percentuale sul costo: il ricavo dell'attività è

}

    || { id, name: (e && e.clientName) || clientName(id) };

function faviconUrl(website) {
  if (!website) return '';
  try {
    const url = new URL(website);
    return url.hostname
      ? `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(url.hostname)}`
      : '';
  } catch {
    return '';
  }
}
function initialsOf(name) {
  const clean = String(name || '?').trim();
  const parts = clean.split(/\s+/).filter(Boolean);
  if (parts.length === 1) return (clean.slice(0, 2) || '?').toUpperCase();
  return (parts.map(p => p[0]).join('').slice(0, 2) || '?').toUpperCase();
}
function hostOf(website) {
  try {
    return new URL(website).hostname.replace(/^www\./, '');
  } catch {
    return website || '';
  }
}

// Anello di avanzamento: stessi numeri della pastiglia engagement, riusabile
// dove serve una versione compatta (lista, calendario).
function progressRing(e, opts = {}) {
  const total = Number(e && e.stepCount) || (e && e.retestPlanned ? 9 : 7);
  const index = Math.max(0, Math.min(Number(e && e.stepIndex) || 0, total));
  const percent = Math.round((index / total) * 100);
  const label = `Passo ${index} di ${total}`;

  return `<span class="ring${opts.late ? ' late' : ''}" title="${esc(label)}" role="img" aria-label="${esc(label)}">
    <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.9" class="track"></circle><circle cx="18" cy="18" r="15.9" class="fill" style="stroke-dasharray:${percent} 100"></circle></svg>
  </span>`;
}

// Engagement: pastiglia compatta (tipo, nome, cliente, avanzamento ad anello).
function engPill(e, opts = {}) {
  const late = opts.late !== undefined
    ? opts.late
    : daysSince((actionState(e) || {}).since) >= STALE_DAYS;
  const client = clientFor(e);
  const src = faviconUrl(client && client.website);
  const total = Number(e.stepCount) || (e.retestPlanned ? 9 : 7);
  const index = Math.max(0, Math.min(Number(e.stepIndex) || 0, total));

  return `<span class="eng-pill${late ? ' late' : ''}" title="${esc(e.name)} · ${esc(e.clientName || '')} · passo ${index} di ${total}">
    ${typeBadge(e.type)}
    <span class="nm">${esc(e.name)}</span>
    <span class="cli" title="${esc(e.clientName || '')}">${src
      ? `<img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`
      : esc(initialsOf(e.clientName))}</span>
    ${progressRing(e, { late })}
  </span>`;
}

async function api(path, options = {}) {
  const url = path.replace(/\?$/, '');
  const response = await fetch(url, {
    ...options,
    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
  });
  if (!response.ok) {
    let message = `Errore ${response.status}`;
    try {
      const body = await response.json();
      if (typeof body === 'string' && body.trim()) message = body;
      else message = (body && (body.detail || body.title)) || message;
    } catch { /* corpo non JSON (es. 403 vuoto) */ }
    if (message === `Errore ${response.status}`) {
      message = {
        400: 'Richiesta non valida.',
        403: 'Operazione non consentita per il tuo profilo.',
        404: 'Risorsa non trovata.',
        409: 'Elemento già esistente o in conflitto.'
      }[response.status] || message;
    }
    throw new Error(message);
  }
  if (response.status === 204) return null;
  const type = response.headers.get('content-type') || '';
  return type.includes('json') ? response.json() : response;
}

function downloadResponse(response, fallbackName) {
  return response.blob().then(blob => {
    const disposition = response.headers.get('content-disposition') || '';
    const match = /filename="?([^";]+)"?/i.exec(disposition);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = match ? match[1] : fallbackName;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });
}

function pickFile(accept) {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file';
    if (accept) input.accept = accept;
    input.onchange = () => resolve(input.files[0] ? input.files[0].name : null);
    input.click();
  });
}

/* ====== MODALE ====== */
function ask({ title, text, fields = [], ok = 'Conferma', danger = false }) {
  return new Promise(resolve => {
    const opener = document.activeElement;
    const fieldsHtml = fields.map(f => {
      const control = f.area
        ? `<textarea id="m_${esc(f.id)}" rows="3" placeholder="${esc(f.ph || '')}">${esc(f.value || '')}</textarea>`
        : f.type === 'select'
          ? `<select class="f" id="m_${esc(f.id)}">${(f.options || [])
              .map(o => `<option value="${esc(o[0])}" ${o[0] === (f.value || (f.options[0] || [])[0]) ? 'selected' : ''}>${esc(o[1])}</option>`)
              .join('')}</select>`
          : `<input type="${esc(f.type || 'text')}" id="m_${esc(f.id)}" value="${esc(f.value || '')}"
               placeholder="${esc(f.ph || '')}" ${f.min ? `min="${esc(f.min)}"` : ''} ${f.max ? `max="${esc(f.max)}"` : ''}>`;
      return `<div class="${f.half ? '' : 'full'}">
        <label for="m_${esc(f.id)}">${esc(f.label)}</label>${control}</div>`;
    }).join('');

    $('#modal').innerHTML = `
      <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mt">
        <h2 id="mt">${esc(title)}</h2>
        ${text ? `<p class="sub" style="margin-bottom:14px">${esc(text)}</p>` : ''}
        <div class="fgrid">${fieldsHtml}</div>
        <div class="mact">
          <button class="btn sec" data-modal="cancel">Annulla</button>
          <button class="btn ${danger ? 'dng' : 'pri'}" data-modal="ok">${esc(ok)}</button>
        </div>
      </div>`;
    $('#modal').classList.add('show');

    const close = value => {
      $('#modal').classList.remove('show');
      $('#modal').innerHTML = '';
      document.removeEventListener('keydown', onKey);
      if (opener && opener.isConnected && opener.focus) opener.focus();
      resolve(value);
    };
    const confirm = () => {
      const values = {};
      fields.forEach(f => { values[f.id] = ($('#m_' + f.id)?.value || '').trim(); });
      close(values);
    };
    const onKey = event => {
      if (event.key === 'Escape') close(null);
      if (event.key === 'Enter' && event.target && event.target.tagName === 'INPUT') confirm();
    };
    document.addEventListener('keydown', onKey);
    $('#modal').querySelector('[data-modal="cancel"]').onclick = () => close(null);
    $('#modal').querySelector('[data-modal="ok"]').onclick = confirm;
    const first = fields[0] && $('#m_' + fields[0].id);
    if (first) setTimeout(() => first.focus(), 30);
    else setTimeout(() => $('#modal').querySelector('[data-modal="ok"]').focus(), 30);
  });
}

/* Sceglie come consegnare un report: invio automatico dal portale (con i
   destinatari della DL, modificabili al volo) oppure invio manuale. */
async function askSendMode({ title, text, recipients = [], ok = 'Invia' }) {
  const value = await ask({
    title,
    text,
    ok,
    fields: [
      {
        id: 'mode',
        label: 'Modalità di invio',
        type: 'select',
        options: [
          ['auto', 'Automatico · email dal portale'],
          ['manual', 'Manuale · fuori dal portale']
        ]
      },
      {
        id: 'recipients',
        label: 'Destinatari (separati da virgola; ignorati con invio manuale)',
        area: true,
        value: recipients.join(', ')
      }
    ]
  });

  if (!value) return null;

  const list = String(value.recipients || '')
    .split(/[,;\s]+/)
    .map(item => item.trim())
    .filter(Boolean);

  if (value.mode === 'auto' && !list.length) {
    toast('Aggiungi almeno un destinatario o scegli l\'invio manuale');
    return null;
  }

  return {
    mode: value.mode === 'manual' ? 'manual' : 'auto',
    recipients: value.mode === 'manual' ? [] : list
  };
}
