<style>
/* ====== PALETTE (allineata a demo-poc.html) ====== */
:root{
  --brand-950:#061d36;
  --brand-900:#0a2a4d;
  --brand-700:#0f4275;
  --brand-600:#0b5fa5;
  --brand-500:#2a86d8;

  --ink:#0a1b2e;
  --muted:#566a80;
  --line:#dfe7ef;
  --bg:#f4f7fa;
  --card:#ffffff;
  /* Token semantici di stato: il colore descrive chi deve agire. */
  --st-action:#b42318;   --st-action-bg:#fee4e2;   --st-action-border:#fda29b;
  --st-wait:#7a5b00;     --st-wait-bg:#fff8c5;     --st-wait-border:#eac54f;
  --st-progress:#175cd3; --st-progress-bg:#d1e9ff; --st-progress-border:#b2ddff;
  --st-done:#067647;     --st-done-bg:#dcfae6;     --st-done-border:#a9efc5;
  --st-blocked:#475467;  --st-blocked-bg:#f2f4f7;  --st-blocked-border:#e4e7ec;
  --st-neutral:#475467;  --st-neutral-bg:#f2f4f7;  --st-neutral-border:#e4e7ec;
  --st-negative:#b42318; --st-negative-bg:#fee4e2; --st-negative-border:#fda29b;
  /* rischio preparazione: distinto dal rosso "da gestire" */
  --st-risk:#9a3412;
  /* tipografia: una sola famiglia e una scala a token */
  --font-sans:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --fs-2xs:10.5px;   /* micro etichette */
  --fs-xs:11.5px;    /* tabelle, meta */
  --fs-sm:12.5px;    /* testi secondari */
  --fs-md:13.5px;    /* controlli e testi compatti */
  --fs-base:14.5px;  /* testo corrente */
  --fs-lg:17px;      /* titoli di sezione */
  --fs-xl:19px;      /* titolo sidebar / logo */
  --fs-2xl:22px;     /* h1 su schermi stretti */
  --fs-3xl:26px;     /* h1 e numeri grandi */
  --fs-stat:24px;
  --fw-regular:400;
  --fw-semibold:600;
  --fw-bold:700;
  --fw-black:800;
  --lh-tight:1.25;
  --lh-base:1.5;
  --tracking-caps:.06em;
  /* raggi */
  --radius-xs:6px;
  --radius-sm:8px;
  --radius-md:10px;
  --radius-lg:12px;
  --radius-xl:14px;
  --radius-pill:999px;
  --radius:var(--radius-xl);
  /* superfici e linee secondarie */
  --line-soft:#eef2f7;
  --line-strong:#c9d4e0;
  --surface-2:#eceff6;
  --surface-3:#f8fafc;
  --skeleton-a:#eef3f8;
  --skeleton-b:#f7fafc;
  --muted-2:#7b8a9b;
  --st-wait-strong:#8a4b00;
  --row-action:#fffafa;
  --row-wait:#fffdf5;
  --row-done:#fbfffc;
  --page-max:1440px;
  --shadow:0 1px 2px rgba(6,29,54,.06),0 6px 20px rgba(6,29,54,.06);
  --shadow-xs:0 1px 2px rgba(0,0,0,.25);
  --shadow-lg:0 20px 60px rgba(6,29,54,.35);
  --overlay:rgba(6,29,54,.55);
}*{box-sizing:border-box}body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--ink);font-size:var(--fs-base);line-height:var(--lh-base);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-variant-numeric:tabular-nums}button{font:inherit;cursor:pointer}/* Header */
.shell-main > header{background:linear-gradient(100deg,var(--brand-950),var(--brand-900) 60%,var(--brand-700));color:#fff;position:sticky;top:0;z-index:20}.hwrap{max-width:var(--page-max);margin:0;padding:12px 16px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}.logo{display:flex;align-items:center;gap:10px;font-weight:var(--fw-bold);font-size:var(--fs-xl);letter-spacing:0}.logo i{width:30px;height:30px;border-radius:var(--radius-md);background:var(--accent);display:grid;place-items:center;color:var(--brand-950);font-style:normal;font-weight:var(--fw-black)}.logo small{display:block;font-weight:var(--fw-regular);font-size:var(--fs-xs);opacity:.7;letter-spacing:var(--tracking-caps);text-transform:uppercase}.spacer{flex:1}.user{display:flex;align-items:center;gap:10px;font-size:var(--fs-md)}.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-500);display:grid;place-items:center;font-weight:var(--fw-bold)}/* ====== SHELL: SIDEBAR GLOBALE ====== */
.shell{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}.shell-main{min-width:0;display:flex;flex-direction:column}.shell-main > main{width:100%}.app-side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:10px;padding:14px 10px;background:linear-gradient(180deg,var(--brand-950),var(--brand-900) 65%,#08243f);color:#c9d9e7;z-index:40;overflow-y:auto;overflow-x:hidden;transition:width .18s ease,padding .18s ease}.app-side-head{display:flex;align-items:center;gap:8px;padding:2px 6px 8px;min-width:0}.app-logo{display:flex;align-items:center;gap:9px;color:#fff;font-weight:var(--fw-bold);font-size:12.5px;min-width:0}.app-logo i{width:30px;height:30px;border-radius:var(--radius-md);background:var(--accent);color:var(--brand-950);display:grid;place-items:center;font-style:normal;font-weight:var(--fw-black);flex:none;font-size:var(--fs-sm)}.app-logo small{display:block;font-size:var(--fs-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:#9db8ce;font-weight:var(--fw-regular)}.app-logo .logo-txt{min-width:0;white-space:normal;line-height:1.2;font-size:12px;overflow-wrap:break-word}.side-close{display:none;margin-left:auto;width:30px;height:30px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;border-radius:8px;align-items:center;justify-content:center;font-size:20px;line-height:1}.app-nav{display:grid;gap:10px}.nav-group{display:grid;gap:2px}.nav-group[hidden]{display:none}.nav-label{font-size:var(--fs-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:#7d9bb4;font-weight:var(--fw-bold);padding:4px 8px 5px;white-space:nowrap}.nav-item{display:flex;align-items:center;gap:9px;width:100%;border:0;background:none;color:#b9cee0;border-radius:var(--radius-md);padding:9px 9px;text-align:left;font-size:var(--fs-md);font-weight:var(--fw-semibold);white-space:nowrap;transition:background .15s,color .15s}.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}.nav-item.on{background:#123e63;color:#fff;box-shadow:inset 3px 0 0 var(--accent)}.nav-item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}.nav-item[hidden]{display:none}.nav-ico{width:16px;height:16px;fill:currentColor;opacity:.92;flex:none}.nav-txt{min-width:0;overflow:hidden;text-overflow:ellipsis}.nav-item.nav-sub{padding-top:6px;padding-bottom:6px;padding-left:31px;font-size:var(--fs-sm);font-weight:var(--fw-regular);color:#9db8ce}.nav-item.nav-sub:hover{color:#fff}.nav-item.nav-sub.on{box-shadow:inset 3px 0 0 var(--st-wait);background:rgba(245,158,11,.12);color:#fcd34d}.nav-count{margin-left:auto;display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 6px;border-radius:999px;background:var(--st-action-bg);color:var(--st-action);font-size:10px;font-weight:800}.nav-item[data-nav="waiting"] .nav-count{background:var(--st-wait-bg);color:var(--st-wait)}.nav-count[hidden]{display:none}body.side-collapsed .nav-count{display:none}.app-side-foot{margin-top:auto;padding-top:10px}.side-collapse{display:flex;align-items:center;gap:9px;width:100%;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:#c9d9e7;border-radius:var(--radius-md);padding:8px 9px;font-size:var(--fs-sm);font-weight:var(--fw-semibold)}.side-collapse:hover{background:rgba(255,255,255,.09);color:#fff}.side-collapse svg{flex:none;transition:transform .18s}.side-scrim{display:none}.hside{width:34px;height:34px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;border-radius:8px;display:grid;place-items:center;flex:none}.hside:hover{background:rgba(255,255,255,.16)}.header-section{display:flex;flex-direction:column;line-height:1.15;min-width:0}.header-section span{font-size:var(--fs-2xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:#9db8ce;font-weight:var(--fw-bold)}.header-section b{font-size:var(--fs-lg);color:#fff;font-weight:var(--fw-semibold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}.hbrand{display:none}
@media(max-width:1500px){.demo-switch label{font-size:0;gap:0}.demo-switch select{font-size:var(--fs-sm);max-width:170px}.demo-switch #role{max-width:120px}.demo-switch #client{max-width:165px}
}
@media(max-width:1200px){.hwrap .user > div:last-child{display:none}
}
@media(max-width:900px){.demo-switch select{max-width:none}
}
@media(min-width:901px){body.side-collapsed .shell{grid-template-columns:64px minmax(0,1fr)}body.side-collapsed .app-side{padding:14px 8px}body.side-collapsed .app-logo{justify-content:center}body.side-collapsed .app-logo .logo-txt,body.side-collapsed .nav-label,body.side-collapsed .nav-txt{display:none}body.side-collapsed .nav-item{justify-content:center;padding:10px 0;gap:0}body.side-collapsed .side-collapse{justify-content:center;padding:8px 0;gap:0}body.side-collapsed .side-collapse svg{transform:rotate(180deg)}
}
@media(max-width:900px){.shell{grid-template-columns:minmax(0,1fr)}.app-side{position:fixed;top:0;left:0;bottom:0;width:272px;max-width:86vw;height:100dvh;transform:translateX(-100%);transition:transform .2s ease;z-index:70;box-shadow:18px 0 40px rgba(6,29,54,.28)}body.side-open .app-side{transform:none}.side-scrim{position:fixed;inset:0;background:rgba(6,29,54,.5);z-index:60}body.side-open .side-scrim{display:block}.side-close{display:flex}.app-side-foot{display:none}.hbrand{display:flex}.header-section{display:none}.hwrap{padding:10px 12px;gap:10px}
}/* Layout */
main{max-width:var(--page-max);margin:24px auto 60px 0;padding:0 16px}h1{font-size:var(--fs-3xl);line-height:var(--lh-tight);margin:0 0 4px;color:var(--brand-900)}h2{font-size:var(--fs-lg);line-height:var(--lh-tight);margin:0 0 12px;color:var(--brand-900)}.sub{color:var(--muted);margin:0 0 22px}.crumb{color:var(--brand-600);background:none;border:0;padding:0;margin-bottom:10px;font-weight:var(--fw-semibold)}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}.grid{display:grid;gap:16px}/* table */
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}tr.row{cursor:pointer;transition:background .15s}tr.row:hover{background:var(--brand-50)}tr:last-child td{border-bottom:0}.name b{display:block;color:var(--brand-900)}.name span{color:var(--muted);font-size:var(--fs-sm)}/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--radius-pill);font-size:var(--fs-sm);font-weight:var(--fw-semibold);white-space:nowrap;border:1px solid transparent}.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}.p-done,.p-ok{background:var(--st-done-bg);color:var(--st-done);border-color:var(--st-done-border)}.p-wait,.p-warn{background:var(--st-wait-bg);color:var(--st-wait);border-color:var(--st-wait-border)}.p-action{background:var(--st-action-bg);color:var(--st-action);border-color:var(--st-action-border)}.p-negative{background:var(--st-negative-bg);color:var(--st-negative);border-color:var(--st-negative-border)}.p-progress,.p-info{background:var(--st-progress-bg);color:var(--st-progress);border-color:var(--st-progress-border)}.p-blocked,.p-neutral,.p-mute{background:var(--st-neutral-bg);color:var(--st-neutral);border-color:var(--st-neutral-border)}.mini{display:flex;gap:4px}.mini i{width:10px;height:6px;border-radius:3px;background:var(--line)}.mini i.on{background:var(--accent)}.mini i.cur{background:var(--brand-500)}/* buttons */
.btn{border:1px solid transparent;border-radius:var(--radius-md);padding:9px 16px;font-weight:var(--fw-semibold);transition:.15s}.btn.pri{background:var(--brand-600);color:#fff}.btn.pri:hover{background:var(--brand-700)}.btn.acc{background:var(--accent);color:var(--brand-950)}.btn.acc:hover{filter:brightness(.95)}.btn.sec{background:#fff;border-color:var(--line);color:var(--brand-900)}.btn.sec:hover{border-color:var(--brand-500)}.btn.dng{background:#fff;border-color:var(--st-negative-border);color:var(--st-negative)}/* Decisioni: niente riempimenti verde/rosso,solo il bordo distingue l'azione */

}.doc{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.doc:last-child{border-bottom:0}.doc-hist{opacity:.8}.report-kinds{display:grid;gap:12px;margin-top:12px}.report-kind{border:1px solid var(--line);border-radius:var(--radius-md);padding:12px 14px;background:#fff}.rk-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}.rk-head h3{font-size:var(--fs-base);margin:0;display:flex;align-items:center;gap:6px}.rk-head p{font-size:var(--fs-sm);color:var(--muted);margin:2px 0 0}.rk-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}.rk-hist{margin-top:8px;border-top:1px solid var(--line-soft);padding-top:8px}.rk-hist summary{cursor:pointer;font-size:var(--fs-sm);color:var(--brand-600);font-weight:var(--fw-semibold)}.rk-hist .doc{padding:10px 0}.ico{width:42px;height:42px;border-radius:var(--radius-md);background:var(--brand-100);color:var(--brand-600);display:grid;place-items:center;font-weight:var(--fw-black);font-size:var(--fs-sm)}.doc .t{flex:1}.doc .t b{display:block}.doc .t span{font-size:var(--fs-sm);color:var(--muted)}.note{background:var(--brand-50);border:1px solid var(--brand-100);border-radius:var(--radius-md);padding:12px 14px;color:var(--brand-700);font-size:var(--fs-md);margin-bottom:16px}.note.lockbox{background:var(--st-blocked-bg);border-color:var(--st-blocked-border);color:var(--st-blocked)}label{display:block;font-size:var(--fs-sm);font-weight:var(--fw-semibold);margin-bottom:5px;color:var(--brand-900)}input[type=text],input[type=search],input[type=date],input[type=email],input[type=number],input[type=tel],input[type=url],input[type=password],textarea,select.f,#modal select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-md);font:inherit;background:#fff}input:focus,textarea:focus,select:focus{outline:2px solid var(--brand-500);outline-offset:-1px}.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.fgrid .full{gri const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v)
  .replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = d => {
  if (!d) return '–';
  const [y, m, g] = String(d).substring(0, 10).split('-');
  return g && m && y ? `${g}/${m}/${y}` : d;
};
const fmtTime = d => {
  if (!d) return '–';
  const date = new Date(d);
  if (Number.isNaN(date.getTime())) return fmt(d);
  const p = n => String(n).padStart(2, '0');
  return `${p(date.getDate())}/${p(date.getMonth() + 1)}/${date.getFullYear()} ${p(date.getHours())}:${p(date.getMinutes())}`;
};
const fmtSize = n => n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : n >= 1024 ? `${Math.round(n / 1024)} KB` : `${n} B`;
const fmtMoney = n => {
  if (n == null || n === '') return '–';
  const value = Number(n);
  if (Number.isNaN(value)) return '–';
  return new Intl.NumberFormat('it-IT', {
    style: 'currency',
    currency: 'EUR',
    maximumFractionDigits: 2
  }).format(value);
};
const fmtPercent = n => {
  if (n == null || n === '') return '–';
  const value = Number(n);
  if (Number.isNaN(value)) return '–';
  return `${new Intl.NumberFormat('it-IT', {
    maximumFractionDigits: 2
  }).format(value)}%`;
};
// Il margine è una percentuale sul costo: il ricavo dell'attività è

function updateFinancialValue(el) {

}

function faviconUrl(website) {
  if (!website) return '';
  try {
    const url = new URL(website);
    return url.hostname
      ? `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(url.hostname)}`
      : '';
  } catch {
    return '';
  }
}
function initialsOf(name) {
  const clean = String(name || '?').trim();
  const parts = clean.split(/\s+/).filter(Boolean);
  if (parts.length === 1) return (clean.slice(0, 2) || '?').toUpperCase();
  return (parts.map(p => p[0]).join('').slice(0, 2) || '?').toUpperCase();
}
function hostOf(website) {
  try {
    return new URL(website).hostname.replace(/^www\./, '');
  } catch {
    return website || '';
  }
}

// Engagement: pastiglia compatta (tipo, nome, cliente, avanzamento ad anello).
function engPill(e, opts = {}) {
  const total = Number(e.stepCount) || (e.retestPlanned ? 9 : 7);
  const index = Math.max(0, Math.min(Number(e.stepIndex) || 0, total));
  const percent = Math.round((index / total) * 100);

    ? opts.late
    : daysSince((actionState(e) || {}).since) >= KPI_LATE_DAYS;

  const src = faviconUrl(client && client.website);

  return `<span class="eng-pill${late ? ' late' : ''}" title="${esc(e.name)} · ${esc(e.clientName || '')} · passo ${index} di ${total}">

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
  });
  if (!response.ok) {
    let message = `Errore ${response.status}`;
    try {
      const body = await response.json();
      if (typeof body === 'string' && body.trim()) message = body;
      else message = (body && (body.detail || body.title)) || message;
    } catch { /* corpo non JSON (es. 403 vuoto) */ }
    if (message === `Errore ${response.status}`) {
      message = {
        400: 'Richiesta non valida.',
        403: 'Operazione non consentita per il tuo profilo.',
        404: 'Risorsa non trovata.',
        409: 'Elemento già esistente o in conflitto.'
      }[response.status] || message;
    }
    throw new Error(message);
  }
  if (response.status === 204) return null;
  const type = response.headers.get('content-type') || '';
  return type.includes('json') ? response.json() : response;
}

function downloadResponse(response, fallbackName) {
  return response.blob().then(blob => {
    const disposition = response.headers.get('content-disposition') || '';
    const match = /filename="?([^";]+)"?/i.exec(disposition);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = match ? match[1] : fallbackName;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });
}

function pickFile(accept) {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file';
    if (accept) input.accept = accept;
    input.onchange = () => resolve(input.files[0] ? input.files[0].name : null);
    input.click();
  });
}

/* ====== MODALE ====== */
function ask({ title, text, fields = [], ok = 'Conferma', danger = false }) {
  return new Promise(resolve => {
    const opener = document.activeElement;
    const fieldsHtml = fields.map(f => {
      const control = f.area
        ? `<textarea id="m_${esc(f.id)}" rows="3" placeholder="${esc(f.ph || '')}"></textarea>`
        : f.type === 'select'
          ? `<select class="f" id="m_${esc(f.id)}">${(f.options || [])
              .map(o => `<option value="${esc(o[0])}" ${o[0] === (f.value || (f.options[0] || [])[0]) ? 'selected' : ''}>${esc(o[1])}</option>`)
              .join('')}</select>`
          : `<input type="${esc(f.type || 'text')}" id="m_${esc(f.id)}" value="${esc(f.value || '')}"
               placeholder="${esc(f.ph || '')}" ${f.min ? `min="${esc(f.min)}"` : ''} ${f.max ? `max="${esc(f.max)}"` : ''}>`;
      return `<div class="${f.half ? '' : 'full'}">
        <label for="m_${esc(f.id)}">${esc(f.label)}</label>${control}</div>`;
    }).join('');

    $('#modal').innerHTML = `
      <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mt">
        <h2 id="mt">${esc(title)}</h2>
        ${text ? `<p class="sub" style="margin-bottom:14px">${esc(text)}</p>` : ''}
        <div class="fgrid">${fieldsHtml}</div>
        <div class="mact">
          <button class="btn sec" data-modal="cancel">Annulla</button>
          <button class="btn ${danger ? 'dng' : 'pri'}" data-modal="ok">${esc(ok)}</button>
        </div>
      </div>`;
    $('#modal').classList.add('show');

    const close = value => {
      $('#modal').classList.remove('show');
      $('#modal').innerHTML = '';
      document.removeEventListener('keydown', onKey);
      if (opener && opener.isConnected && opener.focus) opener.focus();
      resolve(value);
    };
    const confirm = () => {
      const values = {};
      fields.forEach(f => { values[f.id] = ($('#m_' + f.id)?.value || '').trim(); });
      close(values);
    };
    const onKey = event => {
      if (event.key === 'Escape') close(null);
      if (event.key === 'Enter' && event.target && event.target.tagName === 'INPUT') confirm();
    };
    document.addEventListener('keydown', onKey);
    $('#modal').querySelector('[data-modal="cancel"]').onclick = () => close(null);
    $('#modal').querySelector('[data-modal="ok"]').onclick = confirm;
    const first = fields[0] && $('#m_' + fields[0].id);
    if (first) setTimeout(() => first.focus(), 30);
    else setTimeout(() => $('#modal').querySelector('[data-modal="ok"]').focus(), 30);
  });
}

function isMobileShell() {
  return window.matchMedia('(max-width: 900px)').matches;
}

function applyShell() {
  const mobile = isMobileShell();
  const open = document.body.classList.contains('side-open');
  if (!mobile) document.body.classList.remove('side-open');
  document.body.classList.toggle('side-collapsed', !!state.sideCollapsed && !mobile);

  const toggle = $('#sideToggle');
  if (toggle) {
    const expanded = mobile ? open : !state.sideCollapsed;
    toggle.setAttribute('aria-expanded', String(expanded));
    toggle.setAttribute('aria-label', mobile
      ? (open ? 'Chiudi menu' : 'Apri menu')
      : (state.sideCollapsed ? 'Espandi menu' : 'Comprimi menu'));
    toggle.title = mobile
      ? (open ? 'Chiudi menu' : 'Apri menu')
      : (state.sideCollapsed ? 'Espandi menu ( [ )' : 'Comprimi menu ( [ )');
  }

  const foot = $('.side-collapse');
  if (foot) foot.title = state.sideCollapsed ? 'Espandi menu ( [ )' : 'Comprimi menu ( [ )';
}

function closeSideOnMobile() {
  if (!isMobileShell()) return;
  document.body.classList.remove('side-open');
  applyShell();
}

function updateNav() {
  const internal = isInternalRole();
  const tabs = adminTabsForRole();
  const admin = tabs.length > 0;

  document.querySelectorAll('[data-nav]').forEach(item => {
    const view = item.dataset.view;
    let show = true;
    if (view === 'clients' || view === 'solicitations') show = internal;
    if (view === 'kpi') show = canUseAdminTab('users');
    if (view === 'admin') show = canUseAdminTab(item.dataset.tab);
    item.hidden = !show;
  });

  const adminGroup = document.querySelector('[data-group="admin"]');
  if (adminGroup) adminGroup.hidden = !admin;

  const key = state.view === 'admin'
    ? `admin-${state.adminTab}`
    : state.view === 'detail'
      ? 'list'
      : state.view === 'users'
        ? 'admin-users'
        : state.view === 'list' && state.listFilter === 'action'
          ? 'todo'
          : state.view === 'list' && state.listFilter === 'waiting'
            ? 'waiting'
            : state.view;

  document.querySelectorAll('[data-nav]').forEach(item => {
    const on = item.dataset.nav === key;
    item.classList.toggle('on', on);
    if (on) item.setAttribute('aria-current', 'page');
    else item.removeAttribute('aria-current');
  });

  const countByKind = kind => (state.list || [])
    .filter(item => (item.actionState || {}).kind === kind).length;

  [['todo', 'action'], ['waiting', 'waiting']].forEach(([nav, kind]) => {
    const count = countByKind(kind);
    const badge = document.querySelector(`[data-nav="${nav}"] .nav-count`);
    if (!badge) return;
    badge.textContent = String(count);
    badge.hidden = count === 0;
  });

  const kicker = $('#headerKicker');
  const section = $('#headerSection');
  if (!kicker || !section) return;

  const adminTabs = {
    activities: 'Tipi di attività',
    users: 'Utenti',
    clients: 'Clienti',
    mailing: 'Mailing list',
    templates: 'Template mail',
    settings: 'Impostazioni'
  };

  if (state.view === 'admin') {
    kicker.textContent = 'Amministrazione';
    section.textContent = adminTabs[state.adminTab] || 'Utenti';
    return;
  }

  if (state.view === 'detail' && state.detail) {
    kicker.textContent = 'Engagement';
    section.textContent = state.detail.engagement.id;
    return;
  }

  kicker.textContent = 'Portale';
  section.textContent =
    state.view === 'list' && state.listFilter === 'action' ? 'Da gestire'
      : state.view === 'list' && state.listFilter === 'waiting' ? 'In attesa di terzi'
        : {
          list: 'Engagement',
          clients: 'Clienti',
          calendar: 'Calendario',
          solicitations: 'Solleciti',
          kpi: 'KPI e andamento',
          users: 'Utenti'
        }[state.view] || 'Engagement';
}

// Il dettaglio usa rail e contesto sticky: l'offset deve seguire l'altezza
// reale dell'header (che cambia quando va a capo su schermi stretti).
function syncHeaderOffset() {
  const header = document.querySelector('.shell-main > header');
  if (!header) return;
  document.documentElement.style.setProperty('--app-header-h', `${header.offsetHeight}px`);
}
window.addEventListener('resize', syncHeaderOffset);

function fillUserSelect() {
  const select = $('#demoUser');
  if (!select) return;

  const roleOrder = ['Manager', 'PMO', 'Pentester', 'Auditor', 'Client'];
  const visibleUsers = isClient()
    ? state.demoUsers.filter(user => user.role === 'Client')
    : state.demoUsers;
  const groups = roleOrder
    .map(role => [role, visibleUsers.filter(user => user.role === role)])
    .filter(([, list]) => list.length);

  select.innerHTML = groups.length
    ? groups.map(([role, list]) =>
        `<optgroup label="${esc(ROLES[role]?.label || role)}">${list.map(user =>
          `<option value="${esc(user.id)}" ${user.id === state.userId ? 'selected' : ''}>${esc(user.name)}${user.role === 'Client' && user.clientId ? ` · ${esc(clientLabel(user.clientId))}` : ''}</option>`
        ).join('')}</optgroup>`).join('')
    : '<option value="">Nessun utente disponibile</option>';

  if (state.userId && !state.demoUsers.some(user => user.id === state.userId))
    select.value = '';
  else
    select.value = state.userId || '';
}

async function loadDemoUsers(preferredRole) {
  const role = preferredRole || state.role;
  const params = new URLSearchParams({
    role,
    client: state.clientId || ''
  });

  try {
    state.demoUsers = await api('/api/demo/users?' + params.toString());
  } catch {
    state.demoUsers = [];
  }

  const savedId = localStorage.getItem('cep.user');
  const saved = demoUserById(savedId);
  const user = (saved && saved.role === role ? saved : null) ||
    state.demoUsers.find(item => item.role === role) ||
    state.demoUsers[0];

  if (user) {
    state.userId = user.id;
    state.role = user.role;
    state.clientId = user.role === 'Client' ? (user.clientId || '') : '';
  }

  fillUserSelect();
}

function fillClientSelect() {  const select = $('#client');
  const clients = state.clients || [];
  const known = clients.length
    ? clients.map(c => [c.id, c.name])
    : (isClient() ? [] : DEMO_CLIENTS);
  const options = isClient()
    ? known
    : [['', 'Tutti i clienti'], ...known];
  select.innerHTML = options.length
    ? options
      .map(([value, label]) => `<option value="${esc(value)}" ${value === (state.clientId || '') ? 'selected' : ''}>${esc(label)}</option>`)
      .join('')
    : '<option value="">Nessun cliente disponibile</option>';
  if (!options.some(o => o[0] === (state.clientId || ''))) {
    // Per un Cliente l'identità la decide il server: si usa solo la lista
    // restituita dal server, mai il fallback demo.
    state.clientId = isClient()
      ? (clients[0] ? clients[0].id : '')
      : '';
    select.value = state.clientId;
    localStorage.setItem('cep.client', state.clientId);
  }
}

function demoUserById(id) {
  return state.demoUsers.find(user => user.id === id) || null;
}

function setDemoUser(id) {
  const user = demoUserById(id);
  if (!user) return;

  state.userId = user.id;
  state.role = user.role;
  state.clients = [];
  state.clientId = user.role === 'Client' ? (user.clientId || '') : '';
  state.view = 'list';
  state.detail = null;
  state.tab = 'docs';
  state.listTab = 'eng';
  state.scope = null;
  state.credentials = null;
  localStorage.setItem('cep.user', state.userId);
  localStorage.setItem('cep.role', state.role);
  localStorage.setItem('cep.client', state.clientId || '');
  $('#role').value = state.role;
  fillUserSelect();
  fillClientSelect();
  updateHeader();
  loadClients().then(loadList);
}

async function setRole(role) {
  if (!ROLES[role]) return;

  if (role === 'Client' ||
      !state.demoUsers.some(user => user.role === role)) {
    await loadDemoUsers(role);
  }

  const candidate = state.demoUsers.find(user =>
    user.role === role &&
    (role !== 'Client' || user.clientId));

  if (candidate) {
    setDemoUser(candidate.id);
    return;
  }

  state.role = role;
  state.userId = '';
  if (role === 'Client') {
    // La lista clienti di un profilo Cliente è solo la propria: si riparte
    // dalla risposta del server per non ereditare quella del profilo interno.
    state.clients = [];
    state.clientId = '';
  } else {
    state.clientId = '';
  }
  state.view = 'list';
  state.detail = null;
  state.tab = 'docs';
  state.listTab = 'eng';
  state.scope = null;
  state.credentials = null;
  localStorage.setItem('cep.user', '');
  localStorage.setItem('cep.role', role);
  localStorage.setItem('cep.client', state.clientId || '');
  fillUserSelect();
  fillClientSelect();
  updateHeader();
  loadClients().then(loadList);
}

function setClient(clientId) {
  state.clientId = clientId;
  localStorage.setItem('cep.client', clientId || '');
  updateHeader();
  if (state.view === 'detail' && state.detail) {
    // Un utente interno che cambia cliente torna alla lista: il dettaglio
    // aperto potrebbe non appartenere al nuovo perimetro.
    if (isInternalRole()) backToList();
    else loadDetail(state.detail.engagement.id);
  }
  else if (state.view === 'clients') loadClients().then(render);
  else if (state.view === 'calendar') loadCalendar();
  else if (state.view === 'admin') loadAdmin();
  else loadList();
}

function backToList() {
  state.view = 'list';
  state.detail = null;
  state.scope = null;
  state.credentials = null;
  state.listTab = 'eng';
  loadList();
}

async function openEngagement(id) {

  state.tab = null;

  state.credentials = null;
  state.logAuthor = '';
  state.editing = {};

async function setTab(tab) {

async function loadList() {
  state.loading = true;
  state.error = null;
  if (!state.list.length) render();
  try {
    state.list = await api('/api/engagements?' + qs());
    if (!isClient()) await loadSolicitations();
    else { state.rules = []; state.due = []; }
  } catch (error) {
    state.error = error.message;
    toast(error.message);
  } finally {
    state.loading = false;
    render();
  }

async function loadCalendar() {
  state.calendarProposals = [];
  await loadList();

  const pending = (state.list || []).filter(e => e.pendingProposal);
  if (!pending.length) return;

  const details = await Promise.all(pending.map(e =>
    api(`/api/engagements/${encodeURIComponent(e.id)}?` + qs()).catch(() => null)));

  state.calendarProposals = details.filter(Boolean).flatMap(d => {
    const e = d.engagement || {};
    return (e.proposals || [])
      .filter(p => p.status === 'Pending' && p.startDate)
      .map(p => ({
        id: e.id,
        name: e.name,
        client: e.clientName,
        kind: 'proposed',
        start: String(p.startDate).slice(0, 10),
        end: String(p.endDate || p.startDate).slice(0, 10),
        from: p.from
      }));
  });

  if (state.view === 'calendar') renderCalendar();
}

  try {
    state.activityTypes = await api('/api/activity-types?' + qs());

async function loadDetail(id) {
  state.loading = true;
  state.error = null;
  try {
    const detail = await api(`/api/engagements/${encodeURIComponent(id)}?` + qs());
    state.detail = detail;
    await ensureActivityTypes();

    state.view = 'list';
    state.detail = null;
    state.loading = false;

/* ====== STATI WORKFLOW ====== */
// La UI non ricalcola lo stato: legge actionState/tabStates dal server.
function actionState(e) {
  return e && e.actionState ? e.actionState : null;
}

function statusPill(e) {
  const s = actionState(e);
  if (!s) return ['Stato non disponibile', 'neutral'];
  switch (s.kind) {
    case 'action': return ['Da gestire', 'action'];
    case 'waiting': return ['In attesa', 'wait'];
    case 'progress': return ['In corso', 'progress'];
    case 'done': return ['Completato', 'done'];
    case 'blocked': return ['Bloccato', 'blocked'];
    default: return [s.label || 'Stato non disponibile', 'neutral'];
  }
}


function statusOwner(e) {
  const s = actionState(e);
  return s && s.kind === 'waiting' && s.ownerLabel ? s.ownerLabel : '';
}

function daysSince(date) {
  if (!date) return null;
  const d = new Date(String(date).substring(0, 10) + 'T00:00:00');
  if (Number.isNaN(d.getTime())) return null;
  const now = new Date(today() + 'T00:00:00');
  return Math.max(0, Math.round((now - d) / 86400000));
}

function statusAge(e) {
  const s = actionState(e);
  if (!s || (s.kind !== 'action' && s.kind !== 'waiting')) return '';
  const n = daysSince(s.since);
  if (n === null || n < 1) return '';
  const label = n === 1 ? 'da 1 giorno' : `da ${n} giorni`;
  if (s.kind === 'action') {
    return `<span class="status-age late">${label}</span>`;
  }
  return `<span class="status-age ${n >= 5 ? 'overdue' : ''}">${label}</span>`;
}

// Varianti compatte per la tabella della homepage (variante B).
function delayCellCompact(e) {
  const a = e && e.preparationAlert;
  if (!a) return '<span class="delay-none" aria-hidden="true">–</span>';

  const days = Number(a.daysToStart) || 0;
  const label = days > 0
    ? `${days} gg`
    : days === 0 ? 'oggi' : `${Math.abs(days)} gg fa`;
  const full = (a.missing || [])
    .map(m => m === 'scope' ? 'Scope' : 'Credenziali')
    .join(' e ');
  const title = `${full} non completati: ${days > 0
    ? `mancano ${days} giorni all'avvio`
    : days < 0 ? `l'avvio è già avvenuto da ${Math.abs(days)} giorni` : 'l\'avvio è oggi'}.`;

  return `<span class="delay delay-sm" title="${esc(title)}">${esc(label)}</span>`;
}

function delayBadge(e) {
  const a = e && e.preparationAlert;
  if (!a) return '';

  const days = Number(a.daysToStart) || 0;
  const text = days > 0
    ? `${days} gg all'avvio`
    : days === 0 ? 'avvio oggi' : 'avvio superato';

  return `<span class="delay delay-sm">${esc(text)}</span>`;
}

// Fase del workflow in poco spazio: barra a un segmento per passo + nome.
function phaseCell(e) {
  const raw = Number(e.stepIndex) || 0;
  const index = Math.max(0, Math.min(raw, STEPS.length - 1));
  const done = raw >= STEPS.length;
  const name = done ? 'Completato' : STEPS[index][0];
  const title = done
    ? 'Workflow completato'
    : `Passo ${index + 1} di ${STEPS.length}: ${STEPS[index][0]} — ${STEPS[index][1]}`;

  return `<span class="phase" title="${esc(title)}">${mini(raw)}<span class="phase-name">${esc(name)}</span></span>`;
}

function statusCellCompact(e) {
  const owner = statusOwner(e);
  return `<div class="status-cell status-mini">${objState(e)}
    ${owner ? `<span class="status-owner">${esc(owner)}</span>` : ''}
    ${statusAge(e)}</div>`;
}

function rowClass(e) {
  const s = actionState(e);
  return s ? ` is-${s.kind}` : '';
}

function tabState(d, k) {
  const t = d && d.tabStates ? d.tabStates[k] : null;
  if (t) return t.state;
  return legacyTabState(d, k);
}


// Fallback per compatibilità con un backend precedente.
function legacyTabState(d, k) {
  const e = d.engagement;
  const c = d.capabilities || {};
  const pending = (e.proposals || []).some(p => p.status === 'Pending');
  if (k === 'setup') {
    return e.setupDone ? 'ok' : c.canManageSetup ? 'todo' : 'wait';
  }
  if (k === 'docs') {
    const nS = !e.hasManleva && c.canUploadManleva;
    const nO = !e.orderConfirmed && c.canManageEngagementDocs;
    return e.hasManleva && e.orderConfirmed && e.financialsDone && e.financialsApproved ? 'ok' : (nS || nO) ? 'todo' : 'wait';
  }
  if (k === 'plan') {
    if (!e.hasManleva || !e.orderConfirmed || !e.financialsDone || !e.financialsApproved) return 'lock';
    if (d.todo && d.todo.targetTab === 'plan') return 'todo';
    if (pending) return 'wait';
    return e.acceptedProposal ? 'ok' : 'wait';
  }
  if (k === 'scope') {
    if (!e.hasManleva || !e.orderConfirmed || !e.financialsDone || !e.financialsApproved) return 'lock';
    if (d.scope && d.scope.done) return 'ok';
    return canEditPreparation(d) ? 'todo' : 'wait';
  }
  if (k === 'cred') {
    if (!e.hasManleva || !e.orderConfirmed || !e.financialsDone || !e.financialsApproved || !c.canCredentials) return 'lock';
    if (d.credentials && d.credentials.done) return 'ok';
    return canEditCredentials(d) ? 'todo' : 'wait';
  }
  if (k === 'reports') {
    if (d.todo && d.todo.targetTab === 'reports') return 'todo';
    if ((e.reports || []).some(r => r.published)) return 'ok';
    if (!c.isClient && ((e.reports || []).length || d.phase === 'Reporting')) return 'wait';
    return 'lock';
  }
  return 'none';
}

function defaultTab(d) {
  const tabs = isClient()
    ? ['docs', 'scope', 'plan', 'cred', 'reports']
    : ['setup', 'docs', 'scope', 'plan', 'cred', 'reports'];
  const todo = tabs.find(k => tabState(d, k) === 'todo');
  if (todo) return todo;
  const byPhase = {
    Setup: 'setup',
    Docs: 'docs',
    Scope: 'scope',
    Planning: 'plan',
    Credentials: 'cred',
    Scheduled: 'run',
    Running: 'run',
    Reporting: 'reports',
    Done: 'reports'
  };
  const target = byPhase[d.phase] || 'docs';
  return isClient() && target === 'setup' ? 'docs' : target;
}

function canEditPreparation(d) {
  const e = d.engagement;
  if (!e.hasManleva || !e.orderConfirmed || !e.financialsDone || !e.financialsApproved) return false;
  if (state.role === 'Client')
    return d.phase === 'Scope' || d.phase === 'Planning' || d.phase === 'Credentials' || d.phase === 'Scheduled';
  if (state.role === 'PMO')
    return d.phase === 'Scope' || d.phase === 'Planning' || d.phase === 'Credentials' || d.phase === 'Scheduled' || d.phase === 'Running';
  return false;
}

function canEditCredentials(d) {
  // Il server calcola il permesso effettivo (include il Manager).
  if (d && d.capabilities && typeof d.capabilities.canEditCredentials === 'boolean')
    return d.capabilities.canEditCredentials;
  return canEditPreparation(d);
}

/* ====== COMPONENTI ====== */
function mini(stepIndex) {
  return `<div class="mini" aria-hidden="true">${STEPS.map((_, i) =>
    `<i class="${stepIndex > i ? 'on' : stepIndex === i ? 'cur' : ''}"></i>`).join('')}</div>`;
}



function mailSubject(type) {
  if (MAIL_META[type]) return MAIL_META[type].subj;
  if (type && type.startsWith('solicitation:')) return `Sollecito: ${type.split(':')[1]}`;
  return type;
}

function entryAuto(mail, key) {

  return !!(info && info[key]);
}

function listTabs() {

  return `<div class="seg" role="tablist">

    <button role="tab" aria-selected="${state.listTab === 'rem'}" class="${state.listTab === 'rem' ? 'on' : ''}" data-act="list-tab" data-tab="rem">Solleciti automatici <span class="cnt">${state.due.length}</span></button>
  </div>`;

const normText = v => String(v == null ? '' : v)
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .toLowerCase();

// Tutti i campi mostrati in tabella finiscono nell'indice di ricerca:
// nome, codice, cliente, tipologia, passo, stato, responsabile, periodo e ritardo.
function searchableRow(e) {
  const s = actionState(e);
  const raw = Number(e.stepIndex) || 0;
  const step = raw >= STEPS.length
    ? ['Completato', 'Workflow completato']
    : STEPS[Math.max(0, Math.min(raw, STEPS.length - 1))];
  const alert = e.preparationAlert;
  const age = s && s.since ? daysSince(s.since) : null;
  return normText([
    e.name, e.id, e.clientName, typeLabel(e.type),
    s ? s.label : '', s ? s.kind : '', statusOwner(e),
    statusPill(e).join(' '),
    age ? `da ${age} giorni` : '',
    step ? `${step[0]} ${step[1]}` : '',
    e.periodStart
      ? `${fmt(e.periodStart)} ${fmt(e.periodEnd)} ${e.periodStart} ${e.periodEnd}`
      : 'da definire',
    alert
      ? `ritardo ${(alert.missing || []).join(' ')} ${alert.daysToStart} gg ${alert.daysToStart} giorni`
      : ''
  ].join(' '));
}

const LIST_COLUMNS = {
  engagement: 'Engagement',
  client: 'Cliente',
  phase: 'Fase',
  status: 'Stato',
  delay: 'Ritardo',
  period: 'Periodo'
};

function compareColumn(a, b, column) {
  const kindRank = { action: 0, waiting: 1, progress: 2, blocked: 3, neutral: 4, done: 5 };
  if (column === 'phase') {
    return (Number(a.stepIndex) || 0) - (Number(b.stepIndex) || 0);
  }
  if (column === 'status') {
    const ra = kindRank[(actionState(a) || {}).kind] ?? 9;
    const rb = kindRank[(actionState(b) || {}).kind] ?? 9;
    if (ra !== rb) return ra - rb;
    return statusPill(a)[0].localeCompare(statusPill(b)[0], 'it');
  }
  if (column === 'delay') {
    const da = a.preparationAlert ? Number(a.preparationAlert.daysToStart) : null;
    const db = b.preparationAlert ? Number(b.preparationAlert.daysToStart) : null;
    if (da === null && db === null) return 0;
    if (da === null) return 1;
    if (db === null) return -1;
    return da - db;
  }
  if (column === 'period') {
    if (!a.periodStart && !b.periodStart) return 0;
    if (!a.periodStart) return 1;
    if (!b.periodStart) return -1;
    return a.periodStart.localeCompare(b.periodStart);
  }
  if (column === 'client') {
    return String(a.clientName || '').localeCompare(String(b.clientName || ''), 'it');
  }
  return String(a.name || '').localeCompare(String(b.name || ''), 'it');
}

function sortEngagements(list) {
  const rank = { action: 0, waiting: 1, progress: 2, blocked: 3, neutral: 4, done: 5 };
  const priority = (a, b) => {
    const ra = rank[(actionState(a) || {}).kind] ?? 9;
    const rb = rank[(actionState(b) || {}).kind] ?? 9;
    if (ra !== rb) return ra - rb;
    return (a.periodStart || '9999-12-31').localeCompare(b.periodStart || '9999-12-31');
  };
  const mode = state.listSort || 'priority';
  return list.slice().sort((a, b) => {
    if (mode === 'column') {
      const dir = state.listDir === 'desc' ? -1 : 1;
      return compareColumn(a, b, state.listColumn || 'engagement') * dir || priority(a, b);
    }
    if (mode === 'start') {
      // "Avvio più vicino": prima gli avvii futuri (dal più vicino), poi
      // quelli già passati (dal più recente), infine chi non ha date.
      const group = e => !e.periodStart ? 2 : e.periodStart >= today() ? 0 : 1;
      const diff = group(a) - group(b);
      if (diff) return diff;
      if (group(a) === 0) return a.periodStart.localeCompare(b.periodStart) || priority(a, b);
      if (group(a) === 1) return b.periodStart.localeCompare(a.periodStart) || priority(a, b);
      return priority(a, b);
    }
    if (mode === 'client') {
      return a.clientName.localeCompare(b.clientName, 'it') || priority(a, b);
    }
    if (mode === 'name') {
      return a.name.localeCompare(b.name, 'it');
    }
    return priority(a, b);
  });
}

function filteredList() {
  const terms = normText(state.listQuery).split(/\s+/).filter(Boolean);
  const match = e => {
    const s = actionState(e);
    const kind = s ? s.kind : 'neutral';
    if (state.listFilter === 'action' && kind !== 'action') return false;
    if (state.listFilter === 'waiting' && kind !== 'waiting') return false;
    if (state.listFilter === 'progress' && kind !== 'progress') return false;
    if (state.listFilter === 'done' && kind !== 'done') return false;
    if (state.listFilter === 'risk' && !e.preparationAlert) return false;
    if (!terms.length) return true;
    const haystack = searchableRow(e);
    return terms.every(term => haystack.includes(term));
  };
  return sortEngagements(state.list.filter(match));
}

function skeletonRows(count) {
  return `<div class="card" style="padding:18px">${Array.from({ length: count || 4 })
    .map(() => '<div class="skeleton" style="margin-bottom:14px"></div>')
    .join('')}</div>`;
}

  const listTitle = {

  $('#app').innerHTML = `
