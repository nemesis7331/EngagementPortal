/* ====== MAILING LIST ====== */
// Filtri in alto (ricerca su cliente, partecipanti, tipo e engagement), elenco
// scorribile e dettaglio modificabile sotto la lista.
const MAILING_KIND_LABEL = { notifications: 'Notifiche', deliverables: 'Deliverables' };
// Quali template vengono inviati a ciascuna lista: gli altri restano in
// Amministrazione › Template mail.
const MAILING_TEMPLATE_TYPES = {
  notifications: ['start', 'end', 'solrep', 'solrev', 'solcred3', 'solcred2', 'solmanual'],
  deliverables: ['deliver', 'retestreport']
};

function mailingSearchText(item) {
  return normText([
    item.clientName,
    item.engagementId,
    item.engagementName,
    item.ownerName,
    item.kindLabel,
    MAILING_KIND_LABEL[item.kind],
    item.scope === 'client' ? 'base cliente' : 'engagement',
    ...(item.recipients || []).flatMap(entry => [entry.name, entry.email, entry.organization]),
    ...(item.base || []).flatMap(entry => [entry.name, entry.email, entry.organization])
  ].join(' '));
}

function mailingInitials(item) {
  const source = item.scope === 'client' ? item.clientName : (item.engagementId || item.ownerName);
  return initialsOf(source);
}

function mailingRecipientPreview(item) {
  const all = [...(item.base || []), ...(item.recipients || [])];
  const names = all.slice(0, 3).map(entry => entry.name).join(', ');
  return names + (all.length > 3 ? ` +${all.length - 3}` : '');
}

function adminMailingHTML() {
  const query = normText(state.adminMailingQuery);
  const kindFilter = state.adminMailingKind || 'all';
  const scopeFilter = state.adminMailingScope || 'all';

  const lists = state.adminMailing.filter(item =>
    (!query || mailingSearchText(item).includes(query)) &&
    (!state.clientId || item.clientId === state.clientId) &&
    (kindFilter === 'all' || item.kind === kindFilter) &&
    (scopeFilter === 'all' || item.scope === scopeFilter));

  const selected = state.adminMailing.find(item => item.id === state.adminMailingId) || lists[0] || null;

  if (selected) state.adminMailingId = selected.id;

  const rows = lists.length
    ? lists.map(item => `<button class="ml-item ${selected?.id === item.id ? 'on' : ''}" data-act="admin-select-list" data-id="${esc(item.id)}">
        ${item.scope === 'engagement'
          ? engPill({
              type: item.engagementType,
              name: item.engagementName,
              clientId: item.clientId,
              clientName: item.clientName,
              stepIndex: item.stepIndex,
              stepCount: item.stepCount
            })
          : `<span class="ml-av">${esc(mailingInitials(item))}</span>
             <span class="ml-who"><b>${esc(item.clientName)}</b><small>Base cliente · ${esc(mailingRecipientPreview(item))}</small></span>`}
        <span class="ml-end">
          <span class="badge ${item.kind === 'notifications' ? 'int' : 'ext'}">${esc(item.kindLabel)}</span>
          <span class="cntpill" title="${(item.effective || []).length} indirizzi effettivi">${(item.effective || []).length}</span>
        </span>
      </button>`).join('')
    : '<div class="empty">Nessuna mailing list con questi filtri.</div>';

  return `<div class="admin-mm">
    <div class="ml-filters">
      <div class="search">
        <svg class="search-ico" aria-hidden="true"><use href="#i-search"></use></svg>
        <input type="search" id="admin-mail-search" value="${esc(state.adminMailingQuery)}"
          placeholder="Cerca cliente, partecipante, tipo di mail o engagement…"
          aria-label="Cerca per cliente, partecipante, tipo di mail o engagement">

async function saveAdminTemplates() {
  const types = (state.adminTemplates?.types || []).map(item => item.key);

  try {
    for (const type of types) {
      const subject = $(`#tplx_${type}_it_s`)?.value || '';
      const body = $(`#tplx_${type}_it_b`)?.value || '';
      const subjectEn = $(`#tplx_${type}_en_s`)?.value || '';
      const bodyEn = $(`#tplx_${type}_en_b`)?.value || '';
      const reset = [subject, body, subjectEn, bodyEn]
        .every(value => !value.trim());

      await api(adminTemplatePath(type) + '?' + qs(), {
        method: 'PUT',
        body: JSON.stringify({
          subject,
          body,
          subjectEn,
          bodyEn,
          reset
        })
      });
    }

    state.adminTemplates = await api('/api/admin/mail-templates?' + qs());
    renderAdmin();
    toast('Template IT ed EN salvati');
  } catch (error) {
    toast(error.message);
  }
}

/* ====== CALENDARIO ====== */
function calYmd(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function calDate(key) {
  const [y, m, d] = String(key).slice(0, 10).split('-').map(Number);
  return new Date(y, (m || 1) - 1, d || 1);
}

function calLongDate(d) {
  return new Intl.DateTimeFormat('it-IT', { day: 'numeric', month: 'long', year: 'numeric' }).format(d);
}

function calMonthLabel(d) {
  const label = d.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
  return label.charAt(0).toUpperCase() + label.slice(1);
}

function calendarEvents(list) {
  const events = [];
  const seen = new Set();

  for (const e of list) {
    const planned = e.acceptedProposal ||
      (e.periodStart ? { startDate: e.periodStart, endDate: e.periodEnd } : null);

    if (planned && planned.startDate) {
      events.push({
        id: e.id,
        name: e.name,
        client: e.clientName,
        kind: 'planned',
        start: String(planned.startDate).slice(0, 10),
        end: String(planned.endDate || planned.startDate).slice(0, 10)
      });
    }

    for (const p of (e.proposals || [])) {
      if (p.status !== 'Pending' || !p.startDate) continue;
      const start = String(p.startDate).slice(0, 10);
      const end = String(p.endDate || p.startDate).slice(0, 10);
      const key = `${e.id}|${start}|${end}`;
      if (seen.has(key)) continue;
      seen.add(key);
      events.push({
        id: e.id,
        name: e.name,
        client: e.clientName,
        kind: 'proposed',
        start,
        end,
        from: p.from
      });
    }
  }

  return events.filter(ev => ev.end >= ev.start);
}

function renderCalendarMonth(month, events, todayKey) {
  const year = month.getFullYear();
  const index = month.getMonth();
  const first = new Date(year, index, 1);
  const offset = (first.getDay() + 6) % 7;
  const total = new Date(year, index + 1, 0).getDate();
  const monthStart = calYmd(first);
  const monthEnd = calYmd(new Date(year, index + 1, 0));
  const count = events.filter(ev =>
    ev.start <= monthEnd && ev.end >= monthStart && ev.end >= todayKey).length;

  const cells = [];

  for (let i = 0; i < offset; i += 1) {
    const pad = new Date(year, index, 1 - offset + i);
    const we = pad.getDay() === 0 || pad.getDay() === 6;
    cells.push(`<div class="cal-day out${we ? ' we' : ''}" aria-hidden="true"></div>`);
  }

  for (let day = 1; day <= total; day += 1) {
    const date = new Date(year, index, day);
    const key = calYmd(date);
    const weekend = date.getDay() === 0 || date.getDay() === 6;
    const past = key < todayKey;
    const dayEvents = past
      ? []
      : events
        .filter(ev => key >= ev.start && key <= ev.end)
        .sort((a, b) => (a.kind === 'proposed' ? 0 : 1) - (b.kind === 'proposed' ? 0 : 1));
    const shown = dayEvents.slice(0, 3);

    cells.push(`<div class="cal-day${past ? ' past' : ''}${weekend ? ' we' : ''}${key === todayKey ? ' today' : ''}">
      <span class="n">${day}</span>
      ${shown.map(ev => `<button class="cal-ev ${ev.kind}" data-act="open-action" data-id="${esc(ev.id)}" data-tab="${ev.kind === 'proposed' ? 'plan' : ''}" title="${esc(ev.name)} · ${esc(ev.client)} · ${ev.kind === 'planned' ? 'Pianificato' : 'Proposto'} · ${fmt(ev.start)} – ${fmt(ev.end)}">${esc(ev.name)}</button>`).join('')}
      ${dayEvents.length > 3 ? `<span class="cal-more">+${dayEvents.length - 3} altri</span>` : ''}
    </div>`);
  }

  const trailing = (7 - ((offset + total) % 7)) % 7;
  for (let i = 0; i < trailing; i += 1) {
    const pad = new Date(year, index + 1, i + 1);
    const we = pad.getDay() === 0 || pad.getDay() === 6;
    cells.push(`<div class="cal-day out${we ? ' we' : ''}" aria-hidden="true"></div>`);
  }

  return `<section class="cal-month">
    <div class="cal-month-head"><h2>${calMonthLabel(first)}</h2><span>${count} eventi</span></div>
    <div class="cal-week">${['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'].map((d, i) => `<div class="cal-dow${i >= 5 ? ' we' : ''}">${d}</div>`).join('')}</div>
    <div class="cal-days">${cells.join('')}</div>
  </section>`;
}

/* ====== CALENDARIO · TIMELINE ====== */
const CAL_TIMELINE_MONTHS = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];

function calTimelineRange() {
  const now = new Date();
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const end = new Date(now.getFullYear(), now.getMonth() + 2, 0);
  const days = Math.round((end - start) / 86400000) + 1;
  return { start, end, startKey: calYmd(start), endKey: calYmd(end), days };
}

function calDayIndex(range, key) {
  return Math.round((calDate(key) - range.start) / 86400000);
}

function calEventKey(ev) {
  return `${ev.id}|${ev.kind}|${ev.start}`;
}

function renderCalendarTimeline(events, todayKey, counts) {
  const range = calTimelineRange();
  const n = range.days;
  const filter = state.calendarFilter || 'all';

  const visible = events.filter(ev => ev.start <= range.endKey && ev.end >= todayKey);
  const rows = visible
    .filter(ev => filter === 'all' || ev.kind === filter)
    .sort((a, b) => a.start.localeCompare(b.start) || String(a.name).localeCompare(String(b.name)));

  const selected = rows.find(ev => calEventKey(ev) === state.calendarSel) || null;

  // Intestazione mesi: ogni mese occupa le sue colonne-giorno.
  const months = [];
  const firstMonthDays = new Date(range.start.getFullYear(), range.start.getMonth() + 1, 0).getDate()
    - range.start.getDate() + 1;
  for (let cursor = new Date(range.start.getFullYear(), range.start.getMonth(), 1); cursor <= range.end; cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1)) {
    const year = cursor.getFullYear();
    const month = cursor.getMonth();
    const full = new Date(year, month + 1, 0).getDate();
    const span = Math.min(
      n - months.reduce((sum, m) => sum + m.span, 0),
      month === range.start.getMonth() && year === range.start.getFullYear() ? firstMonthDays : full
    );
    months.push({ label: `${CAL_TIMELINE_MONTHS[month]} ${String(year).slice(2)}`, span });
  }

  const dayCells = [];
  const weekendSpans = [];
  for (let i = 0; i < n; i += 1) {
    const date = new Date(range.start.getFullYear(), range.start.getMonth(), range.start.getDate() + i);
    const key = calYmd(date);
    const weekend = date.getDay() === 0 || date.getDay() === 6;
    const cls = [
      'tl-day',
      date.getDay() === 1 ? 'mon' : '',
      weekend ? 'we' : '',
      key === todayKey ? 'today' : ''
    ].filter(Boolean).join(' ');
    dayCells.push(`<div class="${cls}" title="${esc(fmt(key))}">${date.getDate()}</div>`);
    if (weekend) {
      const left = (i / n) * 100;
      const width = 100 / n;
      weekendSpans.push(`<span class="tl-weekend${i === 0 ? ' first' : ''}" aria-hidden="true" style="left:${left.toFixed(4)}%;width:${width.toFixed(4)}%"></span>`);
    }
  }
  const weekendBands = weekendSpans.join('');

  const rowHtml = rows.map(ev => {
    const from = Math.max(0, calDayIndex(range, ev.start));
    const to = Math.min(n - 1, calDayIndex(range, ev.end));
    const span = Math.max(1, to - from + 1);
    const kindLabel = ev.kind === 'planned' ? 'Pianificato' : 'Proposto';
    const key = calEventKey(ev);
    const sel = selected === ev ? ' sel' : '';
    const progress = ev.kind === 'planned' && ev.start < todayKey ? ' inprogress' : '';

    return `<div class="tl-row">
      <button class="tl-label" data-act="cal-select" data-key="${esc(key)}" title="${esc(ev.name)} · ${esc(ev.client)}">
        <b>${esc(ev.name)}</b>
        <small><span class="tl-kind ${ev.kind}"><i></i>${kindLabel}</span> · ${esc(ev.client || '')}</small>
      </button>
      <div class="tl-track" style="--n:${n}">
        ${weekendBands}
        <button class="tl-bar ${ev.kind}${sel}${progress}" data-act="cal-select" data-key="${esc(key)}"
          style="grid-column:${from + 1}/span ${span}"
          title="${esc(ev.name)} · ${esc(ev.client)} · ${kindLabel} · ${fmt(ev.start)} – ${fmt(ev.end)}">${esc(ev.name)}</button>
      </div>
    </div>`;
  }).join('');

  const detail = selected
    ? `<div class="tl-detail">
        <div class="tl-info">
          <b>${esc(selected.name)}</b> · ${esc(selected.client || '')}<br>
          <span class="tl-meta">${selected.kind === 'planned' ? 'Pianificato' : 'Proposto'}${selected.from ? ` da ${esc(selected.from)}` : ''} · ${fmt(selected.start)} – ${fmt(selected.end)}</span>
        </div>
        <div class="tl-actions">
          <button class="btn pri sm" data-act="open-action" data-id="${esc(selected.id)}" data-tab="${selected.kind === 'proposed' ? 'plan' : ''}">Apri engagement</button>
          <button class="btn sec sm" data-act="cal-select" data-key="">Chiudi</button>
        </div>
      </div>`
    : '<div class="tl-detail"><span class="tl-hint">Clicca una barra o un nome per vedere i dettagli dell\'engagement.</span></div>';

  return `<div class="tl-card">
    <div class="tl-toolbar">
      <span class="tl-range"><b>${fmt(range.startKey)}</b> – <b>${fmt(range.endKey)}</b></span>
      <span class="tl-weekend-key"><i></i>Sab e dom: nessun test</span>
      <div class="tl-filters" role="group" aria-label="Filtra gli eventi">
        ${[['all', 'Tutti'], ['planned', 'Pianificati'], ['proposed', 'Proposti']]
          .map(([value, label]) => `<button class="tl-filter" data-act="cal-filter" data-filter="${value}" aria-pressed="${filter === value}">${label} <b>${counts[value]}</b></button>`)
          .join('')}
      </div>
    </div>
    <div class="tl-scroll" style="--n:${n}">
      <div class="tl-axis">
        <div class="tl-axis-label">Engagement</div>
        <div class="tl-axis-track">
          <div class="tl-months">${months.map(m => `<div class="tl-month" style="grid-column:span ${m.span}">${m.label}</div>`).join('')}</div>
          <div class="tl-days">${dayCells.join('')}</div>
        </div>
      </div>
      ${rows.length ? rowHtml : '<div class="tl-empty">Nessun evento con questo filtro nel periodo.</div>'}
    </div>
    ${detail}
  </div>`;
}

function renderCalendar() {
  const now = new Date();
  const todayKey = calYmd(now);
  const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
  const endDate = new Date(now.getFullYear(), now.getMonth() + 2, 0);
  const endKey = calYmd(endDate);

  const all = [...calendarEvents(state.list || []), ...(state.calendarProposals || [])];
  const unique = [...new Map(all.map(ev => [`${ev.id}|${ev.kind}|${ev.start}|${ev.end}`, ev])).values()];
  const visible = unique.filter(ev => ev.end >= todayKey && ev.start <= endKey);
  const planned = visible.filter(ev => ev.kind === 'planned').length;
  const proposed = visible.filter(ev => ev.kind === 'proposed').length;

  const months = [
    startOfMonth,
    new Date(now.getFullYear(), now.getMonth() + 1, 1)
  ];

  const view = state.calendarView === 'month' ? 'month' : 'timeline';

  $('#app').innerHTML = `
    <div class="cal-head">
      <div>
        <p class="side-kicker">Portale</p>
        <h1>Calendario</h1>
        <p class="sub">Da oggi a ${esc(calLongDate(endDate))} · ${state.clientId ? `cliente ${esc(clientLabel(state.clientId))}` : 'engagement visibili per il tuo profilo'}</p>
      </div>
      <div class="head-acts">
        <div class="cal-switch" role="group" aria-label="Vista del calendario">
          <button data-act="cal-view" data-view="timeline" aria-pressed="${view === 'timeline'}">Timeline</button>
          <button data-act="cal-view" data-view="month" aria-pressed="${view === 'month'}">Mese</button>
        </div>
        <button class="btn sec" data-act="nav" data-view="list">Vai alla lista</button>
      </div>
    </div>
    ${state.error ? `<div class="errorbox"><span>${esc(state.error)}</span><button class="btn sec sm" data-act="nav" data-view="calendar">Riprova</button></div>` : ''}
    ${!visible.length ? '<div class="cal-empty">Nessun engagement proposto o pianificato nel periodo.</div>' : ''}
    ${view === 'month'
      ? `<div class="cal-legend">
          <span class="lg planned"><i></i>Pianificati <b>${planned}</b></span>
          <span class="lg proposed"><i></i>Proposti <b>${proposed}</b></span>
          <span class="lg weekend"><i></i>Sab e dom: nessun test</span>
          <span class="hint">Clicca un evento per aprire l'engagement</span>
        </div>
        <div class="cal-grid">
          ${months.map(month => renderCalendarMonth(month, visible, todayKey)).join('')}
        </div>`
      : renderCalendarTimeline(unique, todayKey, { all: visible.length, planned, proposed })}
  `;
}

function clientSameEmail(left, right) {
  return String(left || '').trim().toLowerCase() ===
    String(right || '').trim().toLowerCase();
}

// Una riga per persona: utenze, partecipanti del team e indirizzi senza
// account. L'appartenenza alle due liste si legge dal legame con la persona
// (personId) e, per le voci storiche, dall'email.
function clientPeople(client) {
  const notifications = client.distributionList || [];
  const deliverables = client.deliverablesDistributionList || [];

  const matches = (entry, person) =>
    (entry.personId && entry.personId === person.id) ||
    (!entry.personId && clientSameEmail(entry.email, person.email));

  const people = [];
  const seen = new Set();

  const add = (person, origin, role, organization) => {
    const key = String(person.email || '').trim().toLowerCase();
    // La stessa persona può essere utenza e partecipante (stessa email):
    // una riga sola, con la provenienza più forte.
    if (seen.has(key)) return;
    seen.add(key);
    people.push({
      id: person.id,
      name: person.name,
      email: person.email,
      origin,
      role,
      organization: organization || 'Cliente',
      inNotifications: notifications.some(entry => matches(entry, person)),
      inDeliverables: deliverables.some(entry => matches(entry, person))
    });
  };

  (client.users || []).forEach(user =>
    add(user, 'utenza', 'Referente cliente', 'Cliente'));

  (client.team || []).forEach(member =>
    add(member, 'team', member.role || 'Partecipante', member.organization));

  // Solo destinatari: voci di lista che non corrispondono a una persona.
  [...notifications, ...deliverables].forEach(entry => {
    const key = String(entry.email || '').trim().toLowerCase();
    if (!key) return;
    if (people.some(person => matches(entry, person))) return;
    if (seen.has('ext:' + key)) return;
    seen.add('ext:' + key);
    people.push({
      id: '',
      name: entry.name,
      email: entry.email,
      origin: 'mail',
      role: entry.organization || 'Cliente',
      organization: entry.organization || 'Cliente',
      inNotifications: notifications.some(item => clientSameEmail(item.email, entry.email)),
      inDeliverables: deliverables.some(item => clientSameEmail(item.email, entry.email))
    });
  });

  return people;
}

/* ====== ROUTING (URL normali) ====== */
// Ogni sezione ha una URL propria — /engagements, /engagements/{id}/{tab},
// /kpi — così refresh, link diretti e tasti indietro/avanti funzionano. Il
// server serve index.html su qualunque percorso (fallback SPA), quindi gli URL
// sono "puliti", senza cancelletto. I vecchi link #/... restano validi.
const BASE_ROUTES = {
  list: '/engagements',
  clients: '/clients',
  calendar: '/calendar',
  solicitations: '/solicitations',
  kpi: '/kpi',
  users: '/users'
};
const DETAIL_TABS = ['setup', 'docs', 'scope', 'plan', 'cred', 'run', 'reports', 'mail'];
const ROUTE_ADMIN_TABS = ADMIN_TABS.map(([id]) => id);
const LIST_FILTERS = ['action', 'waiting', 'progress', 'done', 'risk'];

let routeReady = false;
let routeBusy = false;
let lastRoute = '';
let pendingRoute = '';

function currentRoute() {
  if (state.view === 'detail' && state.detail) {
    const id = encodeURIComponent(state.detail.engagement.id);
    const tab = DETAIL_TABS.includes(state.tab) ? '/' + state.tab : '';
    return `/engagements/${id}${tab}`;
  }
  if (state.view === 'admin') {
    const tab = canUseAdminTab(state.adminTab) ? state.adminTab : (adminTabsForRole()[0] || 'users');
    return `/admin/${tab}`;
  }
  if (state.view === 'list' && LIST_FILTERS.includes(state.listFilter))
    return `/engagements?filter=${state.listFilter}`;
  return BASE_ROUTES[state.view] || BASE_ROUTES.list;
}

// Percorso richiesto al server, senza i parametri che non ci riguardano
// (ruolo, utente e cliente servono solo alla demo lato API).
function locationRoute() {
  const params = new URLSearchParams(location.search);
  const filter = params.get('filter');
  const path = location.pathname === '/index.html' ? '/' : location.pathname;
  return filter ? `${path}?filter=${filter}` : path;
}

// Route richiesta dalla barra degli indirizzi: i vecchi link #/... restano validi.
function requestedRoute() {
  return location.hash.startsWith('#/')
    ? location.hash
    : location.pathname + location.search;
}

// Aggiorna la URL senza ricaricare: push per la navigazione, replace per la
// prima scrittura (così il tasto indietro non esce dall'app).
function syncRoute() {
  if (!routeReady || routeBusy) return;
  const route = currentRoute();
  if (route === lastRoute) return;
  const first = !lastRoute;
  lastRoute = route;
  if (first) history.replaceState(null, '', route);
  else history.pushState(null, '', route);
}

// Accetta sia i percorsi (/engagements) sia i vecchi link con cancelletto.
function parseRoute(value) {
  const raw = String(value || '').replace(/^#/, '');
  if (!raw || raw === '/index.html') return null;

  const [pathPart, queryPart] = raw.split('?');
  const parts = pathPart.split('/').filter(Boolean).map(part => {
    try { return decodeURIComponent(part); } catch { return part; }
  });
  const params = new URLSearchParams(queryPart || '');

  switch (parts[0]) {
    case 'engagements':
    case 'engagement': {
      const filterParam = params.get('filter');
      if (filterParam && LIST_FILTERS.includes(filterParam)) return { view: 'list', filter: filterParam };
      if (parts[1] === 'da-gestire') return { view: 'list', filter: 'action' };
      if (parts[1] === 'in-attesa') return { view: 'list', filter: 'waiting' };
      if (parts[1]) return { view: 'detail', id: parts[1], tab: parts[2] || '' };
      return { view: 'list' };
    }

    case 'clients': return { view: 'clients' };
    case 'calendar': return { view: 'calendar' };
    case 'solicitations': return { view: 'solicitations' };
    case 'kpi': return { view: 'kpi' };
    case 'admin': return { view: 'admin', tab: parts[1] || 'users' };
    case 'users': return { view: 'users' };
    default: return null;
  }
}

async function applyRoute(target) {
  const route = target || { view: 'list' };
  const isAdmin = adminTabsForRole().length > 0;
  const filter = LIST_FILTERS.includes(route.filter) ? route.filter : 'all';

  if (route.view === 'admin' && !isAdmin) return applyRoute({ view: 'list' });

  if (route.view === 'detail') {
    const tab = DETAIL_TABS.includes(route.tab) ? route.tab : '';
    if (state.view === 'detail' && state.detail && state.detail.engagement.id === route.id) {
      if (tab && tab !== state.tab) await setTab(tab);
      return;
    }
    await openEngagement(route.id);
    if (tab && state.view === 'detail' && state.detail &&
        state.detail.engagement.id === route.id && tab !== state.tab) {
      await setTab(tab);
    }
    return;
  }

  if (state.view === 'detail') {
    state.detail = null;
    state.scope = null;
    state.credentials = null;
  }

  if (route.view === 'admin') {
    state.view = 'admin';
    state.adminTab = canUseAdminTab(route.tab) ? route.tab : (adminTabsForRole()[0] || 'users');
    state.adminError = null;
    updateHeader();
    await loadAdmin();
    return;
  }

  if (route.view === 'users') {
    state.view = 'users';
    updateHeader();
    await loadUsers();
    return;
  }

  if (route.view === 'clients') {
    state.view = 'clients';
    state.listFilter = filter;
    updateHeader();
    await loadClients();
    render();
    return;
  }

  if (route.view === 'calendar') {
    state.view = 'calendar';
    state.listFilter = filter;
    updateHeader();
    await loadCalendar();
    if (state.view === 'calendar') renderCalendar();
    return;
  }

  if (route.view === 'solicitations') {
    state.view = 'solicitations';
    state.listFilter = filter;
    updateHeader();
    await loadSolicitations();
    render();
    return;
  }

  if (route.view === 'kpi') {
    if (!canUseAdminTab('users')) return applyRoute({ view: 'list' });
    state.view = 'kpi';
    state.listFilter = filter;
    updateHeader();
    await loadKpi();
    return;
  }

  state.view = 'list';
  state.listTab = 'eng';
  state.listFilter = filter;
  if (state.list.length && currentRoute() === locationRoute()) {
    render();
    return;
  }
  await loadList();
}

// Applica l'URL corrente (refresh, indietro/avanti, link diretto).
async function handleRoute() {
  if (routeBusy) {
    // Una navigazione è in corso: non si perde, si riprende appena finita.
    pendingRoute = requestedRoute();
    return;
  }
  if (locationRoute() === currentRoute()) return;

  routeBusy = true;
  try {
    await applyRoute(parseRoute(requestedRoute()));
  } finally {
    routeBusy = false;

    if (pendingRoute) {
      // Nel frattempo l'utente ha navigato di nuovo: si applica quella route
      // (è già nella URL) e non si normalizza lo stato intermedio.
      pendingRoute = '';
      await handleRoute();
    } else {
      const canonical = currentRoute();
      lastRoute = canonical;
      if (locationRoute() !== canonical) history.replaceState(null, '', canonical);
    }
  }
}

/* ====== RENDER ====== */
function render() {
  updateHeader();
  // La scheda utente vive solo nell'elenco utenti: altrove si chiude da sola.
  if (state.userModal &&
      state.view !== 'users' &&
      !(state.view === 'admin' && state.adminTab === 'users')) {
    state.userModal = '';
    state.userModalError = null;
  }
  if (state.view === 'clients') renderClients();
  else if (state.view === 'users') renderUsers();
  else if (state.view === 'admin') renderAdmin();
  else if (state.view === 'calendar') renderCalendar();
  else if (state.view === 'solicitations') renderSolicitations();
  else if (state.view === 'kpi') renderKpi();
  else if (state.view === 'detail' && state.detail) renderDetail();
  else renderList();
  renderUserModal();
  rememberSetupFolds();
  syncRoute();
}

// I blocchi del Setup sono aperti di default e la scelta dell'utente resta
// anche dopo un render (l'evento toggle non risale, quindi si aggancia qui).
function rememberSetupFolds() {
  document.querySelectorAll('details[data-fold]').forEach(details => {
    details.addEventListener('toggle', () => {
      state.setupFold[details.dataset.fold] = details.open;
    });
  });
}

  propose: async () => {
    const startDate = $('#ps').value;
    const endDate = $('#pe').value;
    const note = $('#pn').value.trim();
    if (!startDate || !endDate) { toast('Inserisci data di inizio e fine'); return; }
    if (startDate < today()) { toast('La data di inizio non può essere nel passato'); return; }
    if (endDate < startDate) { toast('La data di fine precede l\'inizio'); return; }
    const days = Math.round((Date.parse(endDate) - Date.parse(startDate)) / 86400000);
    if (days > 60) { toast('La durata massima è di 60 giorni'); return; }
    const notice = state.detail.planningNotice;
    if (notice && (state.role === 'Client' || state.role === 'PMO')) {
      const proceed = await ask({
        title: 'Avviso pianificazione',
        text: `La proposta arriva prima di due settimane dalla richiesta (${fmt(notice.requestDate)}). Potrai proporla dal ${fmt(notice.availableFrom)}. Vuoi inviarla comunque?`,
        ok: 'Invia comunque'
      });
      if (!proceed) return;
    }
    try {
      const result = await api(`/api/engagements/${engagedId()}/proposals?` + qs(), {
        method: 'POST', body: JSON.stringify({ startDate, endDate, note })
      });
      toast(result && result.status === 'Accepted'

        : 'Proposta inviata');
      await refreshDetail();
    } catch (error) { toast(error.message); }

      await ask({
        title: copied ? 'Link monouso copiato' : 'Link monouso creato',
        text: `${copied ? 'Il link è già negli appunti. ' : ''}Valido fino al ${fmtTime(result.expiresAt)} (5 giorni) e utilizzabile una sola volta.`,
        ok: 'Chiudi',

  'new-client', 'rename-client', 'add-client-user', 'remove-client-user',
  'add-client-dl', 'remove-client-address',
  'invite-client-team', 'remove-client-team',
  'new-engagement', 'save-rule', 'send-solicitation', 'upload-manleva',
  'upload-ingaggio', 'register-order', 'save-order', 'edit-financials', 'save-financials-inline', 'approve-financials', 'propose', 'reschedule',
  'decide', 'save-scope', 'save-credentials', 'save-setup', 'upload-report',
  'download-report', 'create-download-link', 'submit-review', 'review-decide', 'publish', 'add-dl',
  'remove-dl', 'invite-team', 'remove-team', 'toggle-mail', 'send-mail', 'export-log', 'retry-list',
  'admin-save-templates'
]);

document.addEventListener('click', event => {
  const el = event.target.closest('[data-act]');
  if (!el) return;
  const action = actions[el.dataset.act];
  if (!action) return;
  event.preventDefault();
  const isButton = el.tagName === 'BUTTON';
  const shouldBusy = isButton && busyActions.has(el.dataset.act);
  if (shouldBusy) {
    el.classList.add('busy');
    el.disabled = true;
    el.setAttribute('aria-busy', 'true');
  }
  Promise.resolve(action(el))
    .catch(error => toast(error.message))
    .finally(() => {
      if (shouldBusy && el.isConnected) {
        el.classList.remove('busy');
        el.disabled = false;
        el.removeAttribute('aria-busy');
      }
    });
});

document.addEventListener('input', event => {
  if (event.target.id === 'user-search') {
    state.userQuery = event.target.value;
    if (state.view === 'admin') renderAdmin(); else renderUsers();
    const input = $('#user-search');
    if (input) {
      input.focus();
      const end = input.value.length;
      try { input.setSelectionRange(end, end); } catch { /* noop */ }
    }
    return;
  }
  if (event.target.id === 'admin-mail-search') {
    state.adminMailingQuery = event.target.value;
    renderAdmin();
    const input = $('#admin-mail-search');
    if (input) {
      input.focus();
      const end = input.value.length;
      try { input.setSelectionRange(end, end); } catch { /* noop */ }
    }
    return;
  }
  if (event.target.id === 'client-search') {
    state.clientQuery = event.target.value;
    renderClients();
    const box = $('#client-search');
    if (box) {
      box.focus();
      const end = box.value.length;
      try { box.setSelectionRange(end, end); } catch { /* noop */ }
    }
    return;
  }
  if (event.target.id !== 'list-search') return;
  state.listQuery = event.target.value;
  renderList();
  const input = $('#list-search');
  if (input) {
    input.focus();
    const end = input.value.length;
    input.setSelectionRange(end, end);
  }
});

document.addEventListener('change', event => {
  const el = event.target.closest('[data-change]');
  if (!el) return;
  const kind = el.dataset.change;
  if (kind === 'rule') {
    Promise.resolve(actions['save-rule'](el)).catch(error => toast(error.message));
  }
  if (kind === 'client-dl') {
    Promise.resolve(actions['client-dl-toggle'](el)).catch(error => toast(error.message));
  }
  if (kind === 'log-author') {
    state.logAuthor = el.value;
    render();
  }
  if (kind === 'list-filter') {
    state.listFilter = el.value || 'all';
    render();
  }
  if (kind === 'list-sort') {
    state.listSort = el.value || 'priority';
    if (state.listSort === 'column' && !state.listColumn) {
      state.listColumn = 'engagement';
      state.listDir = 'asc';
    }
    renderList();
  }
  if (kind === 'admin-template-target') {
    const [scope, clientId] = String(el.value || 'standard').split('|');
    state.adminTemplateTarget = {
      scope: scope === 'client' ? 'client' : 'standard',
      clientId: scope === 'client' ? (clientId || '') : '',
      type: 'start'
    };
    renderAdmin();
  }
});

/* ====== SHELL: SCORCIATOIE ====== */
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && state.userModal) {
    closeUserModal();
    return;
  }

  if (event.key === 'Escape' && document.body.classList.contains('side-open')) {
    closeSideOnMobile();
    return;
  }

  // Invio su una riga utente apre la scheda (le celle sono focusabili).
  if (event.key === 'Enter' && !state.userModal) {
    const row = event.target.closest?.('[data-act="open-user"]');
    if (row && row.tagName === 'TR') {
      event.preventDefault();
      openUserModal(row.dataset.id);
      return;
    }
  }

  // Invio in un campo della scheda salva, come il pulsante.
  if (event.key === 'Enter' && state.userModal) {
    const tag = (event.target.tagName || '').toLowerCase();
    const save = document.querySelector('[data-act="save-user"]');
    if (save && (tag === 'input' || tag === 'select')) {
      event.preventDefault();
      saveUserFromModal();
    }
    return;
  }

  if (event.key !== '[' || event.metaKey || event.ctrlKey || event.altKey) return;
  const tag = (event.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || event.target.isContentEditable) return;
  event.preventDefault();
  actions['side-toggle']();
});

window.addEventListener('resize', applyShell);
window.addEventListener('hashchange', handleRoute);
window.addEventListener('popstate', handleRoute);

/* ====== INIT ====== */
function init() {
  // Ruolo assente o non riconosciuto: come lato server si parte dal profilo
  // meno privilegiato (Cliente), non da un utente interno.
  if (!ROLES[state.role]) state.role = 'Client';

  applyShell();

  const roleSelect = $('#role');
  roleSelect.innerHTML = Object.entries(ROLES)
    .map(([key, value]) => `<option value="${key}" ${key === state.role ? 'selected' : ''}>${esc(value.label)}${key === 'Auditor' ? ' · sola lettura' : ''}</option>`)
    .join('');
  roleSelect.value = state.role;
  roleSelect.onchange = event => setRole(event.target.value);

  $('#demoUser').onchange = event => setDemoUser(event.target.value);
  $('#client').onchange = event => setClient(event.target.value);

  loadDemoUsers().then(() => {
    roleSelect.value = state.role;
    fillClientSelect();
    updateHeader();

    loadClients().then(async () => {
      if (isClient() && !state.clients.length && !state.clientId) {
        // Server irraggiungibile: si mostra comunque il cliente demo atteso.
        state.clientId = ROLES.Client.client || '';
        localStorage.setItem('cep.client', state.clientId);
        fillClientSelect();
      }
      updateHeader();
      await loadList();
      routeReady = true;
      const bootRoute = parseRoute(requestedRoute());
      if (!bootRoute) {
        syncRoute();
        lastRoute = currentRoute();
        if (locationRoute() !== lastRoute) history.replaceState(null, '', lastRoute);
        return;
      }
      await handleRoute();
      if (!lastRoute) lastRoute = currentRoute();
    });
  });
}

init();
</script>
</body>
