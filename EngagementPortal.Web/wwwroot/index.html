function isMobileShell() {
  return window.matchMedia('(max-width: 900px)').matches;
}

function applyShell() {
  const mobile = isMobileShell();
  const open = document.body.classList.contains('side-open');
  if (!mobile) document.body.classList.remove('side-open');
  document.body.classList.toggle('side-collapsed', !!state.sideCollapsed && !mobile);

  const toggle = $('#sideToggle');
  if (toggle) {
    const expanded = mobile ? open : !state.sideCollapsed;
    toggle.setAttribute('aria-expanded', String(expanded));
    toggle.setAttribute('aria-label', mobile
      ? (open ? 'Chiudi menu' : 'Apri menu')
      : (state.sideCollapsed ? 'Espandi menu' : 'Comprimi menu'));
    toggle.title = mobile
      ? (open ? 'Chiudi menu' : 'Apri menu')
      : (state.sideCollapsed ? 'Espandi menu ( [ )' : 'Comprimi menu ( [ )');
  }

  const foot = $('.side-collapse');
  if (foot) foot.title = state.sideCollapsed ? 'Espandi menu ( [ )' : 'Comprimi menu ( [ )';
}

function closeSideOnMobile() {
  if (!isMobileShell()) return;
  document.body.classList.remove('side-open');
  applyShell();
}

function updateNav() {
  const internal = isInternalRole();
  const tabs = adminTabsForRole();
  const admin = tabs.length > 0;

  document.querySelectorAll('[data-nav]').forEach(item => {
    const view = item.dataset.view;
    let show = true;
    if (view === 'clients' || view === 'solicitations') show = internal;
    if (view === 'admin') show = canUseAdminTab(item.dataset.tab);
    item.hidden = !show;
  });

  const adminGroup = document.querySelector('[data-group="admin"]');
  if (adminGroup) adminGroup.hidden = !admin;

  const key = state.view === 'admin'
    ? `admin-${state.adminTab}`
    : state.view === 'detail'
      ? 'list'
      : state.view === 'users'
        ? 'admin-users'
        : state.view === 'list' && state.listFilter === 'action'
          ? 'todo'
          : state.view === 'list' && state.listFilter === 'waiting'
            ? 'waiting'
            : state.view;

  document.querySelectorAll('[data-nav]').forEach(item => {
    const on = item.dataset.nav === key;
    item.classList.toggle('on', on);
    if (on) item.setAttribute('aria-current', 'page');
    else item.removeAttribute('aria-current');
  });

  const countByKind = kind => (state.list || [])
    .filter(item => (item.actionState || {}).kind === kind).length;

  [['todo', 'action'], ['waiting', 'waiting']].forEach(([nav, kind]) => {
    const count = countByKind(kind);
    const badge = document.querySelector(`[data-nav="${nav}"] .nav-count`);
    if (!badge) return;
    badge.textContent = String(count);
    badge.hidden = count === 0;
  });

  const kicker = $('#headerKicker');
  const section = $('#headerSection');
  if (!kicker || !section) return;

  const adminTabs = {
    activities: 'Tipi di attività',
    users: 'Utenti',
    clients: 'Clienti',
    mailing: 'Mailing list',
    templates: 'Template mail',
    solicitations: 'Regole solleciti',
    settings: 'Impostazioni'
  };

  if (state.view === 'admin') {
    kicker.textContent = 'Amministrazione';
    section.textContent = adminTabs[state.adminTab] || 'Utenti';
    return;
  }

  if (state.view === 'detail' && state.detail) {
    kicker.textContent = 'Engagement';
    section.textContent = state.detail.engagement.id;
    return;
  }

  kicker.textContent = 'Portale';
  section.textContent =
    state.view === 'list' && state.listFilter === 'action' ? 'Da gestire'
      : state.view === 'list' && state.listFilter === 'waiting' ? 'In attesa di terzi'
        : {
          dashboard: 'Dashboard',
          list: 'Engagement',
          clients: 'Clienti',
          calendar: 'Calendario',
          solicitations: 'Solleciti',
          users: 'Utenti'
        }[state.view] || 'Engagement';
}

// Il dettaglio usa rail e contesto sticky: l'offset deve seguire l'altezza
// reale dell'header (che cambia quando va a capo su schermi stretti).
function syncHeaderOffset() {
  const header = document.querySelector('.shell-main > header');
  if (!header) return;
  document.documentElement.style.setProperty('--app-header-h', `${header.offsetHeight}px`);
}
window.addEventListener('resize', syncHeaderOffset);

function fillUserSelect() {
  const select = $('#demoUser');
  if (!select) return;

  const roleOrder = ['Manager', 'PMO', 'Pentester', 'Auditor', 'Client'];
  const visibleUsers = isClient()
    ? state.demoUsers.filter(user => user.role === 'Client')
    : state.demoUsers;
  const groups = roleOrder
    .map(role => [role, visibleUsers.filter(user => user.role === role)])
    .filter(([, list]) => list.length);

  select.innerHTML = groups.length
    ? groups.map(([role, list]) =>
        `<optgroup label="${esc(ROLES[role]?.label || role)}">${list.map(user =>
          `<option value="${esc(user.id)}" ${user.id === state.userId ? 'selected' : ''}>${esc(user.name)}${user.role === 'Client' && user.clientId ? ` · ${esc(clientLabel(user.clientId))}` : ''}</option>`
        ).join('')}</optgroup>`).join('')
    : '<option value="">Nessun utente disponibile</option>';

  if (state.userId && !state.demoUsers.some(user => user.id === state.userId))
    select.value = '';
  else
    select.value = state.userId || '';
}

async function loadDemoUsers(preferredRole) {
  const role = preferredRole || state.role;
  const params = new URLSearchParams({
    role,
    client: state.clientId || ''
  });

  try {
    state.demoUsers = await api('/api/demo/users?' + params.toString());
  } catch {
    state.demoUsers = [];
  }

  const savedId = readCookie(ID_COOKIE.user);
  const saved = demoUserById(savedId);
  const user = (saved && saved.role === role ? saved : null) ||
    state.demoUsers.find(item => item.role === role) ||
    state.demoUsers[0];

  if (user) {
    state.userId = user.id;
    state.role = user.role;
    state.clientId = user.role === 'Client' ? (user.clientId || '') : '';
    // Il server legge l'identità dai cookie: si tiene allineata alla scelta.
    writeIdentity();
  }

  fillUserSelect();
}

function fillClientSelect() {  const select = $('#client');
  const clients = state.clients || [];
  const known = clients.length
    ? clients.map(c => [c.id, c.name])
    : (isClient() ? [] : DEMO_CLIENTS);
  const options = isClient()
    ? known
    : [['', 'Tutti i clienti'], ...known];
  select.innerHTML = options.length
    ? options
      .map(([value, label]) => `<option value="${esc(value)}" ${value === (state.clientId || '') ? 'selected' : ''}>${esc(label)}</option>`)
      .join('')
    : '<option value="">Nessun cliente disponibile</option>';
  if (!options.some(o => o[0] === (state.clientId || ''))) {
    // Per un Cliente l'identità la decide il server: si usa solo la lista
    // restituita dal server, mai il fallback demo.
    state.clientId = isClient()
      ? (clients[0] ? clients[0].id : '')
      : '';
    select.value = state.clientId;
    writeCookie(ID_COOKIE.client, state.clientId);
  }
}

function demoUserById(id) {
  return state.demoUsers.find(user => user.id === id) || null;
}

function setDemoUser(id) {
  const user = demoUserById(id);
  if (!user) return;

  state.userId = user.id;
  state.role = user.role;
  state.clients = [];
  state.clientId = user.role === 'Client' ? (user.clientId || '') : '';
  state.view = 'dashboard';
  state.detail = null;
  state.tab = 'docs';
  state.listTab = 'eng';
  state.scope = null;
  state.credentials = null;
  writeCookie(ID_COOKIE.user, state.userId);
  writeCookie(ID_COOKIE.role, state.role);
  writeCookie(ID_COOKIE.client, state.clientId || '');
  $('#role').value = state.role;
  fillUserSelect();
  fillClientSelect();
  updateHeader();
  loadClients().then(loadList);
}

async function setRole(role) {
  if (!ROLES[role]) return;

  if (role === 'Client' ||
      !state.demoUsers.some(user => user.role === role)) {
    await loadDemoUsers(role);
  }

  const candidate = state.demoUsers.find(user =>
    user.role === role &&
    (role !== 'Client' || user.clientId));

  if (candidate) {
    setDemoUser(candidate.id);
    return;
  }

  state.role = role;
  state.userId = '';
  if (role === 'Client') {
    // La lista clienti di un profilo Cliente è solo la propria: si riparte
    // dalla risposta del server per non ereditare quella del profilo interno.
    state.clients = [];
    state.clientId = '';
  } else {
    state.clientId = '';
  }
  state.view = 'dashboard';
  state.detail = null;
  state.tab = 'docs';
  state.listTab = 'eng';
  state.scope = null;
  state.credentials = null;
  writeCookie(ID_COOKIE.user, '');
  writeCookie(ID_COOKIE.role, role);
  writeCookie(ID_COOKIE.client, state.clientId || '');
  fillUserSelect();
  fillClientSelect();
  updateHeader();
  loadClients().then(loadList);
}

function setClient(clientId) {
  state.clientId = clientId;
  writeCookie(ID_COOKIE.client, clientId || '');
  updateHeader();
  if (state.view === 'detail' && state.detail) {
    // Un utente interno che cambia cliente torna alla lista: il dettaglio
    // aperto potrebbe non appartenere al nuovo perimetro.
    if (isInternalRole()) backToList();
    else loadDetail(state.detail.engagement.id);
  }
  else if (state.view === 'clients') loadClients().then(render);
  else if (state.view === 'calendar') loadCalendar();
  else if (state.view === 'admin') loadAdmin();
  else loadList();
}

function backToList() {
  state.view = 'list';
  state.detail = null;
  state.scope = null;
  state.credentials = null;
  state.listTab = 'eng';
  loadList();
}

async function openEngagement(id) {
  state.view = 'detail';
  state.tab = null;
  state.scope = null;
  state.credentials = null;
  state.logAuthor = '';
  state.editing = {};
  await loadDetail(id);
}

async function setTab(tab) {
  state.tab = tab;
  if (tab === 'scope') await loadScope();
  render();
}

/* ====== DATI ====== */
async function loadList() {
  state.loading = true;
  state.error = null;
  if (!state.list.length) render();
  try {
    state.list = await api('/api/engagements?' + qs());
    if (!isClient()) await loadSolicitations();
    else { state.rules = []; state.due = []; }
  } catch (error) {
    state.error = error.message;
    toast(error.message);
  } finally {
    state.loading = false;
    render();
  }
}

async function loadCalendar() {
  state.calendarProposals = [];
  await ensureActivityTypes();
  await loadList();

  const pending = (state.list || []).filter(e => e.pendingProposal);
  if (!pending.length) return;

  const details = await Promise.all(pending.map(e =>
    api(`/api/engagements/${encodeURIComponent(e.id)}?` + qs()).catch(() => null)));

  state.calendarProposals = details.filter(Boolean).flatMap(d => {
    const e = d.engagement || {};
    return (e.proposals || [])
      .filter(p => p.status === 'Pending' && p.startDate)
      .map(p => ({
        id: e.id,
        name: e.name,
        client: e.clientName,
        kind: 'proposed',
        start: String(p.startDate).slice(0, 10),
        end: String(p.endDate || p.startDate).slice(0, 10),
        from: p.from,
        // L'engagement del dettaglio non ha il passo: si ripiega su state.list.
        ref: e
      }));
  });

  if (state.view === 'calendar') renderCalendar();
}

// Catalogo dei tipi di attività: serve al Setup e al form di creazione.
async function ensureActivityTypes() {
  if (state.activityTypes?.length) return state.activityTypes;

  try {
    state.activityTypes = await api('/api/activity-types?' + qs());
  } catch {
    state.activityTypes = [];
  }

  return state.activityTypes;
}

async function loadDetail(id) {
  state.loading = true;
  state.error = null;
  try {
    const detail = await api(`/api/engagements/${encodeURIComponent(id)}?` + qs());
    state.detail = detail;
    await ensureActivityTypes();
    if (!state.tab) state.tab = defaultTab(detail);
    if (state.tab === 'scope') await loadScope();
  } catch (error) {
    state.error = error.message;
    toast(error.message);
    state.view = 'list';
    state.detail = null;
    state.loading = false;
    await loadList();
    return;
  }
  state.loading = false;
  render();
}

async function refreshDetail() {
  if (state.detail) await loadDetail(state.detail.engagement.id);
  else await loadList();
}

async function loadScope() {
  const id = state.detail.engagement.id;
  state.scope = await api(`/api/engagements/${id}/scope?` + qs());
  // Copia di lavoro dei target: le voci nuove restano "non salvate" finché
  // non si preme Salva scope.
  state.scopeTargets = (state.scope.scope?.targets || [])
    .map(target => ({ ...target, saved: true }));
}

async function loadCredentials() {
  const id = state.detail.engagement.id;
  try {
    state.credentials = await api(`/api/engagements/${id}/credentials?` + qs());
  } catch {
    state.credentials = { credentials: null, canEdit: false };
  }
}


async function loadSolicitations() {
  try {
    state.rules = await api('/api/solicitations/rules?' + qs());
    state.due = await api('/api/solicitations/due?' + qs());
    state.sent = await api('/api/solicitations/sent?' + qs());
  } catch {
    state.rules = [];
    state.due = [];
    state.sent = [];
  }
}

async function loadClients() {
  try {
    state.clients = await api('/api/clients?' + qs());
  } catch {
    state.clients = [];
  }
  if (isClient() && state.clients.length &&
      !state.clients.some(c => c.id === state.clientId)) {
    state.clientId = state.clients[0].id;
    writeCookie(ID_COOKIE.client, state.clientId);
  }
  fillClientSelect();
  updateHeader();
}

/* ====== STATI WORKFLOW ====== */
// La UI non ricalcola lo stato: legge actionState/tabStates dal server.
function actionState(e) {
  return e && e.actionState ? e.actionState : null;
}

function statusPill(e) {
  const s = actionState(e);
  if (!s) return ['Stato non disponibile', 'neutral'];
  switch (s.kind) {
    case 'action': return ['Da gestire', 'action'];
    case 'waiting': return ['In attesa', 'wait'];
    case 'progress':
      // "Pianificato dal ..." è sì un progress, ma l'attività non è ancora
      // iniziata: in Dashboard e in lista il piano non deve leggersi "in corso".
      return [s.label && s.label.startsWith('Pianificato') ? 'Pianificato' : 'In corso', 'progress'];
    case 'done': return ['Completato', 'done'];
    case 'blocked': return ['Bloccato', 'blocked'];
    default: return [s.label || 'Stato non disponibile', 'neutral'];
  }
}


function statusOwner(e) {
  const s = actionState(e);
  return s && s.kind === 'waiting' && s.ownerLabel ? s.ownerLabel : '';
}

// Chi ha in carico il passo corrente. Il server manda i nomi veri dietro al
// ruolo del workflow (currentTask.owners); se il ruolo non ha persone attive
// si ripiega sull'etichetta ("Manager", "PMO o Manager").
function taskOwner(d, opts = {}) {
  const task = d.currentTask;
  if (!task) return '';

  if (task.kind === 'action')
    return '<span class="band-owner band-me">Tocca a te</span>';

  const people = (task.owners || []).filter(person => person && person.name);

  if (!people.length) {
    if (task.ownerLabel)
      return `<span class="band-owner">In carico a <b>${esc(task.ownerLabel)}</b></span>`;
    // Pianificato / in redazione / da concludere: il workflow dice cosa sta
    // succedendo, utile per capire lo stato senza aprire la scheda. Le
    // etichette che ripetono la pastiglia restano fuori.
    const redundant = ['In esecuzione', 'In corso', 'Completato'];
    if (task.kind === 'progress' && task.label &&
        !redundant.includes(task.label)) {
      // "Pianificato" + "Pianificato dal 23/11/2026": la pastiglia basta.
      const [stateLabel] = statusPill(d);
      const repeats = stateLabel &&
        task.label.toLowerCase().startsWith(stateLabel.toLowerCase());
      if (!(repeats && opts.compact))
        return `<span class="band-owner band-note">${esc(task.label)}</span>`;
    }
    return '';
  }

  const shown = people.slice(0, 3);
  const hidden = people.slice(3)
    .map(person => person.email || person.name)
    .join(', ');
  const more = people.length - shown.length;
  const orgs = [...new Set(shown.map(person => person.organization).filter(Boolean))];

  return `<span class="band-owner">
    <span>In carico a</span>
    ${shown.map(person => `<span class="band-person" title="${esc(person.email || person.name)}">
      <span class="avatar">${esc(initialsOf(person.name))}</span>${esc(person.name)}
    </span>`).join('')}
    ${more > 0 ? `<span class="band-more" title="${esc(hidden)}">+${more}</span>` : ''}
    ${orgs.length ? `<span class="band-org">${esc(orgs.join(' · '))}</span>` : ''}
  </span>`;
}

function daysSince(date) {
  if (!date) return null;
  const d = new Date(String(date).substring(0, 10) + 'T00:00:00');
  if (Number.isNaN(d.getTime())) return null;
  const now = new Date(today() + 'T00:00:00');
  return Math.max(0, Math.round((now - d) / 86400000));
}

function statusAge(e) {
  const s = actionState(e);
  if (!s || (s.kind !== 'action' && s.kind !== 'waiting')) return '';
  const n = daysSince(s.since);
  if (n === null || n < 1) return '';
  const label = n === 1 ? 'da 1 giorno' : `da ${n} giorni`;
  if (s.kind === 'action') {
    return `<span class="status-age late">${label}</span>`;
  }
  return `<span class="status-age ${n >= 5 ? 'overdue' : ''}">${label}</span>`;
}

// Varianti compatte per la tabella della homepage (variante B).
function delayCellCompact(e) {
  const a = e && e.preparationAlert;
  if (!a) return '<span class="delay-none" aria-hidden="true">–</span>';

  const days = Number(a.daysToStart) || 0;
  const label = days > 0
    ? `${days} gg`
    : days === 0 ? 'oggi' : `${Math.abs(days)} gg fa`;
  const full = (a.missing || [])
    .map(m => m === 'scope' ? 'Scope' : 'Credenziali')
    .join(' e ');
  const title = `${full} non completati: ${days > 0
    ? `mancano ${days} giorni all'avvio`
    : days < 0 ? `l'avvio è già avvenuto da ${Math.abs(days)} giorni` : 'l\'avvio è oggi'}.`;

  return `<span class="delay delay-sm" title="${esc(title)}">${esc(label)}</span>`;
}

function delayBadge(e) {
  const a = e && e.preparationAlert;
  if (!a) return '';

  const days = Number(a.daysToStart) || 0;
  const text = days > 0
    ? `${days} gg all'avvio`
    : days === 0 ? 'avvio oggi' : 'avvio superato';

  return `<span class="delay delay-sm">${esc(text)}</span>`;
}

// Fase del workflow in poco spazio: barra a un segmento per passo + nome.
// La lunghezza non è fissa: senza retest il workflow ha 7 passi, con il
// retest 9. Il conteggio arriva dal server in `e.stepCount`.
function phaseCell(e) {
  const raw = Number(e.stepIndex) || 0;
  const total = Number(e.stepCount) === 7 ? 7 : STEPS.length;
  const steps = STEPS.slice(0, total);
  const index = Math.max(0, Math.min(raw, total - 1));
  const done = raw >= total;
  const name = done ? 'Completato' : steps[index][0];
  const title = done
    ? `Workflow completato · ${total} passi`
    : `Passo ${index + 1} di ${total}: ${steps[index][0]} — ${steps[index][1]}`;

  return `<span class="phase" title="${esc(title)}">${mini(raw, total)}<span class="phase-name">${esc(name)}</span></span>`;
}

function statusCellCompact(e) {
  const owner = statusOwner(e);
  return `<div class="status-cell status-mini">${objState(e)}
    ${owner ? `<span class="status-owner">${esc(owner)}</span>` : ''}
    ${statusAge(e)}</div>`;
}

function rowClass(e) {
  const s = actionState(e);
  return s ? ` is-${s.kind}` : '';
}

function tabState(d, k) {
  const t = d && d.tabStates ? d.tabStates[k] : null;
  if (t) return t.state;
  return legacyTabState(d, k);
}


// Fallback per compatibilità con un backend precedente.
function legacyTabState(d, k) {
  const e = d.engagement;
  const c = d.capabilities || {};
  const pending = (e.proposals || []).some(p => p.status === 'Pending');
  if (k === 'setup') {
    return e.setupDone ? 'ok' : c.canManageSetup ? 'todo' : 'wait';
  }
  if (k === 'docs') {
    const nS = !e.hasManleva && c.canUploadManleva;
    const nO = !e.orderConfirmed && c.canManageEngagementDocs;
    return e.hasManleva && e.orderConfirmed && e.financialsDone && e.financialsApproved ? 'ok' : (nS || nO) ? 'todo' : 'wait';
  }
  if (k === 'plan') {
    if (!e.hasManleva || !e.orderConfirmed || !e.financialsDone || !e.financialsApproved) return 'lock';
    if (d.todo && d.todo.targetTab === 'plan') return 'todo';
    if (pending) return 'wait';
    return e.acceptedProposal ? 'ok' : 'wait';
  }
  if (k === 'scope') {
    if (!e.hasManleva || !e.orderConfirmed || !e.financialsDone || !e.financialsApproved) return 'lock';
    if (d.scope && d.scope.done) return 'ok';
    return canEditPreparation(d) ? 'todo' : 'wait';
  }
  if (k === 'cred') {
    if (!e.hasManleva || !e.orderConfirmed || !e.financialsDone || !e.financialsApproved || !c.canCredentials) return 'lock';
    if (d.credentials && d.credentials.done) return 'ok';
    return canEditCredentials(d) ? 'todo' : 'wait';
  }
  if (k === 'reports') {
    if (d.todo && d.todo.targetTab === 'reports') return 'todo';
    if ((e.reports || []).some(r => r.published)) return 'ok';
    if (!c.isClient && ((e.reports || []).length || d.phase === 'Reporting')) return 'wait';
    return 'lock';
  }
  return 'none';
}

function defaultTab(d) {
  const tabs = isClient()
    ? ['docs', 'scope', 'plan', 'reports']
    : ['setup', 'docs', 'scope', 'plan', 'reports'];
  const todo = tabs.find(k => tabState(d, k) === 'todo');
  if (todo) return todo;
  const byPhase = {
    Setup: 'setup',
    Docs: 'docs',
    Scope: 'scope',
    Planning: 'plan',
    Credentials: 'cred',
    Scheduled: 'run',
    Running: 'run',
    Reporting: 'reports',
    Done: 'reports'
  };
  const target = byPhase[d.phase] || 'docs';
  return isClient() && target === 'setup' ? 'docs' : target;
}

function canEditPreparation(d) {
  const e = d.engagement;
  if (!e.hasManleva || !e.orderConfirmed || !e.financialsDone || !e.financialsApproved) return false;
  if (state.role === 'Client')
    return d.phase === 'Scope' || d.phase === 'Planning' || d.phase === 'Credentials' || d.phase === 'Scheduled';
  if (state.role === 'PMO')
    return d.phase === 'Scope' || d.phase === 'Planning' || d.phase === 'Credentials' || d.phase === 'Scheduled' || d.phase === 'Running';
  return false;
}

function canEditCredentials(d) {
  // Il server calcola il permesso effettivo (include il Manager).
  if (d && d.capabilities && typeof d.capabilities.canEditCredentials === 'boolean')
    return d.capabilities.canEditCredentials;
  return canEditPreparation(d);
}

/* ====== COMPONENTI ====== */
function mini(stepIndex, stepCount = STEPS.length) {
  const total = Number(stepCount) === 7 ? 7 : STEPS.length;
  return `<div class="mini" aria-hidden="true">${STEPS.slice(0, total).map((_, i) =>
    `<i class="${stepIndex > i ? 'on' : stepIndex === i ? 'cur' : ''}"></i>`).join('')}</div>`;
}



function mailSubject(type) {
  if (MAIL_META[type]) return MAIL_META[type].subj;
  if (type && type.startsWith('solicitation:')) return `Sollecito: ${type.split(':')[1]}`;
  return type;
}

function entryAuto(mail, key) {
  const info = mail && mail[key];
  return !!(info && info[key]);
}

/* ====== LISTA ====== */
const normText = v => String(v == null ? '' : v)
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .toLowerCase();

// Tutti i campi mostrati in tabella finiscono nell'indice di ricerca:
// nome, codice, cliente, tipologia, passo, stato, responsabile, periodo e ritardo.
function searchableRow(e) {
  const s = actionState(e);
  const raw = Number(e.stepIndex) || 0;
  const step = raw >= STEPS.length
    ? ['Completato', 'Workflow completato']
    : STEPS[Math.max(0, Math.min(raw, STEPS.length - 1))];
  const alert = e.preparationAlert;
  const age = s && s.since ? daysSince(s.since) : null;
  return normText([
    e.name, e.id, e.clientName, typeLabel(e.type),
    s ? s.label : '', s ? s.kind : '', statusOwner(e),
    statusPill(e).join(' '),
    age ? `da ${age} giorni` : '',
    step ? `${step[0]} ${step[1]}` : '',
    e.periodStart
      ? `${fmt(e.periodStart)} ${fmt(e.periodEnd)} ${e.periodStart} ${e.periodEnd}`
      : 'da definire',
    alert
      ? `ritardo ${(alert.missing || []).join(' ')} ${alert.daysToStart} gg ${alert.daysToStart} giorni`
      : ''
  ].join(' '));
}

const LIST_COLUMNS = {
  engagement: 'Engagement',
  client: 'Cliente',
  phase: 'Fase',
  status: 'Stato',
  delay: 'Ritardo',
  period: 'Periodo'
};

function compareColumn(a, b, column) {
  const kindRank = { action: 0, waiting: 1, progress: 2, blocked: 3, neutral: 4, done: 5 };
  if (column === 'phase') {
    return (Number(a.stepIndex) || 0) - (Number(b.stepIndex) || 0);
  }
  if (column === 'status') {
    const ra = kindRank[(actionState(a) || {}).kind] ?? 9;
    const rb = kindRank[(actionState(b) || {}).kind] ?? 9;
    if (ra !== rb) return ra - rb;
    return statusPill(a)[0].localeCompare(statusPill(b)[0], 'it');
  }
  if (column === 'delay') {
    const da = a.preparationAlert ? Number(a.preparationAlert.daysToStart) : null;
    const db = b.preparationAlert ? Number(b.preparationAlert.daysToStart) : null;
    if (da === null && db === null) return 0;
    if (da === null) return 1;
    if (db === null) return -1;
    return da - db;
  }
  if (column === 'period') {
    if (!a.periodStart && !b.periodStart) return 0;
    if (!a.periodStart) return 1;
    if (!b.periodStart) return -1;
    return a.periodStart.localeCompare(b.periodStart);
  }
  if (column === 'client') {
    return String(a.clientName || '').localeCompare(String(b.clientName || ''), 'it');
  }
  return String(a.name || '').localeCompare(String(b.name || ''), 'it');
}

function sortEngagements(list) {
  const rank = { action: 0, waiting: 1, progress: 2, blocked: 3, neutral: 4, done: 5 };
  const priority = (a, b) => {
    const ra = rank[(actionState(a) || {}).kind] ?? 9;
    const rb = rank[(actionState(b) || {}).kind] ?? 9;
    if (ra !== rb) return ra - rb;
    return (a.periodStart || '9999-12-31').localeCompare(b.periodStart || '9999-12-31');
  };
  const mode = state.listSort || 'priority';
  return list.slice().sort((a, b) => {
    if (mode === 'column') {
      const dir = state.listDir === 'desc' ? -1 : 1;
      return compareColumn(a, b, state.listColumn || 'engagement') * dir || priority(a, b);
    }
    if (mode === 'start') {
      // "Avvio più vicino": prima gli avvii futuri (dal più vicino), poi
      // quelli già passati (dal più recente), infine chi non ha date.
      const group = e => !e.periodStart ? 2 : e.periodStart >= today() ? 0 : 1;
      const diff = group(a) - group(b);
      if (diff) return diff;
      if (group(a) === 0) return a.periodStart.localeCompare(b.periodStart) || priority(a, b);
      if (group(a) === 1) return b.periodStart.localeCompare(a.periodStart) || priority(a, b);
      return priority(a, b);
    }
    if (mode === 'client') {
      return a.clientName.localeCompare(b.clientName, 'it') || priority(a, b);
    }
    if (mode === 'name') {
      return a.name.localeCompare(b.name, 'it');
    }
    return priority(a, b);
  });
}

function filteredList() {
  const terms = normText(state.listQuery).split(/\s+/).filter(Boolean);
  const match = e => {
    const s = actionState(e);
    const kind = s ? s.kind : 'neutral';
    if (state.listFilter === 'action' && kind !== 'action') return false;
    if (state.listFilter === 'waiting' && kind !== 'waiting') return false;
    if (state.listFilter === 'progress' && kind !== 'progress') return false;
    if (state.listFilter === 'done' && kind !== 'done') return false;
    if (state.listFilter === 'risk' && !e.preparationAlert) return false;
    if (!terms.length) return true;
    const haystack = searchableRow(e);
    return terms.every(term => haystack.includes(term));
  };
  return sortEngagements(state.list.filter(match));
}

function skeletonRows(count) {
  return `<div class="card" style="padding:18px">${Array.from({ length: count || 4 })
    .map(() => '<div class="skeleton" style="margin-bottom:14px"></div>')
    .join('')}</div>`;
}

function renderList() {
  const all = state.list;
  const data = filteredList();
  const hasFilters = state.listFilter !== 'all' || state.listQuery.trim() !== '';

  const headActions = canCreateEngagement()
    ? '<button class="btn pri" data-act="new-engagement">+ Nuovo engagement</button>'
    : '';
  const rows = data.map(e => {
    const start = e.periodStart;
    return `<tr class="row${rowClass(e)}" data-act="open" data-id="${esc(e.id)}">
      <td data-label="Engagement"><span class="list-cell-eng">${typeBadge(e.type)}<button class="linkb rowname" data-act="open" data-id="${esc(e.id)}" title="${esc(e.name)}"><b>${esc(e.name)}</b></button></span></td>
      ${isClient() ? '' : `<td data-label="Cliente">${clientChip(clientFor(e))}</td>`}
      <td data-label="Fase">${phaseCell(e)}</td>
      <td data-label="Stato">${statusCellCompact(e)}</td>
      <td data-label="Ritardo">${delayCellCompact(e)}</td>
      <td data-label="Periodo">${periodBox(start, e.periodEnd, { id: e.id, name: e.name })}</td>
    </tr>`;
  }).join('');

  const filterOptions = [
    ['all', 'Tutti'], ['action', 'Da gestire'], ['waiting', 'In attesa di terzi'],
    ['progress', 'In corso'], ['done', 'Completati'], ['risk', 'A rischio']
  ];
  const sortOptions = [
    ['priority', 'Priorità'], ['start', 'Avvio più vicino'],
    ['client', 'Cliente'], ['name', 'Nome'],
    ['column', `Colonna: ${LIST_COLUMNS[state.listColumn] || LIST_COLUMNS.engagement}`]
  ];

  const sortHead = (key, label) => {
    const active = state.listSort === 'column' && (state.listColumn || 'engagement') === key;
    const dir = active ? state.listDir : 'asc';
    return `<th scope="col" aria-sort="${active ? (dir === 'desc' ? 'descending' : 'ascending') : 'none'}">
      <button class="th-sort ${active ? 'on' : ''}" data-act="sort-column" data-column="${key}" title="Ordina per ${label}">
        ${label}${active ? `<span class="sort-arrow" aria-hidden="true">${dir === 'desc' ? '▼' : '▲'}</span>` : ''}
      </button>
    </th>`;
  };

  const empty = state.listQuery || state.listFilter !== 'all'
    ? `<div class="empty">Nessun engagement in questo filtro. <button class="btn sec sm" data-act="clear-filter" style="margin-left:8px">Azzera filtri</button></div>`
    : `<div class="empty">Nessun engagement visibile per questo profilo e cliente.</div>`;

  const content = state.error
    ? `<div class="errorbox"><span><b>Impossibile caricare gli engagement.</b> ${esc(state.error)}</span><button class="btn sec sm" data-act="retry-list">Riprova</button></div>`
    : state.loading && !all.length
      ? skeletonRows(4)
      : `<div class="card listcard"><table class="list-table list-compact">
          <caption class="sr-only">Elenco engagement con fase del workflow, stato e proprietario dell'azione</caption>
          <thead><tr>${sortHead('engagement', 'Engagement')}${isClient() ? '' : sortHead('client', 'Cliente')}${sortHead('phase', 'Fase')}${sortHead('status', 'Stato')}${sortHead('delay', 'Ritardo')}${sortHead('period', 'Periodo')}</tr></thead>
          <tbody>${rows || `<tr><td colspan="${isClient() ? 5 : 6}">${empty}</td></tr>`}</tbody>
        </table></div>`;

  $('#app').innerHTML = `
    <div class="headrow" style="margin-bottom:16px">
      <h1>I miei engagement</h1>
      <div class="head-acts">${headActions}</div>
    </div>
    <section class="home-main">
        <div class="home-toolbar">
          <div class="search">
            <svg class="search-ico" aria-hidden="true"><use href="#i-search"></use></svg>
            <input type="search" id="list-search" value="${esc(state.listQuery)}" placeholder="Cerca in tutti i campi…" aria-label="Cerca per nome, codice, cliente, tipologia, fase, stato, periodo o ritardo">
          </div>
          <select data-change="list-filter" aria-label="Filtra engagement">
            ${filterOptions.map(([k, l]) => `<option value="${k}" ${state.listFilter === k ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
          <select data-change="list-sort" aria-label="Ordina engagement">
            ${sortOptions.map(([k, l]) => `<option value="${k}" ${state.listSort === k ? 'selected' : ''}>Ordina: ${l}</option>`).join('')}
          </select>
          ${hasFilters ? `<button class="btn sec sm toolbar-reset" data-act="clear-filter" title="Rimuovi ricerca e filtro">× Azzera filtri</button>` : ''}
        </div>
        ${content}
    </section>`;
}

/* ====== DASHBOARD ====== */
// Prima schermata del portale: cosa c'è da fare adesso, cosa parte a breve e
// dove il flusso è fermo. Legge l'elenco già filtrato per profilo (e per
// cliente, se scelto in header), quindi le stesse tabelle servono a Manager,
// PMO, Pentester, Auditor e Cliente.
const DASHBOARD_PILL = {
  action: 'action',
  waiting: 'warn',
  wait: 'warn',
  progress: 'info',
  done: 'ok',
  blocked: 'mute',
  neutral: 'mute'
};
const PHASES = [
  ['Setup', 'Setup'],
  ['Docs', 'Documenti'],
  ['Scope', 'Scope'],
  ['Planning', 'Pianificazione'],
  ['Reachability', 'Raggiungibilità'],
  ['Scheduled', 'Pianificato'],
  ['Running', 'In esecuzione'],
  ['Reporting', 'Report'],
  ['Retest', 'Retest'],
  ['RetestReporting', 'Report del retest'],
  ['Done', 'Concluso']
];

function plural(count, one, many) {
  return `${count} ${count === 1 ? one : many}`;
}

function dashPill([text, kind]) {
  return pill([text, DASHBOARD_PILL[kind] || kind || 'mute']);
}

function dashAge(e) {
  const s = actionState(e);
  if (!s || (s.kind !== 'action' && s.kind !== 'waiting')) return 0;
  return daysSince(s.since) || 0;
}

// Giorni all'avvio: negativo se la data è già passata.
function dashDaysToStart(e) {
  if (!e.periodStart) return null;
  const start = new Date(String(e.periodStart).substring(0, 10) + 'T00:00:00');
  if (Number.isNaN(start.getTime())) return null;
  const now = new Date(today() + 'T00:00:00');
  return Math.round((start - now) / 86400000);
}

// Engagement: nome, tipo e identificativo, come nelle altre tabelle.
function dashEngCell(e) {
  return `<td class="name dash-eng"><b>${esc(e.name)}</b><span>${typeBadge(e.type)} ${esc(e.id)}</span></td>`;
}

function dashPanel(title, count, hint, body, tag = '') {
  return `<section class="kpi-panel${tag}">
    <div class="dash-panel-head"><h2>${esc(title)}</h2><span class="cnt">${count}</span></div>
    ${hint ? `<p class="hint">${hint}</p>` : ''}
    ${body}
  </section>`;
}

// Riga-card della Dashboard: la stessa grammatica della scheda engagement
// (nome e cliente in testa, fascia con stato, persone reali e meta a destra)
// al posto delle tabelle dense.
function dashEngRow(e, opts = {}) {
  const client = isClient()
    ? ''
    : `<span class="eng-row-cli">${clientChip(clientFor(e), { still: true })}</span>`;
  const tab = opts.tab ? ` data-tab="${esc(opts.tab)}"` : '';

  return `<article class="eng-row${opts.late ? ' is-late' : ''}"
      data-act="${opts.act || 'open'}" data-id="${esc(e.id)}"${tab}
      role="link" tabindex="0"
      title="Apri ${esc(e.name)}${opts.tab ? ' sul passo da completare' : ''}">
    <div class="eng-row-head">
      ${typeBadge(e.type)}
      <b class="eng-row-name">${esc(e.name)}</b>
      <span class="eng-row-id">${esc(e.id)}</span>
      ${client}
      <span class="eng-row-go" aria-hidden="true">→</span>
    </div>
    <div class="hero-band eng-row-band">
      ${objState(e, { days: !!opts.days })}
      ${taskOwner(e, { compact: true })}
      ${opts.notes || ''}
      ${opts.meta ? `<span class="eng-row-meta">${opts.meta}</span>` : ''}
    </div>
  </article>`;
}

function dashEmptyRow(cols, text) {
  return `<tr><td colspan="${cols}"><div class="empty">${esc(text)}</div></td></tr>`;
}

// 1. Richieste da gestire: le azioni aperte per il profilo attivo.
function dashRequestsHTML() {
  const list = (state.list || [])
    .filter(e => (actionState(e) || {}).kind === 'action')
    .sort((a, b) => dashAge(b) - dashAge(a) || String(a.name).localeCompare(String(b.name)));

  const rows = list.map(e => {
    const s = actionState(e) || {};
    const start = dashDaysToStart(e);

    return dashEngRow(e, {
      act: 'open-action',
      tab: s.targetTab,
      days: true,
      late: dashAge(e) >= STALE_DAYS,
      notes: `<span class="band-note">${esc(s.label || 'Richiesta aperta')}</span>`,
      meta: `${start === null
        ? ''
        : `<span class="row-run${start < 0 ? ' late' : ''}">avvio ${esc(fmt(e.periodStart))}</span>`}${phaseCell(e)}`
    });
  }).join('');

  const empty = state.role === 'Auditor'
    ? 'Profilo di sola lettura: nessuna richiesta da gestire.'
    : 'Nessuna richiesta aperta per il tuo profilo.';
  const stale = list.some(e => dashAge(e) >= STALE_DAYS)
    ? ` In rosso oltre ${STALE_DAYS} giorni.`
    : '';

  return dashPanel(
    'Richieste da gestire',
    list.length,
    `Cosa aspetta il tuo profilo, dalla richiesta più vecchia: la riga apre il passo da completare.${stale}`,
    `<div class="eng-list">${rows || `<div class="empty">${esc(empty)}</div>`}</div>`);
}

// 2. Prossimi avvii: date accettate da qui in avanti, con i segnali che
//    possono far slittare la partenza.
function dashStartsHTML() {
  const reference = today();
  const upcoming = (state.list || [])
    .filter(e => e.periodStart && String(e.periodStart).substring(0, 10) >= reference)
    .sort((a, b) => String(a.periodStart).localeCompare(String(b.periodStart)));
  const openDue = id => (state.due || [])
    .filter(item => item.engagementId === id && !item.sentToday);

  const rows = upcoming.slice(0, 10).map(e => {
    const s = actionState(e) || {};
    const days = dashDaysToStart(e) ?? 0;
    const alert = e.preparationAlert || null;
    const missing = (alert && alert.missing ? alert.missing : [])
      .map(item => item === 'scope' ? 'Scope' : 'Credenziali');
    const flags = [];

    if (missing.length) {
      flags.push(`<span class="pill p-negative" title="Preparazione incompleta a ridosso dell'avvio">Manca ${esc(missing.join(' e '))}</span>`);
    }
    if (s.kind === 'action') {
      flags.push(`<span class="pill p-action" title="${esc(s.label || '')}">Richiesta aperta</span>`);
    }
    if (e.pendingProposal) {
      flags.push('<span class="pill p-warn">Date da approvare</span>');
    }
    const due = openDue(e.id);
    if (due.length) {
      flags.push(`<span class="pill p-warn" title="Solleciti da inviare">${due.length} sollecit${due.length === 1 ? 'o' : 'i'}</span>`);
    }

    const urgent = !!alert || days <= 3;
    const dayKind = alert ? 'negative' : days <= 7 ? 'wait' : 'neutral';

    return dashEngRow(e, {
      days: true,
      late: urgent,
      notes: `<span class="dash-flags">${flags.join('') || '<span class="dash-mute">Nessuna criticità</span>'}</span>`,
      meta: `${periodBox(e.periodStart, e.periodEnd, { id: e.id, name: e.name })}
        ${dashPill([days === 0 ? 'oggi' : days === 1 ? 'domani' : `${days} gg`, dayKind])}
        ${phaseCell(e)}`
    });
  }).join('');

  return dashPanel(
    'Prossimi avvii',
    upcoming.length,
    'Date accettate da qui in avanti: la fascia segnala cosa può far slittare la partenza.',
    `<div class="eng-list">${rows || `<div class="empty">${esc('Nessuna data di avvio pianificata.')}</div>`}</div>`);
}

// 3. In attesa di terzi: il flusso non dipende dal profilo attivo.
function dashWaitingHTML() {
  const list = (state.list || [])
    .filter(e => (actionState(e) || {}).kind === 'waiting')
    .sort((a, b) => dashAge(b) - dashAge(a));

  const rows = list.map(e => {
    const s = actionState(e) || {};
    return dashEngRow(e, {
      days: true,
      notes: `<span class="band-note">${esc(s.label || '—')}</span>`,
      meta: phaseCell(e)
    });
  }).join('');

  return dashPanel(
    'In attesa di terzi',
    list.length,
    'Cosa aspetta cliente, PMO, Manager o Pentester: dalla più vecchia.',
    `<div class="eng-list">${rows || `<div class="empty">${esc('Nessuna attesa aperta.')}</div>`}</div>`);
}

// 4. Dove sono gli engagement: conteggio per fase del workflow.
function dashPhasesHTML() {
  const list = state.list || [];
  const counts = new Map(PHASES.map(([key]) => [key, 0]));
  const actions = new Map();

  for (const e of list) {
    if (!counts.has(e.phase)) continue;
    counts.set(e.phase, counts.get(e.phase) + 1);
    if ((actionState(e) || {}).kind === 'action') {
      actions.set(e.phase, (actions.get(e.phase) || 0) + 1);
    }
  }

  const max = Math.max(1, ...counts.values());
  const rows = PHASES
    .filter(([key]) => (counts.get(key) || 0) > 0)
    .map(([key, label]) => {
      const count = counts.get(key) || 0;
      const open = actions.get(key) || 0;
      return `<div class="dash-phase">
        <b title="${esc(label)}">${esc(label)}</b>
        <span class="kpi-bar"><i style="width:${Math.round((count / max) * 100)}%"></i></span>
        <span class="dash-phase-num">${count}</span>
        <span class="dash-phase-note">${open ? `${open} da gestire` : ''}</span>
      </div>`;
    }).join('');

  return dashPanel(
    'Engagement per fase',
    list.length,
    'Distribuzione del portafoglio visibile: la nota conta le richieste aperte in quella fase.',
    rows ? `<div class="dash-phases">${rows}</div>` : '<div class="empty">Nessun engagement.</div>');
}

// 5. Portafoglio per cliente (Manager, PMO e profili interni).
function dashClientsHTML() {
  const map = new Map();

  for (const e of state.list || []) {
    const row = map.get(e.clientId) || {
      id: e.clientId, name: e.clientName,
      total: 0, action: 0, waiting: 0, late: 0, next: null
    };
    const kind = (actionState(e) || {}).kind;
    row.total += 1;
    if (kind === 'action') row.action += 1;
    if (kind === 'waiting') row.waiting += 1;
    if (dashAge(e) >= STALE_DAYS) row.late += 1;
    if (e.periodStart && String(e.periodStart).substring(0, 10) >= today() &&
        (!row.next || e.periodStart < row.next)) {
      row.next = e.periodStart;
    }
    map.set(e.clientId, row);
  }

  const rows = [...map.values()]
    .sort((a, b) => b.total - a.total || String(a.name || '').localeCompare(String(b.name || '')))
    .map(row => `<tr data-act="dashboard-client" data-client="${esc(row.id)}" title="Filtra la dashboard su ${esc(row.name)}">
      <td class="name">${clientChip(row.id)}</td>
      <td><span class="kpi-num">${row.total}</span></td>
      <td>${row.action ? `<span class="pill p-action">${row.action}</span>` : '<span class="dash-mute">–</span>'}</td>
      <td>${row.waiting ? `<span class="pill p-warn">${row.waiting}</span>` : '<span class="dash-mute">–</span>'}</td>
      <td>${row.late ? `<span class="pill p-negative">${row.late}</span>` : '<span class="dash-mute">–</span>'}</td>
      <td>${row.next ? fmt(row.next) : '<span class="dash-mute">–</span>'}</td>
    </tr>`).join('');

  return dashPanel(
    'Engagement per cliente',
    map.size,
    'Carico e criticità per cliente: la riga imposta il filtro globale.',
    `<div class="tablewrap"><table class="kpi-table dash-table">
      <caption class="sr-only">Engagement per cliente</caption>
      <thead><tr><th>Cliente</th><th>Totale</th><th>Da gestire</th><th>In attesa</th><th>Fermi</th><th>Prossimo avvio</th></tr></thead>
      <tbody>${rows || dashEmptyRow(6, 'Nessun cliente visibile.')}</tbody>
    </table></div>`);
}

// 6. Portafoglio per tipo di attività: utile a chi non segue l'intero team.
function dashTypesHTML() {
  const map = new Map();

  for (const e of state.list || []) {
    const key = e.type || 'unknown';
    const row = map.get(key) || { key, total: 0, active: 0, action: 0, late: 0 };
    const kind = (actionState(e) || {}).kind;
    row.total += 1;
    if (e.phase !== 'Done') row.active += 1;
    if (kind === 'action') row.action += 1;
    if (dashAge(e) >= STALE_DAYS) row.late += 1;
    map.set(key, row);
  }

  const rows = [...map.values()]
    .sort((a, b) => b.total - a.total || a.key.localeCompare(b.key))
    .map(row => `<tr>
      <td class="name"><b>${typeBadge(row.key)} ${esc(typeLabel(row.key))}</b></td>
      <td>${row.total}</td>
      <td>${row.active}</td>
      <td>${row.action ? `<span class="pill p-action">${row.action}</span>` : '<span class="dash-mute">–</span>'}</td>
      <td>${row.late ? `<span class="pill p-negative">${row.late}</span>` : '<span class="dash-mute">–</span>'}</td>
    </tr>`).join('');

  return dashPanel(
    'Engagement per tipo',
    map.size,
    'Come si distribuisce il portafoglio visibile tra i tipi di attività.',
    `<div class="tablewrap"><table class="kpi-table dash-table">
      <caption class="sr-only">Engagement per tipo di attività</caption>
      <thead><tr><th>Tipo</th><th>Totale</th><th>Attivi</th><th>Da gestire</th><th>Fermi</th></tr></thead>
      <tbody>${rows || dashEmptyRow(5, 'Nessun engagement.')}</tbody>
    </table></div>`);
}

// template (Amministrazione › Template mail) ed è bilingue.
function solicitationDetail(item) {
  if (item.daysToStart !== null && item.daysToStart !== undefined) {
    const days = item.daysToStart;
    return days > 0
      ? `avvio tra ${plural(days, 'giorno', 'giorni')}`
      : days === 0
        ? 'avvio oggi'
        : `avvio superato di ${plural(-days, 'giorno', 'giorni')}`;
  }
  return item.ruleKey === 'rep'
    ? `${plural(item.days, 'giorno lavorativo', 'giorni lavorativi')} di ritardo`
    : `${plural(item.days, 'giorno', 'giorni')} in revisione`;
}

// Etichetta con cui il server indica il destinatario di un sollecito.
const recipientLabel = role => (role === 'Client' ? 'Cliente' : role);

// Destinatario vero: i nomi dietro il ruolo. Il clic apre l'elenco completo
// con le email, così il "+1" non nasconde nessuno.
function recipientCell(item) {
  const owners = (Array.isArray(item.owners) ? item.owners : [])
    .filter(owner => owner && owner.name);
  if (!owners.length) return `<span class="hint">${esc(item.recipient || '')}</span>`;

  const title = owners
    .map(owner => (owner.email ? `${owner.name} <${owner.email}>` : owner.name))
    .join(', ');
  const extra = owners.length > 1 ? ` <span class="cnt">+${owners.length - 1}</span>` : '';
  return `<button class="recipient-btn" data-act="recipients" data-key="${esc(item.key)}"
    title="${esc(title)}" aria-haspopup="dialog">${esc(owners[0].name)}${extra}<span class="recipient-caret" aria-hidden="true">▾</span></button>`;
}

// Elenco completo dei destinatari di un sollecito (nome + email).
function showRecipients(owners, label) {
  const opener = document.activeElement;
  const rows = owners.map(owner => `<li class="rcpt-item">
      <span class="avatar">${esc(initialsOf(owner.name))}</span>
      <span><b>${esc(owner.name)}</b><span>${esc(owner.email || '')}</span></span>
    </li>`).join('');

  $('#modal').innerHTML = `
    <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="rcpt-title">
      <h2 id="rcpt-title">Destinatari</h2>
      <p class="sub" style="margin-bottom:12px">${esc(label || '')}</p>
      <ul class="rcpt-list">${rows}</ul>
      <div class="mact"><button class="btn pri" data-modal="rcpt-close">Chiudi</button></div>
    </div>`;
  $('#modal').classList.add('show');

  const close = () => {
    $('#modal').classList.remove('show');
    $('#modal').innerHTML = '';
    document.removeEventListener('keydown', onKey);
    if (opener && opener.isConnected && opener.focus) opener.focus();
  };
  const onKey = event => { if (event.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  $('#modal').querySelector('[data-modal="rcpt-close"]').onclick = close;
  setTimeout(() => $('#modal').querySelector('[data-modal="rcpt-close"]').focus(), 30);
}
