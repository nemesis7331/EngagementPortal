const ADMIN_TABS = [
  ['users', 'UT', 'Utenti'],
  ['clients', 'CL', 'Clienti'],
  ['mailing', 'ML', 'Mailing list'],
  ['templates', 'TP', 'Template mail'],
  ['solicitations', 'SO', 'Solleciti'],
  ['settings', 'ST', 'Impostazioni']
];

async function loadAdmin() {
  if (!canUseAdminTab(state.adminTab)) return;

  state.adminError = null;

  try {
    // Anagrafiche complete solo dove servono: il Pentester non può leggerle.
    if (state.adminTab === 'users' || state.adminTab === 'clients') {
      if (!state.clients.length) await loadClients();
      if (!state.users.length) await loadUsers();
    }

    if (state.adminTab === 'activities') {
      state.activityTypes = await api('/api/activity-types?' + qs());
    }

    if (state.adminTab === 'mailing') {
      state.adminMailing = await api('/api/admin/mailing-lists?' + qs());
      if (!state.adminMailing.some(item => item.id === state.adminMailingId))
        state.adminMailingId = state.adminMailing[0]?.id || '';
      // Il testo delle email dell'engagement si modifica qui: serve la
      // versione corrente del livello engagement.
      await loadMailingTemplates(true);
    }

    if (state.adminTab === 'templates') {
      state.adminTemplates = await api('/api/admin/mail-templates?' + qs());
    }

    if (state.adminTab === 'solicitations') {
      state.rules = await api('/api/solicitations/rules?' + qs());
    }
  } catch (error) {
    state.adminError = error.message;
  }

  renderAdmin();
}

// Carica il livello engagement dei template, solo per liste di tipo engagement.
async function loadMailingTemplates(force) {
  const list = state.adminMailing.find(item => item.id === state.adminMailingId);

  if (!list || list.scope !== 'engagement') {
    state.adminMailingTemplates = null;
    state.adminMailingTemplateType = '';
    return;
  }

  if (!force && state.adminMailingTemplates?.id === list.ownerId) return;

  try {
    state.adminMailingTemplates = await api(
      `/api/admin/mail-templates/engagement/${encodeURIComponent(list.ownerId)}?` + qs());
  } catch {
    state.adminMailingTemplates = null;
  }
}

// Salvataggio automatico della riga del catalogo: niente pulsante "Salva".
// Si aggiorna la copia in memoria senza ridisegnare, così il focus resta.
async function saveActivityRow(row) {
  if (!row) return;

  const key = row.dataset.key;
  const body = {
    label: (row.querySelector('[data-f="label"]')?.value || '').trim(),
    short: (row.querySelector('[data-f="short"]')?.value || '').trim(),
    description: (row.querySelector('[data-f="desc"]')?.value || '').trim(),
    retestPlanned: !!row.querySelector('[data-f="retest"]')?.checked,
    deliverableTypes: [...row.querySelectorAll('[data-f="kind"]:checked')].map(box => box.value)
  };

  const badge = row.querySelector('.act-state');
  const segnala = text => {
    if (!badge) return;
    badge.textContent = text;
    badge.classList.toggle('on', !!text);
    clearTimeout(badge._t);
    if (text) {
      badge._t = setTimeout(() => {
        badge.textContent = '';
        badge.classList.remove('on');
      }, 1600);
    }
  };

  try {
    await api(`/api/activity-types/${encodeURIComponent(key)}?` + qs(), {
      method: 'PUT',
      body: JSON.stringify(body)
    });
    const item = (state.activityTypes || []).find(type => type.key === key);
    if (item) Object.assign(item, body);
    segnala('Salvato');
  } catch (error) {
    toast(error.message);
    state.activityTypes = await api('/api/activity-types?' + qs());
    renderAdmin();
  }
}

/* ====== MAILING LIST ====== */
// Filtri in alto (ricerca su cliente, partecipanti, tipo e engagement), elenco
// scorribile e dettaglio modificabile sotto la lista.
const MAILING_KIND_LABEL = { notifications: 'Notifiche', deliverables: 'Deliverables' };
// Quali template vengono inviati a ciascuna lista: gli altri restano in
// Amministrazione › Template mail.
const MAILING_TEMPLATE_TYPES = {
  notifications: ['start', 'end', 'solrep', 'solrev', 'solcred3', 'solcred2', 'solmanual'],
  deliverables: ['deliver', 'retestreport']
};

function mailingSearchText(item) {
  return normText([
    item.clientName,
    item.engagementId,
    item.engagementName,
    item.ownerName,
    item.kindLabel,
    MAILING_KIND_LABEL[item.kind],
    item.scope === 'client' ? 'base cliente' : 'engagement',
    ...(item.recipients || []).flatMap(entry => [entry.name, entry.email, entry.organization]),
    ...(item.base || []).flatMap(entry => [entry.name, entry.email, entry.organization])
  ].join(' '));
}

function mailingInitials(item) {
  const source = item.scope === 'client' ? item.clientName : (item.engagementId || item.ownerName);
  return initialsOf(source);
}

function mailingRecipientPreview(item) {
  const all = [...(item.base || []), ...(item.recipients || [])];
  const names = all.slice(0, 3).map(entry => entry.name).join(', ');
  return names + (all.length > 3 ? ` +${all.length - 3}` : '');
}

function adminMailingHTML() {
  const query = normText(state.adminMailingQuery);
  const kindFilter = state.adminMailingKind || 'all';
  const scopeFilter = state.adminMailingScope || 'all';

  const lists = state.adminMailing.filter(item =>
    (!query || mailingSearchText(item).includes(query)) &&
    (!state.clientId || item.clientId === state.clientId) &&
    (kindFilter === 'all' || item.kind === kindFilter) &&
    (scopeFilter === 'all' || item.scope === scopeFilter));

  const selected = state.adminMailing.find(item => item.id === state.adminMailingId) || lists[0] || null;

  if (selected) state.adminMailingId = selected.id;

  const rows = lists.length
    ? lists.map(item => `<button class="ml-item ${selected?.id === item.id ? 'on' : ''}" data-act="admin-select-list" data-id="${esc(item.id)}">
        ${item.scope === 'engagement'
          ? engPill({
              type: item.engagementType,
              name: item.engagementName,
              clientId: item.clientId,
              clientName: item.clientName,
              stepIndex: item.stepIndex,
              stepCount: item.stepCount
            })
          : `<span class="ml-av">${esc(mailingInitials(item))}</span>
             <span class="ml-who"><b>${esc(item.clientName)}</b><small>Base cliente · ${esc(mailingRecipientPreview(item))}</small></span>`}
        <span class="ml-end">
          <span class="badge ${item.kind === 'notifications' ? 'int' : 'ext'}">${esc(item.kindLabel)}</span>
          <span class="cntpill" title="${(item.effective || []).length} indirizzi effettivi">${(item.effective || []).length}</span>
        </span>
      </button>`).join('')
    : '<div class="empty">Nessuna mailing list con questi filtri.</div>';

  return `<div class="admin-mm">
    <div class="ml-filters">
      <div class="search">
        <svg class="search-ico" aria-hidden="true"><use href="#i-search"></use></svg>
        <input type="search" id="admin-mail-search" value="${esc(state.adminMailingQuery)}"

  const canManage = canEditEngagementTemplate();
  const inherited = active.inherited || {};

  return `<section class="ml-block">

/* ====== CALENDARIO ====== */
function calYmd(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function calDate(key) {
  const [y, m, d] = String(key).slice(0, 10).split('-').map(Number);
  return new Date(y, (m || 1) - 1, d || 1);
}

function calLongDate(d) {
  return new Intl.DateTimeFormat('it-IT', { day: 'numeric', month: 'long', year: 'numeric' }).format(d);
}

function calendarEvents(list) {
  const events = [];
  const seen = new Set();

  for (const e of list) {
    const planned = e.acceptedProposal ||
      (e.periodStart ? { startDate: e.periodStart, endDate: e.periodEnd } : null);

    if (planned && planned.startDate) {
      events.push({
        id: e.id,
        name: e.name,
        client: e.clientName,
        kind: 'planned',
        start: String(planned.startDate).slice(0, 10),
        end: String(planned.endDate || planned.startDate).slice(0, 10),
        // Engagement completo: al calendario servono tipo, cliente e passo.
        ref: e
      });
    }

    for (const p of (e.proposals || [])) {
      if (p.status !== 'Pending' || !p.startDate) continue;
      const start = String(p.startDate).slice(0, 10);
      const end = String(p.endDate || p.startDate).slice(0, 10);
      const key = `${e.id}|${start}|${end}`;
      if (seen.has(key)) continue;
      seen.add(key);
      events.push({
        id: e.id,
        name: e.name,
        client: e.clientName,
        kind: 'proposed',
        start,
        end,
        from: p.from,
        ref: e
      });
    }
  }

  return events.filter(ev => ev.end >= ev.start);
}

/* ====== CALENDARIO · TIMELINE ====== */
const CAL_TIMELINE_MONTHS = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];

function calTimelineRange(focusEvents = []) {
  const now = new Date();
  // La timeline parte dal lunedì della settimana corrente: si allinea con il
  // mese e con le finestre che iniziano a inizio settimana.
  let start = new Date(
    now.getFullYear(), now.getMonth(),
    now.getDate() - ((now.getDay() + 6) % 7));
  let end = new Date(now.getFullYear(), now.getMonth() + 2, 0);

  // Con un engagement evidenziato si inquadra il suo periodo, anche se è nel
  // passato: dal lunedì della settimana d'inizio al mese successivo alla fine.
  if (focusEvents.length) {
    const first = focusEvents.reduce((min, ev) => (ev.start < min ? ev.start : min), focusEvents[0].start);
    const last = focusEvents.reduce((max, ev) => (ev.end > max ? ev.end : max), focusEvents[0].end);
    const from = calDate(first);
    const to = calDate(last);
    start = new Date(from.getFullYear(), from.getMonth(), from.getDate() - ((from.getDay() + 6) % 7));
    end = new Date(to.getFullYear(), to.getMonth() + 2, 0);

    // Periodi molto lunghi: la finestra resta leggibile.
    const span = Math.round((end - start) / 86400000) + 1;
    if (span > 180) end = new Date(start.getFullYear(), start.getMonth(), start.getDate() + 179);
  }

  const days = Math.round((end - start) / 86400000) + 1;
  return { start, end, startKey: calYmd(start), endKey: calYmd(end), days };
}

function calDayIndex(range, key) {
  return Math.round((calDate(key) - range.start) / 86400000);
}

function calEventKey(ev) {
  return `${ev.id}|${ev.kind}|${ev.start}`;
}

// Engagement dietro un evento: la copia nella lista ha tipo, cliente e passo,
// mentre gli eventi nati dai dettagli portano solo i dati minimi.
function calEngagement(ev) {
  if (!ev) return null;
  if (ev.ref && ev.ref.stepCount !== undefined) return ev.ref;
  return (state.list || []).find(item => item.id === ev.id) || ev.ref || null;
}

// Giorni lavorativi (lun-ven) fra due date, estremi inclusi.
function calWorkingDays(startKey, endKey) {
  const start = calDate(startKey);
  const end = calDate(endKey);
  let count = 0;
  for (let day = new Date(start); day <= end; day.setDate(day.getDate() + 1)) {
    if (day.getDay() !== 0 && day.getDay() !== 6) count += 1;
  }
  return count;
}

function calRelative(startKey, endKey, todayKey) {
  const day = 86400000;
  if (todayKey < startKey) {
    return `avvio tra ${plural(Math.round((calDate(startKey) - calDate(todayKey)) / day), 'giorno', 'giorni')}`;
  }
  if (todayKey > endKey) return 'concluso';
  return `in corso da ${plural(Math.round((calDate(todayKey) - calDate(startKey)) / day) + 1, 'giorno', 'giorni')}`;
}

// Popover ancorato alla barra selezionata (proposta C): pochi fatti utili e
// le azioni, senza occupare spazio fisso sotto la timeline.

  const eng = calEngagement(ev);

  const age = s && s.since ? daysSince(s.since) : null;
  const phase = eng
    ? ((PHASES.find(([key]) => key === eng.phase) || [])[1] || eng.phase || '')
    : '';
  const total = eng ? Number(eng.stepCount) || 0 : 0;
  const step = total ? `${Math.min(Number(eng.stepIndex) || 0, total)}/${total}` : '';
  const reports = eng ? Number(eng.reportCount) || 0 : 0;

  const now = eng
    ? (owner ? `In attesa di ${owner}` : (s?.label || stateLabel))

  const workDays = calWorkingDays(ev.start, ev.end);

  return `<div class="cal-pop" role="dialog" aria-label="Dettaglio engagement" data-start="${esc(ev.start)}" data-end="${esc(ev.end)}" data-kind="${esc(ev.kind)}">
    <div class="cp-head">

    </div>
    <div class="cp-meta">

      ${clientMark(client)}

      <span class="cp-type">${esc(typeLabel(eng?.type || ev.type || ''))}</span>
      ${ev.kind === 'proposed' ? `<span class="cp-kind">${esc(ev.from === 'Client' ? 'Proposta del cliente' : (ev.from === 'Provider' || ev.from === 'PMO') ? 'Proposta del PMO' : ev.from ? `Proposto da ${ev.from}` : 'Proposta')}</span>` : ''}
    </div>
    <div class="cp-rows">
      <div class="cp-row"><span>Periodo</span><b>${fmt(ev.start)} → ${fmt(ev.end)}${workDays ? ` · ${workDays} gg lav.` : ''}</b></div>
      <div class="cp-row"><span>Ora</span><b>${esc(calRelative(ev.start, ev.end, todayKey))}</b></div>
      ${eng ? `<div class="cp-row"><span>Fase</span><b>${esc(phase)}${step ? ` · ${step}` : ''}</b></div>` : ''}
      <div class="cp-row"><span>Adesso</span><b>${esc(now)}${age ? ` · fermo da ${plural(age, 'giorno', 'giorni')}` : ''}</b></div>
      ${eng ? `<div class="cp-row"><span>Deliverable</span><b>${reports ? `${published} di ${reports} pubblicati` : 'Nessun deliverable'}</b></div>` : ''}
    </div>
    <div class="cp-foot">
      <button class="btn pri sm" data-act="open-action" data-id="${esc(ev.id)}" data-tab="${ev.kind === 'proposed' ? 'plan' : ''}">Apri engagement</button>
      <button class="btn sec sm" data-act="cal-select" data-key="">Chiudi</button>
    </div>

// La scheda si aggancia alla barra: sotto, o sopra se non c'è spazio.
function positionCalendarPop() {
  const pop = document.querySelector('.cal-pop');
  if (!pop) return;
  const card = pop.closest('.tl-card');
  const bar = card && card.querySelector('.tl-bar.sel');
  if (!card || !bar) return;
  const cr = card.getBoundingClientRect();
  const br = bar.getBoundingClientRect();
  const pw = pop.offsetWidth;
  const ph = pop.offsetHeight;
  let left = br.left - cr.left;
  if (left + pw > cr.width - 8) left = br.right - cr.left - pw;
  left = Math.max(8, Math.min(left, Math.max(8, cr.width - pw - 8)));
  let top = br.bottom - cr.top + 6;
  if (br.bottom + ph + 12 > window.innerHeight) top = br.top - cr.top - ph - 6;
  pop.style.left = `${Math.round(left)}px`;
  pop.style.top = `${Math.round(Math.max(6, top))}px`;
}

  const detail = state.calendarDetail;
  if (!pop || !detail) return;

  const root = document.querySelector('.cal-pop');
  const start = root?.dataset.start || '';
  const end = root?.dataset.end || '';
  const proposals = detail.engagement?.proposals || [];
  const pending = proposals.find(proposal =>
    proposal.status === 'Pending' &&
    String(proposal.startDate || '').slice(0, 10) === start &&
    String(proposal.endDate || proposal.startDate || '').slice(0, 10) === end);
  const decide = pending && state.role === 'Manager'
    ? `<button class="decide yes sm" data-act="cal-decide" data-id="${esc(detail.engagement.id)}" data-pid="${esc(pending.id)}" data-accept="1">Approva</button>
       <button class="decide no sm" data-act="cal-decide" data-id="${esc(detail.engagement.id)}" data-pid="${esc(pending.id)}" data-accept="0">Rifiuta</button>`
    : '';

  const s = detail.solicitation;
  const owners = (s?.owners || []).filter(owner => owner && owner.name);
  const who = owners.length ? owners[0].name : (s?.recipient || '');
  const solicit = s?.canSend
    ? `<button class="btn sec sm" data-act="cal-solicit" data-id="${esc(detail.engagement.id)}">Sollecita${who ? ` ${esc(who)}` : ''}</button>`
    : '';

  pop.innerHTML = `
    <button class="btn pri sm" data-act="open-action" data-id="${esc(detail.engagement.id)}">Apri engagement</button>
    ${solicit}
    ${decide}
    <button class="btn sec sm" data-act="cal-select" data-key="">Chiudi</button>`;
}

function renderCalendarTimeline(events, todayKey, counts, range, focus = '') {
  const n = range.days;
  const filter = state.calendarFilter || 'all';

  // Normale: da oggi in avanti. Con l'engagement evidenziato si mostra tutto
  // il periodo inquadrato, anche ciò che è già passato.
  const visible = events.filter(ev => ev.start <= range.endKey && ev.end >= range.startKey &&
    (focus || ev.end >= todayKey));
  const rows = visible
    .filter(ev => filter === 'all' || ev.kind === filter)
    .sort((a, b) => a.start.localeCompare(b.start) || String(a.name).localeCompare(String(b.name)));

  const selected = rows.find(ev => calEventKey(ev) === state.calendarSel) || null;

  // Intestazione mesi: ogni mese occupa le sue colonne-giorno.
  const months = [];
  const firstMonthDays = new Date(range.start.getFullYear(), range.start.getMonth() + 1, 0).getDate()
    - range.start.getDate() + 1;
  for (let cursor = new Date(range.start.getFullYear(), range.start.getMonth(), 1); cursor <= range.end; cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1)) {
    const year = cursor.getFullYear();
    const month = cursor.getMonth();
    const full = new Date(year, month + 1, 0).getDate();
    const span = Math.min(
      n - months.reduce((sum, m) => sum + m.span, 0),
      month === range.start.getMonth() && year === range.start.getFullYear() ? firstMonthDays : full
    );
    months.push({ label: `${CAL_TIMELINE_MONTHS[month]} ${String(year).slice(2)}`, span });
  }

  const dayCells = [];
  const weekendSpans = [];
  for (let i = 0; i < n; i += 1) {
    const date = new Date(range.start.getFullYear(), range.start.getMonth(), range.start.getDate() + i);
    const key = calYmd(date);
    const weekend = date.getDay() === 0 || date.getDay() === 6;
    const cls = [
      'tl-day',
      date.getDay() === 1 ? 'mon' : '',
      weekend ? 'we' : '',
      key === todayKey ? 'today' : ''
    ].filter(Boolean).join(' ');
    dayCells.push(`<div class="${cls}" title="${esc(fmt(key))}">${date.getDate()}</div>`);
    if (weekend) {
      const left = (i / n) * 100;
      const width = 100 / n;
      weekendSpans.push(`<span class="tl-weekend${i === 0 ? ' first' : ''}" aria-hidden="true" style="left:${left.toFixed(4)}%;width:${width.toFixed(4)}%"></span>`);
    }
  }
  const weekendBands = weekendSpans.join('');

  const rowHtml = rows.map(ev => {
    const from = Math.max(0, calDayIndex(range, ev.start));
    const to = Math.min(n - 1, calDayIndex(range, ev.end));
    const span = Math.max(1, to - from + 1);
    const kindLabel = ev.kind === 'planned' ? 'Pianificato' : 'Proposto';
    const key = calEventKey(ev);
    const sel = selected === ev ? ' sel' : '';
    const running = ev.kind === 'planned' && ev.start < todayKey ? ' inprogress' : '';
    const isFocus = !!focus && ev.id === focus;

    // Dalla pastiglia engagement: tipo, icona cliente e anello di avanzamento.
    const eng = calEngagement(ev);
    const late = !!eng && daysSince((actionState(eng) || {}).since) >= STALE_DAYS;
    const client = eng ? clientFor(eng) : { id: '', name: ev.client || '' };

    return `<div class="tl-row${isFocus ? ' focus' : ''}" data-eng="${esc(ev.id)}">
      <button class="tl-label" data-act="cal-select" data-key="${esc(key)}" title="${esc(ev.name)} · ${esc(ev.client || '')}">
        <span class="tl-main">
          ${eng ? typeBadge(eng.type) : ''}
          <b>${esc(ev.name)}</b>
          ${eng ? progressRing(eng, { late }) : ''}
        </span>
        <small class="tl-sub">
          ${clientMark(client)}
          <span class="tl-client">${esc(ev.client || client.name || '')}</span>
          <span class="tl-kind ${ev.kind}"><i></i>${kindLabel}</span>
        </small>
      </button>
      <div class="tl-track" style="--n:${n}">
        ${weekendBands}
        <button class="tl-bar ${ev.kind}${sel}${running}${isFocus ? ' focus' : ''}" data-act="cal-select" data-key="${esc(key)}"
          style="grid-column:${from + 1}/span ${span}"
          title="${esc(ev.name)} · ${esc(ev.client)} · ${kindLabel} · ${fmt(ev.start)} – ${fmt(ev.end)}">${esc(ev.name)}</button>
      </div>
    </div>`;
  }).join('');

  const pop = selected ? calPopHtml(selected, todayKey) : '';

  return `<div class="tl-card">
    <div class="tl-toolbar">
      <span class="tl-range"><b>${fmt(range.startKey)}</b> – <b>${fmt(range.endKey)}</b></span>
      <div class="tl-filters" role="group" aria-label="Filtra gli eventi">
        ${[['all', 'Tutti'], ['planned', 'Pianificati'], ['proposed', 'Proposti']]
          .map(([value, label]) => `<button class="tl-filter" data-act="cal-filter" data-filter="${value}" aria-pressed="${filter === value}">${label} <b>${counts[value]}</b></button>`)
          .join('')}
      </div>
    </div>
    <div class="tl-scroll" style="--n:${n}">
      <div class="tl-axis">
        <div class="tl-axis-label">Engagement</div>
        <div class="tl-axis-track">
          <div class="tl-months">${months.map(m => `<div class="tl-month" style="grid-column:span ${m.span}">${m.label}</div>`).join('')}</div>
          <div class="tl-days">${dayCells.join('')}</div>
        </div>
      </div>
      ${rows.length ? rowHtml : '<div class="tl-empty">Nessun evento con questo filtro nel periodo.</div>'}
    </div>
    ${pop}
  </div>`;
}

function renderCalendar() {
  const now = new Date();
  const todayKey = calYmd(now);

  const all = [...calendarEvents(state.list || []), ...(state.calendarProposals || [])];
  const unique = [...new Map(all.map(ev => [`${ev.id}|${ev.kind}|${ev.start}|${ev.end}`, ev])).values()];

  // L'engagement arrivato da ?eng= viene evidenziato; se non ha eventi nel
  // calendario (o il codice non esiste) la vista resta quella normale.
  const focus = state.calendarFocus || '';
  const focusEvents = focus ? unique.filter(ev => ev.id === focus) : [];
  const activeFocus = focusEvents.length ? focus : '';
  const range = calTimelineRange(focusEvents);

  const visible = unique.filter(ev => ev.start <= range.endKey && ev.end >= range.startKey &&
    (activeFocus || ev.end >= todayKey));
  const planned = visible.filter(ev => ev.kind === 'planned').length;
  const proposed = visible.filter(ev => ev.kind === 'proposed').length;

  $('#app').innerHTML = `
    <div class="cal-head">
      <div>
        <p class="side-kicker">Portale</p>
        <h1>Calendario</h1>
        <p class="sub">${activeFocus
          ? `Periodo dell'engagement evidenziato · ${fmt(range.startKey)} – ${fmt(range.endKey)}`
          : `Da oggi a ${esc(calLongDate(range.end))}`} · ${state.clientId ? `cliente ${esc(clientLabel(state.clientId))}` : 'engagement visibili per il tuo profilo'}</p>
      </div>
    </div>
    ${state.error ? `<div class="errorbox"><span>${esc(state.error)}</span><button class="btn sec sm" data-act="nav" data-view="calendar">Riprova</button></div>` : ''}
    ${!visible.length ? '<div class="cal-empty">Nessun engagement proposto o pianificato nel periodo.</div>' : ''}
    ${renderCalendarTimeline(unique, todayKey, { all: visible.length, planned, proposed }, range, activeFocus)}
  `;

  // Porta subito in vista la riga evidenziata, una volta sola all'arrivo.
  if (state.calendarFocusPending) {
    state.calendarFocusPending = false;
    const row = document.querySelector('.tl-row.focus');
    if (row) requestAnimationFrame(() => row.scrollIntoView({ block: 'center', inline: 'center' }));
  }

  // La scheda del dettaglio segue la barra anche quando si scorre la timeline.
  positionCalendarPop();
  requestAnimationFrame(positionCalendarPop);
  const scroller = document.querySelector('.tl-scroll');
  if (scroller) scroller.addEventListener('scroll', positionCalendarPop, { passive: true });
}

function clientSameEmail(left, right) {
  return String(left || '').trim().toLowerCase() ===
    String(right || '').trim().toLowerCase();
}

// Una riga per persona: utenze, partecipanti del team e indirizzi senza
// account. L'appartenenza alle due liste si legge dal legame con la persona
// (personId) e, per le voci storiche, dall'email.
function clientPeople(client) {
  const notifications = client.distributionList || [];
  const deliverables = client.deliverablesDistributionList || [];

  const matches = (entry, person) =>
    (entry.personId && entry.personId === person.id) ||
    (!entry.personId && clientSameEmail(entry.email, person.email));

  const people = [];
  const seen = new Set();

  const add = (person, origin, role, organization) => {
    const key = String(person.email || '').trim().toLowerCase();
    // La stessa persona può essere utenza e partecipante (stessa email):
    // una riga sola, con la provenienza più forte.
    if (seen.has(key)) return;
    seen.add(key);
    people.push({
      id: person.id,
      name: person.name,
      email: person.email,
      origin,
      role,
      organization: organization || 'Cliente',
      inNotifications: notifications.some(entry => matches(entry, person)),
      inDeliverables: deliverables.some(entry => matches(entry, person))
    });
  };

  (client.users || []).forEach(user =>
    add(user, 'utenza', 'Referente cliente', 'Cliente'));

  (client.team || []).forEach(member =>
    add(member, 'team', member.role || 'Partecipante', member.organization));

  // Solo destinatari: voci di lista che non corrispondono a una persona.
  [...notifications, ...deliverables].forEach(entry => {
    const key = String(entry.email || '').trim().toLowerCase();
    if (!key) return;
    if (people.some(person => matches(entry, person))) return;
    if (seen.has('ext:' + key)) return;
    seen.add('ext:' + key);
    people.push({
      id: '',
      name: entry.name,
      email: entry.email,
      origin: 'mail',
      role: entry.organization || 'Cliente',
      organization: entry.organization || 'Cliente',
      inNotifications: notifications.some(item => clientSameEmail(item.email, entry.email)),
      inDeliverables: deliverables.some(item => clientSameEmail(item.email, entry.email))
    });
  });

  return people;
}

/* ====== ROUTING (URL normali) ====== */
// Ogni sezione ha una URL propria — /dashboard, /engagements, /engagements/{id}/{tab},
// /clients — così refresh, link diretti e tasti indietro/avanti funzionano. Il
// server serve index.html su qualunque percorso (fallback SPA), quindi gli URL
// sono "puliti", senza cancelletto. I vecchi link #/... restano validi.
const BASE_ROUTES = {
  dashboard: '/dashboard',
  list: '/engagements',
  clients: '/clients',
  calendar: '/calendar',
  solicitations: '/solicitations',
  users: '/users'
};
const DETAIL_TABS = ['setup', 'docs', 'scope', 'plan', 'run', 'reports', 'mail'];
const ROUTE_ADMIN_TABS = ADMIN_TABS.map(([id]) => id);
const LIST_FILTERS = ['action', 'waiting', 'progress', 'done', 'risk'];

let routeReady = false;
let routeBusy = false;
let lastRoute = '';
let pendingRoute = '';

function currentRoute() {
  if (state.view === 'detail' && state.detail) {
    const id = encodeURIComponent(state.detail.engagement.id);
    const tab = DETAIL_TABS.includes(state.tab) ? '/' + state.tab : '';
    return `/engagements/${id}${tab}`;
  }
  if (state.view === 'admin') {
    const tab = canUseAdminTab(state.adminTab) ? state.adminTab : (adminTabsForRole()[0] || 'users');
    return `/admin/${tab}`;
  }
  if (state.view === 'list' && LIST_FILTERS.includes(state.listFilter))
    return `/engagements?filter=${state.listFilter}`;
  return BASE_ROUTES[state.view] || BASE_ROUTES.list;
}

// Percorso richiesto al server, senza i parametri che non ci riguardano
// (ruolo, utente e cliente servono solo alla demo lato API).
function locationRoute() {
  const params = new URLSearchParams(location.search);
  const filter = params.get('filter');
  const path = location.pathname === '/index.html' ? '/' : location.pathname;
  return filter ? `${path}?filter=${filter}` : path;
}

// Route richiesta dalla barra degli indirizzi: i vecchi link #/... restano validi.
function requestedRoute() {
  return location.hash.startsWith('#/')
    ? location.hash
    : location.pathname + location.search;
}

// Aggiorna la URL senza ricaricare: push per la navigazione, replace per la
// prima scrittura (così il tasto indietro non esce dall'app).
function syncRoute() {
  if (!routeReady || routeBusy) return;
  const route = currentRoute();
  if (route === lastRoute) return;
  const first = !lastRoute;
  lastRoute = route;
  if (first) history.replaceState(null, '', route);
  else history.pushState(null, '', route);
}

// Accetta sia i percorsi (/engagements) sia i vecchi link con cancelletto.
function parseRoute(value) {
  const raw = String(value || '').replace(/^#/, '');
  if (!raw || raw === '/index.html') return null;

  const [pathPart, queryPart] = raw.split('?');
  const parts = pathPart.split('/').filter(Boolean).map(part => {
    try { return decodeURIComponent(part); } catch { return part; }
  });
  const params = new URLSearchParams(queryPart || '');

  switch (parts[0]) {
    case 'engagements':
    case 'engagement': {
      const filterParam = params.get('filter');
      if (filterParam && LIST_FILTERS.includes(filterParam)) return { view: 'list', filter: filterParam };
      if (parts[1] === 'da-gestire') return { view: 'list', filter: 'action' };
      if (parts[1] === 'in-attesa') return { view: 'list', filter: 'waiting' };
      if (parts[1]) return { view: 'detail', id: parts[1], tab: parts[2] || '' };
      return { view: 'list' };
    }

    case 'clients': return { view: 'clients' };
    case 'calendar': return { view: 'calendar', engagement: params.get('eng') || '' };
    case 'solicitations': return { view: 'solicitations' };
    // /kpi resta valido per i link salvati prima della Dashboard.
    case 'dashboard':
    case 'kpi': return { view: 'dashboard' };
    case 'admin': return { view: 'admin', tab: parts[1] || 'users' };
    case 'users': return { view: 'users' };
    default: return null;
  }
}

async function applyRoute(target) {
  const route = target || { view: 'dashboard' };
  const isAdmin = adminTabsForRole().length > 0;
  const filter = LIST_FILTERS.includes(route.filter) ? route.filter : 'all';

  if (route.view === 'admin' && !isAdmin) return applyRoute({ view: 'list' });
  // La pagina Solleciti è per il team interno: un profilo cliente resta
  // sull'elenco e sollecita dall'engagement (dove vede la propria attesa).
  if (route.view === 'solicitations' && isClient()) return applyRoute({ view: 'list' });

  if (route.view === 'detail') {
    const tab = DETAIL_TABS.includes(route.tab) ? route.tab : '';
    if (state.view === 'detail' && state.detail && state.detail.engagement.id === route.id) {
      if (tab && tab !== state.tab) await setTab(tab);
      return;
    }
    await openEngagement(route.id);
    if (tab && state.view === 'detail' && state.detail &&
        state.detail.engagement.id === route.id && tab !== state.tab) {
      await setTab(tab);
    }
    return;
  }

  if (state.view === 'detail') {
    state.detail = null;
    state.scope = null;
    state.credentials = null;
  }

  if (route.view === 'admin') {
    state.view = 'admin';
    state.adminTab = canUseAdminTab(route.tab) ? route.tab : (adminTabsForRole()[0] || 'users');
    state.adminError = null;
    updateHeader();
    await loadAdmin();
    return;
  }

  if (route.view === 'users') {
    state.view = 'users';
    updateHeader();
    await loadUsers();
    return;
  }

  if (route.view === 'clients') {
    state.view = 'clients';
    state.listFilter = filter;
    updateHeader();
    await loadClients();
    render();
    return;
  }

  if (route.view === 'calendar') {
    state.view = 'calendar';
    state.listFilter = filter;
    // ?eng=CODICE: la timeline si apre sul periodo dell'engagement e lo evidenzia.
    state.calendarFocus = route.engagement || '';
    state.calendarFocusPending = !!state.calendarFocus;
    if (state.calendarFocus) {
      state.calendarFilter = 'all';
      state.calendarSel = '';
    }
    updateHeader();
    await loadCalendar();
    if (state.view === 'calendar') renderCalendar();
    return;
  }

  if (route.view === 'solicitations') {
    state.view = 'solicitations';
    state.listFilter = filter;
    updateHeader();
    await loadSolicitations();
    render();
    return;
  }

  if (route.view === 'dashboard') {
    state.view = 'dashboard';
    state.listFilter = filter;
    updateHeader();
    await loadDashboard();
    return;
  }

  state.view = 'list';
  state.listTab = 'eng';
  state.listFilter = filter;
  if (state.list.length && currentRoute() === locationRoute()) {
    render();
    return;
  }
  await loadList();
}

// Applica l'URL corrente (refresh, indietro/avanti, link diretto).
async function handleRoute() {
  if (routeBusy) {
    // Una navigazione è in corso: non si perde, si riprende appena finita.
    pendingRoute = requestedRoute();
    return;
  }
  if (locationRoute() === currentRoute()) return;

  routeBusy = true;
  try {
    await applyRoute(parseRoute(requestedRoute()));
  } finally {
    routeBusy = false;

    if (pendingRoute) {
      // Nel frattempo l'utente ha navigato di nuovo: si applica quella route
      // (è già nella URL) e non si normalizza lo stato intermedio.
      pendingRoute = '';
      await handleRoute();
    } else {
      const canonical = currentRoute();
      lastRoute = canonical;
      if (locationRoute() !== canonical) history.replaceState(null, '', canonical);
    }
  }
}

/* ====== RENDER ====== */
function render() {
  updateHeader();
  // La scheda utente vive solo nell'elenco utenti: altrove si chiude da sola.
  if (state.userModal &&
      state.view !== 'users' &&
      !(state.view === 'admin' && state.adminTab === 'users')) {
    state.userModal = '';
    state.userModalError = null;
  }
  if (state.view === 'clients') renderClients();
  else if (state.view === 'users') renderUsers();
  else if (state.view === 'admin') renderAdmin();
  else if (state.view === 'calendar') renderCalendar();
  else if (state.view === 'solicitations') renderSolicitations();
  else if (state.view === 'dashboard') renderDashboard();
  else if (state.view === 'detail' && state.detail) renderDetail();
  else renderList();
  renderUserModal();
  rememberSetupFolds();
  syncRoute();
}

// I blocchi del Setup sono aperti di default e la scelta dell'utente resta
// anche dopo un render (l'evento toggle non risale, quindi si aggancia qui).
function rememberSetupFolds() {
  document.querySelectorAll('details[data-fold]').forEach(details => {
    details.addEventListener('toggle', () => {
      state.setupFold[details.dataset.fold] = details.open;
    });
  });
}

      return;
    }

    if (!deliverableTypes.length) {
      toast('Seleziona almeno una tipologia di deliverable');
      return;
    }

    const before = state.detail?.engagement || {};
    const identityChanged = name !== (before.name || '') ||
      clientId !== (before.clientId || '') ||
      type !== (before.activityTypeKey || before.type || '');

    try {
      await api(`/api/engagements/${engagedId()}/setup?` + qs(), {
        method: 'PUT',
        body: JSON.stringify({
          name,
          clientId,
          type,
          language,
          deliverableTypes,
          retestPlanned: !!$('#setup_retest')?.checked
        })
      });
      toast('Setup salvato');
      await refreshDetail();
      // Nome, cliente o tipologia compaiono anche in elenco, calendario e
      // intestazioni: si riallinea la copia in memoria.
      if (identityChanged) await loadList();
    } catch (error) { toast(error.message); }
  },

  'download-report': async el => {
    let otp = '';
    if (isClient()) {
      const verify = await ask({
        title: 'Verifica in due passaggi',
        text: 'Placeholder 2FA: in produzione il codice arriva dall\'app authenticator. In questa demo inserisci un codice di 6 cifre qualsiasi per continuare.',
        ok: 'Verifica e scarica',
        fields: [{ id: 'code', label: 'Codice 2FA (6 cifre)', ph: '123456' }]
      });
      if (!verify) return;
      otp = (verify.code || '').trim();
      if (!/^\d{6}$/.test(otp)) {
        toast('Inserisci un codice di 6 cifre');
        return;
      }
    }
    try {
      const q = qs({ ...(otp ? { otp } : {}) });
      const response = await fetch(`/api/engagements/${engagedId()}/reports/${encodeURIComponent(el.dataset.rid)}/download${q ? '?' + q : ''}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }
      });
      if (!response.ok) throw new Error(`Errore ${response.status}`);
      await downloadResponse(response, 'deliverable.txt');
      toast('Download avviato');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'create-download-link': async el => {
    try {
      const result = await api(`/api/engagements/${engagedId()}/reports/${encodeURIComponent(el.dataset.rid)}/links?` + qs(), {
        method: 'POST'
      });
      const url = new URL(result.url, location.origin).href;
      let copied = false;
      try {
        await navigator.clipboard.writeText(url);
        copied = true;
      } catch { /* clipboard non disponibile */ }
      await ask({
        title: copied ? 'Link monouso copiato' : 'Link monouso creato',
        text: `${copied ? 'Il link è già negli appunti. ' : ''}Valido fino al ${fmtTime(result.expiresAt)} (5 giorni) e utilizzabile una sola volta.`,
        ok: 'Chiudi',
        fields: [{ id: 'url', label: 'Link di download', value: url }]
      });
      toast(copied ? 'Link copiato negli appunti' : 'Copia il link dalla finestra');
    } catch (error) { toast(error.message); }
  },

  'submit-review': async () => {
    try {
      await api(`/api/engagements/${engagedId()}/review/submit?` + qs(), { method: 'POST' });
      toast('Inviati in revisione al manager');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'review-decide': async el => {
    const approve = el.dataset.approve === '1';
    let comment = null;
    if (!approve) {
      const v = await ask({
        title: 'Richiedi modifiche',
        ok: 'Richiedi modifiche',
        danger: true,
        fields: [{ id: 'comment', label: 'Cosa va corretto?*', area: true }]
      });
      if (!v) return;
      if (!v.comment) { toast('Indica cosa va corretto'); return; }
      comment = v.comment;
    }
    try {
      await api(`/api/engagements/${engagedId()}/review/decide?` + qs(), {
        method: 'POST', body: JSON.stringify({ approve, comment })
      });
      toast(approve ? 'Deliverables approvati' : 'Modifiche richieste');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  publish: async () => {
    const recipients = (state.detail?.deliverablesEffective || [])
      .map(entry => entry.email).filter(Boolean);
    const choice = await askSendMode({
      title: 'Pubblica al cliente',
      text: 'Scegli come consegnare i deliverable. Con l\'invio automatico parte l\'email dal portale ai destinatari qui sotto (puoi modificarli ora). Con l\'invio manuale consegni tu il report, senza email dal portale.',
      recipients,
      ok: 'Pubblica'
    });
    if (!choice) return;
    try {
      const result = await api(`/api/engagements/${engagedId()}/reports/publish?` + qs(), {
        method: 'POST', body: JSON.stringify(choice)
      });
      toast(choice.mode === 'manual'
        ? `Deliverables pubblicati · invio manuale${result && result.published ? ` (${result.published})` : ''}`
        : `Deliverables pubblicati e inviati${result && result.published ? ` (${result.published})` : ''}`);
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'add-dl': async el => {
    const kind = el.dataset.list === 'deliverables' ? 'deliverables' : 'notifications';
    const prefix = kind === 'deliverables' ? 'dl2' : 'dl';
    const name = $(`#${prefix}_n`).value.trim();
    const email = $(`#${prefix}_e`).value.trim();
    const organization = isClient() ? 'Cliente' : $(`#${prefix}_o`).value;
    if (!name || !email) { toast('Inserisci nome ed email valida'); return; }
    try {
      await api(`/api/engagements/${engagedId()}/distribution-list?` + qs({ kind }), {
        method: 'POST', body: JSON.stringify({ name, email, organization })
      });
      toast(kind === 'deliverables'
        ? 'Destinatario deliverables aggiunto'
        : 'Destinatario notifiche aggiunto');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'remove-dl': async el => {
    const kind = el.dataset.list === 'deliverables' ? 'deliverables' : 'notifications';
    try {
      await api(`/api/engagements/${engagedId()}/distribution-list/${encodeURIComponent(el.dataset.entry)}?` + qs({ kind }), { method: 'DELETE' });
      toast('Destinatario rimosso');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'invite-team': async () => {
    const v = await ask({
      title: 'Invita partecipante esterno',
      ok: 'Invita',
      fields: [
        {
          id: 'scope', label: 'Dove', type: 'select',
          options: [
            ['engagement', 'Solo questo engagement'],
            ['client', 'Team cliente (tutti gli engagement)']
          ]
        },
        { id: 'name', label: 'Nome e cognome*' },
        { id: 'email', label: 'Email*', type: 'email', ph: 'nome@dominio.it' },
        {
          id: 'organization', label: 'Organizzazione', type: 'select',
          options: [['Cliente', 'Cliente'], ['Partner', 'Partner'], ['Altro', 'Altro']]
        },
        { id: 'role', label: 'Ruolo (opzionale)', ph: 'es. Referente tecnico' }
      ]
    });
    if (!v) return;
    if (!v.name || !v.email || !v.email.includes('@') || !v.email.includes('.')) {
      toast('Nome ed email valida sono obbligatori');
      return;
    }
    try {
      await api(`/api/engagements/${engagedId()}/team?` + qs(), {
        method: 'POST',
        body: JSON.stringify(v)
      });
      toast('Partecipante invitato');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'remove-team': async el => {
    const v = await ask({
      title: 'Rimuovere il partecipante?',
      text: 'Non avrà più accesso ai dati dell\'engagement. L\'operazione non è reversibile.',
      ok: 'Rimuovi',
      danger: true
    });
    if (!v) return;
    try {
      await api(`/api/engagements/${engagedId()}/team/${encodeURIComponent(el.dataset.member)}?` + qs(), { method: 'DELETE' });
      toast('Partecipante rimosso');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'toggle-mail': async el => {
    try {
      await api(`/api/engagements/${engagedId()}/mails/${el.dataset.key}/toggle?` + qs(), { method: 'POST' });
      toast('Impostazione aggiornata');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'send-mail': async el => {
    try {
      const result = await api(`/api/engagements/${engagedId()}/mails/${el.dataset.key}/send?` + qs(), { method: 'POST' });
      toast(`Email inviata${result && result.recipients ? ' a ' + result.recipients : ''}`);
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },



  'export-log': async () => {
    try {
      const q = qs();
      const response = await fetch(`/api/engagements/${engagedId()}/log/export${q ? '?' + q : ''}`);
      if (!response.ok) throw new Error(`Errore ${response.status}`);
      await downloadResponse(response, 'registro.csv');
      toast('Registro esportato');
    } catch (error) { toast(error.message); }
  }
};

/* ====== EVENTI ====== */
const busyActions = new Set([
  'new-client', 'rename-client', 'add-client-user', 'remove-client-user',
  'add-client-dl', 'remove-client-address',
  'invite-client-team', 'remove-client-team',
  'new-engagement', 'save-rule-details', 'send-solicitation', 'upload-manleva',
  'upload-ingaggio', 'register-order', 'save-order', 'edit-financials', 'save-financials-inline', 'approve-financials', 'propose', 'reschedule',
  'decide', 'save-scope', 'save-credentials', 'save-setup', 'upload-report',
  'download-report', 'create-download-link', 'submit-review', 'review-decide', 'publish', 'add-dl',
  'remove-dl', 'invite-team', 'remove-team', 'toggle-mail', 'send-mail', 'export-log', 'retry-list',
  'admin-save-templates'
]);

document.addEventListener('click', event => {
  const el = event.target.closest('[data-act]');
  if (!el) return;
  const action = actions[el.dataset.act];
  if (!action) return;
  event.preventDefault();
  const isButton = el.tagName === 'BUTTON';
  const shouldBusy = isButton && busyActions.has(el.dataset.act);
  if (shouldBusy) {
    el.classList.add('busy');
    el.disabled = true;
    el.setAttribute('aria-busy', 'true');
  }
  Promise.resolve(action(el))
    .catch(error => toast(error.message))
    .finally(() => {
      if (shouldBusy && el.isConnected) {
        el.classList.remove('busy');
        el.disabled = false;
        el.removeAttribute('aria-busy');
      }
    });
});

// Le righe-card della Dashboard sono link: Enter e Spazio le aprono come un clic.
document.addEventListener('keydown', event => {
  if (event.key !== 'Enter' && event.key !== ' ') return;
  const row = event.target.closest && event.target.closest('.eng-row[data-act]');
  if (!row || row !== event.target) return;
  event.preventDefault();
  row.click();
});

document.addEventListener('input', event => {
  if (event.target.id === 'user-search') {
    state.userQuery = event.target.value;
    if (state.view === 'admin') renderAdmin(); else renderUsers();
    const input = $('#user-search');
    if (input) {
      input.focus();
      const end = input.value.length;
      try { input.setSelectionRange(end, end); } catch { /* noop */ }
    }
    return;
  }
  if (event.target.id === 'admin-mail-search') {
    state.adminMailingQuery = event.target.value;
    renderAdmin();
    const input = $('#admin-mail-search');
    if (input) {
      input.focus();
      const end = input.value.length;
      try { input.setSelectionRange(end, end); } catch { /* noop */ }
    }
    return;
  }
  if (event.target.id === 'client-search') {
    state.clientQuery = event.target.value;
    renderClients();
    const box = $('#client-search');
    if (box) {
      box.focus();
      const end = box.value.length;
      try { box.setSelectionRange(end, end); } catch { /* noop */ }
    }
    return;
  }
  if (event.target.id !== 'list-search') return;
  state.listQuery = event.target.value;
  renderList();
  const input = $('#list-search');
  if (input) {
    input.focus();
    const end = input.value.length;
    input.setSelectionRange(end, end);
  }
});

document.addEventListener('change', event => {
  const el = event.target.closest('[data-change]');
  if (!el) return;
  const kind = el.dataset.change;
  if (kind === 'activity') {
    // Catalogo tipi: si salva da solo a ogni modifica della riga.
    const row = el.closest('.act-row');
    if (row) Promise.resolve(saveActivityRow(row)).catch(error => toast(error.message));
  }
  if (kind === 'verify-target') {
    Promise.resolve(actions['verify-target'](el)).catch(error => toast(error.message));
  }
  if (kind === 'client-dl') {
    Promise.resolve(actions['client-dl-toggle'](el)).catch(error => toast(error.message));
  }
  if (kind === 'log-author') {
    state.logAuthor = el.value;
    render();
  }
  if (kind === 'list-filter') {
    state.listFilter = el.value || 'all';
    render();
  }
  if (kind === 'list-sort') {
    state.listSort = el.value || 'priority';
    if (state.listSort === 'column' && !state.listColumn) {
      state.listColumn = 'engagement';
      state.listDir = 'asc';
    }
    renderList();
  }
  if (kind === 'admin-template-target') {
    const [scope, clientId] = String(el.value || 'standard').split('|');
    state.adminTemplateTarget = {
      scope: scope === 'client' ? 'client' : 'standard',
      clientId: scope === 'client' ? (clientId || '') : '',
      type: 'start'
    };
    renderAdmin();
  }
});

/* ====== SHELL: SCORCIATOIE ====== */
// La scheda dell'evento nel calendario si chiude cliccando fuori.
document.addEventListener('click', event => {
  if (!state.calendarSel || state.view !== 'calendar') return;
  if (event.target.closest('.cal-pop, .tl-bar, .tl-label, .tl-filter')) return;
  state.calendarSel = '';
  state.calendarDetail = null;
  renderCalendar();
});

window.addEventListener('resize', () => positionCalendarPop());

document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && state.userModal) {
    closeUserModal();
    return;
  }

  // Esc chiude la scheda dell'evento nel calendario.
  if (event.key === 'Escape' && state.calendarSel && state.view === 'calendar') {
    state.calendarSel = '';
    state.calendarDetail = null;
    renderCalendar();
    return;
  }

  if (event.key === 'Escape' && document.body.classList.contains('side-open')) {
    closeSideOnMobile();
    return;
  }

  // Invio su una riga utente apre la scheda (le celle sono focusabili).
  if (event.key === 'Enter' && !state.userModal) {
    const row = event.target.closest?.('[data-act="open-user"]');
    if (row && row.tagName === 'TR') {
      event.preventDefault();
      openUserModal(row.dataset.id);
      return;
    }
  }

  // Invio in un campo della scheda salva, come il pulsante.
  if (event.key === 'Enter' && state.userModal) {
    const tag = (event.target.tagName || '').toLowerCase();
    const save = document.querySelector('[data-act="save-user"]');
    if (save && (tag === 'input' || tag === 'select')) {
      event.preventDefault();
      saveUserFromModal();
    }
    return;
  }

  if (event.key !== '[' || event.metaKey || event.ctrlKey || event.altKey) return;
  const tag = (event.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || event.target.isContentEditable) return;
  event.preventDefault();
  actions['side-toggle']();
});

window.addEventListener('resize', applyShell);
window.addEventListener('hashchange', handleRoute);
window.addEventListener('popstate', handleRoute);

/* ====== INIT ====== */
function init() {
  // Ruolo dal cookie; se assente o sconosciuto si usa il Manager impostato al
  // primo caricamento.
  if (!ROLES[state.role]) state.role = 'Manager';

  applyShell();

  const roleSelect = $('#role');
  roleSelect.innerHTML = Object.entries(ROLES)
    .map(([key, value]) => `<option value="${key}" ${key === state.role ? 'selected' : ''}>${esc(value.label)}${key === 'Auditor' ? ' · sola lettura' : ''}</option>`)
    .join('');
  roleSelect.value = state.role;
  roleSelect.onchange = event => setRole(event.target.value);

  $('#demoUser').onchange = event => setDemoUser(event.target.value);
  $('#client').onchange = event => setClient(event.target.value);

  loadDemoUsers().then(() => {
    roleSelect.value = state.role;
    fillClientSelect();
    updateHeader();

    loadClients().then(async () => {
      if (isClient() && !state.clients.length && !state.clientId) {
        // Server irraggiungibile: si mostra comunque il cliente demo atteso.
        state.clientId = ROLES.Client.client || '';
        writeCookie(ID_COOKIE.client, state.clientId);
        fillClientSelect();
      }
      updateHeader();
      await ensureActivityTypes();
      await loadList();
      routeReady = true;
      const bootRoute = parseRoute(requestedRoute());
      if (!bootRoute) {
        syncRoute();
        lastRoute = currentRoute();
        if (locationRoute() !== lastRoute) history.replaceState(null, '', lastRoute);
        return;
      }
      await handleRoute();
      if (!lastRoute) lastRoute = currentRoute();
    });
  });
}

init();
</script>
