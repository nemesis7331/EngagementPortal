<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>Cyber Engagement Portal</title>
<style>
/* ====== PALETTE (allineata a demo-poc.html) ====== */
:root{
  --brand-950:#061d36;
  --brand-900:#0a2a4d;
  --brand-700:#0f4275;
  --brand-600:#0b5fa5;
  --brand-500:#2a86d8;
  --brand-100:#e1eefa;
  --brand-50:#f1f7fc;
  --accent:#0e9fb5;
  --ink:#0a1b2e;
  --muted:#566a80;
  --line:#dfe7ef;
  --bg:#f4f7fa;
  --card:#ffffff;
  /* Token semantici di stato: il colore descrive chi deve agire. */
  --st-action:#b42318;   --st-action-bg:#fee4e2;   --st-action-border:#fda29b;
  --st-wait:#7a5b00;     --st-wait-bg:#fff8c5;     --st-wait-border:#eac54f;
  --st-progress:#175cd3; --st-progress-bg:#d1e9ff; --st-progress-border:#b2ddff;
  --st-done:#067647;     --st-done-bg:#dcfae6;     --st-done-border:#a9efc5;
  --st-blocked:#475467;  --st-blocked-bg:#f2f4f7;  --st-blocked-border:#e4e7ec;
  --st-neutral:#475467;  --st-neutral-bg:#f2f4f7;  --st-neutral-border:#e4e7ec;
  --st-negative:#b42318; --st-negative-bg:#fee4e2; --st-negative-border:#fda29b;
  /* rischio preparazione: distinto dal rosso "da gestire" */
  --st-risk:#9a3412;
  /* tipografia: una sola famiglia e una scala a token */
  --font-sans:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  --fs-2xs:10.5px;   /* micro etichette */
  --fs-xs:11.5px;    /* tabelle, meta */
  --fs-sm:12.5px;    /* testi secondari */
  --fs-md:13.5px;    /* controlli e testi compatti */
  --fs-base:14.5px;  /* testo corrente */
  --fs-lg:17px;      /* titoli di sezione */
  --fs-xl:19px;      /* titolo sidebar / logo */
  --fs-2xl:22px;     /* h1 su schermi stretti */
  --fs-3xl:26px;     /* h1 e numeri grandi */
  --fs-stat:24px;
  --fw-regular:400;
  --fw-semibold:600;
  --fw-bold:700;
  --fw-black:800;
  --lh-tight:1.25;
  --lh-base:1.5;
  --tracking-caps:.06em;
  /* raggi */
  --radius-xs:6px;
  --radius-sm:8px;
  --radius-md:10px;
  --radius-lg:12px;
  --radius-xl:14px;
  --radius-pill:999px;
  --radius:var(--radius-xl);
  /* superfici e linee secondarie */
  --line-soft:#eef2f7;
  --line-strong:#c9d4e0;
  --surface-2:#eceff6;
  --surface-3:#f8fafc;
  --skeleton-a:#eef3f8;
  --skeleton-b:#f7fafc;
  --muted-2:#7b8a9b;
  --st-wait-strong:#8a4b00;
  --row-action:#fffafa;
  --row-wait:#fffdf5;
  --row-done:#fbfffc;
  --page-max:1200px;
  --shadow:0 1px 2px rgba(6,29,54,.06),0 6px 20px rgba(6,29,54,.06);
  --shadow-xs:0 1px 2px rgba(0,0,0,.25);
  --shadow-lg:0 20px 60px rgba(6,29,54,.35);
  --overlay:rgba(6,29,54,.55);
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);background:var(--bg);color:var(--ink);font-size:var(--fs-base);line-height:var(--lh-base);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
/* Header */
header{background:linear-gradient(100deg,var(--brand-950),var(--brand-900) 60%,var(--brand-700));color:#fff;position:sticky;top:0;z-index:20}
.hwrap{max-width:var(--page-max);margin:auto;padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:var(--fw-bold);font-size:var(--fs-xl);letter-spacing:0}
.logo i{width:30px;height:30px;border-radius:var(--radius-md);background:var(--accent);display:grid;place-items:center;color:var(--brand-950);font-style:normal;font-weight:var(--fw-black)}
.logo small{display:block;font-weight:var(--fw-regular);font-size:var(--fs-xs);opacity:.7;letter-spacing:var(--tracking-caps);text-transform:uppercase}
.spacer{flex:1}
.user{display:flex;align-items:center;gap:10px;font-size:var(--fs-md)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-500);display:grid;place-items:center;font-weight:var(--fw-bold)}
/* Layout */
main{max-width:var(--page-max);margin:24px auto 60px;padding:0 24px}
h1{font-size:var(--fs-3xl);line-height:var(--lh-tight);margin:0 0 4px;color:var(--brand-900)}
h2{font-size:var(--fs-lg);line-height:var(--lh-tight);margin:0 0 12px;color:var(--brand-900)}
.sub{color:var(--muted);margin:0 0 22px}
.crumb{color:var(--brand-600);background:none;border:0;padding:0;margin-bottom:10px;font-weight:var(--fw-semibold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.grid{display:grid;gap:16px}
/* table */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer;transition:background .15s}
tr.row:hover{background:var(--brand-50)}
tr:last-child td{border-bottom:0}
.name b{display:block;color:var(--brand-900)} .name span{color:var(--muted);font-size:var(--fs-sm)}
/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--radius-pill);font-size:var(--fs-sm);font-weight:var(--fw-semibold);white-space:nowrap;border:1px solid transparent}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.p-done,.p-ok{background:var(--st-done-bg);color:var(--st-done);border-color:var(--st-done-border)}
.p-wait,.p-warn{background:var(--st-wait-bg);color:var(--st-wait);border-color:var(--st-wait-border)}
.p-action{background:var(--st-action-bg);color:var(--st-action);border-color:var(--st-action-border)}
.p-negative,.p-err{background:var(--st-negative-bg);color:var(--st-negative);border-color:var(--st-negative-border)}
.p-progress,.p-info{background:var(--st-progress-bg);color:var(--st-progress);border-color:var(--st-progress-border)}
.p-blocked,.p-neutral,.p-mute{background:var(--st-neutral-bg);color:var(--st-neutral);border-color:var(--st-neutral-border)}
.p-prog{background:var(--st-progress-bg);color:var(--st-progress);border-color:var(--st-progress-border)}
.mini{display:flex;gap:4px}.mini i{width:22px;height:6px;border-radius:3px;background:var(--line)}.mini i.on{background:var(--accent)}.mini i.cur{background:var(--brand-500)}
/* buttons */
.btn{border:1px solid transparent;border-radius:var(--radius-md);padding:9px 16px;font-weight:var(--fw-semibold);transition:.15s}
.btn.pri{background:var(--brand-600);color:#fff}.btn.pri:hover{background:var(--brand-700)}
.btn.acc{background:var(--accent);color:var(--brand-950)}.btn.acc:hover{filter:brightness(.95)}
.btn.sec{background:#fff;border-color:var(--line);color:var(--brand-900)}.btn.sec:hover{border-color:var(--brand-500)}
.btn.dng{background:#fff;border-color:var(--st-negative-border);color:var(--st-negative)}
/* Decisioni: niente riempimenti verde/rosso, solo il bordo distingue l'azione */
.decide{background:#fff;border:1px solid var(--line);border-radius:var(--radius-md);padding:9px 16px;font-weight:var(--fw-semibold);color:var(--brand-900);transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.decide:hover{background:var(--surface-3)}
.decide.yes{color:var(--st-done);border-color:var(--st-done-border)}
.decide.yes:hover{background:var(--st-done-bg)}
.decide.no{color:var(--st-negative);border-color:var(--st-negative-border)}
.decide.no:hover{background:var(--st-negative-bg)}
.decide.warn{color:var(--st-wait);border-color:var(--st-wait-border)}
.decide.warn:hover{background:var(--st-wait-bg)}
.decide:focus-visible{outline:2px solid var(--brand-500);outline-offset:2px}
.decide.sm{padding:5px 11px;font-size:var(--fs-md)}
.decision-group{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn.sm{padding:5px 11px;font-size:var(--fs-md)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* stepper orizzontale legacy (usato solo dai mockup statici) */
.sprite{position:absolute;width:0;height:0;overflow:hidden}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 18px;overflow:auto}
.tab{background:none;border:0;padding:10px 16px;color:var(--muted);font-weight:var(--fw-semibold);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--brand-600);border-bottom-color:var(--brand-600)}
.tab .lock{display:inline-flex;align-items:center;opacity:.6}
.tab .lock svg{width:14px;height:14px;fill:currentColor;display:block}
/* misc */
.two{grid-template-columns:1fr 1fr}
@media(max-width:820px){
  .two{grid-template-columns:1fr}
}
.doc{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.ico{width:42px;height:42px;border-radius:var(--radius-md);background:var(--brand-100);color:var(--brand-600);display:grid;place-items:center;font-weight:var(--fw-black);font-size:var(--fs-sm)}
.doc .t{flex:1}.doc .t b{display:block}.doc .t span{font-size:var(--fs-sm);color:var(--muted)}
.note{background:var(--brand-50);border:1px solid var(--brand-100);border-radius:var(--radius-md);padding:12px 14px;color:var(--brand-700);font-size:var(--fs-md);margin-bottom:16px}
.note.lockbox{background:var(--st-blocked-bg);border-color:var(--st-blocked-border);color:var(--st-blocked)}
label{display:block;font-size:var(--fs-sm);font-weight:var(--fw-semibold);margin-bottom:5px;color:var(--brand-900)}
input[type=text],input[type=search],input[type=date],input[type=email],input[type=number],input[type=tel],input[type=url],input[type=password],textarea,select.f,#modal select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-md);font:inherit;background:#fff}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand-500);outline-offset:-1px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
@media(max-width:620px){.fgrid{grid-template-columns:1fr}}
.prop{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:var(--radius-lg);margin-bottom:10px;flex-wrap:wrap}
.prop .d{flex:1;min-width:220px}.prop .d b{color:var(--brand-900)}.prop .d span{display:block;color:var(--muted);font-size:var(--fs-sm)}
.tl{list-style:none;padding:0;margin:0}.tl li{position:relative;padding:0 0 14px 22px;font-size:var(--fs-md)}
.tl li::before{content:"";position:absolute;left:3px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--brand-500)}
.tl li::after{content:"";position:absolute;left:7px;top:16px;bottom:-2px;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}.tl span{color:var(--muted);display:block;font-size:var(--fs-sm)}
.bars{display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:10px}.bars div{flex:1;background:linear-gradient(var(--brand-500),var(--brand-600));border-radius:6px 6px 0 0;position:relative}
.bars div em{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-style:normal;font-size:var(--fs-xs);color:var(--muted)}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:var(--fs-md);font-weight:var(--fw-semibold);margin:0}.sw input{display:none}.sw i{width:38px;height:22px;border-radius:var(--radius-pill);background:var(--line-strong);position:relative;transition:.2s}.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:var(--shadow-xs)}.sw input:checked+i{background:var(--accent)}.sw input:checked+i::after{left:19px}
.mailc{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--line)}.mailc:last-child{border-bottom:0}.mailc .t{flex:1;min-width:240px}.mailc .t b{display:block;color:var(--brand-900)}.mailc .t span{color:var(--muted);font-size:var(--fs-sm);display:block}.mailc .ctl{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
/* template email */
.tpl-card{border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px;margin-top:12px;background:#fff}
.tpl-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.tpl-head b{color:var(--brand-900);font-size:var(--fs-md)}
.tpl-scope{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tpl-scope label{margin:0}
.tpl-scope select{width:auto;min-width:190px}
.tpl-grid{display:grid;gap:10px;margin-top:10px}
.tpl-card label{margin-top:6px}
.tpl-card textarea{font-family:var(--font-sans);min-height:120px}
.tpl-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.tpl-preview{margin-top:10px;font-size:var(--fs-sm);color:var(--muted)}
.tpl-preview summary{cursor:pointer;font-weight:var(--fw-semibold);color:var(--brand-600)}
.tpl-mail{margin-top:8px;border:1px solid var(--line);border-radius:var(--radius-md);padding:12px;background:var(--brand-50)}
.tpl-mail b{display:block;color:var(--brand-900);margin-bottom:6px}
.tpl-mail pre{margin:0;white-space:pre-wrap;font-family:var(--font-sans);font-size:var(--fs-sm);color:var(--ink);line-height:var(--lh-base)}
@media(max-width:560px){.tpl-scope select{min-width:0;width:100%}.tpl-actions .btn{flex:1}}
/* stato schede */
.tab::before{content:"";display:inline-block;min-width:16px;height:16px;line-height:16px;border-radius:50%;margin-right:7px;font-size:var(--fs-xs);font-weight:var(--fw-black);text-align:center;vertical-align:1px}
.tab.s-ok::before{content:"✓";background:var(--st-done);color:#fff}
.tab.s-todo::before{content:"!";background:var(--st-action);color:#fff}
.tab.s-wait::before{content:"…";background:var(--st-wait-bg);color:var(--st-wait);border:1px solid var(--st-wait-border)}
.tab.s-lock::before,.tab.s-none::before{display:none}
.tab.s-ok,.tab.s-ok.on{color:var(--st-done)}
.tab.s-todo,.tab.s-todo.on{color:var(--st-action)}
.tab.s-wait,.tab.s-wait.on{color:var(--st-wait)}
.tab.s-lock,.tab.s-lock.on{color:var(--st-blocked)}
.tab.s-ok.on{border-bottom-color:var(--st-done)}
.tab.s-todo.on{border-bottom-color:var(--st-action)}
.tab.s-wait.on{border-bottom-color:var(--st-wait)}
.tab.s-lock.on{border-bottom-color:var(--st-blocked)}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}.chipb{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:var(--radius-pill);padding:7px 14px;font:inherit;font-size:var(--fs-md);font-weight:var(--fw-semibold);color:var(--muted)}.chipb:hover{border-color:var(--brand-500)}.chipb.on{border-color:var(--brand-600);color:var(--brand-600);box-shadow:0 0 0 2px var(--brand-100)}
.cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:var(--radius-pill);background:var(--surface-2);color:var(--muted);font-size:var(--fs-sm);font-weight:var(--fw-bold);text-align:center}.chipb.on .cnt{background:var(--brand-100);color:var(--brand-600)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:var(--fs-sm);color:var(--muted);margin:-8px 0 18px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
/* ====== DETTAGLIO: workspace con sidebar ====== */
.workspace{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start;margin-top:14px}
.aside{position:sticky;top:16px;align-self:start}
.side{padding:18px 18px 20px}
.side-kicker{font-size:var(--fs-xs);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--muted);font-weight:var(--fw-bold);margin:0 0 6px;overflow-wrap:anywhere}
.side-title{font-size:var(--fs-xl);line-height:var(--lh-tight);margin:0 0 10px;color:var(--brand-900)}
.side-status{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.side-status .status-owner{font-size:var(--fs-sm);color:var(--muted);margin:0}
.side-alert{margin-top:10px;border:1px solid var(--st-action-border);background:#fff;border-radius:var(--radius-md);padding:8px 10px;display:grid;gap:2px;color:var(--st-negative)}
.side-alert b{font-size:var(--fs-2xs);text-transform:uppercase;letter-spacing:var(--tracking-caps)}
.side-alert span{font-size:var(--fs-sm);font-weight:var(--fw-semibold);line-height:1.35}
.side h3{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:var(--tracking-caps);color:var(--muted);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:var(--fw-bold)}
.side h3 .side-count{color:var(--brand-600);letter-spacing:0;font-size:var(--fs-sm)}
.side .divider{height:1px;background:var(--line);margin:16px 0}
.side .kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 12px;margin:0;font-size:var(--fs-md)}
.side .kv dt{color:var(--muted)}
.side .kv dd{margin:0;font-weight:var(--fw-semibold);color:var(--brand-900);text-align:right;overflow-wrap:anywhere}
.side-chips{margin:0;gap:8px}
.side-chips .chipb{padding:5px 11px;font-size:var(--fs-sm);background:var(--brand-50);color:var(--brand-700);border-color:var(--brand-100)}
.side-chips .chipb.on{background:#fff;border-color:var(--brand-600);color:var(--brand-600)}
.side-legend{margin-top:14px;font-size:var(--fs-sm);color:var(--muted)}
.side-legend summary{cursor:pointer;font-weight:var(--fw-semibold);color:var(--brand-600);list-style:none}
.side-legend summary::-webkit-details-marker{display:none}
.side-legend summary::before{content:"▸ "}
.side-legend[open] summary::before{content:"▾ "}
.side-legend .lg{display:grid;gap:7px;margin-top:10px}
.side-legend .lg span{display:flex;align-items:center;gap:8px}
.side-legend .lg b{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;font-size:var(--fs-2xs);flex:none}
.side-legend .lg b svg{width:9px;height:9px;fill:currentColor}
.main-col{min-width:0}
/* avanzamento verticale: una riga per passo, binario a sinistra */
.vsteps{list-style:none;margin:0;padding:0}
.vsteps li{position:relative;display:grid;grid-template-columns:26px minmax(0,1fr);column-gap:12px;padding-bottom:16px}
.vsteps li:last-child{padding-bottom:0}
.vsteps li::before{content:"";position:absolute;left:12px;top:27px;bottom:0;width:2px;border-radius:1px;background:var(--line)}
.vsteps li.done::before{background:var(--accent)}
.vsteps li:last-child::before{display:none}
.vsteps .vt{position:relative;z-index:1;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:#fff;color:var(--muted-2);display:grid;place-items:center;font-size:var(--fs-xs);font-weight:var(--fw-black);line-height:1}
.vsteps .vt svg{width:12px;height:12px;fill:currentColor;display:block}
.vsteps li.done .vt{background:var(--accent);border-color:var(--accent);color:var(--brand-950)}
.vsteps li.cur .vt{border-color:var(--brand-500);color:var(--brand-600);box-shadow:0 0 0 4px var(--brand-100)}
.vsteps .vtx{min-width:0;padding-top:2px}
.vsteps b{display:block;font-size:var(--fs-md);line-height:1.35;font-weight:var(--fw-semibold);color:var(--brand-900);overflow-wrap:anywhere}
.vsteps .vsd{display:block;font-style:normal;font-size:var(--fs-xs);line-height:1.4;color:var(--muted);margin-top:2px}
.vsteps li.future b{color:var(--muted);font-weight:var(--fw-semibold)}
.vsteps li.cur b{color:var(--brand-600);font-weight:var(--fw-bold)}
/* avanzamento compatto per schermi stretti */
.cprog{display:none}
.cprog .cbar{display:flex;gap:4px}
.cprog .cbar i{flex:1;height:6px;border-radius:var(--radius-pill);background:var(--line)}
.cprog .cbar i.on{background:var(--accent)}
.cprog .cbar i.cur{background:var(--brand-500)}
.cprog .clabel{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:var(--fs-sm);color:var(--muted)}

<script>
/* ====== PROFILI E CLIENTI ====== */
const ROLES = {
  Client:       { label: 'Cliente',      role: 'Cliente',                av: 'MR', client: 'contoso' },
  PMO:     { label: 'PMO',     role: 'PMO',               av: 'LF', client: null },
  Pentester: { label: 'Pentester', role: 'Pentester',           av: 'SC', client: null },
  Manager:      { label: 'Manager',      role: 'Manager',                av: 'GM', client: null },
  Auditor:      { label: 'Auditor',      role: 'Auditor · sola lettura', av: 'EG', client: null }
};
const ROLE_NAMES = {
  Client: 'Marta Rinaldi',
  PMO: 'Luca Ferri',
  Pentester: 'Sara Conti',
  Manager: 'Giorgio Marino',
  Auditor: 'Elena Greco'
};
const ROLE_LABEL = {
  Client: 'Cliente',
  PMO: 'PMO',
  Pentester: 'Pentester',
  Manager: 'Manager',
  Auditor: 'Auditor'
};
const DEMO_CLIENTS = [
  // Cliente = anagrafica che raggruppa utenze ed engagement.
  ['contoso', 'Contoso'],
  ['fabrikam', 'Fabrikam'],
  ['novabank', 'Nova Bank'],
  ['orion', 'Orion Energia']
];
const TYPES = [
  ['PenetrationTest', 'Penetration Test'],
  ['VulnerabilityAssessment', 'Vulnerability Assessment'],
  ['RedTeam', 'Red Team'],
  ['CodeReview', 'Code Review'],
  ['CloudSecurity', 'Cloud Security']
];
const STEPS = [
  ['Documenti e dati economici', 'Scheda tecnica, ordine, costi e margine approvati'],
  ['Scope', 'Perimetro e obiettivi dell\'attività'],
  ['Pianificazione', 'Proposta e approvazione delle date'],
  ['Credenziali', 'Dati di accesso per l\'esecuzione'],
  ['Esecuzione', 'Attività in corso'],
  ['Report', 'Revisione e consegna']
];
const MAIL_META = {
  start:   { t: 'Inizio attività', subj: 'Avvio attività', desc: 'Comunica alla distribution list l\'avvio dell\'attività.' },
  end:     { t: 'Fine attività', subj: 'Conclusione attività', desc: 'Comunica alla distribution list la conclusione dell\'attività.' },
  deliver: { t: 'Consegna deliverables', subj: 'Consegna deliverables', desc: 'Notifica la disponibilità dei report e degli altri deliverables.' }
};
const PROPOSAL_STATUS = {
  Pending: ['In attesa', 'wait'],
  Accepted: ['Approvata', 'done'],
  Rejected: ['Rifiutata', 'negative'],
  Superseded: ['Sostituita', 'neutral'],
  Replaced: ['Superata', 'neutral']
};
const REVIEW_STATUS = {
  None: ['Non inviata', 'neutral'],
  Pending: ['In attesa del manager', 'wait'],
  Approved: ['Approvata', 'done'],
  Changes: ['Modifiche richieste', 'negative']
};
const VISIBILITY = {
  Client: 'scheda tecnica, documento di ingaggio, credenziali fornite e deliverables',
  PMO: 'tutti i file, costi e margine e credenziali',
  Pentester: 'scheda tecnica, ingaggio, ordine, costi e margine approvati, credenziali e deliverables',
  Manager: 'scheda tecnica, ingaggio, ordine, costi e margine approvati, credenziali (sola lettura) e deliverables',
  Auditor: 'tutti i file e i dati economici, tranne le credenziali, in sola lettura'
};

const state = {
  role: localStorage.getItem('cep.role') || 'Pentester',
  clientId: localStorage.getItem('cep.client') || '',
  view: 'list',
  listTab: 'eng',
  listFilter: 'all',
  listQuery: '',
  listSort: 'priority',
  loading: false,
  error: null,
  list: [],
  clients: [],
  detail: null,
  tab: 'docs',
  rules: [],
  due: [],
  scope: null,
  credentials: null,
  mailTemplates: null,
  mailTemplatesError: false,
  mailTemplateScope: {},
  logAuthor: '',
  editing: {}
};

const $ = s => document.querySelector(s);
const esc = v => String(v == null ? '' : v)
  .replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = d => {
  if (!d) return '–';
  const [y, m, g] = String(d).substring(0, 10).split('-');
  return g && m && y ? `${g}/${m}/${y}` : d;
};
const fmtTime = d => {
  if (!d) return '–';
  const date = new Date(d);
  if (Number.isNaN(date.getTime())) return fmt(d);
  const p = n => String(n).padStart(2, '0');
  return `${p(date.getDate())}/${p(date.getMonth() + 1)}/${date.getFullYear()} ${p(date.getHours())}:${p(date.getMinutes())}`;
};
const fmtSize = n => n >= 1048576 ? `${(n / 1048576).toFixed(1)} MB` : n >= 1024 ? `${Math.round(n / 1024)} KB` : `${n} B`;
const fmtMoney = n => {
  if (n == null || n === '') return '–';
  const value = Number(n);
  if (Number.isNaN(value)) return '–';
  return new Intl.NumberFormat('it-IT', {
    style: 'currency',
    currency: 'EUR',
    maximumFractionDigits: 2
  }).format(value);
};
const fmtPercent = n => {
  if (n == null || n === '') return '–';
  const value = Number(n);
  if (Number.isNaN(value)) return '–';
  return `${new Intl.NumberFormat('it-IT', {
    maximumFractionDigits: 2
  }).format(value)}%`;
};
// Il margine è una percentuale sul costo: il valore dell'attività è
// costo + margine.
const financialValue = (cost, margin) =>
  cost == null || margin == null || cost === '' || margin === ''
    ? null
    : Number(cost) * (1 + Number(margin) / 100);
const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};
const typeLabel = t => (TYPES.find(x => x[0] === t) || [t, t])[1];
const clientLabel = t => clientName(t);
const isClient = () => state.role === 'Client';
const isInternalRole = () => state.role === 'PMO' || state.role === 'Pentester' || state.role === 'Manager' || state.role === 'Auditor';
const canCreateEngagement = () => state.role === 'PMO' || state.role === 'Manager';
const canManageClients = () => state.role === 'Manager';
const clientName = t => (state.clients.find(c => c.id === t) || {}).name
  || (DEMO_CLIENTS.find(x => x[0] === t) || [t, t])[1];

// Icona del cliente: favicon del sito, con le iniziali come fallback
// quando il cliente non ha un sito o l'immagine non è raggiungibile.
function clientFor(e) {
  const id = e && e.clientId;
  return (state.clients || []).find(c => c.id === id)
    || { id, name: (e && e.clientName) || clientName(id) };
}
function faviconUrl(website) {
  if (!website) return '';
  try {
    const url = new URL(website);
    return url.hostname
      ? `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(url.hostname)}`
      : '';
  } catch {
    return '';
  }
}
function initialsOf(name) {
  const clean = String(name || '?').trim();
  const parts = clean.split(/\s+/).filter(Boolean);
  if (parts.length === 1) return (clean.slice(0, 2) || '?').toUpperCase();
  return (parts.map(p => p[0]).join('').slice(0, 2) || '?').toUpperCase();
}
function hostOf(website) {
  try {
    return new URL(website).hostname.replace(/^www\./, '');
  } catch {
    return website || '';
  }
}
function clientAvatar(client, cls) {
  const name = (client && client.name) || '';
  const src = faviconUrl(client && client.website);
  const size = cls === 'lg' ? 40 : 28;
  return `<span class="cav ${cls || ''}" title="${esc(name)}">
    <span class="cav-init" aria-hidden="true">${esc(initialsOf(name))}</span>
    ${src ? `<img src="${esc(src)}" alt="" width="${size}" height="${size}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
  </span>`;
}

const pill = ([text, cls]) => `<span class="pill p-${cls}">${esc(text)}</span>`;
function reviewLabel(s) {
  if (s === 'Pending') {
    return state.role === 'Manager'
      ? ['Da approvare', 'action']
      : ['In attesa del manager', 'wait'];
  }
  if (s === 'Changes') {
    return state.role === 'Pentester'
      ? ['Da correggere', 'action']
      : ['Modifiche richieste', 'negative'];
  }
  return REVIEW_STATUS[s] || [s, 'neutral'];
}

function proposalLabel(p) {
  if (typeof p === 'string') return PROPOSAL_STATUS[p] || [p, 'neutral'];
  if (p.status === 'Pending') {
    return canDecideProposal(p)
      ? ['Da decidere', 'action']
      : ['In attesa', 'wait'];
  }
  return PROPOSAL_STATUS[p.status] || [p.status, 'neutral'];
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2800);
}

function qs(extra = {}) {
  return new URLSearchParams({ role: state.role, client: state.clientId || '', ...extra }).toString();
}

async function api(path, options = {}) {
  const response = await fetch(path, {
    ...options,
    headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
  });
  if (!response.ok) {
    let message = `Errore ${response.status}`;
    try {
      const body = await response.json();
      if (typeof body === 'string' && body.trim()) message = body;
      else message = (body && (body.detail || body.title)) || message;
    } catch { /* corpo non JSON (es. 403 vuoto) */ }
    if (message === `Errore ${response.status}`) {
      message = {
        400: 'Richiesta non valida.',
        403: 'Operazione non consentita per il tuo profilo.',
        404: 'Risorsa non trovata.',
        409: 'Elemento già esistente o in conflitto.'
      }[response.status] || message;
    }
    throw new Error(message);
  }
  if (response.status === 204) return null;
  const type = response.headers.get('content-type') || '';
  return type.includes('json') ? response.json() : response;
}

function downloadResponse(response, fallbackName) {
  return response.blob().then(blob => {
    const disposition = response.headers.get('content-disposition') || '';
    const match = /filename="?([^";]+)"?/i.exec(disposition);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = match ? match[1] : fallbackName;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  });
}

function pickFile(accept) {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file';
    if (accept) input.accept = accept;
    input.onchange = () => resolve(input.files[0] ? input.files[0].name : null);
    input.click();
  });
}

/* ====== MODALE ====== */
function ask({ title, text, fields = [], ok = 'Conferma', danger = false }) {
  return new Promise(resolve => {
    const opener = document.activeElement;
    const fieldsHtml = fields.map(f => {
      const control = f.area
        ? `<textarea id="m_${esc(f.id)}" rows="3" placeholder="${esc(f.ph || '')}"></textarea>`
        : f.type === 'select'
          ? `<select class="f" id="m_${esc(f.id)}">${(f.options || [])
              .map(o => `<option value="${esc(o[0])}" ${o[0] === (f.value || (f.options[0] || [])[0]) ? 'selected' : ''}>${esc(o[1])}</option>`)
              .join('')}</select>`
          : `<input type="${esc(f.type || 'text')}" id="m_${esc(f.id)}" value="${esc(f.value || '')}"
               placeholder="${esc(f.ph || '')}" ${f.min ? `min="${esc(f.min)}"` : ''} ${f.max ? `max="${esc(f.max)}"` : ''}>`;
      return `<div class="${f.half ? '' : 'full'}">
        <label for="m_${esc(f.id)}">${esc(f.label)}</label>${control}</div>`;
    }).join('');

    $('#modal').innerHTML = `
      <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mt">
        <h2 id="mt">${esc(title)}</h2>
        ${text ? `<p class="sub" style="margin-bottom:14px">${esc(text)}</p>` : ''}
        <div class="fgrid">${fieldsHtml}</div>
        <div class="mact">
          <button class="btn sec" data-modal="cancel">Annulla</button>
          <button class="btn ${danger ? 'dng' : 'pri'}" data-modal="ok">${esc(ok)}</button>
        </div>
      </div>`;
    $('#modal').classList.add('show');

    const close = value => {
      $('#modal').classList.remove('show');
      $('#modal').innerHTML = '';
      document.removeEventListener('keydown', onKey);
      if (opener && opener.isConnected && opener.focus) opener.focus();
      resolve(value);
    };
    const confirm = () => {
      const values = {};
      fields.forEach(f => { values[f.id] = ($('#m_' + f.id)?.value || '').trim(); });
      close(values);
    };
    const onKey = event => {
      if (event.key === 'Escape') close(null);
      if (event.key === 'Enter' && event.target && event.target.tagName === 'INPUT') confirm();
    };
    document.addEventListener('keydown', onKey);
    $('#modal').querySelector('[data-modal="cancel"]').onclick = () => close(null);
    $('#modal').querySelector('[data-modal="ok"]').onclick = confirm;
    const first = fields[0] && $('#m_' + fields[0].id);
    if (first) setTimeout(() => first.focus(), 30);
    else setTimeout(() => $('#modal').querySelector('[data-modal="ok"]').focus(), 30);
  });
}

/* ====== NAVIGAZIONE ====== */
function updateHeader() {
  let name = ROLE_NAMES[state.role] || 'Demo User';
  let av = (ROLES[state.role] || {}).av || '–';
  if (isClient()) {
    const account = state.clients.find(c => c.id === state.clientId);
    const contact = account && account.users && account.users[0];
    if (contact) {
      name = contact.name;
      av = contact.name.split(/\s+/).map(p => p[0]).join('').slice(0, 2).toUpperCase();
    }
  }
  $('#uname').textContent = name;
  $('#urole').textContent = ROLES[state.role].role;
  $('#av').textContent = av;
}

function fillClientSelect() {
  const select = $('#client');
  const clients = state.clients || [];
  const known = clients.length
    ? clients.map(c => [c.id, c.name])
    : (isClient() ? [] : DEMO_CLIENTS);
  const options = isClient()
    ? known
    : [['', 'Tutti i clienti'], ...known];
  select.innerHTML = options.length
    ? options
      .map(([value, label]) => `<option value="${esc(value)}" ${value === (state.clientId || '') ? 'selected' : ''}>${esc(label)}</option>`)
      .join('')
    : '<option value="">Nessun cliente disponibile</option>';
  if (!options.some(o => o[0] === (state.clientId || ''))) {
    // Per un Cliente l'identità la decide il server: si usa solo la lista
    // restituita dal server, mai il fallback demo.
    state.clientId = isClient()
      ? (clients[0] ? clients[0].id : '')
      : '';
    select.value = state.clientId;
    localStorage.setItem('cep.client', state.clientId);
  }
}

function setRole(role) {
  if (!ROLES[role]) return;
  state.role = role;
  if (role === 'Client') {
    // La lista clienti di un profilo Cliente è solo la propria: si riparte
    // dalla risposta del server per non ereditare quella del profilo interno.
    state.clients = [];
    state.clientId = '';
  } else {
    state.clientId = '';
  }
  state.view = 'list';
  state.detail = null;
  state.tab = 'docs';
  state.listTab = 'eng';
  state.scope = null;
  state.credentials = null;
  localStorage.setItem('cep.role', role);
  localStorage.setItem('cep.client', state.clientId || '');
  fillClientSelect();
  updateHeader();
  loadClients().then(loadList);
}

function setClient(clientId) {
  state.clientId = clientId;
  localStorage.setItem('cep.client', clientId || '');
  updateHeader();
  if (state.view === 'detail' && state.detail) {
    // Un utente interno che cambia cliente torna alla lista: il dettaglio
    // aperto potrebbe non appartenere al nuovo perimetro.
    if (isInternalRole()) backToList();
    else loadDetail(state.detail.engagement.id);
  }
  else if (state.view === 'clients') loadClients().then(render);
  else loadList();
}

function backToList() {
  state.view = 'list';
  state.detail = null;
  state.scope = null;
  state.credentials = null;
  state.mailTemplates = null;
  state.mailTemplatesError = false;
  state.mailTemplateScope = {};
  state.listTab = 'eng';
  loadList();
}

async function openEngagement(id) {
  state.view = 'detail';
  state.tab = 'docs';
  state.scope = null;
  state.credentials = null;
  state.mailTemplates = null;
  state.mailTemplatesError = false;
  state.mailTemplateScope = {};
  state.logAuthor = '';
  state.editing = {};
  await loadDetail(id);
}

async function setTab(tab) {
  state.tab = tab;
  if (tab === 'scope') await loadScope();
  if (tab === 'cred') await loadCredentials();
  if (tab === 'mail') await loadMailTemplates();
  render();
}

/* ====== DATI ====== */
async function loadList() {
  state.loading = true;
  state.error = null;
  if (!state.list.length) render();
  try {
    state.list = await api('/api/engagements?' + qs());
    if (!isClient()) await loadSolicitations();
    else { state.rules = []; state.due = []; }
  } catch (error) {
    state.error = error.message;
    toast(error.message);
  } finally {
    state.loading = false;
    render();
  }
}

async function loadDetail(id) {
  state.loading = true;
  state.error = null;
  try {
    const detail = await api(`/api/engagements/${encodeURIComponent(id)}?` + qs());
    state.detail = detail;
    if (!state.tab || state.tab === 'docs') state.tab = defaultTab(detail);
    if (state.tab === 'scope') await loadScope();
    if (state.tab === 'cred') await loadCredentials();
    if (state.tab === 'mail') await loadMailTemplates();
  } catch (error) {
    state.error = error.message;
    toast(error.message);
    state.view = 'list';
    state.detail = null;
    state.loading = false;
    await loadList();
    return;
  }
  state.loading = false;
  render();
}

async function refreshDetail() {
  if (state.detail) await loadDetail(state.detail.engagement.id);
  else await loadList();
}

async function loadScope() {
  const id = state.detail.engagement.id;
  state.scope = await api(`/api/engagements/${id}/scope?` + qs());
}

async function loadCredentials() {
  const id = state.detail.engagement.id;
  try {
    state.credentials = await api(`/api/engagements/${id}/credentials?` + qs());
  } catch {
    state.credentials = { credentials: null, canEdit: false };
  }
}

async function loadMailTemplates() {
  state.mailTemplates = null;
  state.mailTemplatesError = false;

  if (!state.detail) return;
  // I template non sono visibili a Cliente, PMO e Auditor.
  if (!['Manager', 'Pentester'].includes(state.role)) return;

  try {
    state.mailTemplates = await api(
      `/api/engagements/${engagedId()}/mail-templates?` + qs());
  } catch {
    state.mailTemplates = null;
    state.mailTemplatesError = true;
  }
}

async function loadSolicitations() {
  try {
    state.rules = await api('/api/solicitations/rules?' + qs());
    state.due = await api('/api/solicitations/due?' + qs());
  } catch {
    state.rules = [];
    state.due = [];
  }
}

async function loadClients() {
  try {
    state.clients = await api('/api/clients?' + qs());
  } catch {
    state.clients = [];
  }
  if (isClient() && state.clients.length &&
      !state.clients.some(c => c.id === state.clientId)) {
    state.clientId = state.clients[0].id;
    localStorage.setItem('cep.client', state.clientId);
  }
  fillClientSelect();
  updateHeader();
}

/* ====== STATI WORKFLOW ====== */
// La UI non ricalcola lo stato: legge actionState/tabStates dal server.
function actionState(e) {
  return e && e.actionState ? e.actionState : null;
}

function statusPill(e) {
  const s = actionState(e);
  if (!s) return ['Stato non disponibile', 'neutral'];
  switch (s.kind) {
    case 'action': return ['Da gestire', 'action'];
    case 'waiting': return ['In attesa', 'wait'];
    case 'progress': return ['In corso', 'progress'];
    case 'done': return ['Completato', 'done'];
    case 'blocked': return ['Bloccato', 'blocked'];
    default: return [s.label || 'Stato non disponibile', 'neutral'];
  }
}

function statusText(e) {
  const s = actionState(e);
  return s && s.label ? s.label : '';
}

function statusOwner(e) {
  const s = actionState(e);
  return s && s.kind === 'waiting' && s.ownerLabel ? s.ownerLabel : '';
}

function daysSince(date) {
  if (!date) return null;
  const d = new Date(String(date).substring(0, 10) + 'T00:00:00');
  if (Number.isNaN(d.getTime())) return null;
  const now = new Date(today() + 'T00:00:00');
  return Math.max(0, Math.round((now - d) / 86400000));
}

function statusAge(e) {
  const s = actionState(e);
  if (!s || (s.kind !== 'action' && s.kind !== 'waiting')) return '';
  const n = daysSince(s.since);
  if (n === null || n < 1) return '';
  const label = n === 1 ? 'da 1 giorno' : `da ${n} giorni`;
  if (s.kind === 'action') {
    return `<span class="status-age late">${label}</span>`;
  }
  return `<span class="status-age ${n >= 5 ? 'overdue' : ''}">${label}</span>`;
}

// Varianti compatte per la tabella della homepage (variante B).
function delayCellCompact(e) {
  const a = e && e.preparationAlert;
  if (!a) return '<span class="delay-none" aria-hidden="true">–</span>';

  const days = Number(a.daysToStart) || 0;
  const label = days > 0
    ? `${days} gg`
    : days === 0 ? 'oggi' : `${Math.abs(days)} gg fa`;
  const full = (a.missing || [])
    .map(m => m === 'scope' ? 'Scope' : 'Credenziali')
    .join(' e ');
  const title = `${full} non completati: ${days > 0
    ? `mancano ${days} giorni all'avvio`
    : days < 0 ? `l'avvio è già avvenuto da ${Math.abs(days)} giorni` : 'l\'avvio è oggi'}.`;

  return `<span class="delay delay-sm" title="${esc(title)}">${esc(label)}</span>`;
}

function delayBadge(e) {
  const a = e && e.preparationAlert;
  if (!a) return '';

  const days = Number(a.daysToStart) || 0;
  const text = days > 0
    ? `${days} gg all'avvio`
    : days === 0 ? 'avvio oggi' : 'avvio superato';

  return `<span class="delay delay-sm">${esc(text)}</span>`;
}

// Fase del workflow in poco spazio: barra a 6 segmenti + nome del passo.
function phaseCell(e) {
  const raw = Number(e.stepIndex) || 0;
  const index = Math.max(0, Math.min(raw, STEPS.length - 1));
  const done = raw >= STEPS.length;
  const name = done ? 'Completato' : STEPS[index][0];
  const title = done
    ? 'Workflow completato'
    : `Passo ${index + 1} di ${STEPS.length}: ${STEPS[index][0]} — ${STEPS[index][1]}`;

  return `<span class="phase" title="${esc(title)}">${mini(raw)}<span class="phase-name">${esc(name)}</span></span>`;
}

function statusCellCompact(e) {
  const owner = statusOwner(e);
  return `<div class="status-cell status-mini">${pill(statusPill(e))}
    ${owner ? `<span class="status-owner">${esc(owner)}</span>` : ''}
    ${statusAge(e)}</div>`;
}

function rowClass(e) {
  const s = actionState(e);
  return s ? ` is-${s.kind}` : '';
}

function tabState(d, k) {
  const t = d && d.tabStates ? d.tabStates[k] : null;
  if (t) return t.state;
  return legacyTabState(d, k);
}

function tabReason(d, k) {
  const t = d && d.tabStates ? d.tabStates[k] : null;
  return t && t.reason ? t.reason : '';
}

// Fallback per compatibilità con un backend precedente.
function legacyTabState(d, k) {
  const e = d.engagement;
  const c = d.capabilities || {};
  const pending = (e.proposals || []).some(p => p.status === 'Pending');
  if (k === 'docs') {
    const nS = !e.hasManleva && c.canUploadManleva;
    const nO = !e.orderConfirmed && c.canManageEngagementDocs;
    return e.hasManleva && e.orderConfirmed && e.financialsDone && e.financialsApproved ? 'ok' : (nS || nO) ? 'todo' : 'wait';
  }
  if (k === 'plan') {
    if (!e.hasManleva || !e.orderConfirmed || !e.financialsDone || !e.financialsApproved) return 'lock';
    if (d.todo && d.todo.targetTab === 'plan') return 'todo';
    if (pending) return 'wait';
    return e.acceptedProposal ? 'ok' : 'wait';
  }
  if (k === 'scope') {
    if (!e.hasManleva || !e.orderConfirmed || !e.financialsDone || !e.financialsApproved) return 'lock';
    if (d.scope && d.scope.done) return 'ok';
    return canEditPreparation(d) ? 'todo' : 'wait';
  }
  if (k === 'cred') {
    if (!e.hasManleva || !e.orderConfirmed || !e.financialsDone || !e.financialsApproved || !c.canCredentials) return 'lock';
    if (d.credentials && d.credentials.done) return 'ok';
    return canEditCredentials(d) ? 'todo' : 'wait';
  }
  if (k === 'reports') {
    if (d.todo && d.todo.targetTab === 'reports') return 'todo';
    if ((e.reports || []).some(r => r.published)) return 'ok';
    if (!c.isClient && ((e.reports || []).length || d.phase === 'Reporting')) return 'wait';
    return 'lock';
  }
  return 'none';
}

function defaultTab(d) {
  return ['docs', 'scope', 'plan', 'cred', 'reports'].find(k => tabState(d, k) === 'todo') || 'docs';
}

function canEditPreparation(d) {
  const e = d.engagement;
  if (!e.hasManleva || !e.orderConfirmed || !e.financialsDone || !e.financialsApproved) return false;
  if (state.role === 'Client')
    return d.phase === 'Scope' || d.phase === 'Planning' || d.phase === 'Credentials' || d.phase === 'Scheduled';
  if (state.role === 'PMO')
    return d.phase === 'Scope' || d.phase === 'Planning' || d.phase === 'Credentials' || d.phase === 'Scheduled' || d.phase === 'Running';
  return false;
}

function canEditCredentials(d) {
  // Il server calcola il permesso effettivo (include il Manager).
  if (d && d.capabilities && typeof d.capabilities.canEditCredentials === 'boolean')
    return d.capabilities.canEditCredentials;
  return canEditPreparation(d);
}

/* ====== COMPONENTI ====== */
function mini(stepIndex) {
  return `<div class="mini" aria-hidden="true">${STEPS.map((_, i) =>
    `<i class="${stepIndex > i ? 'on' : stepIndex === i ? 'cur' : ''}"></i>`).join('')}</div>`;
}

function vstepper(stepIndex) {
  return `<ol class="vsteps">${STEPS.map((x, i) => {
    const cls = stepIndex > i ? 'done' : stepIndex === i ? 'cur' : 'future';
    const mark = stepIndex > i
      ? '<svg aria-hidden="true"><use href="#i-check"></use></svg>'
      : String(i + 1);
    return `
    <li class="${cls}"${stepIndex === i ? ' aria-current="step"' : ''}>
      <span class="vt" aria-hidden="true">${mark}</span>
      <div class="vtx"><b>${esc(x[0])}</b><em class="vsd">${esc(x[1])}</em></div>
    </li>`;
  }).join('')}</ol>`;
}

function cprogress(stepIndex) {
  const done = stepIndex >= STEPS.length;
  const cur = Math.max(0, Math.min(stepIndex, STEPS.length - 1));
  return `<div class="cprog">
    <div class="cbar" aria-hidden="true">${STEPS.map((_, i) =>
      `<i class="${stepIndex > i ? 'on' : stepIndex === i ? 'cur' : ''}"></i>`).join('')}</div>
    <div class="clabel"><span>${done ? '<b>Completato</b>' : `Passo <b>${cur + 1} di ${STEPS.length}</b>`}</span><span>${done ? 'Tutti i passi conclusi' : esc(STEPS[cur][0])}</span></div>
  </div>`;
}

function mailSubject(type) {
  if (MAIL_META[type]) return MAIL_META[type].subj;
  if (type && type.startsWith('solicitation:')) return `Sollecito: ${type.split(':')[1]}`;
  return type;
}

function entryAuto(mail, key) {
  const info = mail && mail[key];
  return !!(info && info[key]);
}

/* ====== LISTA ====== */
function listTabs() {
  if (isClient()) return '';
  return `<div class="seg" role="tablist">
    <button role="tab" aria-selected="${state.listTab === 'eng'}" class="${state.listTab === 'eng' ? 'on' : ''}" data-act="list-tab" data-tab="eng">Engagement</button>
    <button role="tab" aria-selected="${state.listTab === 'rem'}" class="${state.listTab === 'rem' ? 'on' : ''}" data-act="list-tab" data-tab="rem">Solleciti automatici <span class="cnt">${state.due.length}</span></button>
  </div>`;
}

const normText = v => String(v == null ? '' : v)
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .toLowerCase();

// Tutti i campi mostrati in tabella finiscono nell'indice di ricerca:
// nome, codice, cliente, tipologia, passo, stato, responsabile, periodo e ritardo.
function searchableRow(e) {
  const s = actionState(e);
  const raw = Number(e.stepIndex) || 0;
  const step = raw >= STEPS.length
    ? ['Completato', 'Workflow completato']
    : STEPS[Math.max(0, Math.min(raw, STEPS.length - 1))];
  const alert = e.preparationAlert;
  const age = s && s.since ? daysSince(s.since) : null;
  return normText([
    e.name, e.id, e.clientName, typeLabel(e.type),
    s ? s.label : '', s ? s.kind : '', statusOwner(e),
    statusPill(e).join(' '),
    age ? `da ${age} giorni` : '',
    step ? `${step[0]} ${step[1]}` : '',
    e.periodStart
      ? `${fmt(e.periodStart)} ${fmt(e.periodEnd)} ${e.periodStart} ${e.periodEnd}`
      : 'da definire',
    alert
      ? `ritardo ${(alert.missing || []).join(' ')} ${alert.daysToStart} gg ${alert.daysToStart} giorni`
      : ''
  ].join(' '));
}

function sortEngagements(list) {
  const rank = { action: 0, waiting: 1, progress: 2, blocked: 3, neutral: 4, done: 5 };
  const priority = (a, b) => {
    const ra = rank[(actionState(a) || {}).kind] ?? 9;
    const rb = rank[(actionState(b) || {}).kind] ?? 9;
    if (ra !== rb) return ra - rb;
    return (a.periodStart || '9999-12-31').localeCompare(b.periodStart || '9999-12-31');
  };
  const mode = state.listSort || 'priority';
  return list.slice().sort((a, b) => {
    if (mode === 'start') {
      // "Avvio più vicino": prima gli avvii futuri (dal più vicino), poi
      // quelli già passati (dal più recente), infine chi non ha date.
      const group = e => !e.periodStart ? 2 : e.periodStart >= today() ? 0 : 1;
      const diff = group(a) - group(b);
      if (diff) return diff;
      if (group(a) === 0) return a.periodStart.localeCompare(b.periodStart) || priority(a, b);
      if (group(a) === 1) return b.periodStart.localeCompare(a.periodStart) || priority(a, b);
      return priority(a, b);
    }
    if (mode === 'client') {
      return a.clientName.localeCompare(b.clientName, 'it') || priority(a, b);
    }
    if (mode === 'name') {
      return a.name.localeCompare(b.name, 'it');
    }
    return priority(a, b);
  });
}

function filteredList() {
  const terms = normText(state.listQuery).split(/\s+/).filter(Boolean);
  const match = e => {
    const s = actionState(e);
    const kind = s ? s.kind : 'neutral';
    if (state.listFilter === 'action' && kind !== 'action') return false;
    if (state.listFilter === 'waiting' && kind !== 'waiting') return false;
    if (state.listFilter === 'progress' && kind !== 'progress') return false;
    if (state.listFilter === 'done' && kind !== 'done') return false;
    if (state.listFilter === 'risk' && !e.preparationAlert) return false;
    if (!terms.length) return true;
    const haystack = searchableRow(e);
    return terms.every(term => haystack.includes(term));
  };
  return sortEngagements(state.list.filter(match));
}

function skeletonRows(count) {
  return `<div class="card" style="padding:18px">${Array.from({ length: count || 4 })
    .map(() => '<div class="skeleton" style="margin-bottom:14px"></div>')
    .join('')}</div>`;
}

function renderList() {
  const all = state.list;
  const data = filteredList();
  const todo = sortEngagements(all.filter(e => (actionState(e) || {}).kind === 'action'));
  const waiting = sortEngagements(all.filter(e => (actionState(e) || {}).kind === 'waiting'));
  const atRisk = all.filter(e => e.preparationAlert);
  const next = all
    .filter(e => e.periodStart && e.periodStart >= today())
    .sort((a, b) => a.periodStart.localeCompare(b.periodStart))[0];
  const who = state.clientId
    ? `Engagement di ${esc(clientLabel(state.clientId))}`
    : (isClient() ? 'Il tuo cliente' : 'Tutti i clienti');

  const headActions = canCreateEngagement()
    ? `<button class="btn sec" data-act="clients">Clienti e utenze</button><button class="btn pri" data-act="new-engagement">+ Nuovo engagement</button>`
    : isInternalRole()
      ? `<button class="btn sec" data-act="clients">Clienti e utenze</button>`
      : '';

  const tile = (key, cls, count, label) =>
    `<button class="tile ${cls} ${state.listFilter === key ? 'on' : ''}" data-act="list-filter" data-filter="${key}" aria-pressed="${state.listFilter === key}"><b>${count}</b><span>${label}</span></button>`;

  const cta = {
    docs: 'Apri i documenti',
    plan: 'Vai alla pianificazione',
    scope: 'Compila lo scope',
    cred: 'Compila le credenziali',
    reports: 'Vai ai report'

  const focus = todo.slice(0, 4).map(e => {
    const s = actionState(e) || {};
    return `<div class="focus-card">
      <b>${esc(e.name)}</b>
      <div class="fcard-meta">${esc(e.clientName)} · ${esc(e.id)} · ${esc(typeLabel(e.type))}</div>
      <div class="fcard-action"><span>${esc(s.label || 'Da gestire')}</span>${e.preparationAlert ? delayBadge(e) : statusAge(e)}</div>
      <div><button class="btn pri sm" data-act="open-action" data-id="${esc(e.id)}" data-tab="${esc(s.targetTab || 'docs')}">${esc(cta[s.targetTab] || 'Apri')}</button></div>
    </div>`;
  }).join('');

  const waitingRows = waiting.slice(0, 4).map(e => {
    const s = actionState(e) || {};
    const label = s.label || 'In attesa';
    const owner = statusOwner(e);
    // Se l'azione dice già "dal cliente" / "dal Manager", non ripetere il
    // responsabile subito dopo.
    const showOwner = !!owner &&
      !label.toLowerCase().includes(owner.toLowerCase());
    return `<button class="wrow" data-act="open" data-id="${esc(e.id)}">
      ${clientAvatar(clientFor(e))}
      <span class="wtt"><b>${esc(e.name)}</b><span>${esc(label)}${showOwner ? ` · ${esc(owner)}` : ''}</span></span>
      ${statusAge(e)}
    </button>`;
  }).join('');

  const rows = data.map(e => {
    const start = e.periodStart;
    return `<tr class="row${rowClass(e)}" data-act="open" data-id="${esc(e.id)}">
      <td data-label="Engagement"><button class="linkb rowname" data-act="open" data-id="${esc(e.id)}"><b>${esc(e.name)}</b></button>
        <span class="rowmeta">${esc(e.id)} <span class="kind">${esc(typeLabel(e.type))}</span></span></td>
      ${isClient() ? '' : `<td data-label="Cliente"><span class="client-cell">${clientAvatar(clientFor(e))}<span>${esc(e.clientName)}</span></span></td>`}
      <td data-label="Fase">${phaseCell(e)}</td>
      <td data-label="Stato">${statusCellCompact(e)}</td>
      <td data-label="Ritardo">${delayCellCompact(e)}</td>
      <td data-label="Periodo">${start ? `<span class="period">${fmt(start)} – ${fmt(e.periodEnd)}</span>` : '<span style="color:var(--muted)">Da definire</span>'}</td>

  ];
  const sortOptions = [
    ['priority', 'Priorità'], ['start', 'Avvio più vicino'],

    : `<div class="empty">Nessun engagement visibile per questo profilo e cliente.</div>`;

  const content = state.error
    ? `<div class="errorbox"><span><b>Impossibile caricare gli engagement.</b> ${esc(state.error)}</span><button class="btn sec sm" data-act="retry-list">Riprova</button></div>`
    : state.loading && !all.length
      ? skeletonRows(4)
      : `<div class="card listcard"><table class="list-table list-compact">
          <caption class="sr-only">Elenco engagement con fase del workflow, stato e proprietario dell'azione</caption>

          <tbody>${rows || `<tr><td colspan="${isClient() ? 5 : 6}">${empty}</td></tr>`}</tbody>
        </table></div>`;

  $('#app').innerHTML = `

        <h1>I miei engagement</h1>

      </div>
      <div class="head-acts">${headActions}</div>
    </div>
    <div class="tiles" role="group" aria-label="Riepilogo e filtri">
      ${tile('action', 'a', todo.length, 'Da gestire')}
      ${tile('waiting', 'w', waiting.length, 'In attesa di altri')}
      ${tile('risk', 'r', atRisk.length, 'A rischio avvio')}
      <div class="tile n" title="${next ? esc(`${fmt(next.periodStart)} · ${next.name}`) : ''}"><b>${next ? fmt(next.periodStart).slice(0, 5) : '–'}</b><span>Prossimo avvio</span></div>
    </div>
    <div class="home-cols">

        <div class="card sideblock">
          <div class="colhead"><h2>Da gestire ora</h2><span class="cnt c-action">${todo.length}</span></div>

          ${todo.length > 4 ? `<button class="linkb" data-act="list-filter" data-filter="action" style="margin-top:8px">Vedi tutte (${todo.length})</button>` : ''}
        </div>
        <div class="card sideblock">
          <div class="colhead"><h2 style="font-size:var(--fs-base)">In attesa di altri</h2><span class="cnt c-wait">${waiting.length}</span></div>
          ${waitingRows || '<div class="empty" style="padding:12px 0">Nessuna attesa in corso.</div>'}
          ${waiting.length > 4 ? `<button class="linkb" data-act="list-filter" data-filter="waiting" style="margin-top:8px">Vedi tutte (${waiting.length})</button>` : ''}
        </div>
      </section>
      <section class="home-main">
        <div class="colhead">
          <h2>Tutti gli engagement <span class="cnt">${data.length}${data.length !== all.length ? ` di ${all.length}` : ''}</span></h2>
          ${isClient() ? '' : `<button class="linkb" data-act="list-tab" data-tab="rem">Solleciti automatici · ${state.due.length}</button>`}
        </div>
        <div class="home-toolbar">

            <svg class="search-ico" aria-hidden="true"><use href="#i-search"></use></svg>
            <input type="search" id="list-search" value="${esc(state.listQuery)}" placeholder="Cerca in tutti i campi…" aria-label="Cerca per nome, codice, cliente, tipologia, fase, stato, periodo o ritardo">

          <select data-change="list-filter" aria-label="Filtra engagement">
            ${filterOptions.map(([k, l]) => `<option value="${k}" ${state.listFilter === k ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
          <select data-change="list-sort" aria-label="Ordina engagement">
            ${sortOptions.map(([k, l]) => `<option value="${k}" ${state.listSort === k ? 'selected' : ''}>Ordina: ${l}</option>`).join('')}
          </select>
        </div>
        ${content}
      </section>
    </div>`;
}

  const editable = state.role === 'PMO';
  const rules = state.rules.map(rule => `
    <div class="mailc">
      <div class="t"><b>${esc(rule.label)}</b><span>${esc(rule.description)}</span></div>
      <div class="ctl">
        ${editable
          ? `<label class="sw"><input type="checkbox" id="on_${esc(rule.key)}" data-change="rule" data-key="${esc(rule.key)}" ${rule.enabled ? 'checked' : ''}><i></i><span>${rule.enabled ? 'Attivo' : 'Disattivo'}</span></label>
             <label style="font-weight:500;margin:0">Soglia
               <input type="number" min="1" max="60" id="rule_${esc(rule.key)}" value="${rule.thresholdDays}" style="width:64px;padding:6px" data-change="rule" data-key="${esc(rule.key)}"> giorni</label>`
          : `<span style="color:var(--muted);font-size:var(--fs-md)">${rule.enabled ? 'Attivo' : 'Disattivo'} · soglia <b>${rule.thresholdDays}</b> giorni</span>`}
      </div>
    </div>`).join('');

  const due = state.due.length ? `
    <table><thead><tr><th>Engagement</th><th>Regola</th><th>Dettaglio</th><th>Stato</th><th></th></tr></thead><tbody>
      ${state.due.map(item => `<tr>
        <td class="name"><b>${esc(item.engagementId)}</b><span>${esc(item.clientName)}</span></td>
        <td>${esc(item.label)}</td>
        <td>${item.days} giorni (soglia ${item.thresholdDays})</td>
        <td>${pill(editable ? ['Da inviare', 'action'] : ['Da inviare', 'wait'])}</td>
        <td style="text-align:right">${editable
          ? `<button class="btn sec sm" data-act="send-solicitation" data-key="${esc(item.key)}">Invia ora</button>`
          : ''}</td>
      </tr>`).join('')}
    </tbody></table>` : '<div class="empty">Nessuna situazione in ritardo.</div>';

  $('#app').innerHTML = `
    <h1>Solleciti automatici</h1>
    <p class="sub">${editable
      ? 'Pannello PMO: attiva le regole e imposta le soglie.'
      : 'Sola lettura: le regole sono gestite da PMO.'} Data di riferimento: ${fmt(today())}</p>
    ${listTabs()}
    <div class="card"><h2>Regole</h2>${rules || '<div class="empty">Nessuna regola.</div>'}</div>
    <div class="card" style="margin-top:16px"><h2>Situazioni che richiedono un sollecito</h2>${due}</div>`;
}

/* ====== DETTAGLIO ====== */
function nextAction(d) {
  const e = d.engagement;
  const s = d.actionState;

  if (s) {
    const icons = { action: '!', waiting: '…', progress: '▶', done: '✓', neutral: '·', blocked: '<svg aria-hidden="true"><use href="#i-lock"></use></svg>' };
    const head = s.kind === 'action'
      ? 'Richiede il tuo intervento'
      : s.kind === 'waiting'
        ? `In attesa di ${s.ownerLabel || 'altri'}`
        : s.kind === 'done'
          ? 'Completato'
          : s.kind === 'blocked'
            ? 'Bloccato'
            : 'In corso';
    const labels = {
      docs: 'Vai ai documenti',
      plan: 'Vai alla pianificazione',
      scope: 'Compila lo scope',
      cred: 'Compila le credenziali',
      reports: 'Vai ai report'
    };
    const button = s.kind === 'action' && s.targetTab
      ? `<button class="btn pri sm" style="margin-left:8px" data-act="tab" data-tab="${esc(s.targetTab)}">${esc(labels[s.targetTab] || 'Apri')}</button>`
      : '';
    return `<div class="note ${s.kind}">
      <div class="note-head"><span class="note-ico">${icons[s.kind] || '·'}</span>${esc(head)}</div>
      ${s.label && s.label !== head ? `<div>${esc(s.label)}${button}</div>` : ''}
      ${statusAge(d)}
    </div>`;
  }

  // Fallback per un backend senza actionState.
  const accepted = e.acceptedProposal;
  const pending = (e.proposals || []).find(p => p.status === 'Pending');
  let message = '';
  switch (d.phase) {
    case 'Docs': {
      const missingDocs = [
        !e.hasManleva ? 'scheda tecnica firmata dal cliente' : '',
        !e.orderConfirmed ? 'registrazione dell\'ordine da parte del PMO' : '',
        !isClient() && d.capabilities && d.capabilities.canViewFinancials && !e.financialsDone ? 'costi e margine (PMO o Manager)' : '',
        e.financialsDone && !e.financialsApproved ? 'approvazione di costi e margine (Manager)' : ''
      ].filter(Boolean);
      message = (missingDocs.length
        ? 'In attesa di: ' + missingDocs.join(' e ')
        : 'In attesa del completamento della prima fase') +
        '. Il workflow prosegue con lo scope quando la prima fase è completa.';
      break;
    }
    case 'Scope':
      message = `In attesa dello scope dell'attività: ${d.scope && d.scope.done ? 'completato' : 'da compilare da cliente o PMO'}. Scope e credenziali si possono compilare già da ora.`;
      break;
    case 'Planning':
      message = pending
        ? `Proposta ${fmt(pending.startDate)} → ${fmt(pending.endDate)} in attesa dell'approvazione del Manager.`
        : 'Nessuna proposta di date ancora inviata.';
      break;
    case 'Credentials':
      message = `Scope completato: in attesa delle credenziali di accesso per l'esecuzione.`;
      break;
    case 'Scheduled':
      message = `Tutto pronto: attività pianificata dal ${fmt(accepted?.startDate)} al ${fmt(accepted?.endDate)}.`;
      break;
    case 'Running':
      message = `Attività in corso fino al ${fmt(accepted?.endDate)}.`;
      break;
    case 'Reporting':
      message = e.reviewStatus === 'Pending'
        ? 'Attività conclusa: deliverables in attesa di revisione del manager.'
        : `Attività conclusa il ${fmt(accepted?.endDate)}: i deliverables sono in redazione.`;
      break;
    case 'Done':
      return '<div class="note done"><div class="note-head"><span class="note-ico">✓</span>Completato</div>Engagement completato. I deliverables sono disponibili nella scheda Reportistica.</div>';
  }
  if (pending && pending.kind === 'resched' && d.phase !== 'Planning') {
    message += ` Richiesta di riprogrammazione ${fmt(pending.startDate)} → ${fmt(pending.endDate)} in attesa dell'approvazione del Manager.`;
  }
  const readOnly = state.role === 'Auditor' ? '<b>Profilo Auditor</b>: sola lettura. ' : '';
  return `<div class="note blocked">${readOnly}${esc(message)}</div>`;
}

function renderDetail() {
  const d = state.detail;
  const e = d.engagement;
  const st = statusPill(d);
  const owner = statusOwner(d);
  const capabilities = d.capabilities || {};
  const TABS = [['docs', 'Documenti'], ['scope', 'Scope'], ['plan', 'Pianificazione'], ['cred', 'Credenziali'], ['reports', 'Reportistica']];
  const mailCount = (d.mailLog || []).length;
  const body = {
    docs: tabDocs,
    plan: tabPlan,
    scope: tabScope,
    cred: tabCred,
    reports: tabReports,
    dl: tabDl,
    team: tabTeam,
    mail: tabMail,
    log: tabLog
  }[state.tab] || tabDocs;
  const activeReason = tabReason(d, state.tab);
  // Se il motivo dello stato coincide con l'azione già mostrata nel
  // riquadro in alto, evitiamo di ripeterlo sotto i tab.
  const tabHint = activeReason && activeReason !== statusText(d)
    ? activeReason
    : '';
  const step = Math.max(0, Math.min(Number(d.stepIndex) || 0, STEPS.length));
  const stepDone = step >= STEPS.length;
  const stepCount = stepDone ? 'Completato' : `${step + 1}/${STEPS.length}`;
  const prep = d.preparationAlert;
  const prepText = prep
    ? [
        (prep.missing || []).map(m => m === 'scope' ? 'Scope' : 'Credenziali').join(' e '),
        prep.daysToStart > 0
          ? `mancano ${prep.daysToStart} gg`
          : prep.daysToStart === 0
            ? 'avvio oggi'
            : `avvio superato da ${Math.abs(prep.daysToStart)} gg`
      ].join(' · ')
    : '';
  const period = e.acceptedProposal
    ? `${fmt(e.acceptedProposal.startDate)} – ${fmt(e.acceptedProposal.endDate)}`
    : 'Da definire';
  const extra = [
    ['dl', 'i-users', 'Distribution list', (d.distributionEffective || d.distributionList || []).length],
    ['team', 'i-team', 'Team', (d.teamEffective || []).length],
    ['mail', 'i-mail', isClient() ? 'Email ricevute' : 'Comunicazioni', mailCount],
    ['log', 'i-list', 'Registro', (d.audit || []).length]
  ];

  $('#app').innerHTML = `
    <button class="crumb" data-act="list">← Tutti gli engagement</button>
    <div class="workspace">
      <aside class="aside">
        <div class="card side">
          <p class="side-kicker">${esc(e.id)} · ${esc(typeLabel(e.type))}</p>
          <h1 class="side-title">${esc(e.name)}</h1>
          <div class="side-status">${pill(st)}${owner ? `<span class="status-owner">In attesa di <b>${esc(owner)}</b></span>` : ''}</div>
          ${prep ? `<div class="side-alert"><b>Preparazione in ritardo</b><span>${esc(prepText)}</span></div>` : ''}
          <div class="divider divider--steps"></div>
          <h3>Avanzamento <span class="side-count">${stepCount}</span></h3>
          ${vstepper(step)}
          ${cprogress(step)}
          <div class="divider"></div>
          <h3>Riepilogo</h3>
          <dl class="kv">
            <dt>Cliente</dt><dd><span class="client-cell" style="justify-content:flex-end">${clientAvatar(clientFor(e))}<span>${esc(e.clientName)}</span></span></dd>
            <dt>Responsabile</dt><dd>${esc(e.owner)}</dd>
            <dt>Periodo</dt><dd>${period}</dd>
            ${isClient() ? '' : `<dt>Ordine</dt><dd>${e.orderConfirmed ? esc(e.orderRef || 'Ricevuto') : 'Non ricevuto'}</dd>`}
            ${capabilities.canViewFinancials ? `<dt>Costi</dt><dd>${e.cost != null ? fmtMoney(e.cost) : '–'}</dd>
            <dt>Margine</dt><dd>${e.margin != null ? fmtPercent(e.margin) : '–'}</dd>
            <dt>Approvazione</dt><dd>${e.financialsApproved ? 'Approvato' : e.financialsDone ? 'In attesa' : '–'}</dd>` : ''}
          </dl>
          <div class="divider"></div>
          <div class="chips side-chips">
            ${extra.map(([key, icon, label, count]) => `<button class="chipb ${state.tab === key ? 'on' : ''}" data-act="tab" data-tab="${key}"><svg class="chip-ico" aria-hidden="true"><use href="#${icon}"></use></svg>${esc(label)} <span class="cnt">${count}</span></button>`).join('')}
          </div>
          <details class="side-legend">
            <summary>Cosa significano i simboli?</summary>
            <div class="lg">
              <span><b class="g-action">!</b> Da gestire</span>
              <span><b class="g-wait">…</b> In attesa di altri</span>
              <span><b class="g-progress">▶</b> In corso</span>
              <span><b class="g-done">✓</b> Completato</span>
              <span><b class="g-blocked"><svg aria-hidden="true"><use href="#i-lock"></use></svg></b> Bloccato</span>
            </div>
          </details>
        </div>
      </aside>
      <section class="main-col">
        ${nextAction(d)}
        <div class="tabs" role="tablist">
          ${TABS.map(([key, label]) => {
            const s = tabState(d, key);
            const reason = tabReason(d, key);
            return `<button role="tab" aria-selected="${state.tab === key}" class="tab s-${s} ${state.tab === key ? 'on' : ''}" data-act="tab" data-tab="${key}" title="${esc(reason || '')}" aria-label="${esc(label + (reason ? ': ' + reason : ''))}">${label}${s === 'lock' ? ' <span class="lock" aria-label="bloccato"><svg aria-hidden="true"><use href="#i-lock"></use></svg></span>' : ''}</button>`;
          }).join('')}
        </div>
        ${tabHint ? `<p class="hint" style="margin:-8px 0 14px">${esc(tabHint)}</p>` : ''}
        ${body(d)}
      </section>
    </div>`;
}

/* ====== SCHEDE ====== */
function docRow(icon, title, subtitle, right) {
  return `<div class="doc"><div class="ico">${esc(icon)}</div>
    <div class="t"><b>${title}</b><span>${subtitle}</span></div>${right}</div>`;
}

function isSampleDoc(path) {
  return typeof path === 'string' && path.startsWith('samples/');
}

function docName(path) {
  return typeof path === 'string' && path
    ? path.split('/').pop()
    : '';
}

function docLink(path) {
  return `<a class="btn sec sm" href="/${esc(path)}" target="_blank" rel="noopener">Apri</a>`;
}

function tabDocs(d) {
  const e = d.engagement;
  const c = d.capabilities || {};
  const canManleva = c.canUploadManleva;
  const canDocs = c.canManageEngagementDocs;
  const canCreds = c.canCredentials;

  let html = `<div class="note">Profilo <b>${esc(ROLE_LABEL[state.role])}</b> · puoi vedere: ${esc(VISIBILITY[state.role] || '')}.</div>
    <div class="card"><h2>Documenti associati</h2>`;

  html += docRow('SCH', 'Scheda tecnica con manleva',
    e.hasManleva
      ? `Firmato · ${esc(docName(e.manlevaFile))}`
      : 'Da firmare e caricare da parte del cliente: vale anche come manleva',
    e.hasManleva
      ? (isSampleDoc(e.manlevaFile)
          ? `<span class="decision-group">${docLink(e.manlevaFile)}${pill(['Firmato', 'ok'])}</span>`
          : pill(['Firmato', 'ok']))
      : canManleva
        ? `<button class="btn pri sm" data-act="upload-manleva">Carica firmato${isClient() ? '' : ' (per conto del cliente)'}</button>`
        : pill(['In attesa cliente', 'warn']));

  html += docRow('ING', 'Documento di ingaggio',
    e.documentoIngaggioFile ? esc(docName(e.documentoIngaggioFile)) : 'Non ancora caricato',
    e.documentoIngaggioFile
      ? `<span class="decision-group">${isSampleDoc(e.documentoIngaggioFile) ? docLink(e.documentoIngaggioFile) : ''}${pill(['Disponibile', 'ok'])}</span>`
      : canDocs
        ? `<button class="btn pri sm" data-act="upload-ingaggio">Carica</button>`
        : pill(['Non disponibile', 'mute']));

  if (!isClient()) {
    html += docRow('PO', 'Ordine',
      e.orderConfirmed ? `Ricevuto · ${esc(e.orderRef || '')}` : 'In attesa di registrazione',
      e.orderConfirmed
        ? pill(['Ricevuto', 'ok'])
        : canDocs
          ? `<button class="btn acc sm" data-act="register-order">Registra ordine ricevuto</button>`
          : pill(['In attesa ordine', 'warn']));

    if (c.canViewFinancials) {
      const finDone = !!e.financialsDone && e.cost != null && e.margin != null;
      const finApproved = !!e.financialsApproved;
      const canEditFin = !!c.canEditFinancials;
      const canApproveFin = !!c.canApproveFinancials;
      const finTotal = finDone ? financialValue(e.cost, e.margin) : null;
      const finEdit = canEditFin
        ? '<button class="btn sec sm" data-act="edit-financials">Modifica</button>'
        : '';

      let finSubtitle;
      let finAction;

      if (!finDone) {
        finSubtitle = 'Da compilare da PMO o Manager nella prima fase';
        finAction = canEditFin
          ? '<button class="btn pri sm" data-act="edit-financials">Compila</button>'
          : pill(['Da completare', 'warn']);
      } else if (!finApproved) {
        finSubtitle = `Costo ${fmtMoney(e.cost)} · margine ${fmtPercent(e.margin)} · valore ${fmtMoney(finTotal)} · in attesa di approvazione del Manager`;
        finAction = canApproveFin
          ? `<span class="decision-group"><button class="decide yes sm" data-act="approve-financials">Approva</button>${finEdit}</span>`
          : canEditFin
            ? finEdit
            : pill(['In attesa di approvazione', 'wait']);
      } else {
        finSubtitle = `Costo ${fmtMoney(e.cost)} · margine ${fmtPercent(e.margin)} · valore ${fmtMoney(finTotal)} · approvato dal Manager${e.financialsApprovedDate ? ` il ${fmt(e.financialsApprovedDate)}` : ''}`;
        finAction = canEditFin
          ? finEdit
          : pill(['Approvato', 'ok']);
      }

      html += docRow('EUR', 'Costi e margine', finSubtitle, finAction);
    }
  }

  if (canCreds) {
    const cred = d.credentials || e.credentials;
    html += docRow('CRED', 'Credenziali fornite',
      cred && cred.done ? 'Credenziali consegnate tramite canale sicuro' : 'Non ancora fornite',
      cred && cred.done
        ? pill(['Fornite', 'ok']) + ' <button class="btn sec sm" data-act="tab" data-tab="cred">Dettagli</button>'
        : canEditCredentials(d)
          ? `<button class="btn pri sm" data-act="tab" data-tab="cred">Compila</button>`
          : pill(['In attesa cliente', 'warn']));
  }

  const reports = e.reports || [];
  const published = reports.filter(r => r.published).length;
  html += docRow('RPT', 'Deliverables',
    published
      ? `${published} pubblicati${!isClient() && reports.length > published ? ` · ${reports.length - published} in bozza` : ''}`
      : 'Nessun deliverable ancora disponibile',
    published
      ? pill(['Disponibili', 'ok']) + ' <button class="btn pri sm" data-act="tab" data-tab="reports">Apri</button>'
      : pill(['Non disponibili', 'mute']));

  html += `</div>
    <p style="color:var(--muted);font-size:var(--fs-md);margin-top:12px">Scope e pianificazione si sbloccano quando la scheda tecnica firmata è caricata, l'ordine è registrato dal PMO e costi e margine sono approvati.</p>`;
  return html;
}

function canDecideProposal(p) {
  // Le proposte di pianificazione (cliente o PMO) sono approvate solo dal Manager.
  return p.status === 'Pending' && state.role === 'Manager';
}

function tabPlan(d) {
  const e = d.engagement;
  const c = d.capabilities || {};
  const canPropose = c.canPropose;

  if (!e.hasManleva || !e.orderConfirmed || !e.financialsDone) {
    return `<div class="note lockbox"><b>Pianificazione bloccata.</b> Servono la scheda tecnica firmata dal cliente, l'ordine registrato dal PMO e costi/margine approvati dal Manager.</div>`;
  }

  const pending = (e.proposals || []).find(p => p.status === 'Pending');
  const accepted = e.acceptedProposal;
  const notice = d.planningNotice;
  const earlyWarning = notice && !accepted && canPropose
    ? `<div class="note waiting"><b>Avviso pianificazione.</b>
        Non è possibile proporre una pianificazione prima di due settimane dalla
        richiesta (${fmt(notice.requestDate)}): potrai proporla dal
        <b>${fmt(notice.availableFrom)}</b>${notice.daysRemaining > 0
          ? `, tra ${notice.daysRemaining} ${notice.daysRemaining === 1 ? 'giorno' : 'giorni'}`
          : ''}. L'avviso non blocca l'invio.</div>`
    : '';

  const list = (e.proposals || []).length
    ? [...e.proposals].reverse().map(p => {
        const status = proposalLabel(p);
        return `<div class="prop">
          <div class="d">
            <b>${fmt(p.startDate)} → ${fmt(p.endDate)}</b>
            ${p.kind === 'resched' ? '<span class="badge-kind">Riprogrammazione</span>' : ''}
            <span>${p.from === 'Client' ? 'Cliente' : 'PMO'} · ${esc(p.by)} · ${fmt(p.date)}
              ${p.note ? ` · “${esc(p.note)}”` : ''}${p.reason ? ` · Motivo rifiuto: ${esc(p.reason)}` : ''}</span>
          </div>
          ${pill(status)}
          ${canDecideProposal(p)
            ? `<div class="decision-group" role="group" aria-label="Decisione sulla proposta">
                 <button class="decide yes sm" data-act="decide" data-pid="${esc(p.id)}" data-accept="1">Approva</button>
                 <button class="decide no sm" data-act="decide" data-pid="${esc(p.id)}" data-accept="0">Rifiuta</button>
               </div>`
            : ''}
        </div>`;
      }).join('')
    : '<div class="empty">Nessuna proposta ancora inviata.</div>';

  let right;
  if (accepted) {
    let action = '';
    if (pending) {
      action = `<p style="color:var(--muted);font-size:var(--fs-md);margin:12px 0 0">Richiesta di riprogrammazione in corso: decide il Manager.</p>`;
    } else if (!canPropose) {
      action = '';
    } else if (d.phase !== 'Done') {
      action = `<div style="margin-top:14px"><button class="btn sec" data-act="reschedule">Richiedi riprogrammazione</button></div>`;
    }
    right = `<h2>Pianificazione confermata</h2>
      <div class="note done">
        <b>${fmt(accepted.startDate)} → ${fmt(accepted.endDate)}</b><br>
        Approvata dal Manager${accepted.from === 'Client' ? ' · proposta del cliente' : ' · proposta del PMO'}.</div>${action}`;
  } else if (!canPropose) {
    right = `<h2>Nuova proposta</h2><div class="note lockbox">Sola lettura: proposte di date solo da cliente e PMO.</div>`;
  } else {
    right = `<h2>Nuova proposta</h2>
      ${earlyWarning}
      <p class="sub" style="margin-bottom:12px">Le date proposte da cliente o PMO vengono approvate dal Manager.</p>
      <div class="fgrid">
        <div><label for="ps">Inizio attività</label><input type="date" id="ps" min="${today()}"></div>
        <div><label for="pe">Fine attività</label><input type="date" id="pe" min="${today()}"></div>
        <div class="full"><label for="pn">Note (vincoli, finestre di manutenzione…)</label><textarea id="pn" rows="3"></textarea></div>
      </div>
      <div style="margin-top:14px"><button class="btn pri" data-act="propose">Invia proposta al Manager</button></div>`;
  }

  return `${!accepted && canEditPreparation(d)
    ? '<div class="note progress">Puoi già compilare <b>scope</b> e <b>credenziali</b>: non serve attendere la conferma delle date.</div>'
    : ''}<div class="grid two" style="align-items:start">
    <div class="card"><h2>Proposte e richieste</h2>${list}</div>
    <div class="card">${right}</div>
  </div>`;
}

function isEditing(key) {
  return !!state.editing[key];
}

function authorOf(x) {
  return x.by === 'Client' ? 'cliente' : `${ROLE_LABEL[x.by] || x.by} per conto del cliente`;
}

function tabScope(d) {
  const e = d.engagement;
  if (!e.hasManleva || !e.orderConfirmed || !e.financialsDone) {
    return `<div class="note lockbox"><b>Sezione bloccata.</b> Lo scope si sblocca dopo la firma della manleva, la registrazione dell'ordine e l'approvazione di costi e margine.</div>`;
  }

  const info = state.scope;
  if (!info) return `<div class="card"><h2>Scope</h2><p class="sub">Caricamento…</p></div>`;
  const s = info.scope || {};
  const editing = isEditing('scope');

  if (s.done && !editing) {
    return `<div class="card"><h2>Scope ${pill(['Fornito', 'ok'])}</h2>
      <p class="sub">Fornito da ${esc(authorOf(s))} il ${fmt(s.date)}.</p>
      <table style="font-size:var(--fs-base)">${[
        ['Target (hostname / URL)', s.host],
        ['Indirizzi / range IP', s.ipRange || '–'],
        ['Fuori scope', s.outOfScope || '–'],
        ['Finestra oraria e vincoli', s.window || '–'],
        ['Referente tecnico', s.contact],
        ['Note', s.notes || '–']
      ].map(r => `<tr><td style="padding:9px 0;color:var(--muted);width:32%">${r[0]}</td><td><b>${esc(r[1])}</b></td></tr>`).join('')}
      </table>
      ${info.canEdit ? `<div style="margin-top:14px"><button class="btn sec sm" data-act="start-edit" data-key="scope">Modifica</button></div>` : ''}
    </div>`;
  }

  if (!info.canEdit) {
    return `<div class="note ${s.done ? 'blocked' : 'waiting'}">${s.done ? 'Lo scope non è più modificabile.' : 'In attesa che lo scope venga fornito dal cliente.'}</div>`;
  }

  return `<div class="card"><h2>${s.done ? 'Modifica scope' : 'Compila lo scope'}</h2>
    ${!e.acceptedProposal ? '<div class="note progress">La pianificazione non è ancora confermata: puoi compilare lo scope già ora, resterà valido.</div>' : ''}
    ${!isClient() ? '<div class="note">Stai compilando <b>per conto del cliente</b>.</div>' : ''}
    <div class="fgrid">
      <div><label for="f_host">Target (hostname / URL)*</label><input type="text" id="f_host" value="${esc(s.host || '')}" placeholder="es. api-uat.cliente.it"></div>
