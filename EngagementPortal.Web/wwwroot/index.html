      <div><label for="f_ipRange">Indirizzi / range IP</label><input type="text" id="f_ipRange" value="${esc(s.ipRange || '')}" placeholder="es. 10.0.0.0/28"></div>
      <div><label for="f_outOfScope">Fuori scope</label><input type="text" id="f_outOfScope" value="${esc(s.outOfScope || '')}" placeholder="Sistemi o ambienti da non testare"></div>
      <div><label for="f_window">Finestra oraria e vincoli</label><input type="text" id="f_window" value="${esc(s.window || '')}" placeholder="es. notturno 22:00–06:00"></div>
      <div><label for="f_contact">Referente tecnico*</label><input type="text" id="f_contact" value="${esc(s.contact || '')}" placeholder="Nome, telefono"></div>
      <div class="full"><label for="f_notes">Note</label><textarea id="f_notes" rows="3">${esc(s.notes || '')}</textarea></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px">
      <button class="btn pri" data-act="save-scope">Salva scope</button>
      ${s.done ? '<button class="btn sec" data-act="cancel-edit" data-key="scope">Annulla</button>' : ''}
    </div>
  </div>`;
}

function tabCred(d) {
  const e = d.engagement;
  if (!e.hasManleva || !e.orderConfirmed || !e.financialsDone) {
    return `<div class="note lockbox"><b>Sezione bloccata.</b> Le credenziali si sbloccano dopo la firma della manleva, la registrazione dell'ordine e l'approvazione di costi e margine.</div>`;
  }

  const info = state.credentials;
  if (!info) return `<div class="card"><h2>Credenziali</h2><p class="sub">Caricamento…</p></div>`;
  if (!info.credentials) {
    return `<div class="note lockbox"><b>Accesso non consentito.</b> Le credenziali non sono visibili al profilo ${esc(ROLE_LABEL[state.role])}.</div>`;
  }

  const c = info.credentials;
  const editing = isEditing('cred');

  if (c.done && !editing) {
    return `<div class="card"><h2>Credenziali ${pill(['Fornite', 'ok'])}</h2>
      <p class="sub">Fornite da ${esc(authorOf(c))} il ${fmt(c.date)}. Le password non sono conservate nel portale.</p>
      <table style="font-size:var(--fs-base)">${[
        ['VPN', c.vpn],
        ['Utenze di test', c.users],
        ['Metodo di consegna dei segreti', c.deliveryMethod],
        ['Note', c.notes || '–']
      ].map(r => `<tr><td style="padding:9px 0;color:var(--muted);width:32%">${r[0]}</td><td><b>${esc(r[1])}</b></td></tr>`).join('')}
      </table>
      ${info.canEdit ? `<div style="margin-top:14px"><button class="btn sec sm" data-act="start-edit" data-key="cred">Modifica</button></div>` : ''}
    </div>`;
  }

  if (!info.canEdit) {
    return `<div class="note ${c.done ? 'blocked' : 'waiting'}">${c.done ? 'Le credenziali non sono più modificabili.' : 'Credenziali non ancora fornite: in attesa del cliente.'}</div>`;
  }

  const options = ['Vault aziendale', 'File cifrato (password su canale separato)', 'Altro (concordato con Pentester)'];
  return `<div class="card"><h2>${c.done ? 'Modifica credenziali' : 'Fornisci le credenziali'}</h2>
    ${!e.acceptedProposal ? '<div class="note progress">La pianificazione non è ancora confermata: puoi fornirle già ora, resteranno valide.</div>' : ''}
    <div class="note">Non scrivere password in questo modulo: indica solo dove e come verranno consegnate.</div>
    ${state.role === 'PMO' ? '<div class="note">Stai compilando come PMO <b>per conto del cliente</b>.</div>' : ''}
    <div class="fgrid">
      <div><label for="f_vpn">VPN (endpoint e profilo)*</label><input type="text" id="f_vpn" value="${esc(c.vpn || '')}" placeholder="es. vpn.cliente.it – profilo test"></div>
      <div><label for="f_users">Utenze di test*</label><input type="text" id="f_users" value="${esc(c.users || '')}" placeholder="es. 2 utenze: utente e amministratore"></div>
      <div><label for="f_deliveryMethod">Metodo di consegna dei segreti*</label>
        <select class="f" id="f_deliveryMethod">
          <option value="">Seleziona…</option>
          ${options.map(o => `<option ${c.deliveryMethod === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}
        </select></div>
      <div class="full"><label for="f_credNotes">Note</label><textarea id="f_credNotes" rows="3">${esc(c.notes || '')}</textarea></div>
    </div>
    <div style="margin-top:16px;display:flex;gap:10px">
      <button class="btn pri" data-act="save-credentials">Salva credenziali</button>
      ${c.done ? '<button class="btn sec" data-act="cancel-edit" data-key="cred">Annulla</button>' : ''}
    </div>
  </div>`;
}

function reviewCard(d) {
  const e = d.engagement;
  const reports = e.reports || [];
  const unpublished = reports.filter(r => !r.published).length;
  const status = reviewLabel(e.reviewStatus);
  let action = '';

  if (state.role === 'Pentester' && unpublished > 0 &&
      (e.reviewStatus === 'None' || e.reviewStatus === 'Changes')) {
    action = `<button class="btn pri" data-act="submit-review">Invia in revisione al manager</button>`;
  }
  if (state.role === 'Manager' && e.reviewStatus === 'Pending') {
    action = `<div class="decision-group">
      <button class="decide yes" data-act="review-decide" data-approve="1">Approva</button>
      <button class="decide warn" data-act="review-decide" data-approve="0">Richiedi modifiche</button>
    </div>`;
  }
  if (state.role === 'Pentester' && unpublished > 0 && e.reviewStatus === 'Approved') {
    action = `<button class="btn acc" data-act="publish">Pubblica al cliente${entryAuto(d.mail, 'deliver') ? ' e invia email' : ''}</button>`;
  }

  return `<div class="card" style="margin-bottom:16px"><h2>Revisione del manager ${pill(status)}</h2>
    <p class="sub" style="margin-bottom:${action ? 12 : 0}px">I deliverables non arrivano al cliente finché il manager non li approva.</p>
    ${action}</div>`;
}

function tabReports(d) {
  const e = d.engagement;
  const c = d.capabilities || {};
  const reports = e.reports || [];
  const published = reports.filter(r => r.published).length;

  if (!reports.length && !c.canUploadReports) {
    return '<div class="note lockbox"><b>Nessun deliverable disponibile.</b> La reportistica viene caricata dal Pentester e pubblicata al cliente dopo la revisione del manager.</div>';
  }

  let html = '';
  if (!c.isClient && (reports.length || e.reviewStatus !== 'None')) {
    html += reviewCard(d);
  }

  html += `<div class="card"><h2>Reportistica</h2>${
    reports.length
      ? reports.map(r => `<div class="doc">
          <div class="ico">${esc((r.type || 'FILE').substring(0, 4))}</div>
          <div class="t"><b>${esc(r.name)}</b>
            <span>${r.published ? `Pubblicato il ${fmtTime(r.date)}` : `Bozza del ${fmtTime(r.date)}`} · ${fmtSize(r.size)}</span></div>
          ${r.published ? pill(['Pubblicato', 'ok']) : pill(['Bozza', 'mute'])}
          <button class="btn pri sm" data-act="download-report" data-rid="${esc(r.id)}">Scarica</button>
        </div>`).join('')
      : '<div class="empty">Nessun deliverable disponibile.</div>'
  }</div>`;

  if (c.canUploadReports) {
    html += `<div class="card" style="margin-top:16px"><h2>Carica deliverables</h2>
      <p class="sub" style="margin-bottom:12px">I file caricati restano in bozza fino all'approvazione del manager. Un nuovo file azzera la revisione.</p>
      <button class="btn sec" data-act="upload-report">Carica file</button></div>`;
  }

  if (published > 0) {
    html += `<div class="card" style="margin-top:16px"><h2>Riepilogo findings</h2>
      <div style="display:flex;gap:20px;flex-wrap:wrap">
        <div style="flex:1;min-width:240px"><div class="bars">
          ${[['Critical', 1], ['High', 3], ['Medium', 7], ['Low', 5]].map(x =>
            `<div style="height:${x[1] * 13}px"><em>${x[0]} (${x[1]})</em></div>`).join('')}
        </div><div style="height:22px"></div></div>
        <div style="flex:1;min-width:240px;color:var(--muted);font-size:var(--fs-md)">Dati dimostrativi. Il piano di remediation è nel documento Evidenze.</div>
      </div></div>`;
  }

  return html;
}

function orgPill(org) {
  return `<span class="pill ${org === 'Cliente' ? 'p-progress' : org === 'Provider Pentester' ? 'p-done' : 'p-neutral'}">${esc(org)}</span>`;
}

function tabDl(d) {
  const c = d.capabilities || {};
  const notifications = d.distributionEffective || [];
  const deliverables = d.deliverablesEffective || [];
  const writable = c.canWrite;

  const section = kind => {
    const isDeliverables = kind === 'deliverables';
    const entries = (isDeliverables
      ? d.deliverablesDistributionList
      : d.distributionList) || [];
    const base = (isDeliverables ? d.deliverablesBase : d.distributionBase) || [];
    const effective = (isDeliverables ? deliverables : notifications);
    const title = isDeliverables
      ? 'Distribution list deliverables'
      : 'Distribution list notifiche';
    const subtitle = isDeliverables
      ? `Riceve l'invio dei deliverables.${d.deliverablesFallback
          ? ' Lista vuota: si usano temporaneamente i destinatari delle notifiche.'
          : ''}`
      : 'Riceve inizio/fine attività e i solleciti.';
    const prefix = isDeliverables ? 'dl2' : 'dl';
    const clientCount = effective.filter(x => x.organization === 'Cliente').length;

    const baseRows = base.map(entry => `<tr>
        <td><b>${esc(entry.name)}</b></td>
        <td>${esc(entry.email)}</td>
        <td>${orgPill(entry.organization)}</td>
      </tr>`).join('');

    const rows = entries.map(entry => {
      const removable = writable &&
        (state.role !== 'Client' || entry.organization === 'Cliente') &&
        !(entry.organization === 'Cliente' && clientCount <= 1);
      return `<tr>
        <td><b>${esc(entry.name)}</b></td>
        <td>${esc(entry.email)}</td>
        <td>${orgPill(entry.organization)}</td>
        ${writable ? `<td style="text-align:right">${removable
          ? `<button class="btn dng sm" data-act="remove-dl" data-list="${kind}" data-entry="${esc(entry.id)}">Rimuovi</button>` : ''}</td>` : ''}
      </tr>`;
    }).join('');

    const form = writable
      ? `<div style="margin-top:14px;border-top:1px solid var(--line-soft);padding-top:14px">
          <h3 style="font-size:var(--fs-base);margin:0 0 8px">Aggiungi destinatario ${isDeliverables ? 'deliverables' : 'notifiche'} all'engagement</h3>
          <div class="fgrid">
            <div><label for="${prefix}_n">Nome e cognome</label><input type="text" id="${prefix}_n"></div>
            <div><label for="${prefix}_e">Email</label><input type="text" id="${prefix}_e" placeholder="nome@dominio.it"></div>
            ${isClient() ? '' : `<div><label for="${prefix}_o">Organizzazione</label>
              <select class="f" id="${prefix}_o">
                <option>Cliente</option><option>Provider PMO</option><option>Provider Pentester</option>
              </select></div>`}
          </div>
          <div style="margin-top:14px"><button class="btn pri" data-act="add-dl" data-list="${kind}">Aggiungi</button></div>
        </div>`
      : '';

    return `<div class="card" style="margin-top:16px"><h2>${title} · ${effective.length}</h2>
      <p class="sub">${subtitle}${writable ? '' : ' Il tuo profilo è in sola lettura.'}</p>
      <h3 style="font-size:var(--fs-base);margin:14px 0 6px">Base cliente · ${base.length}</h3>
      <p class="sub" style="margin:0 0 6px">Comune a tutti gli engagement di ${esc(d.engagement.clientName)}. La gestisce il Manager in <b>Clienti e utenze</b>.</p>
      <table><thead><tr><th>Nome</th><th>Email</th><th>Organizzazione</th></tr></thead>
      <tbody>${baseRows || `<tr><td colspan="3" class="empty">Nessun destinatario base.</td></tr>`}</tbody></table>
      <h3 style="font-size:var(--fs-base);margin:18px 0 6px">Destinatari dell'engagement · ${entries.length}</h3>
      <table><thead><tr><th>Nome</th><th>Email</th><th>Organizzazione</th>${writable ? '<th></th>' : ''}</tr></thead>
      <tbody>${rows || `<tr><td colspan="${writable ? 4 : 3}" class="empty">Nessun destinatario specifico dell'engagement.</td></tr>`}</tbody></table>
      ${form}
    </div>`;
  };

  return `<div class="note">Due liste separate: <b>notifiche</b> (${notifications.length} indirizzi effettivi) per inizio/fine attività e solleciti, <b>deliverables</b> (${deliverables.length} indirizzi effettivi) per l'invio dei report.${writable ? '' : ' Il tuo profilo è in sola lettura.'}</div>
    ${section('notifications')}
    ${section('deliverables')}`;
}

function teamRows(rows, canRemove) {
  return rows.map(member => {
    const removable = canRemove &&
      (state.role !== 'Client' || member.organization === 'Cliente');
    return `<tr>
      <td><b>${esc(member.name)}</b><br><span class="hint">${esc(member.role || '—')}</span></td>
      <td>${esc(member.email)}</td>
      <td>${orgPill(member.organization)}</td>
      <td><span class="hint">${esc(member.invitedBy)} · ${fmt(member.invitedDate)}</span></td>
      <td style="text-align:right">${removable
        ? `<button class="btn dng sm" data-act="remove-team" data-member="${esc(member.id)}">Rimuovi</button>`
        : ''}</td>
    </tr>`;
  }).join('');
}

function tabTeam(d) {
  const c = d.capabilities || {};
  const base = d.teamBase || [];
  const own = d.team || [];
  const canInvite = !!c.canInviteTeam;
  const canRemove = !!c.canRemoveTeam;
  const colspan = canRemove ? 5 : 4;

  return `<div class="note">Partecipanti esterni al provider. Il <b>team cliente</b> vale per tutti gli engagement; il <b>team engagement</b> solo per questa attività. Gli inviti sono aperti a tutti tranne l'<b>Auditor</b>; rimuovono il <b>Manager</b> (tutti) e il <b>Cliente</b> (solo organizzazione Cliente).</div>
    <div class="card"><h2>Team cliente · ${base.length}</h2>
      <p class="sub">Base comune di ${esc(d.engagement.clientName)}.</p>
      <table><thead><tr><th>Nome</th><th>Email</th><th>Organizzazione</th><th>Invitato da</th>${canRemove ? '<th></th>' : ''}</tr></thead>
      <tbody>${teamRows(base, canRemove) || `<tr><td colspan="${colspan}" class="empty">Nessun partecipante base.</td></tr>`}</tbody></table>
    </div>
    <div class="card" style="margin-top:16px"><h2>Team engagement · ${own.length}</h2>
      <p class="sub">Partecipanti specifici di questo engagement.</p>
      <table><thead><tr><th>Nome</th><th>Email</th><th>Organizzazione</th><th>Invitato da</th>${canRemove ? '<th></th>' : ''}</tr></thead>
      <tbody>${teamRows(own, canRemove) || `<tr><td colspan="${colspan}" class="empty">Nessun partecipante specifico.</td></tr>`}</tbody></table>
    </div>
    ${canInvite
      ? `<div style="margin-top:14px"><button class="btn pri" data-act="invite-team">+ Invita partecipante</button></div>`
      : ''}`;
}

function tabMail(d) {
  const e = d.engagement;
  const c = d.capabilities || {};
  const notificationCount = (d.distributionEffective || []).length;
  const deliverableCount = (d.deliverablesEffective || []).length;
  const log = d.mailLog || [];

  if (isClient()) {
    return `<div class="card"><h2>Email ricevute</h2>
      ${log.length
        ? `<ul class="tl">${log.map(m => `<li>${esc(m.subject || mailSubject(m.type))}<span>${fmtTime(m.date)} · ${esc(m.recipients)}</span></li>`).join('')}</ul>`
        : '<div class="empty" style="padding:10px">Nessuna email ricevuta per questo engagement.</div>'}
    </div>`;
  }

  const manager = c.canManageMail;
  const accepted = e.acceptedProposal;
  const published = (e.reports || []).some(r => r.published);
  const when = {
    start: accepted ? `alla data di inizio (${fmt(accepted.startDate)})` : 'dopo l\'approvazione della pianificazione',
    end: accepted ? `alla data di fine (${fmt(accepted.endDate)})` : 'dopo l\'approvazione della pianificazione',
    deliver: 'alla pubblicazione dei deliverables'
  };

  const cards = ['start', 'end', 'deliver'].map(key => {
    const meta = MAIL_META[key];
    const auto = entryAuto(d.mail, key);
    const sentEntry = log.find(m => m.type === key);
    const available = key === 'deliver' ? published : !!accepted;
    const listLabel = key === 'deliver' ? 'deliverables' : 'notifiche';
    const listCount = key === 'deliver' ? deliverableCount : notificationCount;
    const status = sentEntry
      ? pill([`Inviata il ${fmtTime(sentEntry.date)}`, 'ok'])
      : auto ? pill([`Programmata: ${when[key]}`, 'info'])
        : pill(['Invio automatico disattivato', 'neutral']);
    return `<div class="mailc">
      <div class="t"><b>${esc(meta.t)}</b><span>${esc(meta.desc)}</span>
        <span>Lista: <b>${listLabel}</b> · ${listCount} destinatari effettivi</span>
        <span>Oggetto: ${esc(sentEntry?.subject || `[${e.id}] ${meta.subj}`)}</span>
        <div style="margin-top:8px">${status}</div></div>
      <div class="ctl">
        ${manager
          ? `<label class="sw"><input type="checkbox" data-act="toggle-mail" data-key="${key}" ${auto ? 'checked' : ''}><i></i><span>Invio automatico</span></label>
             <button class="btn sec sm" data-act="send-mail" data-key="${key}" ${available ? '' : 'disabled title="Non ancora disponibile"'}>Invia ora</button>`
          : `<span style="color:var(--muted);font-size:var(--fs-md)">Invio automatico: <b>${auto ? 'attivo' : 'disattivo'}</b></span>`}
      </div>
    </div>`;
  }).join('');

  return `<div class="note">${manager
    ? `Come <b>PMO</b> controlli l'invio automatico delle email. Notifiche: ${notificationCount} destinatari; deliverables: ${deliverableCount} destinatari.`
    : 'Le comunicazioni sono gestite da PMO: puoi consultarne lo stato (sola lettura).'}
    Nessun invio SMTP reale: la voce nel registro simula l'invio.</div>
    <div class="card"><h2>Email automatiche</h2>${cards}</div>
    <div class="card" style="margin-top:16px"><h2>Email inviate</h2>
      ${log.length
        ? `<ul class="tl">${[...log].reverse().map(m => `<li>${esc(m.subject || mailSubject(m.type))}
            <span>${fmtTime(m.date)} · ${esc(m.recipients)} · ${m.auto ? 'invio automatico' : 'invio manuale'}${m.templateSource ? ` · template ${esc(m.templateSource)}` : ''}${m.visibility === 'ProviderOnly' ? ' · interna' : ''}</span></li>`).join('')}</ul>`
        : '<div class="empty" style="padding:10px">Nessuna email ancora inviata.</div>'}
    </div>
    ${mailTemplatesSection(d)}`;
}

const TEMPLATE_SCOPES = {
  standard: 'Standard (globale)',
  client: 'Cliente',
  engagement: 'Engagement'
};

const TEMPLATE_SOURCE_LABEL = {
  standard: 'standard',
  client: 'cliente',
  engagement: 'engagement'
};

function templateScopeLabel(scope) {
  return TEMPLATE_SCOPES[scope] || scope;
}

function mailTemplatesSection(d) {
  const c = d.capabilities || {};

  // I template non sono visibili a Cliente, PMO e Auditor.
  if (!c.canManageMailTemplates) return '';

  const info = state.mailTemplates;

  if (!info) {
    return `<div class="card" style="margin-top:16px"><h2>Template email</h2>
      <p class="sub">${state.mailTemplatesError
        ? 'Impossibile caricare i template. Riprova più tardi.'
        : 'Caricamento…'}</p></div>`;
  }

  const allowed = ['standard', 'client', 'engagement'].filter(scope =>
    scope === 'engagement' ? info.canEditEngagement
      : scope === 'client' ? info.canEditClient
        : info.canEditStandard);

  const cards = info.templates.map(t => {
    let scope = state.mailTemplateScope[t.type];

    if (!allowed.includes(scope)) {
      scope = t.engagement && allowed.includes('engagement')
        ? 'engagement'
        : t.client && allowed.includes('client')
          ? 'client'
          : allowed[0] || 'standard';
      state.mailTemplateScope[t.type] = scope;
    }

    const raw = scope === 'standard'
      ? t.standard
      : scope === 'client'
        ? (t.client || t.standard)
        : (t.engagement || t.client || t.standard);

    const meta = MAIL_META[t.type] || { t: t.type };
    const options = ['standard', 'client', 'engagement'].map(option => {
      const custom = option === 'standard' ? t.standardCustom
        : option === 'client' ? !!t.client
          : !!t.engagement;
      return `<option value="${option}" ${scope === option ? 'selected' : ''} ${allowed.includes(option) ? '' : 'disabled'}>${esc(templateScopeLabel(option))}${custom ? ' · personalizzato' : ''}</option>`;
    }).join('');

    return `<div class="tpl-card">
      <div class="tpl-head"><b>${esc(meta.t)}</b>
        ${pill([TEMPLATE_SOURCE_LABEL[t.effective.source] || t.effective.source, 'info'])}</div>
      <div class="tpl-scope">
        <label for="tpl_scope_${t.type}">Ambito</label>
        <select class="f" id="tpl_scope_${t.type}" data-change="mail-template-scope" data-key="${t.type}" ${allowed.length === 1 ? 'disabled' : ''}>${options}</select>
      </div>
      <div class="tpl-grid">
        <div><label for="tpl_subject_${t.type}">Oggetto</label><input type="text" id="tpl_subject_${t.type}" value="${esc(raw.subject)}"></div>
        <div><label for="tpl_body_${t.type}">Corpo</label><textarea id="tpl_body_${t.type}" rows="6">${esc(raw.body)}</textarea></div>
      </div>
      <div class="tpl-actions">
        <button class="btn pri sm" data-act="save-mail-template" data-key="${t.type}">Salva</button>
        <button class="btn sec sm" data-act="reset-mail-template" data-key="${t.type}">Ripristina</button>
        <span class="hint">Salva su: <b>${esc(templateScopeLabel(scope))}</b></span>
      </div>
      <details class="tpl-preview">
        <summary>Anteprima con i dati di questo engagement</summary>
        <div class="tpl-mail"><b>${esc(t.effective.subject)}</b><pre>${esc(t.effective.body)}</pre></div>
      </details>
    </div>`;
  }).join('');

  return `<div class="card" style="margin-top:16px"><h2>Template email</h2>
    <p class="sub">Il template standard è globale, quello cliente vale per tutti gli engagement del cliente, quello engagement solo per questa attività. Variabili: ${esc(info.placeholders.join(', '))}.</p>
    ${cards}
  </div>`;
}

function tabLog(d) {
  const all = (d.audit || []).slice().sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const authors = [...new Set(all.map(a => a.author))];
  const rows = state.logAuthor ? all.filter(a => a.author === state.logAuthor) : all;

  return `<div class="note">Registro delle attività con autore, data e ora. ${isClient()
    ? 'Mostra le attività che ti riguardano.'
    : 'Include accessi e download dei deliverables.'}</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px">
        <h2 style="margin:0">Registro · ${rows.length} eventi</h2>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <select class="f" style="width:auto" aria-label="Filtra per autore" data-change="log-author">
            <option value="">Tutti gli autori</option>
            ${authors.map(a => `<option ${a === state.logAuthor ? 'selected' : ''}>${esc(a)}</option>`).join('')}
          </select>
          <button class="btn sec sm" data-act="export-log">Esporta CSV</button>
        </div>
      </div>
      <table><thead><tr><th>Data e ora</th><th>Autore</th><th>Profilo</th><th>Evento</th></tr></thead>
      <tbody>${rows.length
        ? rows.map(a => `<tr><td style="white-space:nowrap">${fmtTime(a.date)}</td><td><b>${esc(a.author)}</b></td><td>${esc(a.authorRole)}</td><td>${esc(a.text)}</td></tr>`).join('')
        : '<tr><td colspan="4" class="empty">Nessun evento.</td></tr>'}</tbody></table>
    </div>`;
}

/* ====== CLIENTI ====== */
function renderClients() {
  const manage = canManageClients();
  const items = state.clients || [];

  const cards = items.map(client => {
    const users = client.users || [];
    const baseDl = client.distributionList || [];
    const baseDeliverables = client.deliverablesDistributionList || [];
    const userRows = users.length
      ? `<ul style="list-style:none;margin:0;padding:0">${users.map(u => `<li style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)">
          <span><b>${esc(u.name)}</b><br><span style="color:var(--muted);font-size:var(--fs-md);overflow-wrap:anywhere">${esc(u.email)}</span></span>
          ${manage ? `<button class="btn dng sm" data-act="remove-client-user" data-client="${esc(client.id)}" data-user="${esc(u.id)}">Rimuovi</button>` : ''}
        </li>`).join('')}</ul>`
      : '<div class="empty" style="padding:8px 0">Nessuna utenza associata.</div>';

    const dlRowsFor = (entries, kind) => entries.length
      ? `<ul style="list-style:none;margin:0;padding:0">${entries.map(entry => `<li style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)">
          <span><b>${esc(entry.name)}</b><br><span style="color:var(--muted);font-size:var(--fs-md);overflow-wrap:anywhere">${esc(entry.email)}</span></span>
          ${manage ? `<button class="btn dng sm" data-act="remove-client-dl" data-client="${esc(client.id)}" data-list="${kind}" data-entry="${esc(entry.id)}">Rimuovi</button>` : ''}
        </li>`).join('')}</ul>`
      : '<div class="empty" style="padding:8px 0">Nessun destinatario base.</div>';

    const dlRows = dlRowsFor(baseDl, 'notifications');
    const deliverablesRows = dlRowsFor(baseDeliverables, 'deliverables');

    const team = client.team || [];
    const canTeamInvite = state.role !== 'Auditor';
    const canTeamRemove = state.role === 'Manager' || state.role === 'Client';
    const teamRows = team.length
      ? `<ul style="list-style:none;margin:0;padding:0">${team.map(member => {
          const removable = canTeamRemove &&
            (state.role !== 'Client' || member.organization === 'Cliente');
          return `<li style="display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft)">
            <span><b>${esc(member.name)}</b>${member.role ? ` · ${esc(member.role)}` : ''}<br>
              <span style="color:var(--muted);font-size:var(--fs-md);overflow-wrap:anywhere">${esc(member.email)}</span>
              ${orgPill(member.organization)}</span>
            ${removable ? `<button class="btn dng sm" data-act="remove-client-team" data-client="${esc(client.id)}" data-member="${esc(member.id)}">Rimuovi</button>` : ''}
          </li>`;
        }).join('')}</ul>`
      : '<div class="empty" style="padding:8px 0">Nessun partecipante esterno.</div>';

    return `<div class="card client-card">
      <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start">
        <div style="display:flex;gap:12px;align-items:flex-start;min-width:0">
          ${clientAvatar(client, 'lg')}
          <div><h2 style="margin:0">${esc(client.name)}</h2>
            <p class="sub" style="margin:4px 0 0">${esc(client.id)} · ${client.engagementCount || 0} engagement ${(client.engagementCount || 0) === 1 ? 'associato' : 'associati'}${client.website
              ? ` · <a href="${esc(client.website)}" target="_blank" rel="noopener noreferrer">${esc(hostOf(client.website))}</a>`
              : ''}</p></div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sec sm" data-act="open-client" data-client="${esc(client.id)}">Vedi engagement</button>
          ${manage ? `<button class="btn sec sm" data-act="rename-client" data-client="${esc(client.id)}">Modifica</button>` : ''}
        </div>
      </div>
      <h3 style="font-size:var(--fs-base);margin:18px 0 6px">Utenze associate</h3>
      ${userRows}
      ${manage ? `<div style="margin-top:12px"><button class="btn pri sm" data-act="add-client-user" data-client="${esc(client.id)}">+ Aggiungi utenza</button></div>` : ''}
      <h3 style="font-size:var(--fs-base);margin:18px 0 6px">Distribution list notifiche (base)</h3>
      <p class="sub" style="margin:0 0 6px">Comune a tutti gli engagement del cliente; riceve inizio/fine attività e i solleciti.</p>
      ${dlRows}
      ${manage ? `<div style="margin-top:12px"><button class="btn sec sm" data-act="add-client-dl" data-client="${esc(client.id)}" data-list="notifications">+ Aggiungi destinatario notifiche</button></div>` : ''}
      <h3 style="font-size:var(--fs-base);margin:18px 0 6px">Distribution list deliverables (base)</h3>
      <p class="sub" style="margin:0 0 6px">Comune a tutti gli engagement del cliente; riceve l'invio dei report.</p>
      ${deliverablesRows}
      ${manage ? `<div style="margin-top:12px"><button class="btn sec sm" data-act="add-client-dl" data-client="${esc(client.id)}" data-list="deliverables">+ Aggiungi destinatario deliverables</button></div>` : ''}
      <h3 style="font-size:var(--fs-base);margin:18px 0 6px">Team cliente</h3>
      <p class="sub" style="margin:0 0 6px">Partecipanti esterni comuni a tutti gli engagement del cliente.</p>
      ${teamRows}
      ${canTeamInvite ? `<div style="margin-top:12px"><button class="btn sec sm" data-act="invite-client-team" data-client="${esc(client.id)}">+ Invita partecipante</button></div>` : ''}
    </div>`;
  }).join('');

  $('#app').innerHTML = `
    <button class="crumb" data-act="list">← Tutti gli engagement</button>
    <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start">
      <div><h1>Clienti e utenze</h1>
        <p class="sub" style="margin-bottom:14px">${manage
          ? 'Gestisci clienti, utenze, team ed engagement collegati.'
          : state.role === 'Auditor'
            ? 'Elenco in sola lettura: clienti, utenze, team ed engagement associati.'
            : 'Elenco clienti e utenze; puoi invitare partecipanti al team. Il resto è in sola lettura.'}</p></div>
      ${manage ? '<button class="btn pri" data-act="new-client">+ Nuovo cliente</button>' : ''}
    </div>
    ${cards
      ? `<div class="client-grid">${cards}</div>`
      : '<div class="empty">Nessun cliente disponibile.</div>'}`;
}

/* ====== RENDER ====== */
function render() {
  updateHeader();
  if (state.view === 'clients') renderClients();
  else if (state.view === 'solicitations') renderSolicitations();
  else if (state.view === 'detail' && state.detail) renderDetail();
  else renderList();
}

/* ====== AZIONI ====== */
function engagedId() {
  return encodeURIComponent(state.detail.engagement.id);
}

const actions = {
  list: backToList,
  clients: () => {
    state.view = 'clients';
    loadClients().then(render);
  },
  'open-client': el => {
    state.clientId = el.dataset.client;
    localStorage.setItem('cep.client', state.clientId);
    state.view = 'list';
    state.listFilter = 'all';
    state.listQuery = '';
    state.listTab = 'eng';
    fillClientSelect();
    updateHeader();
    loadList();
  },
  'new-client': async () => {
    const v = await ask({
      title: 'Nuovo cliente',
      ok: 'Crea cliente',
      fields: [
        { id: 'name', label: 'Ragione sociale*' },
        { id: 'website', label: 'Sito web', type: 'url', ph: 'https://esempio.it' }
      ]
    });
    if (!v) return;
    if (!v.name) { toast('Il nome del cliente è obbligatorio'); return; }
    try {
      await api('/api/clients?' + qs(), {
        method: 'POST',
        body: JSON.stringify({ name: v.name, website: v.website || null })
      });
      toast('Cliente creato');
      await loadClients();
      render();
    } catch (error) { toast(error.message); }
  },
  'rename-client': async el => {
    const client = (state.clients || []).find(c => c.id === el.dataset.client);
    if (!client) return;
    const v = await ask({
      title: 'Modifica cliente',
      ok: 'Salva',
      fields: [
        { id: 'name', label: 'Ragione sociale*', value: client.name },
        { id: 'website', label: 'Sito web', type: 'url', ph: 'https://esempio.it', value: client.website || '' }
      ]
    });
    if (!v) return;
    if (!v.name) { toast('Il nome del cliente è obbligatorio'); return; }
    try {
      await api(`/api/clients/${encodeURIComponent(client.id)}?` + qs(), {
        method: 'PUT',
        body: JSON.stringify({ name: v.name, website: v.website || null })
      });
      toast('Cliente aggiornato');
      await loadClients();
      render();
    } catch (error) { toast(error.message); }
  },
  'add-client-user': async el => {
    const clientId = el.dataset.client;
    const v = await ask({
      title: 'Aggiungi utenza',
      ok: 'Aggiungi',
      fields: [
        { id: 'name', label: 'Nome e cognome*' },
        { id: 'email', label: 'Email*', type: 'email', ph: 'nome@dominio.it' }
      ]
    });
    if (!v) return;
    if (!v.name || !v.email || !v.email.includes('@') || !v.email.includes('.')) {
      toast('Nome ed email valida sono obbligatori');
      return;
    }
    try {
      await api(`/api/clients/${encodeURIComponent(clientId)}/users?` + qs(), {
        method: 'POST',
        body: JSON.stringify({ name: v.name, email: v.email })
      });
      toast('Utenza aggiunta');
      await loadClients();
      render();
    } catch (error) { toast(error.message); }
  },
  'remove-client-user': async el => {
    const clientId = el.dataset.client;
    const userId = el.dataset.user;
    const v = await ask({
      title: 'Rimuovere l\'utenza?',
      text: 'L\'utenza non avrà più accesso al portale. L\'operazione non è reversibile.',
      ok: 'Rimuovi',
      danger: true
    });
    if (!v) return;
    try {
      await api(`/api/clients/${encodeURIComponent(clientId)}/users/${encodeURIComponent(userId)}?` + qs(), { method: 'DELETE' });
      toast('Utenza rimossa');
      await loadClients();
      render();
    } catch (error) { toast(error.message); }
  },
  'add-client-dl': async el => {
    const clientId = el.dataset.client;
    const kind = el.dataset.list === 'deliverables' ? 'deliverables' : 'notifications';
    const deliverables = kind === 'deliverables';
    const v = await ask({
      title: deliverables
        ? 'Aggiungi destinatario deliverables'
        : 'Aggiungi destinatario notifiche',
      text: deliverables
        ? 'Sarà incluso nell\'invio dei report per tutti gli engagement del cliente.'
        : 'Riceverà inizio/fine attività e i solleciti di tutti gli engagement del cliente.',
      ok: 'Aggiungi',
      fields: [
        { id: 'name', label: 'Nome e cognome*' },
        { id: 'email', label: 'Email*', type: 'email', ph: 'nome@dominio.it' }
      ]
    });
    if (!v) return;
    if (!v.name || !v.email || !v.email.includes('@') || !v.email.includes('.')) {
      toast('Nome ed email valida sono obbligatori');
      return;
    }
    try {
      await api(`/api/clients/${encodeURIComponent(clientId)}/distribution-list?` + qs({ kind }), {
        method: 'POST',
        body: JSON.stringify({ name: v.name, email: v.email, organization: 'Cliente' })
      });
      toast('Destinatario base aggiunto');
      await loadClients();
      render();
    } catch (error) { toast(error.message); }
  },
  'remove-client-dl': async el => {
    const clientId = el.dataset.client;
    const entryId = el.dataset.entry;
    const kind = el.dataset.list === 'deliverables' ? 'deliverables' : 'notifications';
    const v = await ask({
      title: 'Rimuovere il destinatario base?',
      text: kind === 'deliverables'
        ? 'Non riceverà più i deliverables degli engagement del cliente, salvo aggiunta specifica sul singolo engagement.'
        : 'Non riceverà più le notifiche degli engagement del cliente, salvo aggiunta specifica sul singolo engagement.',
      ok: 'Rimuovi',
      danger: true
    });
    if (!v) return;
    try {
      await api(`/api/clients/${encodeURIComponent(clientId)}/distribution-list/${encodeURIComponent(entryId)}?` + qs({ kind }), { method: 'DELETE' });
      toast('Destinatario base rimosso');
      await loadClients();
      render();
    } catch (error) { toast(error.message); }
  },
  'invite-client-team': async el => {
    const clientId = el.dataset.client;
    const v = await ask({
      title: 'Invita partecipante esterno',
      ok: 'Invita',
      fields: [
        { id: 'name', label: 'Nome e cognome*' },
        { id: 'email', label: 'Email*', type: 'email', ph: 'nome@dominio.it' },
        {
          id: 'organization', label: 'Organizzazione', type: 'select',
          options: [['Cliente', 'Cliente'], ['Partner', 'Partner'], ['Altro', 'Altro']]
        },
        { id: 'role', label: 'Ruolo (opzionale)', ph: 'es. Referente tecnico' }
      ]
    });
    if (!v) return;
    if (!v.name || !v.email || !v.email.includes('@') || !v.email.includes('.')) {
      toast('Nome ed email valida sono obbligatori');
      return;
    }
    try {
      await api(`/api/clients/${encodeURIComponent(clientId)}/team?` + qs(), {
        method: 'POST',
        body: JSON.stringify(v)
      });
      toast('Partecipante invitato');
      await loadClients();
      render();
    } catch (error) { toast(error.message); }
  },
  'remove-client-team': async el => {
    const clientId = el.dataset.client;
    const memberId = el.dataset.member;
    const v = await ask({
      title: 'Rimuovere il partecipante?',
      text: 'Non farà più parte del team del cliente.',
      ok: 'Rimuovi',
      danger: true
    });
    if (!v) return;
    try {
      await api(`/api/clients/${encodeURIComponent(clientId)}/team/${encodeURIComponent(memberId)}?` + qs(), { method: 'DELETE' });
      toast('Partecipante rimosso');
      await loadClients();
      render();
    } catch (error) { toast(error.message); }
  },
  open: el => openEngagement(el.dataset.id),
  'open-action': async el => {
    await openEngagement(el.dataset.id);
    if (state.detail && el.dataset.tab) await setTab(el.dataset.tab);
  },
  'list-filter': el => {
    state.listFilter = el.dataset.filter || 'all';
    renderList();
  },
  'clear-filter': () => {
    state.listFilter = 'all';
    state.listQuery = '';
    renderList();
  },
  'retry-list': () => loadList(),
  tab: el => setTab(el.dataset.tab),
  'list-tab': el => {
    state.listTab = el.dataset.tab;
    if (state.listTab === 'rem') {
      state.view = 'solicitations';
      loadSolicitations().then(render);
    } else {
      state.view = 'list';
      render();
    }
  },

  'start-edit': el => {
    state.editing[el.dataset.key] = true;
    render();
  },

  'cancel-edit': el => {
    delete state.editing[el.dataset.key];
    render();
  },

  'new-engagement': async () => {
    const clientOptions = state.clients.map(c => [c.id, c.name]);
    const v = await ask({
      title: 'Nuovo engagement',
      ok: 'Crea',
      fields: [
        { id: 'name', label: 'Nome engagement*' },
        { id: 'clientId', label: 'Cliente*', type: 'select', options: clientOptions, value: state.clientId || (clientOptions[0] || [''])[0] },
        { id: 'type', label: 'Tipologia', type: 'select', options: TYPES, value: 'PenetrationTest' }
      ]
    });
    if (!v) return;
    if (!v.name || !v.clientId) { toast('Compila tutti i campi obbligatori'); return; }
    try {
      await api('/api/engagements?' + qs(), {
        method: 'POST',
        body: JSON.stringify({ name: v.name, clientId: v.clientId, type: v.type || 'PenetrationTest' })
      });
      toast('Engagement creato');
      await loadList();
    } catch (error) { toast(error.message); }
  },

  'save-rule': input => {
    const key = input.dataset.key;
    const threshold = Number($('#rule_' + key)?.value) || 1;
    const enabled = !!$('#on_' + key)?.checked;
    return api(`/api/solicitations/rules/${encodeURIComponent(key)}?` + qs(), {
      method: 'PUT', body: JSON.stringify({ enabled, thresholdDays: threshold })
    }).then(async () => {
      toast('Regola aggiornata');
      await loadSolicitations();
      render();
    }).catch(error => toast(error.message));
  },

  'send-solicitation': el => api(`/api/solicitations/${encodeURIComponent(el.dataset.key)}/send?` + qs(), { method: 'POST' })
    .then(async () => {
      toast('Sollecito inviato');
      await loadSolicitations();
      render();
    }).catch(error => toast(error.message)),

  'upload-manleva': async () => {
    const name = await pickFile('.pdf,.p7m');
    if (!name) return;
    try {
      await api(`/api/engagements/${engagedId()}/manleva?` + qs(), { method: 'POST', body: JSON.stringify({ fileName: name }) });
      toast('Scheda tecnica firmata caricata');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'upload-ingaggio': async () => {
    const name = await pickFile('.pdf');
    if (!name) return;
    try {
      await api(`/api/engagements/${engagedId()}/documento-ingaggio?` + qs(), { method: 'POST', body: JSON.stringify({ fileName: name }) });
      toast('Documento di ingaggio caricato');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'register-order': async () => {
    const v = await ask({
      title: 'Registra ordine ricevuto',
      fields: [{ id: 'ref', label: 'Riferimento ordine', value: 'PO-' + Math.floor(90000 + Math.random() * 9999), ph: 'PO-12345' }]
    });
    if (!v) return;
    if (!v.ref) { toast('Inserisci il riferimento ordine'); return; }
    try {
      await api(`/api/engagements/${engagedId()}/order?` + qs(), { method: 'POST', body: JSON.stringify({ ref: v.ref }) });
      toast('Ordine registrato');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'edit-financials': async () => {
    const e = state.detail.engagement;
    const v = await ask({
      title: 'Costi e margine',
      text: 'Dati economici dell\'attività: obbligatori nella prima fase.',
      ok: 'Salva',
      fields: [
        { id: 'cost', label: 'Costo (€)*', type: 'number', min: '0', value: e.cost != null ? String(e.cost) : '' },
        { id: 'margin', label: 'Margine (%)*', type: 'number', min: '0', max: '100', value: e.margin != null ? String(e.margin) : '46' }
      ]
    });
    if (!v) return;
    const cost = Number(v.cost);
    const margin = Number(v.margin);
    if (v.cost === '' || v.margin === '' ||
        !Number.isFinite(cost) || !Number.isFinite(margin) ||
        cost < 0 || margin < 0 || margin > 100) {
      toast('Inserisci un costo valido e un margine tra 0 e 100%');
      return;
    }
    try {
      const result = await api(`/api/engagements/${engagedId()}/financials?` + qs(), {
        method: 'PUT',
        body: JSON.stringify({ cost, margin })
      });
      toast(result && result.financialsApproved
        ? 'Costi e margine salvati e approvati'
        : 'Costi e margine salvati: in attesa di approvazione del Manager');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'approve-financials': async () => {
    const e = state.detail.engagement;
    const total = financialValue(e.cost, e.margin);
    const v = await ask({
      title: 'Approvare costi e margine?',
      text: `Costo ${fmtMoney(e.cost)} · margine ${fmtPercent(e.margin)} · valore ${fmtMoney(total)}.`,
      ok: 'Approva'
    });
    if (!v) return;
    try {
      await api(`/api/engagements/${engagedId()}/financials/approve?` + qs(), {
        method: 'POST'
      });
      toast('Costi e margine approvati');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  propose: async () => {
    const startDate = $('#ps').value;
    const endDate = $('#pe').value;
    const note = $('#pn').value.trim();
    if (!startDate || !endDate) { toast('Inserisci data di inizio e fine'); return; }
    if (startDate < today()) { toast('La data di inizio non può essere nel passato'); return; }
    if (endDate < startDate) { toast('La data di fine precede l\'inizio'); return; }
    const days = Math.round((Date.parse(endDate) - Date.parse(startDate)) / 86400000);
    if (days > 60) { toast('La durata massima è di 60 giorni'); return; }
    const notice = state.detail.planningNotice;
    if (notice && (state.role === 'Client' || state.role === 'PMO')) {
      const proceed = await ask({
        title: 'Avviso pianificazione',
        text: `La proposta arriva prima di due settimane dalla richiesta (${fmt(notice.requestDate)}). Potrai proporla dal ${fmt(notice.availableFrom)}. Vuoi inviarla comunque?`,
        ok: 'Invia comunque'
      });
      if (!proceed) return;
    }
    try {
      await api(`/api/engagements/${engagedId()}/proposals?` + qs(), {
        method: 'POST', body: JSON.stringify({ startDate, endDate, note })
      });
      toast('Proposta inviata');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  reschedule: async () => {
    const accepted = state.detail.engagement.acceptedProposal;
    const v = await ask({
      title: 'Richiedi riprogrammazione',
      text: `Attività attualmente pianificata dal ${fmt(accepted.startDate)} al ${fmt(accepted.endDate)}.`,
      ok: 'Invia richiesta',
      fields: [
        { id: 'startDate', label: 'Nuovo inizio', type: 'date', min: today(), half: true },
        { id: 'endDate', label: 'Nuova fine', type: 'date', min: today(), half: true },
        { id: 'note', label: 'Motivazione*', area: true }
      ]
    });
    if (!v) return;
    if (!v.startDate || !v.endDate || !v.note) { toast('Compila date e motivazione'); return; }
    try {
      await api(`/api/engagements/${engagedId()}/proposals?` + qs(), {
        method: 'POST', body: JSON.stringify({ startDate: v.startDate, endDate: v.endDate, note: v.note })
      });
      toast('Richiesta inviata');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  decide: async el => {
    const accept = el.dataset.accept === '1';
    let reason = null;
    if (!accept) {
      const v = await ask({
        title: 'Rifiuta proposta',
        ok: 'Rifiuta',
        danger: true,
        fields: [{ id: 'reason', label: 'Motivazione*', area: true }]
      });
      if (!v) return;
      if (!v.reason) { toast('Indica il motivo del rifiuto'); return; }
      reason = v.reason;
    }
    try {
      await api(`/api/engagements/${engagedId()}/proposals/${encodeURIComponent(el.dataset.pid)}/decide?` + qs(), {
        method: 'POST', body: JSON.stringify({ accept, reason })
      });
      toast(accept ? 'Proposta approvata' : 'Proposta rifiutata');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'save-scope': async () => {
    const body = {
      host: $('#f_host').value.trim(),
      ipRange: $('#f_ipRange').value.trim(),
      outOfScope: $('#f_outOfScope').value.trim(),
      window: $('#f_window').value.trim(),
      contact: $('#f_contact').value.trim(),
      notes: $('#f_notes').value.trim()
    };
    if (!body.host || !body.contact) { toast('Target e referente tecnico sono obbligatori'); return; }
    try {
      await api(`/api/engagements/${engagedId()}/scope?` + qs(), { method: 'PUT', body: JSON.stringify(body) });
      delete state.editing.scope;
      toast('Scope salvato');
      await refreshDetail();
      await loadScope();
      render();
    } catch (error) { toast(error.message); }
  },

  'save-credentials': async () => {
    const body = {
      vpn: $('#f_vpn').value.trim(),
      users: $('#f_users').value.trim(),
      deliveryMethod: $('#f_deliveryMethod').value,
      notes: $('#f_credNotes').value.trim()
    };
    if (!body.vpn || !body.users || !body.deliveryMethod) {
      toast('VPN, utenze e metodo di consegna sono obbligatori');
      return;
    }
    try {
      await api(`/api/engagements/${engagedId()}/credentials?` + qs(), { method: 'PUT', body: JSON.stringify(body) });
      delete state.editing.cred;
      toast('Credenziali salvate');
      await refreshDetail();
      await loadCredentials();
      render();
    } catch (error) { toast(error.message); }
  },

  'upload-report': async () => {
    const name = await pickFile('.pdf,.xlsx,.docx');
    if (!name) return;
    const type = (name.split('.').pop() || 'PDF').toUpperCase().substring(0, 4);
    const size = Math.floor(200000 + Math.random() * 5000000);
    try {
      await api(`/api/engagements/${engagedId()}/reports?` + qs(), {
        method: 'POST', body: JSON.stringify({ name, type, size })
      });
      toast('Deliverable caricato come bozza');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'download-report': async el => {
    try {
      const response = await fetch(`/api/engagements/${engagedId()}/reports/${encodeURIComponent(el.dataset.rid)}/download?` + qs(), {
        method: 'POST', headers: { 'Content-Type': 'application/json' }
      });
      if (!response.ok) throw new Error(`Errore ${response.status}`);
      await downloadResponse(response, 'deliverable.txt');
      toast('Download avviato');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'submit-review': async () => {
    try {
      await api(`/api/engagements/${engagedId()}/review/submit?` + qs(), { method: 'POST' });
      toast('Inviati in revisione al manager');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'review-decide': async el => {
    const approve = el.dataset.approve === '1';
    let comment = null;
    if (!approve) {
      const v = await ask({
        title: 'Richiedi modifiche',
        ok: 'Richiedi modifiche',
        danger: true,
        fields: [{ id: 'comment', label: 'Cosa va corretto?*', area: true }]
      });
      if (!v) return;
      if (!v.comment) { toast('Indica cosa va corretto'); return; }
      comment = v.comment;
    }
    try {
      await api(`/api/engagements/${engagedId()}/review/decide?` + qs(), {
        method: 'POST', body: JSON.stringify({ approve, comment })
      });
      toast(approve ? 'Deliverables approvati' : 'Modifiche richieste');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  publish: async () => {
    const ok = await ask({
      title: 'Pubblica al cliente',
      text: 'I deliverables saranno visibili al cliente e l\'engagement risulterà completato. L\'operazione non è reversibile.',
      ok: 'Pubblica'
    });
    if (!ok) return;
    try {
      const result = await api(`/api/engagements/${engagedId()}/reports/publish?` + qs(), { method: 'POST' });
      toast(`Deliverables pubblicati${result && result.published ? ` (${result.published})` : ''}`);
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'add-dl': async el => {
    const kind = el.dataset.list === 'deliverables' ? 'deliverables' : 'notifications';
    const prefix = kind === 'deliverables' ? 'dl2' : 'dl';
    const name = $(`#${prefix}_n`).value.trim();
    const email = $(`#${prefix}_e`).value.trim();
    const organization = isClient() ? 'Cliente' : $(`#${prefix}_o`).value;
    if (!name || !email) { toast('Inserisci nome ed email valida'); return; }
    try {
      await api(`/api/engagements/${engagedId()}/distribution-list?` + qs({ kind }), {
        method: 'POST', body: JSON.stringify({ name, email, organization })
      });
      toast(kind === 'deliverables'
        ? 'Destinatario deliverables aggiunto'
        : 'Destinatario notifiche aggiunto');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'remove-dl': async el => {
    const kind = el.dataset.list === 'deliverables' ? 'deliverables' : 'notifications';
    try {
      await api(`/api/engagements/${engagedId()}/distribution-list/${encodeURIComponent(el.dataset.entry)}?` + qs({ kind }), { method: 'DELETE' });
      toast('Destinatario rimosso');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'invite-team': async () => {
    const v = await ask({
      title: 'Invita partecipante esterno',
      ok: 'Invita',
      fields: [
        {
          id: 'scope', label: 'Dove', type: 'select',
          options: [
            ['engagement', 'Solo questo engagement'],
            ['client', 'Team cliente (tutti gli engagement)']
          ]
        },
        { id: 'name', label: 'Nome e cognome*' },
        { id: 'email', label: 'Email*', type: 'email', ph: 'nome@dominio.it' },
        {
          id: 'organization', label: 'Organizzazione', type: 'select',
          options: [['Cliente', 'Cliente'], ['Partner', 'Partner'], ['Altro', 'Altro']]
        },
        { id: 'role', label: 'Ruolo (opzionale)', ph: 'es. Referente tecnico' }
      ]
    });
    if (!v) return;
    if (!v.name || !v.email || !v.email.includes('@') || !v.email.includes('.')) {
      toast('Nome ed email valida sono obbligatori');
      return;
    }
    try {
      await api(`/api/engagements/${engagedId()}/team?` + qs(), {
        method: 'POST',
        body: JSON.stringify(v)
      });
      toast('Partecipante invitato');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'remove-team': async el => {
    const v = await ask({
      title: 'Rimuovere il partecipante?',
      text: 'Non avrà più accesso ai dati dell\'engagement. L\'operazione non è reversibile.',
      ok: 'Rimuovi',
      danger: true
    });
    if (!v) return;
    try {
      await api(`/api/engagements/${engagedId()}/team/${encodeURIComponent(el.dataset.member)}?` + qs(), { method: 'DELETE' });
      toast('Partecipante rimosso');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'toggle-mail': async el => {
    try {
      await api(`/api/engagements/${engagedId()}/mails/${el.dataset.key}/toggle?` + qs(), { method: 'POST' });
      toast('Impostazione aggiornata');
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'send-mail': async el => {
    try {
      const result = await api(`/api/engagements/${engagedId()}/mails/${el.dataset.key}/send?` + qs(), { method: 'POST' });
      toast(`Email inviata${result && result.recipients ? ' a ' + result.recipients : ''}`);
      await refreshDetail();
    } catch (error) { toast(error.message); }
  },

  'save-mail-template': async el => {
    const key = el.dataset.key;
    const scope = state.mailTemplateScope[key] || 'engagement';
    const subject = $('#tpl_subject_' + key)?.value || '';
    const body = $('#tpl_body_' + key)?.value || '';

    try {
      await api(`/api/engagements/${engagedId()}/mail-templates/${key}?` + qs(), {
        method: 'PUT',
        body: JSON.stringify({ scope, subject, body })
      });
      toast(`Template ${templateScopeLabel(scope)} aggiornato`);
      await loadMailTemplates();
      render();
    } catch (error) { toast(error.message); }
  },

  'reset-mail-template': async el => {
    const key = el.dataset.key;
    const scope = state.mailTemplateScope[key] || 'engagement';

    try {
      await api(`/api/engagements/${engagedId()}/mail-templates/${key}?` + qs(), {
        method: 'PUT',
        body: JSON.stringify({ scope, reset: true })
      });
      toast('Template ripristinato');
      await loadMailTemplates();
      render();
    } catch (error) { toast(error.message); }
  },

  'export-log': async () => {
    try {
      const response = await fetch(`/api/engagements/${engagedId()}/log/export?` + qs());
      if (!response.ok) throw new Error(`Errore ${response.status}`);
      await downloadResponse(response, 'registro.csv');
      toast('Registro esportato');
    } catch (error) { toast(error.message); }
  }
};

/* ====== EVENTI ====== */
const busyActions = new Set([
  'new-client', 'rename-client', 'add-client-user', 'remove-client-user',
  'add-client-dl', 'remove-client-dl', 'invite-client-team', 'remove-client-team',
  'new-engagement', 'save-rule', 'send-solicitation', 'upload-manleva',
  'upload-ingaggio', 'register-order', 'edit-financials', 'approve-financials', 'propose', 'reschedule',
  'decide', 'save-scope', 'save-credentials', 'upload-report',
  'download-report', 'submit-review', 'review-decide', 'publish', 'add-dl',
  'remove-dl', 'invite-team', 'remove-team', 'toggle-mail', 'send-mail', 'export-log', 'retry-list',
  'save-mail-template', 'reset-mail-template'
]);

document.addEventListener('click', event => {
  const el = event.target.closest('[data-act]');
  if (!el) return;
  const action = actions[el.dataset.act];
  if (!action) return;
  event.preventDefault();
  const isButton = el.tagName === 'BUTTON';
  const shouldBusy = isButton && busyActions.has(el.dataset.act);
  if (shouldBusy) {
    el.classList.add('busy');
    el.disabled = true;
    el.setAttribute('aria-busy', 'true');
  }
  Promise.resolve(action(el))
    .catch(error => toast(error.message))
    .finally(() => {
      if (shouldBusy && el.isConnected) {
        el.classList.remove('busy');
        el.disabled = false;
        el.removeAttribute('aria-busy');
      }
    });
});

document.addEventListener('input', event => {
  if (event.target.id !== 'list-search') return;
  state.listQuery = event.target.value;
  renderList();
  const input = $('#list-search');
  if (input) {
    input.focus();
    const end = input.value.length;
    input.setSelectionRange(end, end);
  }
});

document.addEventListener('change', event => {
  const el = event.target.closest('[data-change]');
  if (!el) return;
  const kind = el.dataset.change;
  if (kind === 'rule') {
    Promise.resolve(actions['save-rule'](el)).catch(error => toast(error.message));
  }
  if (kind === 'log-author') {
    state.logAuthor = el.value;
    render();
  }
  if (kind === 'list-filter') {
    state.listFilter = el.value || 'all';
    renderList();
  }
  if (kind === 'list-sort') {
    state.listSort = el.value || 'priority';
    renderList();
  }
  if (kind === 'mail-template-scope') {
    state.mailTemplateScope[el.dataset.key] = el.value;
    render();
  }
});

/* ====== INIT ====== */
function init() {
  // Ruolo assente o non riconosciuto: come lato server si parte dal profilo
  // meno privilegiato (Cliente), non da un utente interno.
  if (!ROLES[state.role]) state.role = 'Client';

  const roleSelect = $('#role');
  roleSelect.innerHTML = Object.entries(ROLES)
    .map(([key, value]) => `<option value="${key}" ${key === state.role ? 'selected' : ''}>${esc(value.label)}${key === 'Auditor' ? ' · sola lettura' : ''}</option>`)
    .join('');
  roleSelect.value = state.role;
  roleSelect.onchange = event => setRole(event.target.value);

  $('#client').onchange = event => setClient(event.target.value);

  fillClientSelect();
  updateHeader();

  loadClients().then(async () => {
    if (isClient() && !state.clients.length && !state.clientId) {
      // Server irraggiungibile: si mostra comunque il cliente demo atteso.
      state.clientId = ROLES.Client.client || '';
      localStorage.setItem('cep.client', state.clientId);
      fillClientSelect();
    }
    updateHeader();
    await loadList();
  });
}

init();
</script>
