/* ====== KPI E ANDAMENTO ====== */
// Pannello di sintesi per Manager e PMO: carico per cliente, fase, ritardi e
// rischi. Legge l'elenco engagement già filtrato dal cliente in header.
function kpiAge(e) {
  const s = actionState(e);
  if (!s || (s.kind !== 'action' && s.kind !== 'waiting')) return 0;
  return daysSince(s.since) || 0;
}


function kpiBar(count, max) {
  const width = max > 0 ? Math.round((count / max) * 100) : 0;
  return `<span class="kpi-bar"><i style="width:${width}%"></i></span>`;
}

function kpiRow(e, extra) {
  return `<tr data-act="open" data-id="${esc(e.id)}">
    <td class="name"><b>${esc(e.name)}</b><span>${esc(e.id)} · ${esc(e.clientName)}</span></td>
    ${extra}
  </tr>`;
}

function renderKpi() {
  const all = state.list || [];
  const kindOf = e => (actionState(e) || {}).kind;
  const active = all.filter(e => e.phase !== 'Done');
  const action = all.filter(e => kindOf(e) === 'action');
  const waiting = all.filter(e => kindOf(e) === 'waiting');
  const atRisk = all.filter(e => e.preparationAlert);
  const late = all.filter(e => kpiAge(e) >= KPI_LATE_DAYS);
  const lateDays = late.reduce((sum, e) => sum + kpiAge(e), 0);
  const done = all.filter(e => e.phase === 'Done');
  const upcoming = active
    .filter(e => e.periodStart && e.periodStart >= today())
    .sort((a, b) => a.periodStart.localeCompare(b.periodStart));
  const next = upcoming[0] || null;

  // --- per cliente ---
  const clients = new Map();
  for (const e of all) {
    const row = clients.get(e.clientId) || {
      id: e.clientId, name: e.clientName,
      total: 0, active: 0, action: 0, waiting: 0, risk: 0, done: 0, late: 0, next: null
    };
    row.total += 1;
    if (e.phase === 'Done') row.done += 1; else row.active += 1;
    if (kindOf(e) === 'action') row.action += 1;
    if (kindOf(e) === 'waiting') row.waiting += 1;
    if (e.preparationAlert) row.risk += 1;
    if (kpiAge(e) >= KPI_LATE_DAYS) row.late += 1;
    if (e.periodStart && e.periodStart >= today() && (!row.next || e.periodStart < row.next)) {
      row.next = e.periodStart;
    }
    clients.set(e.clientId, row);
  }
  const clientRows = [...clients.values()].sort((a, b) => b.total - a.total);
  const maxClient = Math.max(1, ...clientRows.map(c => c.total));

  // --- per responsabile ---
  const owners = new Map();
  for (const e of all) {
    const key = e.owner || '—';
    const row = owners.get(key) || { name: key, total: 0, active: 0, action: 0, late: 0 };
    row.total += 1;
    if (e.phase !== 'Done') row.active += 1;
    if (kindOf(e) === 'action') row.action += 1;
    if (kpiAge(e) >= KPI_LATE_DAYS) row.late += 1;
    owners.set(key, row);
  }
  const ownerRows = [...owners.values()].sort((a, b) => b.active - a.active || a.name.localeCompare(b.name));

  const longest = [...action, ...waiting]
    .sort((a, b) => kpiAge(b) - kpiAge(a))
    .slice(0, 6);

  const lateClient = state.clientId ? ` · cliente ${esc(clientLabel(state.clientId))}` : '';

  $('#app').innerHTML = `
    <div class="headrow">
      <div>
        <h1>KPI e andamento</h1>
        <p class="sub" style="margin-bottom:0">Pannello Manager e PMO${lateClient} · aggiornato al ${fmt(today())} · ${all.length} engagement</p>
      </div>
      <div class="head-acts">
        <button class="btn sec" data-act="nav" data-view="list">Vai alla lista</button>
        <button class="btn sec" data-act="nav" data-view="solicitations">Solleciti · ${state.due.length}</button>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card"><b>${active.length}</b><span>Engagement attivi</span>
        <small>${all.length} in totale · ${done.length} conclusi</small></div>
      <div class="kpi-card a"><b>${action.length}</b><span>Da gestire</span>
        <small>${action.filter(e => kpiAge(e) >= KPI_LATE_DAYS).length} fermi da ${KPI_LATE_DAYS}+ giorni</small></div>
      <div class="kpi-card w"><b>${waiting.length}</b><span>In attesa di terzi</span>
        <small>${waiting.filter(e => kpiAge(e) >= KPI_LATE_DAYS).length} oltre la soglia</small></div>
      <div class="kpi-card r"><b>${late.length}</b><span>In ritardo</span>
        <small>${lateDays} giorni cumulati</small></div>
      <div class="kpi-card r"><b>${atRisk.length}</b><span>A rischio avvio</span>
        <small>scope o credenziali mancanti</small></div>
      <div class="kpi-card n"><b>${next ? fmt(next.periodStart).slice(0, 5) : '–'}</b><span>Prossimo avvio</span>
        <small>${next ? `${esc(next.name)} · ${esc(next.clientName)}` : 'nessuna data pianificata'}</small></div>
    </div>

    <section class="kpi-panel">
      <h2>Engagement per cliente</h2>
      <table class="kpi-table">
        <caption class="sr-only">Engagement, attivi, attese e ritardi per cliente</caption>
        <thead><tr><th>Cliente</th><th>Engagement</th><th>Attivi</th><th>Da gestire</th><th>In attesa</th><th>Ritardi</th><th>Prossimo avvio</th></tr></thead>
        <tbody>
          ${clientRows.map(row => `<tr data-act="kpi-client" data-client="${esc(row.id)}">
            <td class="name">${clientChip(row.id)}<span>${row.done} conclusi</span></td>
            <td><span class="kpi-num">${row.total}</span>${kpiBar(row.total, maxClient)}</td>
            <td><span class="kpi-num">${row.active}</span></td>
            <td>${row.action ? `<span class="pill p-action">${row.action}</span>` : '–'}</td>
            <td>${row.waiting ? `<span class="pill p-wait">${row.waiting}</span>` : '–'}</td>
            <td>${row.late ? `<span class="pill p-negative">${row.late}</span>` : '–'}</td>
            <td>${row.next ? fmt(row.next) : '<span style="color:var(--muted)">–</span>'}</td>
          </tr>`).join('') || '<tr><td colspan="7"><div class="empty">Nessun engagement.</div></td></tr>'}
        </tbody>
      </table>
    </section>

    <div class="kpi-cols">
      <section class="kpi-panel">
        <h2>Fermi da più tempo</h2>
        <p class="hint">Azioni e attese aperte da almeno ${KPI_LATE_DAYS} giorni, dalla più vecchia.</p>
        <table class="kpi-table">
          <thead><tr><th>Engagement</th><th>Stato</th><th>Da</th><th>Giorni</th></tr></thead>
          <tbody>
            ${longest.map(e => {
              const s = actionState(e) || {};
              const owner = statusOwner(e);
              return kpiRow(e, `<td>${pill(statusPill(e))}${owner ? `<span class="status-owner">${esc(owner)}</span>` : ''}</td>
                <td>${esc(s.label || '—')}</td>
                <td><span class="pill ${kpiAge(e) >= KPI_LATE_DAYS ? 'p-negative' : 'p-neutral'}">${kpiAge(e)} gg</span></td>`);
            }).join('') || '<tr><td colspan="4"><div class="empty">Nessuna attesa aperta.</div></td></tr>'}
          </tbody>
        </table>
      </section>

      <div class="kpi-col">
        <section class="kpi-panel">
          <h2>Carico per responsabile</h2>
          <table class="kpi-table">
            <thead><tr><th>Responsabile</th><th>Engagement</th><th>Attivi</th><th>Da gestire</th><th>Ritardi</th></tr></thead>
            <tbody>
              ${ownerRows.map(row => `<tr>
                <td class="name"><b>${esc(row.name)}</b></td>
                <td><span class="kpi-num">${row.total}</span></td>
                <td>${row.active}</td>
                <td>${row.action ? `<span class="pill p-action">${row.action}</span>` : '–'}</td>
                <td>${row.late ? `<span class="pill p-negative">${row.late}</span>` : '–'}</td>
              </tr>`).join('') || '<tr><td colspan="5"><div class="empty">Nessun dato.</div></td></tr>'}
            </tbody>
          </table>
        </section>

        <section class="kpi-panel">
          <h2>A rischio avvio</h2>
          <p class="hint">Preparazione incompleta a ridosso della data di avvio.</p>
          <table class="kpi-table">
            <thead><tr><th>Engagement</th><th>Avvio</th><th>Manca</th><th>Giorni</th></tr></thead>
            <tbody>
              ${atRisk.sort((a, b) => (a.preparationAlert.daysToStart || 0) - (b.preparationAlert.daysToStart || 0))
                .map(e => {
                  const alert = e.preparationAlert;
                  const days = Number(alert.daysToStart) || 0;
                  const missing = (alert.missing || []).map(m => m === 'scope' ? 'Scope' : 'Credenziali').join(' e ');
                  return kpiRow(e, `<td>${fmt(e.periodStart)}</td>
                    <td>${esc(missing || '—')}</td>
                    <td><span class="pill ${days <= 3 ? 'p-negative' : 'p-wait'}">${days > 0 ? `${days} gg` : days === 0 ? 'oggi' : 'avvio superato'}</span></td>`);
                }).join('') || '<tr><td colspan="4"><div class="empty">Nessun avvio a rischio.</div></td></tr>'}
            </tbody>
          </table>
        </section>
      </div>
    </div>

    <section class="kpi-panel">
      <h2>Prossimi avvii</h2>
      <p class="hint">Dai prossimi ${upcoming.length} engagement con data pianificata.</p>
      <table class="kpi-table">
        <thead><tr><th>Engagement</th><th>Cliente</th><th>Periodo</th><th>Preparazione</th></tr></thead>
        <tbody>
          ${upcoming.slice(0, 8).map(e => `<tr data-act="open" data-id="${esc(e.id)}">
            <td class="name"><b>${esc(e.name)}</b><span>${esc(e.id)}</span></td>
            <td>${esc(e.clientName)}</td>
            <td><span class="period">${fmt(e.periodStart)} – ${fmt(e.periodEnd)}</span></td>
            <td>${e.preparationAlert ? delayBadge(e) : pill(['Pronto', 'ok'])}</td>
          </tr>`).join('') || '<tr><td colspan="4"><div class="empty">Nessuna data pianificata.</div></td></tr>'}
        </tbody>
      </table>
    </section>`;
}

async function loadKpi() {
  await loadList();
  if (state.view === 'kpi') renderKpi();
}

/* ====== SOLLECITI ====== */
// Le regole sono fisse: cambiano solo l'accensione e il testo, che vive nei
// template (Amministrazione › Template mail) ed è bilingue.
function solicitationDetail(item) {
  if (item.daysToStart !== null && item.daysToStart !== undefined) {
    const days = item.daysToStart;
    return days > 0
      ? `avvio tra ${days} giorni`
      : days === 0
        ? 'avvio oggi'
        : `avvio superato di ${-days} giorni`;
  }
  return item.ruleKey === 'rep'
    ? `${item.days} giorni lavorativi di ritardo`
    : `${item.days} giorni in revisione`;
}

function renderSolicitations() {
  const editable = state.role === 'PMO';
  const rules = (state.rules || []).map(rule => `
    <div class="mailc">
      <div class="t">
        <b>${esc(rule.label)}</b>
        <span>${esc(rule.when)}</span>
        <span>Destinatario: <b>${esc(rule.recipient)}</b> · soglia ${rule.thresholdDays}${rule.countBusinessDays ? ' giorni lavorativi' : ' giorni'}</span>
        <span class="hint">Testo modificabile e bilingue in <b>Amministrazione › Template mail</b>.</span>
      </div>
      <div class="ctl">
        ${editable
          ? `<label class="sw"><input type="checkbox" id="on_${esc(rule.key)}" data-change="rule" data-key="${esc(rule.key)}" ${rule.enabled ? 'checked' : ''}><i></i><span>${rule.enabled ? 'Attiva' : 'Disattivata'}</span></label>`
          : `<span style="color:var(--muted);font-size:var(--fs-md)">${rule.enabled ? 'Attiva' : 'Disattivata'}</span>`}
      </div>
    </div>`).join('');

  const due = state.due.length ? `
    <table><thead><tr><th>Engagement</th><th>Regola</th><th>Dettaglio</th><th>Destinatario</th><th>Stato</th><th></th></tr></thead><tbody>
      ${state.due.map(item => `<tr>
        <td class="name"><b>${esc(item.engagementId)}</b><span>${esc(item.clientName)}</span></td>
        <td>${esc(item.label)}</td>
        <td>${esc(solicitationDetail(item))}</td>
        <td>${esc(item.recipient)}</td>
        <td>${item.sentToday
          ? pill(['Inviato oggi', 'done'])
          : pill([editable ? 'Da inviare' : 'In attesa del PMO', editable ? 'action' : 'wait'])}</td>
        <td style="text-align:right">${editable
          ? `<button class="btn sec sm" data-act="send-solicitation" data-key="${esc(item.key)}" ${item.canSend ? '' : 'disabled title="' + esc(item.sentToday ? 'Sollecito già inviato oggi' : 'Non disponibile') + '"'}>Invia ora</button>`
          : ''}</td>
      </tr>`).join('')}
    </tbody></table>` : '<div class="empty">Nessuna situazione da sollecitare.</div>';

  $('#app').innerHTML = `
    <h1>Solleciti automatici</h1>
    <p class="sub">${editable
      ? 'Pannello PMO: accendi le regole e invia i solleciti dovuti.'
      : 'Sola lettura: i solleciti sono inviati dal PMO.'} Data di riferimento: ${fmt(today())} · massimo <b>un sollecito al giorno per task</b>.</p>
    ${listTabs()}
    <div class="card"><h2>Regole</h2>${rules || '<div class="empty">Nessuna regola.</div>'}</div>
    <div class="card" style="margin-top:16px"><h2>Situazioni che richiedono un sollecito</h2>${due}</div>`;
}

/* ====== DETTAGLIO ====== */
function nextAction(d) {
  const e = d.engagement;
  const s = d.actionState;

  if (s) {
    const icons = { action: '!', waiting: '…', progress: '▶', done: '✓', neutral: '·', blocked: '<svg aria-hidden="true"><use href="#i-lock"></use></svg>' };
    const head = s.kind === 'action'
      ? 'Richiede il tuo intervento'
      : s.kind === 'waiting'
        ? `In attesa di ${s.ownerLabel || 'altri'}`
        : s.kind === 'done'
          ? 'Completato'
          : s.kind === 'blocked'
            ? 'Bloccato'
            : 'In corso';
    const labels = {
      docs: 'Vai ai documenti',
      plan: 'Vai alla pianificazione',
      scope: 'Compila lo scope',
      cred: 'Compila le credenziali',
      reports: 'Vai ai report'
    };
    const button = s.kind === 'action' && s.targetTab
      ? `<button class="btn pri sm" style="margin-left:8px" data-act="tab" data-tab="${esc(s.targetTab)}">${esc(labels[s.targetTab] || 'Apri')}</button>`
      : '';
    return `<div class="note ${s.kind}">
      <div class="note-head"><span class="note-ico">${icons[s.kind] || '·'}</span>${esc(head)}</div>
      ${s.label && s.label !== head ? `<div>${esc(s.label)}${button}</div>` : ''}
      ${statusAge(d)}
      ${solicitButton(d)}
    </div>`;
  }

  // Fallback per un backend senza actionState.
  const accepted = e.acceptedProposal;
  const pending = (e.proposals || []).find(p => p.status === 'Pending');
  let message = '';
  switch (d.phase) {
    case 'Docs': {
      const missingDocs = [
        !e.hasManleva ? 'scheda tecnica firmata dal cliente' : '',
        !e.orderConfirmed ? 'registrazione dell\'ordine da parte del PMO' : '',
        !isClient() && d.capabilities && d.capabilities.canViewFinancials && !e.financialsDone ? 'costi e margine (PMO o Manager)' : '',
        e.financialsDone && !e.financialsApproved ? 'approvazione di costi e margine (Manager)' : ''
      ].filter(Boolean);
      message = (missingDocs.length
        ? 'In attesa di: ' + missingDocs.join(' e ')
        : 'In attesa del completamento della prima fase') +
        '. Il workflow prosegue con lo scope quando la prima fase è completa.';
      break;
    }
    case 'Scope':
      message = `In attesa dello scope dell'attività: ${d.scope && d.scope.done ? 'completato' : 'da compilare da cliente o PMO'}. Scope e credenziali si possono compilare già da ora.`;
      break;
    case 'Planning':
      message = pending
        ? `Proposta ${fmt(pending.startDate)} → ${fmt(pending.endDate)} in attesa dell'approvazione del Manager.`
        : 'Nessuna proposta di date ancora inviata.';
      break;
    case 'Credentials':
      message = `Scope completato: in attesa delle credenziali di accesso per l'esecuzione.`;
      break;
    case 'Scheduled':
      message = `Tutto pronto: attività pianificata dal ${fmt(accepted?.startDate)} al ${fmt(accepted?.endDate)}.`;
      break;
    case 'Running':
      message = `Attività in corso fino al ${fmt(accepted?.endDate)}.`;
      break;
    case 'Reporting':
      message = e.reviewStatus === 'Pending'
        ? 'Attività conclusa: deliverables in attesa di revisione del manager.'
        : `Attività conclusa il ${fmt(accepted?.endDate)}: i deliverables sono in redazione.`;
      break;
    case 'Done':
      return '<div class="note done"><div class="note-head"><span class="note-ico">✓</span>Completato</div>Engagement completato. I deliverables sono disponibili nella scheda Reportistica.</div>';
  }
  if (pending && pending.kind === 'resched' && d.phase !== 'Planning') {
    message += ` Richiesta di riprogrammazione ${fmt(pending.startDate)} → ${fmt(pending.endDate)} in attesa dell'approvazione del Manager.`;
  }
  const readOnly = state.role === 'Auditor' ? '<b>Profilo Auditor</b>: sola lettura. ' : '';
  return `<div class="note blocked">${readOnly}${esc(message)}${solicitButton(d)}</div>`;
}

// Sollecito manuale: si può sollecitare solo chi ha l'azione in carico, una
// volta al giorno. Il testo è il template "Sollecito su richiesta".
function solicitButton(d) {
  const s = d.solicitation;
  if (!s) return '';

  if (s.sentToday) {
    return `<div class="solicit-line"><span class="pill p-ok">Sollecito inviato oggi a ${esc(s.recipient)}</span></div>`;
  }

  if (!s.canSend) {
    return s.blockedReason
      ? `<div class="solicit-line"><span class="hint">${esc(s.blockedReason)}</span></div>`
      : '';
  }

  return `<div class="solicit-line">
    <button class="btn pri sm" data-act="solicit-engagement">Sollecita ${esc(s.recipient)}</button>
    <span class="hint">${esc(s.label)}${s.sentDate ? ` · ultimo sollecito ${esc(s.sentDate)}` : ''}</span>
  </div>`;
}

// I passi del workflow sono numerati da 0, allineati a STEPS. Gli ultimi due,
// il retest e il report di retest, si aprono nella scheda Report (tab: 'reports')
// dove vivono i comandi, e compaiono solo se il recheck è previsto.
const DETAIL_PANELS = {
  setup: { n:'0', short:'Setup', group:'Workflow', title:'Setup', desc:'Info, team, liste, lingua e deliverable', phase:'Setup' },
  docs: { n:'1', short:'Documenti', group:'Workflow', title:'Documenti e dati economici', desc:'Scheda tecnica, ordine e dati economici', phase:'Docs' },
  scope: { n:'2', short:'Scope', group:'Workflow', title:'Scope', desc:'Perimetro, finestre e referente', phase:'Scope' },
  plan: { n:'3', short:'Pianificazione', group:'Workflow', title:'Pianificazione', desc:'Proposta e approvazione delle date', phase:'Planning' },
  cred: { n:'4', short:'Credenziali', group:'Workflow', title:'Credenziali', desc:'Accessi per l\'esecuzione', phase:'Credentials' },
  run: { n:'5', short:'Esecuzione', group:'Workflow', title:'Esecuzione', desc:'Avanzamento dell\'attività', phase:'Scheduled,Running' },
  reports: { n:'6', short:'Report', group:'Workflow', title:'Report', desc:'Revisione e consegna dei deliverable', phase:'Reporting' },
  retest: { n:'7', short:'Retest', group:'Workflow', tab:'reports', title:'Retest', desc:'Verifiche dopo i fix: richiesta del cliente e date', phase:'Retest' },
  retestreport: { n:'8', short:'Report retest', group:'Workflow', tab:'reports', title:'Report di retest', desc:'Invio al cliente senza revisione', phase:'RetestReporting' },
  dl: { n:'', short:'Distribution list', group:'Gestione', title:'Distribution list', desc:'Notifiche e invio deliverables' },
  team: { n:'', short:'Team', group:'Gestione', title:'Team esterno', desc:'Partecipanti al cliente e all\'engagement' },
  mail: { n:'', short:'Comunicazioni', group:'Gestione', title:'Comunicazioni', desc:'Email automatiche e registro invii' },
  log: { n:'', short:'Registro', group:'Gestione', title:'Registro attività', desc:'Eventi e audit dell\'engagement' }
};

// I due passi del retest esistono solo se il recheck è previsto.
function workflowSteps(d) {
  const base = isClient()
    ? ['docs', 'scope', 'plan', 'cred', 'run', 'reports']
    : ['setup', 'docs', 'scope', 'plan', 'cred', 'run', 'reports'];

  return d.retest?.planned ? [...base, 'retest', 'retestreport'] : base;
}

function currentStepKey(d) {
  const entry = Object.entries(DETAIL_PANELS).find(([, meta]) =>
    String(meta.phase || '').split(',').includes(d.phase));
  return entry ? entry[0] : '';
}

function runState(d) {
  if (d.phase === 'Scheduled' || d.phase === 'Running') return 'progress';
  if (d.phase === 'Reporting' || d.phase === 'Retest' || d.phase === 'RetestReporting' || d.phase === 'Done') return 'ok';
  return 'lock';
}


function panelState(d, key) {
  if (key === 'run') return runState(d);
  if (key === 'retest' || key === 'retestreport') return retestPanelState(d, key);
  if (key === 'dl' || key === 'team' || key === 'mail' || key === 'log') return 'gestione';
  return tabState(d, key);
}

// Stato dei due passi di retest: dipendono dalla fase e da chi deve agire.
function retestPanelState(d, key) {
  const r = d.retest;
  if (!r) return 'lock';

  const sent = !!r.sentDate;

  if (key === 'retestreport') {
    if (sent) return 'ok';
    if (d.phase === 'RetestReporting')
      return d.actionState?.kind === 'action' ? 'todo' : 'wait';
    return 'lock';
  }

  if (sent || d.phase === 'RetestReporting') return 'ok';
  if (d.phase === 'Retest')
    return d.actionState?.kind === 'action' ? 'todo' : 'wait';

  return 'lock';
}

function panelStateLabel(d, key) {
  if (key === 'run') return d.phase === 'Scheduled' ? 'Pianificato' :
    d.phase === 'Running' ? 'In corso' :
    d.phase === 'Reporting' || d.phase === 'Done' ? 'Concluso' : 'Bloccato';
  const s = panelState(d, key);
  return s === 'ok' ? 'Completato' : s === 'todo' ? 'Da fare' : s === 'wait' ? 'In attesa' : s === 'lock' ? 'Bloccato' : '';}

function panelPillClass(s) {
  return s === 'ok' ? 'ok' : s === 'todo' ? 'action' : s === 'wait' ? 'wait' : s === 'progress' ? 'progress' : 'blocked';
}

function renderDetail() {
  const d = state.detail;
  const e = d.engagement;
  const c = d.capabilities || {};
  const st = statusPill(d);
  const owner = statusOwner(d);
  const activeKey = isClient() && state.tab === 'setup' ? 'docs' : state.tab;
  const activeMeta = DETAIL_PANELS[activeKey] || DETAIL_PANELS.docs;
  const activeState = panelState(d, activeKey);
  // La scheda Report ospita anche i due passi di retest: quando è il loro
  // momento, l'intestazione del pannello segue il passo e non la scheda.
  const stepKey = currentStepKey(d);
  const stepMeta = DETAIL_PANELS[stepKey];
  const panelMeta = stepMeta && (stepMeta.tab || stepKey) === activeKey ? stepMeta : activeMeta;
  const body = {
    setup: tabSetup,
    docs: tabDocs,
    plan: tabPlan,
    scope: tabScope,
    cred: tabCred,
    run: tabRun,
    reports: tabReports,
    dl: tabDl,
    team: tabTeam,
    mail: tabMail,
    log: tabLog
  }[activeKey] || tabDocs;

  const prep = d.preparationAlert;
  const prepText = prep
    ? [
        (prep.missing || []).map(m => m === 'scope' ? 'Scope' : 'Credenziali').join(' e '),
        prep.daysToStart > 0
          ? `mancano ${prep.daysToStart} gg`
          : prep.daysToStart === 0
            ? 'avvio oggi'
            : `avvio superato da ${Math.abs(prep.daysToStart)} gg`
      ].join(' · ')
    : '';
  const period = e.acceptedProposal
    ? `${fmt(e.acceptedProposal.startDate)} – ${fmt(e.acceptedProposal.endDate)}`
    : 'Da definire';
  const pending = (e.proposals || []).find(p => p.status === 'Pending');

  const steps = workflowSteps(d);
  const completedSteps = steps.filter(key => panelState(d, key) === 'ok').length;
  const stepNav = steps.map(key => {
    const s = panelState(d, key);
    const meta = DETAIL_PANELS[key];
    const tab = meta.tab || key;
    // Evidenzia il passo corrispondente alla fase corrente, non tutti quelli
    // che aprono la stessa scheda (Report, Retest e Report retest).
    const isCurrent = currentStepKey(d) === key;
    return `<button class="wnav-btn s-${s} ${state.tab === tab && isCurrent ? 'on' : ''}" data-act="tab" data-tab="${tab}" title="${esc(meta.title)} · ${esc(panelStateLabel(d, key))}">
      <span class="wnav-num">${s === 'ok' ? '✓' : meta.n}</span>
      <span class="wnav-h"><b>${esc(meta.short)}</b><span>${esc(meta.desc)}</span></span>
    </button>`;
  }).join('');

  const extras = [
    ['dl', 'i-users', 'Distribution list', (d.distributionEffective || d.distributionList || []).length],
    ['team', 'i-team', 'Team', (d.teamEffective || []).length],
    ['mail', 'i-mail', isClient() ? 'Email ricevute' : 'Comunicazioni', (d.mailLog || []).length],
    ['log', 'i-list', 'Registro', (d.audit || []).length]
  ];
  const extraNav = extras.map(([key, icon, label, count]) => `
    <button class="wnav-btn extra ${state.tab === key ? 'on' : ''}" data-act="tab" data-tab="${key}" title="${esc(label)} · ${count}">
      <span class="wnav-num"><svg aria-hidden="true"><use href="#${icon}"></use></svg></span>
      <span class="wnav-h"><b>${esc(label)}</b><span>${count}</span></span>
    </button>`).join('');

  const statePill = activeState === 'gestione'
    ? ''
    : `<span class="pill p-${panelPillClass(activeState)}">${esc(panelStateLabel(d, activeKey))}</span>`;

  const people = [];
  const seenPeople = new Set();
  const addPerson = person => {
    if (!person.name) return;
    const key = String(person.email || person.name).toLowerCase();
    if (seenPeople.has(key)) return;
    seenPeople.add(key);
    people.push(person);
  };
  addPerson({ name: e.clientName, role: 'Cliente', org: 'Cliente' });
  addPerson({ name: e.owner, role: 'Responsabile', org: 'Provider' });
  (d.teamEffective || []).forEach(member => addPerson({
    name: member.name,
    role: member.role || 'Partecipante',
    org: member.organization,
    email: member.email,
    id: member.id,
    member: true
  }));
  const peopleHtml = people.map(person => {
    const removable = person.member && c.canRemoveTeam &&
      (state.role !== 'Client' || person.org === 'Cliente');
    return `<div class="ctx-person-row">
      <button class="ctx-person" data-act="tab" data-tab="team" title="Apri il team">
        <span class="avatar">${esc(initialsOf(person.name))}</span>
        <span><b>${esc(person.name)}</b><span>${esc(person.role)}${person.org && person.org !== person.role ? ` · ${esc(person.org)}` : ''}</span></span>
      </button>
      ${removable ? `<button class="ctx-person-x" data-act="remove-team" data-member="${esc(person.id)}" title="Rimuovi ${esc(person.name)}" aria-label="Rimuovi ${esc(person.name)}">×</button>` : ''}
    </div>`;
  }).join('');

  $('#app').innerHTML = `
    <button class="crumb" data-act="list">← Tutti gli engagement</button>
    <div class="eng-hero">
      <div class="eng-hero-t">
        <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px">
          ${typeBadge(e.type)}
          <span class="code-pill">${esc(e.id)}</span>
          ${clientChip(clientFor(e))}
        </div>
        <h1>${esc(e.name)}</h1>
        <p class="sub">${[e.owner ? `Responsabile ${e.owner}` : '', `creato il ${fmt(e.createdDate)}`].filter(Boolean).map(value => esc(value)).join(' · ')}</p>
      </div>
      <div class="eng-hero-s">
        ${objState(d, { days: true })}
        ${owner ? `<span class="status-owner">In attesa di <b>${esc(owner)}</b></span>` : ''}
      </div>
    </div>
    ${prep ? `<div class="note waiting" style="margin:12px 0 0"><b>Preparazione in ritardo.</b> ${esc(prepText)}.</div>` : ''}
    <div class="split-detail">
      <nav class="workflow-nav" aria-label="Workflow e gestione">
        <div class="wnav-group">Workflow <span>${completedSteps}/${steps.length} passi</span></div>
        ${stepNav}
        <div class="wnav-group">Gestione</div>
        ${extraNav}
      </nav>
      <section class="work-panel">
        <header class="work-panel-head">
          <span class="wp-num">${panelMeta.n || '•'}</span>
          <div class="wp-t">
            <span class="wp-kicker">${esc(panelMeta.group)}${panelMeta.n ? ` · Passo ${panelMeta.n} di ${STEPS.length}` : ''}</span>
            <h2>${esc(panelMeta.title)}</h2>
            <p>${esc(panelMeta.desc)}</p>
          </div>
          ${statePill}
        </header>
        <div class="work-panel-body">
          ${body(d)}
        </div>
      </section>
      <aside class="context-rail">
        ${nextAction(d)}
        <div class="ctx-card">
          <div class="ctx-head"><h3>Persone</h3>${c.canInviteTeam ? `<button class="ctx-add" data-act="invite-team" title="Aggiungi persona" aria-label="Aggiungi persona">+</button>` : ''}</div>
          ${peopleHtml}
          <button class="ctx-link" data-act="tab" data-tab="team">Gestisci team →</button>
        </div>
        <div class="ctx-card">
          <h3>Date</h3>
          <dl class="ctx-kv">
            <dt>Periodo</dt><dd>${esc(period)}</dd>
            ${pending ? `<dt>Proposta</dt><dd>${fmt(pending.startDate)} → ${fmt(pending.endDate)}</dd>` : ''}
            <dt>Creazione</dt><dd>${fmt(e.createdDate)}</dd>
          </dl>
        </div>
        ${c.canViewFinancials ? `<div class="ctx-card">
          <details class="econ-collapse">
            <summary><h3>Business case</h3><span class="econ-open">Mostra</span><span class="econ-close">Nascondi</span></summary>
            <dl class="ctx-kv">
              <dt>Costo</dt><dd>${e.cost != null ? fmtMoney(e.cost) : '–'}</dd>
              <dt>Margine</dt><dd>${e.margin != null ? fmtPercent(e.margin) : '–'}</dd>
              <dt>Ricavo</dt><dd>${fmtMoney(financialValue(e.cost, e.margin))}</dd>
              <dt>Approvazione</dt><dd>${e.financialsApproved ? 'Approvato' : e.financialsDone ? 'In attesa' : '–'}</dd>
            </dl>
          </details>
        </div>` : ''}
        <div class="ctx-card">
          <h3>Riferimenti</h3>
          <dl class="ctx-kv">
            <dt>Codice</dt><dd>${esc(e.id)}</dd>
            <dt>Tipo</dt><dd>${esc(typeLabel(e.type))}</dd>
            ${!isClient() ? `<dt>Ordine</dt><dd>${e.orderConfirmed ? esc(e.orderRef || 'Ricevuto') : 'Non ricevuto'}</dd>` : ''}
          </dl>
        </div>
      </aside>
    </div>`;
  syncHeaderOffset();
}

/* ====== SCHEDE ====== */
function docRow(icon, title, subtitle, right) {
  return `<div class="doc"><div class="ico">${esc(icon)}</div>
    <div class="t"><b>${title}</b><span>${subtitle}</span></div>${right}</div>`;
}

function isSampleDoc(path) {
  return typeof path === 'string' && path.startsWith('samples/');
}

function docName(path) {
  return typeof path === 'string' && path
    ? path.split('/').pop()
    : '';
}

function docLink(path) {
  return `<a class="btn sec sm" href="/${esc(path)}" target="_blank" rel="noopener">Apri</a>`;
}

function tabDocs(d) {
  const e = d.engagement;
  const c = d.capabilities || {};
  const canManleva = c.canUploadManleva;
  const canDocs = c.canManageEngagementDocs;
  const canCreds = c.canCredentials;

  let html = `<div class="note">Profilo <b>${esc(ROLE_LABEL[state.role])}</b> · puoi vedere: ${esc(VISIBILITY[state.role] || '')}.</div>
    <div class="card"><h2>Documenti associati</h2>`;

  html += docRow('SCH', 'Scheda tecnica con manleva',
    e.hasManleva
      ? `Firmato · ${esc(docName(e.manlevaFile))}`
      : 'Da firmare e caricare da parte del cliente: vale anche come manleva',
    e.hasManleva
      ? (isSampleDoc(e.manlevaFile)
          ? `<span class="decision-group">${docLink(e.manlevaFile)}${pill(['Firmato', 'ok'])}</span>`
          : pill(['Firmato', 'ok']))
      : canManleva
        ? `<button class="btn pri sm" data-act="upload-manleva">Carica firmato${isClient() ? '' : ' (per conto del cliente)'}</button>`
        : pill(['In attesa cliente', 'warn']));

  html += docRow('ING', 'Documento di ingaggio',
    e.documentoIngaggioFile ? esc(docName(e.documentoIngaggioFile)) : 'Non ancora caricato',
    e.documentoIngaggioFile
      ? `<span class="decision-group">${isSampleDoc(e.documentoIngaggioFile) ? docLink(e.documentoIngaggioFile) : ''}${pill(['Disponibile', 'ok'])}</span>`
      : canDocs
        ? `<button class="btn pri sm" data-act="upload-ingaggio">Carica</button>`
        : pill(['Non disponibile', 'mute']));

  if (!isClient()) {
    if (canDocs) {
      html += `<div class="inline-block">
        <div class="inline-head"><h3>Ordine</h3>${e.orderConfirmed
          ? pill(['Ricevuto', 'ok'])
          : pill(['Da registrare', 'warn'])}</div>
        <div class="inline-row">
          <div class="field" style="flex:1"><label for="f_orderRef">Riferimento ordine</label>
            <input type="text" id="f_orderRef" value="${esc(e.orderRef || '')}" placeholder="es. PO-2026-0142"></div>
          <button class="btn ${e.orderConfirmed ? 'sec' : 'pri'}" data-act="save-order">${e.orderConfirmed ? 'Aggiorna' : 'Registra ordine'}</button>
        </div>
        <p class="hint">Il PMO registra l'ordine ricevuto dal cliente.</p>
      </div>`;
    } else {
      html += docRow('PO', 'Ordine',
        e.orderConfirmed ? `Ricevuto · ${esc(e.orderRef || '')}` : 'In attesa di registrazione',
        e.orderConfirmed ? pill(['Ricevuto', 'ok']) : pill(['In attesa ordine', 'warn']));
    }

    if (c.canViewFinancials) {
      const finDone = !!e.financialsDone && e.cost != null && e.margin != null;
      const finApproved = !!e.financialsApproved;
      const canEditFin = !!c.canEditFinancials;
      const canApproveFin = !!c.canApproveFinancials;
      const finTotal = finDone ? financialValue(e.cost, e.margin) : null;
      const finState = finApproved
        ? pill(['Approvato', 'ok'])
        : finDone ? pill(['In attesa di approvazione', 'wait']) : pill(['Da compilare', 'warn']);

      if (canEditFin) {
        html += `<details class="inline-block fin bc-collapse">
          <summary class="bc-summary">
            <span class="bc-summary-title"><b>Costi e margine</b><span class="pill p-progress">solo PMO/Manager</span></span>
            <span class="bc-summary-right">${finState}<span class="bc-open">Apri</span><span class="bc-close">Chiudi</span></span>
          </summary>
          <div class="bc-content">
            <div class="fgrid">
              <div><label for="f_cost">Costo (€)</label><input type="number" id="f_cost" min="0" value="${e.cost != null ? e.cost : ''}" placeholder="0" oninput="updateFinancialValue(this)"></div>
              <div><label for="f_margin">Margine (%)</label><input type="number" id="f_margin" min="0" max="100" value="${e.margin != null ? e.margin : 46}" oninput="updateFinancialValue(this)"></div>
              <div><label for="f_finValue">Ricavo</label><input id="f_finValue" value="${fmtMoney(finTotal)}" readonly></div>
              <div><label for="f_finApproval">Approvazione</label><input id="f_finApproval" value="${finApproved ? `Approvato${e.financialsApprovedDate ? ' il ' + fmt(e.financialsApprovedDate) : ''}` : finDone ? 'In attesa del Manager' : 'Da compilare'}" readonly></div>
            </div>
            <div class="inline-actions">
              <button class="btn pri" data-act="save-financials-inline">Salva dati economici</button>
              ${canApproveFin ? '<button class="btn acc" data-act="approve-financials">Approva</button>' : ''}
              <span class="hint">Ricavo = costo + margine%. Le modifiche del PMO richiedono l'approvazione del Manager.</span>
            </div>
          </div>
        </details>`;
      } else {
        html += `<details class="inline-block bc-collapse">
          <summary class="bc-summary">
            <span class="bc-summary-title"><b>Costi e margine</b></span>
            <span class="bc-summary-right">${finState}<span class="bc-open">Apri</span><span class="bc-close">Chiudi</span></span>
          </summary>
          <div class="bc-content">
            <dl class="ctx-kv" style="grid-template-columns:auto minmax(0,1fr);max-width:420px">
              <dt>Costo</dt><dd>${e.cost != null ? fmtMoney(e.cost) : '–'}</dd>
              <dt>Margine</dt><dd>${e.margin != null ? fmtPercent(e.margin) : '–'}</dd>
              <dt>Ricavo</dt><dd>${fmtMoney(financialValue(e.cost, e.margin))}</dd>
              <dt>Approvazione</dt><dd>${finApproved ? 'Approvato' : finDone ? 'In attesa' : '–'}</dd>
            </dl>
          </div>
        </details>`;
      }
    }
  }

  if (canCreds) {
    const cred = d.credentials || e.credentials;
    html += docRow('CRED', 'Credenziali fornite',
      cred && cred.done ? 'Credenziali consegnate tramite canale sicuro' : 'Non ancora fornite',
      cred && cred.done
        ? pill(['Fornite', 'ok']) + ' <button class="btn sec sm" data-act="tab" data-tab="cred">Dettagli</button>'
        : canEditCredentials(d)
          ? `<button class="btn pri sm" data-act="tab" data-tab="cred">Compila</button>`
          : pill(['In attesa cliente', 'warn']));
  }

  const reports = e.reports || [];
  const published = reports.filter(r => r.published).length;
  html += docRow('RPT', 'Deliverables',
    published
      ? `${published} pubblicati${!isClient() && reports.length > published ? ` · ${reports.length - published} in bozza` : ''}`
      : 'Nessun deliverable ancora disponibile',
    published
      ? pill(['Disponibili', 'ok']) + ' <button class="btn pri sm" data-act="tab" data-tab="reports">Apri</button>'
      : pill(['Non disponibili', 'mute']));

  html += `</div>
    <p style="color:var(--muted);font-size:var(--fs-md);margin-top:12px">Scope e pianificazione si sbloccano quando la scheda tecnica firmata è caricata, l'ordine è registrato dal PMO e costi e margine sono approvati.</p>`;
  return html;
}

function canDecideProposal(p) {
  // Le proposte di pianificazione (cliente o PMO) sono approvate solo dal Manager.
  return p.status === 'Pending' && state.role === 'Manager';
}

function tabPlan(d) {
  const e = d.engagement;
  const c = d.capabilities || {};
  const canPropose = c.canPropose;

  if (!e.hasManleva || !e.orderConfirmed || !e.financialsDone || !e.financialsApproved) {
    return `<div class="note lockbox"><b>Pianificazione bloccata.</b> Servono la scheda tecnica firmata dal cliente, l'ordine registrato dal PMO e costi/margine approvati dal Manager.</div>`;
  }

  const pending = (e.proposals || []).find(p => p.status === 'Pending');
  const accepted = e.acceptedProposal;
  const notice = d.planningNotice;
  const earlyWarning = notice && !accepted && canPropose
    ? `<div class="note waiting"><b>Avviso pianificazione.</b>
        Non è possibile proporre una pianificazione prima di due settimane dalla
        richiesta (${fmt(notice.requestDate)}): potrai proporla dal
        <b>${fmt(notice.availableFrom)}</b>${notice.daysRemaining > 0
          ? `, tra ${notice.daysRemaining} ${notice.daysRemaining === 1 ? 'giorno' : 'giorni'}`
          : ''}. L'avviso non blocca l'invio.</div>`
    : '';

  const list = (e.proposals || []).length
    ? [...e.proposals].reverse().map(p => {
        const status = proposalLabel(p);
        return `<div class="prop">
          <div class="d">
            <b>${fmt(p.startDate)} → ${fmt(p.endDate)}</b>
            ${p.kind === 'resched' ? '<span class="badge-kind">Riprogrammazione</span>' : ''}
            <span>${p.from === 'Client' ? 'Cliente' : 'PMO'} · ${esc(p.by)} · ${fmt(p.date)}
              ${p.note ? ` · “${esc(p.note)}”` : ''}${p.reason ? ` · Motivo rifiuto: ${esc(p.reason)}` : ''}</span>
          </div>
          ${pill(status)}
          ${canDecideProposal(p)
            ? `<div class="decision-group" role="group" aria-label="Decisione sulla proposta">
                 <button class="decide yes sm" data-act="decide" data-pid="${esc(p.id)}" data-accept="1">Approva</button>
                 <button class="decide no sm" data-act="decide" data-pid="${esc(p.id)}" data-accept="0">Rifiuta</button>
               </div>`
            : ''}
        </div>`;
      }).join('')
    : '<div class="empty">Nessuna proposta ancora inviata.</div>';

  let right;
  if (accepted) {
    let action = '';
    if (pending) {
      action = `<p style="color:var(--muted);font-size:var(--fs-md);margin:12px 0 0">Richiesta di riprogrammazione in corso: decide il Manager.</p>`;
    } else if (!canPropose) {
      action = '';
    } else if (d.phase !== 'Done') {
      action = `<div style="margin-top:14px"><button class="btn sec" data-act="reschedule">Richiedi riprogrammazione</button></div>`;
    }
    right = `<h2>Pianificazione confermata</h2>
      <div class="note done">
        <b>${fmt(accepted.startDate)} → ${fmt(accepted.endDate)}</b><br>
        Approvata dal Manager${accepted.from === 'Client' ? ' · proposta del cliente' : ' · proposta del PMO'}.</div>${action}`;
  } else if (!canPropose) {
    right = `<h2>Nuova proposta</h2><div class="note lockbox">Sola lettura: le date sono gestite da cliente, PMO e Manager.</div>`;
  } else {
    right = `<h2>Nuova proposta</h2>
      ${earlyWarning}
      <p class="sub" style="margin-bottom:12px">Le date proposte da cliente o PMO vengono approvate dal Manager.</p>
      <div class="fgrid">
        <div><label for="ps">Inizio attività</label><input type="date" id="ps" min="${today()}"></div>
        <div><label for="pe">Fine attività</label><input type="date" id="pe" min="${today()}"></div>
        <div class="full"><label for="pn">Note (vincoli, finestre di manutenzione…)</label><textarea id="pn" rows="3"></textarea></div>
      </div>
      <div style="margin-top:14px"><button class="btn pri" data-act="propose">Invia proposta al Manager</button></div>`;
  }

  return `${!accepted && canEditPreparation(d)
    ? '<div class="note progress">Puoi già compilare <b>scope</b> e <b>credenziali</b>: non serve attendere la conferma delle date.</div>'
    : ''}<div class="grid two" style="align-items:start">
    <div class="card"><h2>Proposte e richieste</h2>${list}</div>
    <div class="card">${right}</div>
  </div>`;
}


function authorOf(x) {
  return x.by === 'Client' ? 'cliente' : `${ROLE_LABEL[x.by] || x.by} per conto del cliente`;
}

function tabScope(d) {
  const e = d.engagement;
  if (!e.hasManleva || !e.orderConfirmed || !e.financialsDone || !e.financialsApproved) {
    return `<div class="note lockbox"><b>Sezione bloccata.</b> Lo scope si sblocca dopo la firma della manleva, la registrazione dell'ordine e l'approvazione di costi e margine.</div>`;
  }

  const info = state.scope;
  if (!info) return `<div class="card"><p class="sub">Caricamento…</p></div>`;
  const s = info.scope || {};

  if (!info.canEdit) {
    if (!s.done) {
      return `<div class="note waiting">In attesa che lo scope venga fornito dal cliente.</div>`;
    }
    return `<div class="card">
      <p class="sub">Fornito da ${esc(authorOf(s))} il ${fmt(s.date)} · sola lettura per il tuo profilo.</p>
      <table class="detail-table">${[
        ['Target (hostname / URL)', s.host],
        ['Indirizzi / range IP', s.ipRange || '–'],
        ['Fuori scope', s.outOfScope || '–'],
        ['Finestra oraria e vincoli', s.window || '–'],
        ['Referente tecnico', s.contact],
        ['Note', s.notes || '–']
      ].map(r => `<tr><td>${r[0]}</td><td><b>${esc(r[1])}</b></td></tr>`).join('')}
      </table>
    </div>`;
  }

  return `<div class="card">
    <p class="sub">${s.done
      ? `Fornito da ${esc(authorOf(s))} il ${fmt(s.date)}. Puoi modificare i valori e salvare.`
      : 'Compila perimetro, finestre e referente. I campi sono già attivi.'}</p>
    ${!e.acceptedProposal ? '<div class="note progress">La pianificazione non è ancora confermata: puoi compilare lo scope già ora, resterà valido.</div>' : ''}
    ${!isClient() ? '<div class="note">Stai compilando <b>per conto del cliente</b>.</div>' : ''}
    <div class="fgrid">
      <div><label for="f_host">Target (hostname / URL)*</label><input type="text" id="f_host" value="${esc(s.host || '')}" placeholder="es. api-uat.cliente.it"></div>
      <div><label for="f_ipRange">Indirizzi / range IP</label><input type="text" id="f_ipRange" value="${esc(s.ipRange || '')}" placeholder="es. 10.0.0.0/28"></div>
      <div><label for="f_outOfScope">Fuori scope</label><input type="text" id="f_outOfScope" value="${esc(s.outOfScope || '')}" placeholder="Sistemi o ambienti da non testare"></div>
      <div><label for="f_window">Finestra oraria e vincoli</label><input type="text" id="f_window" value="${esc(s.window || '')}" placeholder="es. notturno 22:00–06:00"></div>
      <div><label for="f_contact">Referente tecnico*</label><input type="text" id="f_contact" value="${esc(s.contact || '')}" placeholder="Nome, telefono"></div>
      <div class="full"><label for="f_notes">Note</label><textarea id="f_notes" rows="3">${esc(s.notes || '')}</textarea></div>
    </div>
    <div class="inline-actions">
      <button class="btn pri" data-act="save-scope">Salva scope</button>
      <span class="hint">Salva prima di cambiare sezione: i campi non vengono inviati in automatico.</span>
    </div>
  </div>`;
}

function tabCred(d) {
  const e = d.engagement;
  if (!e.hasManleva || !e.orderConfirmed || !e.financialsDone || !e.financialsApproved) {
    return `<div class="note lockbox"><b>Sezione bloccata.</b> Le credenziali si sbloccano dopo la firma della manleva, la registrazione dell'ordine e l'approvazione di costi e margine.</div>`;
  }

  const info = state.credentials;
  if (!info) return `<div class="card"><p class="sub">Caricamento…</p></div>`;
  if (!info.credentials) {
    return `<div class="note lockbox"><b>Accesso non consentito.</b> Le credenziali non sono visibili al profilo ${esc(ROLE_LABEL[state.role])}.</div>`;
  }

  const c = info.credentials;

  if (!info.canEdit) {
    if (!c.done) {
      return `<div class="note waiting">Credenziali non ancora fornite: in attesa del cliente.</div>`;
    }
    return `<div class="card">
      <p class="sub">Fornite da ${esc(authorOf(c))} il ${fmt(c.date)} · sola lettura per il tuo profilo.</p>
      <table class="detail-table">${[
        ['VPN', c.vpn],
        ['Utenze di test', c.users],
        ['Metodo di consegna dei segreti', c.deliveryMethod],
        ['Note', c.notes || '–']
      ].map(r => `<tr><td>${r[0]}</td><td><b>${esc(r[1])}</b></td></tr>`).join('')}
      </table>
    </div>`;
  }

  const options = ['Vault aziendale', 'File cifrato (password su canale separato)', 'Altro (concordato con Pentester)'];
  return `<div class="card">
    <p class="sub">${c.done ? `Fornite da ${esc(authorOf(c))} il ${fmt(c.date)}. Puoi aggiornarle e salvare.` : 'Indica come verranno consegnati gli accessi: le password non vengono conservate.'}</p>
    ${!e.acceptedProposal ? '<div class="note progress">La pianificazione non è ancora confermata: puoi fornirle già ora, resteranno valide.</div>' : ''}
    <div class="note">Non scrivere password in questo modulo: indica solo dove e come verranno consegnate.</div>
    ${state.role === 'PMO' ? '<div class="note">Stai compilando come PMO <b>per conto del cliente</b>.</div>' : ''}
    <div class="fgrid">
      <div><label for="f_vpn">VPN (endpoint e profilo)*</label><input type="text" id="f_vpn" value="${esc(c.vpn || '')}" placeholder="es. vpn.cliente.it – profilo test"></div>
      <div><label for="f_users">Utenze di test*</label><input type="text" id="f_users" value="${esc(c.users || '')}" placeholder="es. 2 utenze: utente e amministratore"></div>
      <div><label for="f_deliveryMethod">Metodo di consegna dei segreti*</label>
        <select class="f" id="f_deliveryMethod">
          <option value="">Seleziona…</option>
          ${options.map(o => `<option ${c.deliveryMethod === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}
        </select></div>
      <div class="full"><label for="f_credNotes">Note</label><textarea id="f_credNotes" rows="3">${esc(c.notes || '')}</textarea></div>
    </div>
    <div class="inline-actions">
      <button class="btn pri" data-act="save-credentials">Salva credenziali</button>
      <span class="hint">Salva prima di cambiare sezione.</span>
    </div>
  </div>`;
}

function reviewCard(d) {
  const e = d.engagement;
  const reports = e.reports || [];
  const unpublished = reports.filter(r => !r.published).length;
  const missingTypes = e.missingReportTypes || [];
  const status = reviewLabel(e.reviewStatus);
  let action = '';

  if (state.role === 'Pentester' && missingTypes.length > 0 &&
      e.reviewStatus !== 'Pending') {
    action = `<div class="note waiting" style="margin:0"><b>Mancano i deliverable:</b> ${missingTypes.map(esc).join(', ')}. Carica una versione per ogni tipologia prima di inviare in revisione.</div>`;
  }
  else if (state.role === 'Pentester' && unpublished > 0 &&
      (e.reviewStatus === 'None' || e.reviewStatus === 'Changes')) {
    action = `<button class="btn pri" data-act="submit-review">Invia in revisione al manager</button>`;
  }
  if (state.role === 'Manager' && e.reviewStatus === 'Pending') {
    action = `<div class="decision-group">
      <button class="decide yes" data-act="review-decide" data-approve="1">Approva</button>
      <button class="decide warn" data-act="review-decide" data-approve="0">Richiedi modifiche</button>
    </div>`;
  }
  if (state.role === 'Pentester' && unpublished > 0 && e.reviewStatus === 'Approved' &&
      missingTypes.length === 0) {
    action = `<button class="btn acc" data-act="publish">Pubblica al cliente${entryAuto(d.mail, 'deliver') ? ' e invia email' : ''}</button>`;
  }

  return `<div class="card" style="margin-bottom:16px"><h2>Revisione del manager ${pill(status)}</h2>
    <p class="sub" style="margin-bottom:${action ? 12 : 0}px">I deliverables non arrivano al cliente finché il manager non li approva.</p>
    ${action}</div>`;
}

function tabRun(d) {
  const e = d.engagement;
  const p = e.acceptedProposal;
  if (!p) {
    return `<div class="note lockbox"><b>Esecuzione non ancora pianificata.</b> Si apre quando le date sono confermate e la preparazione (scope e credenziali) è completa.</div>`;
  }

  const phase = d.phase;
  const daysToStart = Math.round((Date.parse(p.startDate) - Date.parse(today())) / 86400000);
  const started = phase === 'Running' || phase === 'Reporting' || phase === 'Done';
  const ended = phase === 'Reporting' || phase === 'Done';
  const stateLabel = ended ? 'Concluso' : started ? 'In corso' : 'Pianificato';
  const statePill = ended ? pill(['Concluso', 'ok']) : started ? pill(['In corso', 'info']) : pill(['Pianificato', 'wait']);
  const startText = started ? fmt(p.startDate) : daysToStart > 0 ? `tra ${daysToStart} ${daysToStart === 1 ? 'giorno' : 'giorni'}` : 'oggi';
  const team = (d.teamEffective || []).length;
  const prep = d.preparationAlert;
  const prepMissing = prep && (prep.missing || []).length
    ? prep.missing.map(m => m === 'scope' ? 'scope' : 'credenziali').join(' e ')
    : '';

  return `<div class="card">
    <p class="sub">Periodo ${fmt(p.startDate)} → ${fmt(p.endDate)} · ${startText} · ${statePill}.</p>
    <div class="run-grid">
      <div><b>${esc(stateLabel)}</b><span>stato attività</span></div>
      <div><b>${fmt(p.endDate)}</b><span>fine prevista</span></div>
      <div><b>${team}</b><span>partecipanti esterni</span></div>
      <div><b>${(e.reports || []).length}</b><span>deliverable</span></div>
    </div>
    ${prepMissing ? `<div class="note waiting" style="margin-top:14px"><b>Preparazione incompleta:</b> mancano ${esc(prepMissing)}. L'avvio potrebbe slittare.</div>` : ''}
    <table class="detail-table" style="margin-top:14px">
      ${e.owner ? `<tr><td>Responsabile</td><td><b>${esc(e.owner)}</b></td></tr>` : ''}
      <tr><td>Cliente</td><td><b>${esc(e.clientName)}</b></td></tr>
      <tr><td>Finestra concordata</td><td><b>${fmt(p.startDate)} → ${fmt(p.endDate)}</b></td></tr>
      <tr><td>Stato</td><td><b>${esc(stateLabel)}</b></td></tr>
    </table>
  </div>`;
}

function tabSetup(d) {
  const e = d.engagement;
  const c = d.capabilities || {};
  const canEdit = !!c.canManageSetup;
  const language = e.language || 'it';
  const selected = e.deliverableTypes || [];
  const done = !!e.setupDone;

  const types = DELIVERABLE_KINDS;

  const definition = (state.activityTypes || []).find(item => item.key === e.type) || null;

  const team = (d.teamEffective || []).length;
  const notifications = (d.distributionEffective || []).length;
  const deliverables = (d.deliverablesEffective || []).length;

  return `<div class="card">
    <h2>Setup attività ${done ? pill(['Completato', 'ok']) : pill(['Da completare', 'wait'])}</h2>
    <p class="sub">Prima di documenti e scope: chi lavora, chi riceve le comunicazioni, in che lingua e quali deliverable produrre.</p>
    <div class="fgrid">
      <div>
        <label for="setup_lang">Lingua dei deliverable</label>
        <select id="setup_lang" class="f" ${canEdit ? '' : 'disabled'}>
          <option value="it" ${language === 'it' ? 'selected' : ''}>Italiano</option>
          <option value="en" ${language === 'en' ? 'selected' : ''}>Inglese</option>
        </select>
      </div>
      <div class="full">
        <label>Tipologie di deliverable*</label>
        <div class="setup-types">
          ${types.map(([value, label, description]) => `
            <label class="setup-type">
              <input type="checkbox" name="setup_type" value="${value}" ${selected.includes(value) ? 'checked' : ''} ${canEdit ? '' : 'disabled'}>
              <span><b>${label}</b><span>${description}</span></span>
            </label>`).join('')}
        </div>
        <p class="hint">Il Pentester dovrà caricare almeno una versione per ogni tipologia selezionata.</p>
      </div>
      <div class="full">
        <label class="actcheck">
          <input type="checkbox" id="setup_retest" ${e.retestPlanned ? 'checked' : ''} ${canEdit && (d.retest ? d.retest.canEditFlag : true) ? '' : 'disabled'}>
          <span>Recheck previsto (retest a fine attività)</span>
        </label>
        <p class="hint" style="margin:5px 0 0">${definition
          ? `Default di <b>${esc(definition.label)}</b>: ${definition.retestPlanned ? 'retest previsto' : 'senza retest'}.`
          : ''} Resta modificabile fino alla richiesta di retest del cliente${d.retest?.requested ? ': ora è bloccato perché il retest è già stato richiesto' : ''}.</p>
      </div>
    </div>
    <div class="inline-actions" style="margin-top:12px">
      ${canEdit
        ? '<button class="btn pri" data-act="save-setup">Salva setup</button>'
        : '<span class="hint">Sola lettura per il tuo profilo.</span>'}
      ${canEdit && definition
        ? `<button class="btn sec" data-act="apply-type-defaults">Applica i default di ${esc(definition.label)}</button>`
        : ''}
      ${!done
        ? '<span class="hint">Completa il setup per sbloccare i passi successivi.</span>'
        : ''}
    </div>
  </div>
  <details class="setup-fold" data-fold="team" ${state.setupFold.team ? 'open' : ''}>
    <summary>Team · ${team} persone</summary>
    ${tabTeam(d)}
  </details>
  <details class="setup-fold" data-fold="dl" ${state.setupFold.dl ? 'open' : ''}>
    <summary>Distribution list · ${notifications} notifiche · ${deliverables} deliverables</summary>
    ${tabDl(d)}
  </details>`;
}

function tabReports(d) {
  const e = d.engagement;
  const c = d.capabilities || {};
  const reports = e.reports || [];
  const published = reports.filter(r => r.published).length;
  const canLink = ['Client', 'PMO', 'Manager'].includes(state.role);
  const deliverLog = (d.mailLog || []).find(entry => entry.type === 'deliver');
  const deliverRecipients = d.deliverablesEffective || [];
  const sentRecipients = deliverLog
    ? String(deliverLog.recipients || '').split(';').map(value => value.trim()).filter(Boolean)
    : [];
  const sentEmails = sentRecipients.map(value => value.toLowerCase());
  const currentEmails = deliverRecipients.map(entry => String(entry.email || '').trim().toLowerCase()).filter(Boolean);
  const recipientChanged = deliverLog && (
    sentEmails.length !== currentEmails.length ||
    sentEmails.some(email => !currentEmails.includes(email)) ||
    currentEmails.some(email => !sentEmails.includes(email)));

  const required = e.deliverableTypes || [];
  const present = [...new Set(reports.map(r => r.kind || 'Technical'))];
  const kinds = c.isClient ? present : [...new Set([...required, ...present])];
  const kindDesc = {
    Executive: 'Sintesi per il management',
    Technical: 'Dettaglio tecnico ed evidenze',
    Activity: 'Log delle attività svolte',
    Custom: 'Deliverable personalizzato concordato'
  };
  const kindOf = r => r.kind || 'Technical';
  const groupOf = kind => {
    const list = reports
      .filter(r => kindOf(r).toLowerCase() === kind.toLowerCase())
      .sort((a, b) => (b.version || 1) - (a.version || 1));
    return {
      list,
      latest: list[0] || null,
      history: list.slice(1)
    };
  };
  const loadedKinds = required.filter(kind =>
    reports.some(r => kindOf(r).toLowerCase() === kind.toLowerCase()));
  const missingKinds = required.filter(kind => !loadedKinds.includes(kind));

  if (!reports.length && !c.canUploadReports) {
    return '<div class="note lockbox"><b>Nessun deliverable disponibile.</b> La reportistica viene caricata dal Pentester e pubblicata al cliente dopo la revisione del manager.</div>';
  }

  const reportRow = (r, historic = false) => `<div class="doc${historic ? ' doc-hist' : ''}">
      ${docTag(r.kind, { version: `v${r.version || 1}`, state: r.published ? 'published' : 'draft' })}
      <div class="t"><b>${esc(r.name)}</b>
        <span>${r.published ? `Pubblicato il ${fmtTime(r.date)}` : `Bozza del ${fmtTime(r.date)}`} · ${fmtSize(r.size)}${historic ? ' · superata' : ''}</span></div>
      <div class="report-actions">
        <button class="btn pri sm" data-act="download-report" data-rid="${esc(r.id)}">Scarica</button>
        ${r.published && canLink
          ? `<button class="btn sec sm" data-act="create-download-link" data-rid="${esc(r.id)}">Link monouso</button>`
          : ''}
      </div>
    </div>`;

  let html = '';
  if (!c.isClient && (reports.length || e.reviewStatus !== 'None')) {
    html += reviewCard(d);
  }

  html += `<div class="card"><h2>Reportistica ${c.isClient ? '' : `<span class="hint" style="font-weight:500">· ${loadedKinds.length}/${required.length || kinds.length} tipologie</span>`}</h2>
    ${missingKinds.length && !c.isClient
      ? `<div class="note waiting" style="margin:0 0 12px"><b>Deliverable mancanti:</b> ${missingKinds.map(esc).join(', ')}. Il Pentester deve caricare almeno una versione per ogni tipologia del setup.</div>`
      : ''}
    <div class="report-kinds">
      ${kinds.length
        ? kinds.map(kind => {
            const group = groupOf(kind);
            const latest = group.latest;
            const isRequired = required.some(k => k.toLowerCase() === kind.toLowerCase());
            return `<section class="report-kind">
              <div class="rk-head">
                <div><h3>${esc(kind)}${isRequired ? '' : ' <span class="hint">(storico)</span>'}</h3>
                  <p>${esc(kindDesc[kind] || 'Deliverable')}</p></div>
                ${latest
                  ? (latest.published ? pill(['Pubblicato', 'ok']) : pill(['Bozza', 'mute']))
                  : pill(['Mancante', 'wait'])}
              </div>
              ${latest
                ? reportRow(latest)
                : `<div class="empty" style="padding:10px 0">Nessun ${esc(kind)} caricato.</div>`}
              ${group.history.length
                ? `<details class="rk-hist"><summary>Versioni precedenti (${group.history.length})</summary>${group.history.map(r => reportRow(r, true)).join('')}</details>`
                : ''}
              ${c.canUploadReports
                ? `<div class="rk-actions"><button class="btn ${latest ? 'sec' : 'pri'} sm" data-act="upload-report" data-kind="${esc(kind)}">${latest ? 'Carica nuova versione' : `Carica ${esc(kind)}`}</button></div>`
                : ''}
            </section>`;
          }).join('')
        : '<div class="empty">Nessuna tipologia definita nel setup.</div>'}
    </div>
    ${canLink ? '<p class="hint" style="margin-top:10px">Il link monouso scade dopo 5 giorni e può essere usato una sola volta.</p>' : ''}
    <p class="hint" style="margin-top:${canLink ? 4 : 10}px"><b>Policy di retention:</b> i deliverables vengono cancellati automaticamente dopo <b>1 anno</b> dalla pubblicazione.</p></div>`;

  if (!c.isClient) {
    const recipientChips = deliverRecipients.length
      ? deliverRecipients.map(entry => `
        <span class="user-chip">
          <span class="user-chip-main" title="${esc(entry.email)}">${esc(entry.name)} · ${esc(entry.email)} <span style="opacity:.65">(${esc(entry.organization)})</span></span>
          ${c.canWrite ? `<button class="user-chip-x" data-act="remove-dl" data-list="deliverables" data-entry="${esc(entry.id)}" title="Rimuovi ${esc(entry.email)}">×</button>` : ''}
        </span>`).join('')
      : '<span class="tiny">Nessun destinatario: la mail di consegna non partirà.</span>';

    const sentInfo = deliverLog
      ? `<div class="note done" style="margin:0 0 8px"><b>Ultimo invio:</b> ${fmtTime(deliverLog.date)} · ${esc(deliverLog.subject || 'Consegna deliverables')}</div>
         <div class="hint">Inviata a: ${sentRecipients.length ? esc(sentRecipients.join('; ')) : 'nessun destinatario'}</div>`
      : `<div class="note ${published ? 'waiting' : 'blocked'}" style="margin:0 0 8px"><b>${published ? 'Non ancora inviata.' : 'Non ancora disponibile.'}</b> ${published ? 'Verrà inviata alla pubblicazione dei deliverables.' : 'Si attiva dopo la pubblicazione dei deliverables.'}</div>`;

    html += `<div class="card" style="margin-top:16px"><h2>Destinatari reportistica</h2>
      <p class="sub">Chi riceve l'email di consegna dei deliverables. La lista effettiva unisce base cliente e destinatari dell'engagement.</p>
      <div class="user-chips">${recipientChips}</div>
      ${recipientChanged ? '<div class="note waiting" style="margin:10px 0 0"><b>Lista modificata dopo l’ultimo invio.</b> Verifica i destinatari prima di un nuovo invio.</div>' : ''}
      ${c.canWrite ? `<div class="fgrid" style="margin-top:12px">
        <div><label for="dl2_n">Nome e cognome</label><input type="text" id="dl2_n" placeholder="Nuovo destinatario"></div>

      </div>` : ''}
      <div style="margin-top:14px;border-top:1px solid var(--line-soft);padding-top:12px">${sentInfo}</div>

  }

  return retestPanel(d) + html;

/* ====== RETEST (scheda Report) ====== */
// Due passi in coda all'esecuzione: retest e invio del report di retest. La
// richiesta arriva dal cliente a fix completati; l'invio non ha revisione.
function retestPanel(d) {
  const r = d.retest;
  if (!r) return '';

  const status = r.sentDate
    ? pill(['Report di retest inviato', 'ok'])
    : r.report
      ? pill(['Report caricato, da inviare', 'wait'])
      : r.accepted
        ? pill([`Retest pianificato dal ${fmt(r.accepted.startDate)}`, 'progress'])
        : r.requested
          ? pill(['Retest richiesto: mancano le date', 'wait'])
          : r.planned
            ? pill(['Recheck previsto: in attesa della richiesta', 'neutral'])
            : pill(['Senza recheck', 'neutral']);

  const rows = [];
  rows.push(`<div class="kvline"><span>Recheck previsto</span><b>${r.planned ? 'Sì' : 'No'}</b></div>`);
  if (r.decidedBy) {
    rows.push(`<div class="kvline"><span>Deciso nel Setup da</span><b>${esc(r.decidedBy)}${r.decidedDate ? ` · ${fmt(r.decidedDate)}` : ''}</b></div>`);
  }
  if (r.requested) {
    rows.push(`<div class="kvline"><span>Richiesta dal cliente</span><b>${esc(r.requestedBy || '')} · ${fmt(r.requestedDate)}</b></div>`);
  }
  if (r.accepted) {
    rows.push(`<div class="kvline"><span>Date del retest</span><b>${fmt(r.accepted.startDate)} – ${fmt(r.accepted.endDate)}</b></div>`);
  }
  if (r.completedDate) {
    rows.push(`<div class="kvline"><span>Retest eseguito il</span><b>${fmt(r.completedDate)}</b></div>`);
  }
  if (r.report) {
    rows.push(`<div class="kvline"><span>Report di retest</span><b>${esc(r.report.name)}${r.sentDate ? ` · inviato il ${fmt(r.sentDate)}` : ' · da inviare'}</b></div>`);
  }

  const pending = (r.proposals || []).find(p => p.status === 'Pending');

  let actions = '';

  if (r.canRequest) {
    actions += `<div class="note waiting" style="margin:10px 0 0"><b>Puoi richiedere il retest.</b> Fallo quando i fix sono completati: si può chiedere una sola volta.</div>
      <div class="inline-actions" style="margin-top:10px"><button class="btn pri" data-act="retest-request">Richiedi il retest</button></div>`;
  }

  if (r.canDecide && pending) {
    actions += `<div class="note waiting" style="margin:10px 0 0"><b>Date del retest proposte:</b> ${fmt(pending.startDate)} – ${fmt(pending.endDate)} da ${esc(pending.by)}.</div>
      <div class="inline-actions" style="margin-top:10px">
        <button class="btn pri" data-act="retest-decide" data-approve="1">Approva le date</button>
        <button class="btn sec" data-act="retest-decide" data-approve="0">Rifiuta</button>
      </div>`;
  }

  if (r.canPropose && !pending) {
    actions += `<div class="fgrid" style="margin-top:12px">
        <div><label for="retest_start">Avvio del retest</label><input type="date" id="retest_start" value="${esc(r.accepted?.startDate || '')}"></div>
        <div><label for="retest_end">Fine del retest</label><input type="date" id="retest_end" value="${esc(r.accepted?.endDate || '')}"></div>
      </div>
      <div class="inline-actions" style="margin-top:10px"><button class="btn pri" data-act="retest-propose">Proponi le date del retest</button></div>`;
  }

  if (r.canLoadReport) {
    actions += `<div class="fgrid" style="margin-top:12px">
        <div class="full"><label for="retest_report">Descrizione del report di retest*</label>
          <input type="text" id="retest_report" placeholder="Esito del retest dopo i fix"></div>
      </div>
      <div class="inline-actions" style="margin-top:10px"><button class="btn pri" data-act="retest-report">Concludi il retest e carica il report</button></div>`;
  }

  if (r.canSend) {
    actions += `<div class="note done" style="margin:10px 0 0"><b>Report pronto.</b> L'invio al cliente <b>non richiede approvazione</b>.</div>
      <div class="inline-actions" style="margin-top:10px"><button class="btn pri" data-act="retest-send">Invia il report al cliente</button></div>`;
  }

  return `<div class="card" style="margin-bottom:16px"><h2>Retest ${status}</h2>
    <p class="sub">Verifiche dopo i fix. Il retest si schedula una sola volta ed è il cliente a richiederlo; il report di retest va al cliente senza passare dalla revisione.</p>
    <div class="kv">${rows.join('')}</div>
    ${(!r.planned && !r.requested)
      ? '<p class="hint" style="margin-top:10px">Recheck non previsto per questa attività: i due passi di retest non fanno parte del workflow. Si può cambiare nel Setup finché il cliente non ha richiesto il retest.</p>'
      : ''}
    ${actions}
  </div>`;
}

    const effective = (isDeliverables ? deliverables : notifications);

      ? 'Distribution list deliverables'
      : 'Distribution list notifiche';
    const subtitle = isDeliverables
      ? `Riceve l'invio dei deliverables.${d.deliverablesFallback
          ? ' Lista vuota: si usano temporaneamente i destinatari delle notifiche.'
          : ''}`
      : 'Riceve inizio/fine attività e i solleciti.';
    const prefix = isDeliverables ? 'dl2' : 'dl';
    const clientCount = effective.filter(x => x.organization === 'Cliente').length;

    const baseRows = base.map(entry => `<tr>
        <td><b>${esc(entry.name)}</b></td>
        <td>${esc(entry.email)}</td>

    const rows = entries.map(entry => {

        !(entry.organization === 'Cliente' && clientCount <= 1);
      return `<tr>
        <td><b>${esc(entry.name)}</b></td>
        <td>${esc(entry.email)}</td>
        <td>${orgPill(entry.organization)}</td>
        ${writable ? `<td style="text-align:right">${removable

    }).join('');

    const form = writable

          <h3 style="font-size:var(--fs-base);margin:0 0 8px">Aggiungi destinatario ${isDeliverables ? 'deliverables' : 'notifiche'} all'engagement</h3>

            ${isClient() ? '' : `<div><label for="${prefix}_o">Organizzazione</label>
              <select class="f" id="${prefix}_o">
                <option>Cliente</option><option>Provider PMO</option><option>Provider Pentester</option>
              </select></div>`}
          </div>
          <div style="margin-top:14px"><button class="btn pri" data-act="add-dl" data-list="${kind}">Aggiungi</button></div>
        </div>`
      : '';

    return `<div class="card" style="margin-top:16px"><h2>${title} · ${effective.length}</h2>
      <p class="sub">${subtitle}${writable ? '' : ' Il tuo profilo è in sola lettura.'}</p>
      <h3 style="font-size:var(--fs-base);margin:14px 0 6px">Base cliente · ${base.length}</h3>
      <p class="sub" style="margin:0 0 6px">Comune a tutti gli engagement di ${esc(d.engagement.clientName)}. La gestisce il Manager in <b>Clienti e utenze</b>.</p>
      <table><thead><tr><th>Nome</th><th>Email</th><th>Organizzazione</th></tr></thead>
      <tbody>${baseRows || `<tr><td colspan="3" class="empty">Nessun destinatario base.</td></tr>`}</tbody></table>

      <table><thead><tr><th>Nome</th><th>Email</th><th>Organizzazione</th>${writable ? '<th></th>' : ''}</tr></thead>
      <tbody>${rows || `<tr><td colspan="${writable ? 4 : 3}" class="empty">Nessun destinatario specifico dell'engagement.</td></tr>`}</tbody></table>
      ${form}

  return `<div class="note">Due liste separate: <b>notifiche</b> (${notifications.length} indirizzi effettivi) per inizio/fine attività e solleciti, <b>deliverables</b> (${deliverables.length} indirizzi effettivi) per l'invio dei report.${writable ? '' : ' Il tuo profilo è in sola lettura.'}</div>

function tabMail(d) {
  const e = d.engagement;
  const c = d.capabilities || {};
  const notificationCount = (d.distributionEffective || []).length;
  const deliverableCount = (d.deliverablesEffective || []).length;
  const log = d.mailLog || [];

  if (isClient()) {
    return `<div class="card"><h2>Email ricevute</h2>
      ${log.length
        ? `<ul class="tl">${log.map(m => `<li>${esc(m.subject || mailSubject(m.type))}<span>${fmtTime(m.date)} · ${esc(m.recipients)}</span></li>`).join('')}</ul>`
        : '<div class="empty" style="padding:10px">Nessuna email ricevuta per questo engagement.</div>'}
    </div>`;
  }

  const manager = c.canManageMail;
  const accepted = e.acceptedProposal;
  const published = (e.reports || []).some(r => r.published);
  const when = {
    start: accepted ? `alla data di inizio (${fmt(accepted.startDate)})` : 'dopo l\'approvazione della pianificazione',
    end: accepted ? `alla data di fine (${fmt(accepted.endDate)})` : 'dopo l\'approvazione della pianificazione',
    deliver: 'alla pubblicazione dei deliverables'
  };

  const cards = ['start', 'end', 'deliver'].map(key => {
    const meta = MAIL_META[key];
    const auto = entryAuto(d.mail, key);
    const sentEntry = log.find(m => m.type === key);
    const available = key === 'deliver' ? published : !!accepted;
    const listLabel = key === 'deliver' ? 'deliverables' : 'notifiche';
    const listCount = key === 'deliver' ? deliverableCount : notificationCount;
    const status = sentEntry
      ? pill([`Inviata il ${fmtTime(sentEntry.date)}`, 'ok'])
      : auto ? pill([`Programmata: ${when[key]}`, 'info'])
        : pill(['Invio automatico disattivato', 'neutral']);
    return `<div class="mailc">
      <div class="t"><b>${esc(meta.t)}</b><span>${esc(meta.desc)}</span>
        <span>Lista: <b>${listLabel}</b> · ${listCount} destinatari effettivi</span>
        <span>Oggetto: ${esc(sentEntry?.subject || `[${e.id}] ${meta.subj}`)}</span>
        <div style="margin-top:8px">${status}</div></div>
      <div class="ctl">
        ${manager
          ? `<label class="sw"><input type="checkbox" data-act="toggle-mail" data-key="${key}" ${auto ? 'checked' : ''}><i></i><span>Invio automatico</span></label>
             <button class="btn sec sm" data-act="send-mail" data-key="${key}" ${available ? '' : 'disabled title="Non ancora disponibile"'}>Invia ora</button>`
          : `<span style="color:var(--muted);font-size:var(--fs-md)">Invio automatico: <b>${auto ? 'attivo' : 'disattivo'}</b></span>`}
      </div>
    </div>`;
  }).join('');

  return `<div class="note">${manager
    ? `Come <b>PMO</b> controlli l'invio automatico delle email. Notifiche: ${notificationCount} destinatari; deliverables: ${deliverableCount} destinatari.`
    : 'Le comunicazioni sono gestite da PMO: puoi consultarne lo stato (sola lettura).'}
    Nessun invio SMTP reale: la voce nel registro simula l'invio.</div>
    <div class="card"><h2>Email automatiche</h2>${cards}</div>
    <div class="card" style="margin-top:16px"><h2>Email inviate</h2>
      ${log.length
        ? `<ul class="tl">${[...log].reverse().map(m => `<li>${esc(m.subject || mailSubject(m.type))}
            <span>${fmtTime(m.date)} · ${esc(m.recipients)} · ${m.auto ? 'invio automatico' : 'invio manuale'}${m.templateSource ? ` · template ${esc(m.templateSource)}` : ''}${m.visibility === 'ProviderOnly' ? ' · interna' : ''}</span></li>`).join('')}</ul>`
        : '<div class="empty" style="padding:10px">Nessuna email ancora inviata.</div>'}
    </div>`;
}

async function loadUsers() {
  state.usersError = null;
  try {
    state.users = await api('/api/users?' + qs());
    state.userEngagements = await api('/api/engagements?' + qs({ client: '' }));
    state.usersRev = (state.usersRev || 0) + 1;
    if (!state.users.some(user => user.id === state.selectedUserId)) {
      const current = state.users.find(user => user.id === state.userId);
      state.selectedUserId = current?.id || state.users[0]?.id || '';
    }
  } catch (error) {
    state.usersError = error.message;
    state.users = [];
  }
  if (state.view === 'users') renderUsers();
  else if (state.view === 'admin' && state.adminTab === 'users') renderAdmin();
  // La scheda in popup resta aperta e si aggiorna con i dati appena letti.
  renderUserModal();
}

function renderUsers() {
  if (state.role !== 'Manager' && state.role !== 'PMO') {
    $('#app').innerHTML = `<div class="note lockbox"><b>Accesso riservato.</b> La sezione Utenti è gestita da Manager e PMO.</div>`;
    return;

  $('#app').innerHTML = `
    <button class="crumb" data-act="list">← Tutti gli engagement</button>
    <div class="headrow">
      <div><h1>Utenti e accessi</h1>
        <p class="sub" style="margin-bottom:0">Persone interne e visibilità per assegnazione · ${state.users.length} utenti</p></div>

        <h3>Anagrafica e accesso</h3>
        <div class="ureadonly">${user.isClient
          ? 'Utenza cliente: i dati si modificano in <b>Clienti</b>, sulla scheda del cliente.'

        <dl class="user-perms" style="margin-top:10px">

function renderUserModal(force = false) {
  const node = $('#modal');
  if (!node) return;
  const user = state.userModal ? modalUser() : null;
  if (!user) {
    state.userModal = '';
    userModalSig = '';
    node.classList.remove('show');
    node.innerHTML = '';
    node.onclick = null;
    return;
  }
  // Un render di sfondo non deve cancellare quello che si sta scrivendo nel
  // popup: si ridisegna solo se i dati o l'utente sono davvero cambiati.
  const sig = `${user.id}|${state.usersRev || 0}|${state.userModalError || ''}`;
  if (!force && node.classList.contains('show') && sig === userModalSig) return;
  userModalSig = sig;
  node.innerHTML = userModalHTML(user);
  node.onclick = event => {
    if (event.target === node) closeUserModal();
  };
  node.classList.add('show');
}

function openUserModal(id) {
  const user = state.users.find(item => item.id === id);
  if (!user) return;
  state.selectedUserId = user.id;
  state.userModal = user.id;
  state.userModalError = null;
  renderUserModal();
  const box = $('#modal .mbox-lg');
  if (box) box.scrollTop = 0;
  setTimeout(() => {
    const first = $('#modal [data-act="close-user"]');
    if (first) first.focus();
  }, 30);
}

function closeUserModal() {
  state.userModal = '';
  state.userModalError = null;
  renderUserModal();
}

async function saveUserFromModal() {
  const user = modalUser();
  if (!user) return;

  const name = ($('#um_name')?.value || '').trim();
  const email = ($('#um_email')?.value || '').trim();
  const role = $('#um_role')?.value || user.role;
  const active = ($('#um_active')?.value || '1') === '1';

  if (!name || !email.includes('@')) {
    state.userModalError = 'Nome ed email valida sono obbligatori.';
    renderUserModal();
    return;
  }

  try {
    await api(`/api/users/${encodeURIComponent(user.id)}?` + qs(), {
      method: 'PUT',
      body: JSON.stringify({ name, email, role, active })
    });
    state.userModalError = null;
    toast('Utente aggiornato');
    await loadDemoUsers();
    await loadUsers();
    renderUserModal();
  } catch (error) {
    state.userModalError = error.message;
    renderUserModal();
  }
}

function userPermissions(user) {
  const rows = user.isManager
    ? [['Clienti', 'Tutti'], ['Engagement', 'Tutti'], ['Costi e margine', 'Sì'], ['Utenti', 'Amministra']]
    : user.isClient

      : user.role === 'PMO'

          : [['Clienti', 'Assegnati'], ['Engagement', 'Assegnati'], ['Costi e margine', 'No'], ['Utenti', 'No']];

const ADMIN_TABS = [
  ['users', 'UT', 'Utenti'],
  ['clients', 'CL', 'Clienti'],
  ['mailing', 'ML', 'Mailing list'],
  ['templates', 'TP', 'Template mail'],
  ['settings', 'ST', 'Impostazioni']
];

async function loadAdmin() {
  if (!canUseAdminTab(state.adminTab)) return;

  state.adminError = null;

  try {
    // Anagrafiche complete solo dove servono: il Pentester non può leggerle.
    if (state.adminTab === 'users' || state.adminTab === 'clients') {
      if (!state.clients.length) await loadClients();
      if (!state.users.length) await loadUsers();
    }

    if (state.adminTab === 'activities') {
      state.activityTypes = await api('/api/activity-types?' + qs());
    }

    if (state.adminTab === 'mailing') {
      state.adminMailing = await api('/api/admin/mailing-lists?' + qs());
      if (!state.adminMailing.some(item => item.id === state.adminMailingId))
        state.adminMailingId = state.adminMailing[0]?.id || '';
      // Il testo delle email dell'engagement si modifica qui: serve la
      // versione corrente del livello engagement.
      await loadMailingTemplates(true);
    }

    if (state.adminTab === 'templates') {
      state.adminTemplates = await api('/api/admin/mail-templates?' + qs());
    }
  } catch (error) {
    state.adminError = error.message;
  }

  renderAdmin();
}

// Carica il livello engagement dei template, solo per liste di tipo engagement.
async function loadMailingTemplates(force) {
  const list = state.adminMailing.find(item => item.id === state.adminMailingId);

  if (!list || list.scope !== 'engagement') {
    state.adminMailingTemplates = null;
    state.adminMailingTemplateType = '';
    return;
  }

  if (!force && state.adminMailingTemplates?.id === list.ownerId) return;

  try {
    state.adminMailingTemplates = await api(
      `/api/admin/mail-templates/engagement/${encodeURIComponent(list.ownerId)}?` + qs());
  } catch {
    state.adminMailingTemplates = null;
  }
}
