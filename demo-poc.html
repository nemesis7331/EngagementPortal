<style>
/* ====== PALETTE (modificabile da qui) ====== */
:root{
  --brand-950:#061d36;
  --brand-900:#0a2a4d;
  --brand-700:#0f4275;
  --brand-600:#0d63b5;
  --brand-500:#2a86d8;
  --brand-100:#e1eefa;
  --brand-50:#f1f7fc;
  --accent:#19c3d6;
  --accent-soft:#d6f4f8;
  --ink:#0a1b2e;
  --muted:#566a80;
  --line:#dfe7ef;
  --bg:#f4f7fa;
  --card:#ffffff;
  --ok:#0b7a55; --ok-bg:#def7ec;
  --warn:#8a5a00; --warn-bg:#fef3c7;
  --err:#d1344a; --err-bg:#fde8ec;

}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5}
button{font:inherit;cursor:pointer}
/* Header */
header{background:linear-gradient(100deg,var(--brand-950),var(--brand-900) 60%,var(--brand-700));color:#fff;position:sticky;top:0;z-index:20}
.hwrap{max-width:1200px;margin:auto;padding:12px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:.2px}
.logo i{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--brand-950);font-style:normal;font-weight:800}
.logo small{display:block;font-weight:400;font-size:11px;opacity:.7;letter-spacing:.4px;text-transform:uppercase}
.spacer{flex:1}
.roleSw{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);padding:5px 6px 5px 12px;border-radius:999px;font-size:12.5px}
.roleSw select{background:#fff;color:var(--ink);border:0;border-radius:999px;padding:6px 12px;font:inherit;font-weight:600}
.user{display:flex;align-items:center;gap:10px;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-500);display:grid;place-items:center;font-weight:700}
.demo-banner{background:var(--warn-bg);color:#7a5200;text-align:center;font-size:12px;padding:5px}
/* Layout */
main{max-width:1200px;margin:24px auto 60px;padding:0 24px}
h1{font-size:26px;margin:0 0 4px;color:var(--brand-900)}
h2{font-size:17px;margin:0 0 12px;color:var(--brand-900)}
.sub{color:var(--muted);margin:0 0 22px}
.crumb{color:var(--brand-600);background:none;border:0;padding:0;margin-bottom:10px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:22px}
.kpi b{display:block;font-size:28px;color:var(--brand-900);line-height:1.1}
.kpi span{color:var(--muted);font-size:13px}
.kpi{border-left:4px solid var(--brand-500)}
.kpi.a{border-left-color:var(--accent)} .kpi.w{border-left-color:#f0b429}
/* table */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.row{cursor:pointer;transition:background .15s}
tr.row:hover{background:var(--brand-50)}
tr:last-child td{border-bottom:0}
.name b{display:block;color:var(--brand-900)} .name span{color:var(--muted);font-size:12.5px}
/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-err{background:var(--err-bg);color:var(--err)} .p-info{background:var(--brand-100);color:var(--brand-600)}
.p-mute{background:#eceff6;color:var(--muted)}
.mini{display:flex;gap:4px}.mini i{width:22px;height:6px;border-radius:3px;background:var(--line)}.mini i.on{background:var(--accent)}.mini i.cur{background:var(--brand-500)}
/* buttons */
.btn{border:1px solid transparent;border-radius:10px;padding:9px 16px;font-weight:600;transition:.15s}
.btn.pri{background:var(--brand-600);color:#fff}.btn.pri:hover{background:var(--brand-700)}
.btn.acc{background:var(--accent);color:var(--brand-950)}.btn.acc:hover{filter:brightness(.95)}
.btn.sec{background:#fff;border-color:var(--line);color:var(--brand-900)}.btn.sec:hover{border-color:var(--brand-500)}
.btn.dng{background:#fff;border-color:var(--err-bg);color:var(--err)}
.btn.sm{padding:5px 11px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* stepper */
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:0;margin:6px 0 4px}
.st{position:relative;text-align:center;padding:0 6px}
.st::before{content:"";position:absolute;top:17px;left:-50%;width:100%;height:3px;background:var(--line)}
.st:first-child::before{display:none}
.st.done::before,.st.cur::before{background:var(--accent)}
.dot{position:relative;z-index:1;width:36px;height:36px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:#fff;border:3px solid var(--line);font-weight:700;color:var(--muted)}
.st.done .dot{background:var(--accent);border-color:var(--accent);color:var(--brand-950)}
.st.cur .dot{border-color:var(--brand-500);color:var(--brand-600);box-shadow:0 0 0 5px var(--brand-100)}
.st b{display:block;font-size:13px;color:var(--brand-900)}.st span{font-size:12px;color:var(--muted)}
/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 18px;overflow:auto}
.tab{background:none;border:0;padding:10px 16px;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--brand-600);border-bottom-color:var(--brand-600)}
.tab .lock{opacity:.6;font-size:12px}
/* misc */
.two{grid-template-columns:1fr 1fr}
@media(max-width:820px){.two{grid-template-columns:1fr}.stepper{grid-template-columns:1fr;gap:12px}.st{display:flex;gap:12px;text-align:left;align-items:center}.st::before{display:none}.dot{margin:0}}
.doc{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.doc:last-child{border-bottom:0}
.ico{width:42px;height:42px;border-radius:10px;background:var(--brand-100);color:var(--brand-600);display:grid;place-items:center;font-weight:800;font-size:12px}
.doc .t{flex:1}.doc .t b{display:block}.doc .t span{font-size:12.5px;color:var(--muted)}
.note{background:var(--brand-50);border:1px solid var(--brand-100);border-radius:10px;padding:12px 14px;color:var(--brand-700);font-size:13.5px;margin-bottom:16px}
.note.lockbox{background:#f1f3f8;border-color:var(--line);color:var(--muted)}
label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--brand-900)}
input[type=text],input[type=date],textarea,select.f{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
input:focus,textarea:focus,select:focus{outline:2px solid var(--brand-500);outline-offset:-1px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fgrid .full{grid-column:1/-1}
@media(max-width:620px){.fgrid{grid-template-columns:1fr}}
.upl{border:2px dashed var(--line);border-radius:10px;padding:14px;display:flex;align-items:center;gap:12px;background:var(--brand-50)}
.upl span{flex:1;color:var(--muted);font-size:13px}
.prop{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;flex-wrap:wrap}
.prop .d{flex:1;min-width:220px}.prop .d b{color:var(--brand-900)}.prop .d span{display:block;color:var(--muted);font-size:12.5px}
.tl{list-style:none;padding:0;margin:0}.tl li{position:relative;padding:0 0 14px 22px;font-size:13px}
.tl li::before{content:"";position:absolute;left:3px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--brand-500)}
.tl li::after{content:"";position:absolute;left:7px;top:16px;bottom:-2px;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}.tl span{color:var(--muted);display:block;font-size:12px}
.bars{display:flex;align-items:flex-end;gap:10px;height:110px;margin-top:10px}.bars div{flex:1;background:linear-gradient(var(--brand-500),var(--brand-600));border-radius:6px 6px 0 0;position:relative}
.bars div em{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-style:normal;font-size:11px;color:var(--muted)}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:600;margin:0}.sw input{display:none}.sw i{width:38px;height:22px;border-radius:999px;background:#c9d4e0;position:relative;transition:.2s}.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.25)}.sw input:checked+i{background:var(--accent)}.sw input:checked+i::after{left:19px}
.mailc{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--line)}.mailc:last-child{border-bottom:0}.mailc .t{flex:1;min-width:240px}.mailc .t b{display:block;color:var(--brand-900)}.mailc .t span{color:var(--muted);font-size:12.5px;display:block}.mailc .ctl{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
/* stato schede */
.tab::before{content:"";display:inline-block;min-width:16px;height:16px;line-height:16px;border-radius:50%;margin-right:7px;font-size:11px;font-weight:800;text-align:center;vertical-align:1px}
.tab.s-ok::before{content:"✓";background:var(--ok);color:#fff}.tab.s-todo::before{content:"!";background:#f0b429;color:#3b2a00}.tab.s-wait::before{content:"…";background:var(--brand-100);color:var(--brand-600)}.tab.s-lock::before,.tab.s-none::before{display:none}
.tab.s-ok,.tab.s-ok.on{color:var(--ok)}.tab.s-todo,.tab.s-todo.on{color:var(--warn)}.tab.s-wait,.tab.s-wait.on{color:var(--brand-600)}.tab.s-lock,.tab.s-lock.on{color:#667689}
.tab.s-ok.on{border-bottom-color:var(--ok)}.tab.s-todo.on{border-bottom-color:#f0b429}.tab.s-wait.on{border-bottom-color:var(--brand-600)}.tab.s-lock.on{border-bottom-color:#667689}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}.chipb{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;color:var(--muted)}.chipb:hover{border-color:var(--brand-500)}.chipb.on{border-color:var(--brand-600);color:var(--brand-600);box-shadow:0 0 0 2px var(--brand-100)}
.cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:#eceff6;color:var(--muted);font-size:12px;font-weight:700;text-align:center}.chipb.on .cnt{background:var(--brand-100);color:var(--brand-600)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:-8px 0 18px}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
@media(max-width:820px){
  .tab.s-ok{background:var(--ok-bg);border-color:#b7ebd3}.tab.s-todo{background:var(--warn-bg);border-color:#f3d48a}.tab.s-wait{background:var(--brand-50);border-color:var(--brand-100)}.tab.s-lock{background:#f1f3f8}
  .tabs{flex-wrap:wrap;overflow:visible;border-bottom:0;gap:8px;margin:18px 0 14px}
  .tab{border:1px solid var(--line);border-radius:999px;padding:7px 13px;background:#fff;font-size:13px}
  .tab.on{box-shadow:0 0 0 2px var(--brand-600);font-weight:700}
  .tab .lock{font-size:11px}
  .card{overflow-x:auto}
  .hwrap{padding:10px 16px;gap:12px}
  main{padding:0 16px}
  h1{font-size:22px}
  .doc{flex-wrap:wrap}.doc .t{min-width:60%}
  .mailc .ctl{align-items:flex-start}
}
ol.stepper{list-style:none;padding:0}
.legend b{display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;border-radius:50%;font-size:11px;margin-right:6px}.g-ok{background:var(--ok);color:#fff}.g-todo{background:#f0b429;color:#3b2a00}.g-wait{background:var(--brand-100);color:var(--brand-600)}
.p-prog{background:#d6f4f8;color:#0a6f7c}
.badge-kind{background:var(--brand-100);color:var(--brand-700);padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;margin-left:6px}
.linkb{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.seg{display:inline-flex;background:#e9eef5;border-radius:999px;padding:4px;margin-bottom:18px}.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:600;color:var(--muted)}.seg button.on{background:#fff;color:var(--brand-900);box-shadow:var(--shadow)}
.roleSw input{width:auto;background:#fff;color:var(--ink);border:0;border-radius:999px;padding:5px 10px;font:inherit}
.modal{position:fixed;inset:0;background:rgba(6,29,54,.55);display:none;place-items:center;z-index:60;padding:16px}.modal.show{display:grid}.mbox{background:#fff;border-radius:var(--radius);padding:22px;max-width:480px;width:100%;box-shadow:0 20px 60px rgba(6,29,54,.35);max-height:90vh;overflow:auto}.mact{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--brand-500);outline-offset:2px}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:var(--brand-900);color:#fff;padding:12px 20px;border-radius:10px;box-shadow:var(--shadow);transition:.3s;opacity:0;z-index:90}
#toast.show{transform:translate(-50%,0);opacity:1}
.linkbox{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--brand-50);border:1px solid var(--brand-100);padding:10px 12px;border-radius:10px;word-break:break-all;font-size:13px;color:var(--brand-700);margin-bottom:8px}.hint{color:var(--muted);font-size:12.5px;margin:0}
.empty{text-align:center;color:var(--muted);padding:26px}
</style>

<script>

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const SCOPE_OK=(host,ip,sw,out,win,date,by)=>({host,ip,swagger:sw,out,win,contact:'Marta Rinaldi · +39 02 0000 000',notes:'',done:true,by:by||'client',date});

 eng({id:'ENG-2026-014',name:'Penetration Test – App Mobile Banking',type:'Penetration Test',client:'Nova Bank',owner:'Sara Conti',created:'2026-11-03',

  proposals:[P(1,'client','2026-12-01','2026-12-05','pending',{note:'Preferiamo evitare il fine mese.',date:'2026-11-12'})],
  log:[lg('2026-10-03','Engagement creato',SC),lg('2026-10-20','STAF firmato (con manleva) caricato',MR),lg('2026-10-24','Ordine PO-88231 ricevuto',LF,'bip'),lg('2026-11-12','Proposta 01/12/2026 → 05/12/2026 inviata dal cliente',MR)]}),

const acc=e=>e.proposals.find(p=>p.status==='accepted');
const pend=e=>e.proposals.find(p=>p.status==='pending');
const pubs=e=>e.reports.filter(r=>r.pub);
const canPlan=e=>!!e.staf.file&&e.order.ok;
function phase(e){
  if(!e.staf.file||!e.order.ok)return'docs';
  const a=acc(e);if(!a)return'planning';
  if(pubs(e).length)return'done';
  if(demoDate>a.end)return'reporting';
  if(!(e.scope.done&&e.cred.done))return'prep';
  return demoDate>=a.start?'running':'scheduled';
}
const STEP_OF={docs:0,planning:1,prep:2,scheduled:3,running:3,reporting:4,done:5};
const step=e=>STEP_OF[phase(e)];
const STEPS=[['STAF + Ordine','STAF con manleva e ordine'],['Pianificazione','Proposta e accettazione'],['Scope e credenziali','Dati di accesso e perimetro'],['Esecuzione','Attività in corso'],['Report','Revisione e consegna']];
function missing(e){return[!e.scope.done&&'scope',!e.cred.done&&'credenziali'].filter(Boolean).join(' e ')}
function statusOf(e){
  const ph=phase(e),p=pend(e),a=acc(e);
  if(ph==='docs')return !e.staf.file&&!e.order.ok?['In attesa STAF e ordine','warn']:!e.staf.file?['In attesa STAF firmato','warn']:['In attesa ordine Bip','warn'];
  if(ph==='planning')return p?['Proposta da valutare','info']:['Da pianificare','warn'];
  if(p&&p.kind==='resched'&&(ph==='prep'||ph==='scheduled'))return['Riprogrammazione richiesta','info'];
  if(ph==='prep'){const m=missing(e);return demoDate>=a.start?['Dati mancanti: '+m,'err']:[m.charAt(0).toUpperCase()+m.slice(1)+' da fornire','warn']}
  if(ph==='scheduled')return['Pianificato dal '+fmt(a.start),'info'];
  if(ph==='running')return['In esecuzione','info'];
  if(ph==='reporting'){
    if(role==='client')return['Report in progress','prog'];
    const s=e.review.status;
    return s==='pending'?['Report in revisione','prog']:s==='approved'?['Report approvato – da pubblicare','prog']:s==='changes'?['Report: modifiche richieste','prog']:['Report in progress','prog'];
  }
  return['Completato','ok'];
}

const mfaOk=()=>Date.now()<mfaUntil;
function mfaMins(){return Math.max(1,Math.ceil((mfaUntil-Date.now())/60000))}
let mfaFails=0,mfaLock=0,linkTimer=null;
function requireMfa(cb){
  if(mfaOk())return cb();
  const en=E.find(x=>x.id===cur);
  openModal({title:'Verifica a due fattori',text:'Inserisci il codice a 6 cifre generato dalla tua app di autenticazione. (Demo: il codice è '+MFA_CODE+')',fields:[{id:'code',label:'Codice 2FA',ph:'000000',mode:'numeric'}],ok:'Verifica',
    validate:v=>{
      if(Date.now()<mfaLock)return'Troppi tentativi: riprova tra '+Math.ceil((mfaLock-Date.now())/1000)+' secondi';
      if(v.code===MFA_CODE)return'';
      mfaFails++;if(en)log(en,'Verifica 2FA non riuscita (tentativo '+mfaFails+')',{aud:'bip'});
      if(mfaFails>=3){mfaFails=0;mfaLock=Date.now()+30000;return'Troppi tentativi: accesso bloccato per 30 secondi'}
      return'Codice non valido ('+(3-mfaFails)+' tentativi rimasti)'},
    onOk:()=>{mfaFails=0;mfaUntil=Date.now()+10*60000;if(en)log(en,'Verifica 2FA riuscita (accesso ai report)',{aud:'bip'});toast('Identità verificata: accesso ai report attivo per 10 minuti');cb()}});
}

function pickSwagger(id){pickFile(n=>{if(!/\.(json|ya?ml)$/i.test(n)){toast('Seleziona un file .json, .yaml o .yml');return}pendingSw[id]=n;$('#sw').textContent=n},'.json,.yaml,.yml')}
function saveScope(id){const e=E.find(x=>x.id===id),g=k=>$('#f_'+k).value.trim();
  const s={host:g('host'),ip:g('ip'),out:g('out'),win:g('win'),contact:g('contact'),notes:g('notes'),swagger:pendingSw[id]||e.scope.swagger||''};
  if(!s.host||!s.contact){toast('Target e referente tecnico sono obbligatori');return}
  const upd=e.scope.done;e.scope={...s,done:true,by:role,date:demoDate};delete pendingSw[id];delete editing[id+':scope'];clearDrafts(id);
  log(e,(upd?'Scope aggiornato':'Scope fornito')+(role!=='client'?' per conto del cliente':''));toast('Scope salvato');render()}
function saveCred(id){const e=E.find(x=>x.id===id),g=k=>$('#f_'+k).value.trim();
  const c={vpn:g('vpn'),users:g('users'),delivery:g('delivery'),notes:g('cnotes')};
  if(!c.vpn||!c.users||!c.delivery){toast('VPN, utenze e metodo di consegna sono obbligatori');return}
  const upd=e.cred.done;e.cred={...c,done:true,by:role,date:demoDate};delete editing[id+':cred'];clearDrafts(id);
  log(e,(upd?'Credenziali aggiornate':'Credenziali fornite')+(role!=='client'?' per conto del cliente':''));toast('Credenziali salvate');render()}
/* report e revisione */
function resetReview(e){if(e.review.status!=='none'){e.review={status:'none'};log(e,'Revisione azzerata: nuovo file caricato',{aud:'bip'})}}
function pushDraft(e,n,t,s){const ext=(n.split('.').pop()||'').toUpperCase();e.reports.push({n,d:demoDate,t:t||ext.slice(0,4),s:s||'–',pub:false});resetReview(e);log(e,`Deliverable «${n}» caricato come bozza`,{aud:'bip'})}
function addReportFile(id){const e=E.find(x=>x.id===id);pickFile(n=>{pushDraft(e,n);toast('Bozza caricata');render()},'.pdf,.xlsx,.docx')}
function addDemoReport(id){const e=E.find(x=>x.id===id);pushDraft(e,'Report esecutivo','PDF','1,1 MB');pushDraft(e,'Report tecnico dettagliato','PDF','5,2 MB');toast('Bozze di esempio aggiunte');render()}
function submitReview(id){const e=E.find(x=>x.id===id);e.review={status:'pending',by:authorOf(),date:demoDate,comment:''};log(e,'Deliverables inviati in revisione al manager',{aud:'bip'});toast('Inviati in revisione al manager');render()}
function reviewDecide(id,ok){const e=E.find(x=>x.id===id);
  openModal({title:ok?'Approva i deliverables':'Richiedi modifiche',fields:[{id:'c',label:ok?'Commento (opzionale)':'Cosa va corretto?*',type:'textarea'}],ok:ok?'Approva':'Richiedi modifiche',validate:v=>(!ok&&!v.c)?'Indica cosa va corretto':'',
    onOk:v=>{e.review={status:ok?'approved':'changes',by:authorOf(),date:demoDate,comment:v.c};log(e,ok?'Deliverables approvati dal manager':'Modifiche richieste ai deliverables: '+v.c,{aud:'bip'});toast(ok?'Deliverables approvati':'Modifiche richieste');render()}})}
function publishReports(id){const e=E.find(x=>x.id===id);if(e.review.status!=='approved'){toast('Serve l\'approvazione del manager');return}
  e.reports.forEach(r=>{if(!r.pub){r.pub=true;r.d=demoDate}});log(e,'Deliverables pubblicati');
  if(e.mail.deliver.auto&&!e.mail.deliver.sent)doSend(e,'deliver',true);
  toast('Deliverables pubblicati'+(e.mail.deliver.sent===demoDate?' · email di consegna inviata':''));render()}
function exportLog(id){const e=E.find(x=>x.id===id);const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=visibleLog(e).map(l=>[fmt(l.t),l.h,l.who,l.rl,l.txt].map(q).join(';'));
  const csv=['Data;Ora;Autore;Profilo;Evento'].concat(rows).join('\n');
  log(e,'Registro esportato',{aud:'bip'});
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download=e.id+'_registro.csv';a.click();toast('Registro esportato (CSV)')}catch(x){toast('Esportazione non disponibile in questa anteprima')}
  render()}
function setLogAuthor(v){logAuthor=v;render()}

const REM_RULES=[
 {k:'staf',t:'STAF non firmato',to:'Cliente',unit:'giorni dalla creazione',subj:'Promemoria: STAF da firmare',desc:'Il cliente non ha caricato lo STAF firmato (comprende la manleva).',
  ev:(e,d)=>{if(!e.staf.file){const a=dayDiff(e.created,demoDate);if(a>=d)return{ref:'s'+Math.floor(a/d),to:'Cliente',detail:`STAF non firmato da ${a} giorni`}}}},
 {k:'order',t:'Ordine non ricevuto',to:'Cybersec',unit:'giorni dal caricamento STAF',subj:'Promemoria: ordine da registrare',desc:'STAF firmato ma l\'ordine non risulta ancora ricevuto.',
  ev:(e,d)=>{if(e.staf.file&&!e.order.ok){const a=dayDiff(e.staf.date,demoDate);if(a>=d)return{ref:'o'+Math.floor(a/d),to:'Cybersec',detail:`Ordine non ricevuto da ${a} giorni`}}}},
 {k:'prop',t:'Proposta senza risposta',to:'Chi deve decidere',unit:'giorni di attesa',subj:'Promemoria: proposta di date in attesa',desc:'Una proposta o richiesta di riprogrammazione non ha ricevuto risposta.',
  ev:(e,d)=>{const p=pend(e);if(p){const a=dayDiff(p.date,demoDate);if(a>=d)return{ref:'p'+p.id+'_'+Math.floor(a/d),to:p.from==='client'?'Cyberdefence':'Cliente',detail:`Proposta ${fmt(p.start)} senza risposta da ${a} giorni`}}}},
 {k:'prep',t:'Scope / credenziali mancanti',to:'Cliente',unit:'giorni prima dell\'inizio',subj:'Promemoria: scope e credenziali da fornire',desc:'Scope o credenziali non ancora forniti a ridosso dell\'attività.',
  ev:(e,d)=>{if(phase(e)==='prep'){const a=acc(e),dd=dayDiff(demoDate,a.start);if(dd<=d)return{ref:'prep'+(dd<=0?'late':dd<=3?'t3':'t'+d),to:'Cliente',detail:(dd>=0?`Inizio tra ${dd} giorni`:'Attività già iniziata')+`: mancano ${missing(e)}`}}}},
 {k:'rep',t:'Deliverables non consegnati',to:'Cyberdefence',unit:'giorni dalla fine attività',subj:'Promemoria: deliverables da consegnare',desc:'Attività conclusa ma deliverables non ancora pubblicati.',
  ev:(e,d)=>{if(phase(e)==='reporting'){const a=dayDiff(acc(e).end,demoDate);if(a>=d)return{ref:'r'+Math.floor(a/d),to:'Cyberdefence',detail:`Deliverables non pubblicati da ${a} giorni dalla fine`}}}},
 {k:'rev',t:'Revisione manager in attesa',to:'Manager',unit:'giorni di attesa',subj:'Promemoria: deliverables da rivedere',desc:'I deliverables sono in attesa di revisione.',
  ev:(e,d)=>{if(phase(e)==='reporting'&&e.review.status==='pending'){const a=dayDiff(e.review.date,demoDate);if(a>=d)return{ref:'v'+Math.floor(a/d),to:'Manager',detail:`Revisione in attesa da ${a} giorni`}}}}
];
const REM={cfg:{staf:{on:true,days:3},order:{on:true,days:5},prop:{on:true,days:2},prep:{on:true,days:7},rep:{on:true,days:2},rev:{on:true,days:1}},keys:{},sent:[]};
function remDue(){const out=[];E.forEach(e=>REM_RULES.forEach(r=>{const c=REM.cfg[r.k],x=r.ev(e,c.days);if(x){const key=e.id+'|'+r.k+'|'+x.ref;out.push({e,r,x,key,sent:!!REM.keys[key],on:c.on})}}));return out}
function remSend(it,auto){
  REM.keys[it.key]=1;REM.sent.push({d:demoDate,h:hhmm(),id:it.e.id,name:it.e.name,rule:it.r.t,to:it.x.to,detail:it.x.detail,auto});
  const toClient=it.x.to==='Cliente';
  if(toClient)it.e.mails.push({d:demoDate,s:`[${it.e.id}] ${it.r.subj}`,n:it.e.dl.filter(m=>m.org==='Cliente').length,auto,aud:'all'});
  log(it.e,`Sollecito ${auto?'automatico':'manuale'} «${it.r.t}» → ${it.x.to}`,{who:auto?'Sistema':undefined,rl:auto?'Automatico':undefined,aud:toClient?'all':'bip',cl:'Email ricevuta: «'+it.r.subj+'»'});
}
function tickRem(){remDue().forEach(it=>{if(it.on&&!it.sent)remSend(it,true)})}
function toggleRem(k){const c=REM.cfg[k];c.on=!c.on;toast('Sollecito «'+REM_RULES.find(r=>r.k===k).t+'» '+(c.on?'attivato':'disattivato'));tickRem();render()}
function setRemDays(k,v){const n=Math.max(1,Math.min(60,parseInt(v,10)||1));REM.cfg[k].days=n;tickRem();render()}
function sendRemNow(key){const it=remDue().find(x=>x.key===key);if(it&&!it.sent){remSend(it,false);toast('Sollecito inviato')}render()}

/* azione richiesta al profilo corrente */
function myTodo(e){
  if(role==='auditor')return null;
  const ph=phase(e),p=pend(e),c=role==='client',cd=role==='cyberdefence',cs=role==='cybersec';
  if(role==='manager')return(ph==='reporting'&&e.review.status==='pending')?{tab:'reports',t:'Rivedi i deliverables prima della pubblicazione.',b:'Vai alla revisione'}:null;
  if(p&&canDecide(p))return{tab:'plan',t:`${p.kind==='resched'?'Richiesta di riprogrammazione':'Proposta di pianificazione'} ${fmt(p.start)} → ${fmt(p.end)} ${p.from==='client'?'del cliente':'di Bip'}: accetta o rifiuta.`,b:'Vai alla pianificazione'};
  if(ph==='docs'){
    if(!e.staf.file)return{tab:'docs',t:'Scarica lo STAF (comprende la manleva), firmalo e caricalo'+(c?'.':' per conto del cliente.'),b:'Vai ai documenti'};
    if(!e.order.ok&&(cs||cd))return{tab:'docs',t:'Registra la ricezione dell\'ordine.',b:'Vai ai documenti'};
    return null}
  if(ph==='planning'&&!p)return{tab:'plan',t:'Proponi le date per l\'attività.',b:'Proponi date'};
  if(ph==='prep'){
    const nS=!e.scope.done,nC=!e.cred.done&&(c||cd);
    if(nS&&nC)return{tab:'scope',t:'Fornisci scope e credenziali.',b:'Compila lo scope'};
    if(nS)return{tab:'scope',t:'Compila lo scope dell\'attività.',b:'Compila lo scope'};
    if(nC)return{tab:'cred',t:'Fornisci le credenziali di accesso.',b:'Compila le credenziali'};
    return null}
  if(ph==='reporting'&&cd){
    const dr=e.reports.filter(r=>!r.pub).length,st=e.review.status;
    if(!dr)return{tab:'reports',t:'Attività conclusa: carica i deliverables.',b:'Vai ai report'};
    if(st==='none')return{tab:'reports',t:'Invia i deliverables in revisione al manager.',b:'Vai ai report'};
    if(st==='changes')return{tab:'reports',t:'Il manager ha richiesto modifiche: aggiorna i deliverables e reinvia.',b:'Vai ai report'};
    if(st==='approved')return{tab:'reports',t:'Deliverables approvati: pubblicali al cliente.',b:'Vai ai report'};
  }
  return null;
}
function nextAction(e){
  const t=myTodo(e);
  if(t)return`<div class="note"><b>Azione richiesta:</b> ${esc(t.t)} <button class="btn pri sm" style="margin-left:8px" onclick="setTab('${t.tab}',1)">${t.b}</button></div>`;
  const ph=phase(e),a=acc(e),p=pend(e);let m='',cls='';
  if(ph==='docs')m='In attesa di: '+[!e.staf.file?'STAF firmato dal cliente':'',!e.order.ok?'ricezione ordine da parte di Bip':''].filter(Boolean).join(' e ')+'. La pianificazione si sblocca quando entrambi sono completati.';
  else if(ph==='planning')m=p?`Proposta ${fmt(p.start)} → ${fmt(p.end)} in attesa di decisione ${p.from==='client'?'di Cyberdefence':'del cliente'}.`:'Nessuna proposta di date ancora inviata.';
  else if(ph==='prep')m=`In attesa che vengano forniti: ${missing(e)}.`;
  else if(ph==='scheduled')m=`Tutto pronto: attività pianificata dal ${fmt(a.start)} al ${fmt(a.end)}.`;
  else if(ph==='running')m=`Attività in corso fino al ${fmt(a.end)}.`;
  else if(ph==='reporting')m=(role!=='client'&&e.review.status==='pending')?`Attività conclusa: deliverables in attesa di revisione del manager.`:`Attività conclusa il ${fmt(a.end)}: i deliverables sono in redazione (report in progress).`;
  else{m='Engagement completato. I deliverables sono disponibili nella scheda Reportistica.';cls='ok'}
  if(p&&p.kind==='resched'&&ph!=='planning')m+=` Richiesta di riprogrammazione ${fmt(p.start)} → ${fmt(p.end)} in attesa di decisione ${p.from==='client'?'di Cyberdefence':'del cliente'}.`;
  const ro=role==='auditor'?'<b>Profilo Auditor</b>: sola lettura. ':'';
  return cls?`<div class="note" style="background:var(--ok-bg);border-color:#b7ebd3;color:var(--ok)">${m}</div>`:`<div class="note lockbox">${ro}${esc(m)}</div>`;
}

  h+=row('STID','STID',`${esc(e.stid.file)} · ${fmt(e.stid.date)}`,pill('Disponibile','ok')+' '+dl(e.stid.file));
  if(seesInt()){
    h+=row('PO','Ordine',e.order.ok?`Ricevuto · ${esc(e.order.ref)} · ${fmt(e.order.date)}`:'In attesa di ricezione lato Bip',e.order.ok?pill('Ricevuto','ok'):bip?`<button class="btn acc sm" onclick="markOrder('${e.id}')">Registra ordine ricevuto</button>`:pill('In attesa Bip','warn'));
    h+=row('BC','Business Case',e.bc?`${esc(e.bc.file)} · ${fmt(e.bc.date)}`:'Non ancora caricato',e.bc?pill('Caricato','ok')+' '+dl(e.bc.file):bip?`<button class="btn pri sm" onclick="uploadBc('${e.id}')">Carica BC</button>`:pill('Non caricato','mute'));
  }
  if(canCreds()){

  return h}

function tabPlan(e){
  if(!canPlan(e))return`<div class="note lockbox"><b>Pianificazione bloccata.</b> Servono lo STAF firmato dal cliente e l'ordine ricevuto da Bip.</div>`;
  const wr=canWrite(),a=acc(e),ph=phase(e),p0=pend(e);
  const stat={pending:['In attesa','warn'],accepted:['Accettata','ok'],rejected:['Rifiutata','err'],superseded:['Sostituita','mute'],replaced:['Superata','mute']};
  const list=e.proposals.length?[...e.proposals].reverse().map(p=>{const s=stat[p.status];return`<div class="prop"><div class="d"><b>${fmt(p.start)} → ${fmt(p.end)}</b>${p.kind==='resched'?'<span class="badge-kind">Riprogrammazione</span>':''}<span>${p.from==='client'?'Cliente':'Bip'} · ${esc(p.by)} · ${fmt(p.date)}${p.note?' · “'+esc(p.note)+'”':''}${p.reason?' · Motivo rifiuto: '+esc(p.reason):''}</span></div>${pill(s[0],s[1])}
    ${canDecide(p)?`<button class="btn acc sm" onclick="decide('${e.id}',${p.id},true)">Accetta</button><button class="btn dng sm" onclick="decide('${e.id}',${p.id},false)">Rifiuta</button>`:''}</div>`}).join(''):'<div class="empty">Nessuna proposta ancora inviata.</div>';
  let right;
  if(a){
    let act='';
    if(p0)act=`<p style="color:var(--muted);font-size:13px;margin:12px 0 0">Richiesta di riprogrammazione in corso: decide ${p0.from==='client'?'Cyberdefence':'il cliente'}.</p>`;
    else if(!wr)act='';
    else if(ph==='prep'||ph==='scheduled')act=`<div style="margin-top:14px"><button class="btn sec" onclick="requestResched('${e.id}')">Richiedi riprogrammazione</button></div>`;
    else act=`<p style="color:var(--muted);font-size:13px;margin:12px 0 0">L'attività è già avviata: non è più possibile riprogrammarla da qui.</p>`;
    right=`<h2>Pianificazione confermata</h2><div class="note" style="background:var(--ok-bg);border-color:#b7ebd3;color:var(--ok)"><b>${fmt(a.start)} → ${fmt(a.end)}</b><br>Confermata${a.from==='client'?' da Cyberdefence':' dal cliente'}.</div>${act}`;
  }else if(!wr)right=`<h2>Nuova proposta</h2><div class="note lockbox">Sola lettura: da questo profilo non si possono inviare proposte.</div>`;
  else right=`<h2>Nuova proposta</h2><p class="sub" style="margin-bottom:12px">Le date proposte dal cliente vengono accettate da Cyberdefence.</p><div class="fgrid"><div><label for="ps">Inizio attività</label><input type="date" id="ps" min="${demoDate}"></div><div><label for="pe">Fine attività</label><input type="date" id="pe" min="${demoDate}"></div>
    <div class="full"><label for="pn">Note (vincoli, finestre di manutenzione…)</label><textarea id="pn" rows="3"></textarea></div></div>
    <div style="margin-top:14px"><button class="btn pri" onclick="propose('${e.id}')">${role==='client'?'Invia proposta a Bip':'Invia proposta al cliente'}</button></div>`;
  return`<div class="grid two" style="align-items:start"><div class="card"><h2>Proposte e richieste</h2>${list}</div><div class="card">${right}</div></div>`}

const FIELD=(id,label,val,o={})=>`<div class="${o.full?'full':''}"><label for="f_${id}">${label}</label>${o.area?`<textarea id="f_${id}" rows="3">${esc(val)}</textarea>`:`<input type="text" id="f_${id}" value="${esc(val)}" ${o.ph?`placeholder="${esc(o.ph)}"`:''}>`}</div>`;
function who(x){return x.by==='client'?'cliente':'Cyberdefence per conto del cliente'}

    ${FIELD('out','Fuori scope',s.out||'',{ph:'Sistemi o ambienti da non testare'})}${FIELD('win','Finestra oraria e vincoli',s.win||'',{ph:'es. notturno 22:00–06:00'})}

function mfaGate(){return`<div class="card" style="text-align:center;padding:34px 20px"><div style="font-size:34px" aria-hidden="true">🔐</div><h2 style="margin-top:8px">Accesso protetto ai deliverables</h2>
  <p class="sub" style="max-width:460px;margin:0 auto 16px">I report contengono informazioni riservate. Per aprirli è richiesta la verifica a due fattori. Ogni accesso e download viene registrato.</p>
  <button class="btn pri" onclick="verifyMfa()">Verifica con codice 2FA</button></div>`}
function reviewCard(e){
  const rv=e.review,dr=e.reports.filter(r=>!r.pub).length,cd=role==='cyberdefence',mg=role==='manager';
  const S={none:['Non inviata','mute'],pending:['In attesa del manager','warn'],approved:['Approvata','ok'],changes:['Modifiche richieste','err']}[rv.status];
  let act='';
  if(cd&&dr&&(rv.status==='none'||rv.status==='changes'))act=`<button class="btn pri" onclick="submitReview('${e.id}')">Invia in revisione al manager</button>`;
  if(mg&&rv.status==='pending')act=`<button class="btn acc" onclick="reviewDecide('${e.id}',true)">Approva</button> <button class="btn dng" onclick="reviewDecide('${e.id}',false)">Richiedi modifiche</button>`;
  if(cd&&dr&&rv.status==='approved')act=`<button class="btn acc" onclick="publishReports('${e.id}')">Pubblica al cliente${e.mail.deliver.auto?' e invia email':''}</button>`;
  return`<div class="card" style="margin-bottom:16px"><h2>Revisione del manager ${pill(S[0],S[1])}</h2>
   <p class="sub" style="margin-bottom:${act?12:0}px">I deliverables non arrivano al cliente finché il manager non li approva.${rv.by&&rv.status!=='none'?` Ultimo esito: ${esc(rv.by)} · ${fmt(rv.date)}.`:''}${rv.comment?` Commento: “${esc(rv.comment)}”`:''}</p>${act}</div>`}
function tabReports(e){
  const bv=role!=='client',cd=role==='cyberdefence',ph=phase(e),list=bv?e.reports:pubs(e);
  if(!list.length&&!(cd&&(ph==='reporting'||ph==='running')))return`<div class="note lockbox"><b>Nessun deliverable disponibile.</b> La reportistica viene pubblicata da Bip al termine dell'attività.</div>`;
  if(!mfaOk())return mfaGate();
  let h=`<div class="note" style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><span>🔐 Accesso verificato con 2FA · scade tra ${mfaMins()} min · link monouso (15 min), documenti filigranati, download registrati.</span></div>`;
  if(bv&&(ph==='reporting'||ph==='running'||e.review.status!=='none'))h+=reviewCard(e);
  if(list.length)h+=`<div class="card"><h2>Reportistica</h2>${list.map(r=>`<div class="doc"><div class="ico">${esc(r.t)}</div><div class="t"><b>${esc(r.n)}</b><span>${r.pub?'Pubblicato il '+fmt(r.d):'Bozza del '+fmt(r.d)} · ${esc(r.s)}</span></div>${r.pub?pill('Pubblicato','ok'):pill('Bozza','mute')}<button class="btn pri sm" data-e="${e.id}" data-n="${esc(r.n)}" onclick="dlReport(this)">Scarica</button></div>`).join('')}</div>`;
  if(cd&&(ph==='reporting'||ph==='running'))h+=`<div class="card" style="margin-top:16px"><h2>Carica deliverables</h2><p class="sub" style="margin-bottom:12px">I file caricati restano in bozza fino all'approvazione del manager. Un nuovo file azzera la revisione.</p><button class="btn sec" onclick="addReportFile('${e.id}')">Carica file</button> <button class="btn sec" onclick="addDemoReport('${e.id}')">Aggiungi bozze di esempio (demo)</button></div>`;
  if(pubs(e).length)h+=`<div class="card" style="margin-top:16px"><h2>Riepilogo findings</h2><div style="display:flex;gap:20px;flex-wrap:wrap"><div style="flex:1;min-width:240px"><div class="bars">${[['Critical',1],['High',3],['Medium',7],['Low',5]].map(x=>`<div style="height:${x[1]*13}px"><em>${x[0]} (${x[1]})</em></div>`).join('')}</div><div style="height:22px"></div></div><div style="flex:1;min-width:240px;color:var(--muted);font-size:13px">Dati dimostrativi. Il piano di remediation è nel documento Evidenze.</div></div></div>`;
  return h}

function orgPill(o){return`<span class="pill ${o==='Cliente'?'p-info':o==='Bip Cyberdefence'?'p-ok':'p-mute'}">${esc(o)}</span>`}
function tabDL(e){
  const w=canWrite(),dom=((e.dl.find(x=>x.org==='Cliente')||{email:''}).email.split('@')[1]||'').toLowerCase();

  if(w)h+=`<div class="card" style="margin-top:16px"><h2>Aggiungi destinatario</h2><div class="fgrid"><div><label for="dl_n">Nome e cognome</label><input type="text" id="dl_n"></div><div><label for="dl_e">Email</label><input type="text" id="dl_e" placeholder="nome@dominio.it"></div><div><label for="dl_r">Ruolo</label><input type="text" id="dl_r" placeholder="es. Referente tecnico"></div>${role==='client'?'':`<div><label for="dl_o">Organizzazione</label><select class="f" id="dl_o"><option>Cliente</option><option>Bip Cybersec</option><option>Bip Cyberdefence</option></select></div>`}</div><div style="margin-top:14px"><button class="btn pri" onclick="addDL('${e.id}')">Aggiungi</button></div></div>`;

function tabMail(e){

  const ctl=canMail(),a=acc(e);
  const when={start:a?'alla data di inizio ('+fmt(a.start)+')':'dopo l\'accettazione della pianificazione',end:a?'alla data di fine ('+fmt(a.end)+')':'dopo l\'accettazione della pianificazione',deliver:'alla pubblicazione dei deliverables'};
  let h=`<div class="note">${ctl?'Come <b>Cyberdefence</b> controlli l\'invio automatico delle email alla distribution list ('+e.dl.length+' destinatari).':'Le comunicazioni sono gestite da Cyberdefence: tu puoi consultarne lo stato (sola lettura).'}</div><div class="card"><h2>Email automatiche</h2>`;
  for(const k of ['start','end','deliver']){
    const m=e.mail[k],M=MAIL_META[k];
    const st=m.sent?pill('Inviata il '+fmt(m.sent),'ok'):m.auto?pill('Programmata: '+when[k],'info'):pill('Invio automatico disattivato','warn');
    const tog=ctl?`<label class="sw"><input type="checkbox" ${m.auto?'checked':''} onchange="toggleMail('${e.id}','${k}')"><i></i><span>Invio automatico</span></label>`:`<span style="color:var(--muted);font-size:13px">Invio automatico: <b>${m.auto?'attivo':'disattivo'}</b></span>`;
    const dis=(k==='deliver'?!pubs(e).length:!a);
    const now=ctl&&!m.sent?`<button class="btn sec sm" ${dis?'disabled title="Non ancora disponibile"':''} onclick="sendNow('${e.id}','${k}')">Invia ora</button>`:'';
    h+=`<div class="mailc"><div class="t"><b>${M.t}</b><span>${M.desc}</span><span>Oggetto: [${e.id}] ${M.subj}</span><div style="margin-top:8px">${st}</div></div><div class="ctl">${tog}${now}</div></div>`;
  }
  h+=`</div><div class="card" style="margin-top:16px"><h2>Email inviate</h2>${e.mails.length?`<ul class="tl">${[...e.mails].reverse().map(m=>`<li>${esc(m.s)}<span>${fmt(m.d)} · ${m.n} destinatari · ${m.auto?'invio automatico':'invio manuale'}${m.aud==='bip'?' · interna':''}</span></li>`).join('')}</ul>`:'<div class="empty" style="padding:10px">Nessuna email ancora inviata.</div>'}</div>`;
  return h}

function tabLog(e){

  <table><thead><tr><th>Data e ora</th><th>Autore</th><th>Profilo</th><th>Evento</th></tr></thead><tbody>${rows.map(l=>`<tr><td style="white-space:nowrap">${fmt(l.t)} ${l.h}</td><td><b>${esc(l.who)}</b></td><td>${esc(l.rl)}</td><td>${esc(l.txt)}</td></tr>`).join('')}</tbody></table></div>`}

function tabState(e,k){
  const wr=canWrite(),ph=phase(e),p=pend(e),t=myTodo(e),a=acc(e);
  if(k==='docs'){const nS=!e.staf.file&&wr,nO=!e.order.ok&&isBip();return(e.staf.file&&e.order.ok)?'ok':(nS||nO)?'todo':'wait'}
  if(k==='plan'){if(!canPlan(e))return'lock';if(t&&t.tab==='plan')return'todo';if(p)return'wait';return a?'ok':'wait'}
  if(k==='scope'){if(!a)return'lock';return e.scope.done?'ok':wr?'todo':'wait'}
  if(k==='cred'){if(!a||!canCreds())return'lock';return e.cred.done?'ok':'todo'}
  if(k==='reports'){if(t&&t.tab==='reports')return'todo';if(pubs(e).length)return'ok';if(role!=='client'&&(e.reports.length||ph==='reporting'))return'wait';return'lock'}
  return'none'}
const GLYPH={ok:'✓',todo:'!',wait:'…',lock:'',none:''};
function defaultTab(e){return['docs','plan','scope','cred','reports'].find(k=>tabState(e,k)==='todo')||'docs'}

 <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start"><div><h1>${esc(e.name)}</h1><p class="sub" style="margin-bottom:14px">${e.id} · ${esc(e.type)} · ${esc(e.client)}</p></div>${pill(st,c)}</div>
 <div class="card">${renderStepper(e)}</div>
 <div style="margin-top:16px">${tabOverview(e)}</div>
 <div class="tabs" role="tablist">${TABS.map(t=>{const s=tabState(e,t[0]);return`<button role="tab" aria-selected="${tab===t[0]}" class="tab s-${s} ${tab===t[0]?'on':''}" onclick="setTab('${t[0]}')">${t[1]}${s==='lock'?' <span class="lock" aria-label="bloccato">🔒</span>':''}</button>`}).join('')}</div>
 <div class="legend"><span><b class="g-ok">✓</b> Completato</span><span><b class="g-todo">!</b> Azione richiesta</span><span><b class="g-wait">…</b> In attesa di altri</span><span>🔒 Bloccato / non disponibile</span></div>
 <div class="chips"><button class="chipb ${tab==='dl'?'on':''}" onclick="setTab('dl')">👥 Distribution list <span class="cnt">${e.dl.length}</span></button><button class="chipb ${tab==='mail'?'on':''}" onclick="setTab('mail')">✉️ ${role==='client'?'Email ricevute':'Comunicazioni'} <span class="cnt">${nm}</span></button><button class="chipb ${tab==='log'?'on':''}" onclick="setTab('log')">📋 Registro <span class="cnt">${visibleLog(e).length}</span></button></div>
 ${body}`}

tickMail();tickRem();
setRole('client');
