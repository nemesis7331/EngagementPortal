name: Build and deploy Engagement Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EngagementPortal.sln

      - name: Build
        run: dotnet build EngagementPortal.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test EngagementPortal.sln --configuration Release --no-build

      - name: Publish web application
        run: dotnet publish EngagementPortal.Web/EngagementPortal.Web.csproj --configuration Release --no-build --output publish

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: engagement-portal
          path: publish
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: engagement-portal
          path: publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: 0cdd832c-4d86-4bcc-a6dd-21e7e31b35f3
          tenant-id: 5452feb2-048f-4841-8121-215a8af91240
          subscription-id: 2cc996ba-f504-45ff-b3d8-a07211196c51

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: cyber-engagement-demo
          slot-name: Production
          package: publish
          target-path: /home/site/wwwroot
          clean: true
          restart: true
          startup-command: dotnet EngagementPortal.Web.dll

      - name: Verify deployment
        env:
          APP_URL: https://cyber-engagement-demo-hecxdgbqevh2awar.westus3-01.azurewebsites.net
        run: |
          for attempt in {1..12}; do
            if response=$(curl --fail --silent --show-error \
              "$APP_URL/api/engagements?role=Cyberdefence&tenant=tenant-bip") &&
              printf '%s' "$response" | jq -e 'type == "array"' >/dev/null; then
              echo "Engagement Portal API is responding."
              exit 0
            fi

            echo "Waiting for the deployed app to start (attempt ${attempt}/12)..."
            sleep 10
          done

          echo "Deployment completed, but the Engagement Portal API did not become available." >&2
          exit 1
